    btn.addEventListener('pointercancel', releaseSkill);
});

function clampPosition(x, y, radius = 26) {
    let startX = 450, startY = MAP_SIZE - 450;
    let endX = MAP_SIZE - 450, endY = 450;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;
    let pX = x - startX, pY = y - startY;
    let t = pX * uX + pY * uY;
    t = Math.max(0, Math.min(lineLen, t));
    let nearestX = startX + uX * t;
    let nearestY = startY + uY * t;
    let dist = Math.hypot(x - nearestX, y - nearestY);
    if (dist > ROAD_WIDTH / 2 - radius) {
        let angle = Math.atan2(y - nearestY, x - nearestX);
        x = nearestX + Math.cos(angle) * (ROAD_WIDTH / 2 - radius);
        y = nearestY + Math.sin(angle) * (ROAD_WIDTH / 2 - radius);
    }
    return { x: Math.max(radius, Math.min(MAP_SIZE - radius, x)), y: Math.max(radius, Math.min(MAP_SIZE - radius, y)) };
}

class Entity {
    constructor(x, y, team, radius = 26) {
        this.x = x; this.y = y; this.team = team; this.radius = radius;
        this.hp = 1000; this.maxHp = 1000; this.alive = true;
        this.shield = 0;
    }
    takeDamage(dmg, sourceTeam, type = 'physical') {
        if (!this.alive) return;
        
        if (this instanceof Hero) {
            this.outOfCombatTimer = 0; 
            if (this.isSuperArmor || this.isUntargetable) return;
            if (this.isDamageReduced) dmg *= (1 - (this.damageReductionRatio || 0.5));
        }

        if (this.shield > 0) {
            if (this.shield >= dmg) {
                this.shield -= dmg;
                dmg = 0;
            } else {
                dmg -= this.shield;
                this.shield = 0;
            }
        }

        this.hp -= dmg;
        
        if (this === player) {
            damageTexts.push({ x: this.x, y: this.y - 45, value: `-${Math.floor(dmg)}`, color: '#ff3366', life: 0.8 });
        }

        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(sourceTeam);
        }
    }
    onDeath(sourceTeam) {}
}

class Building extends Entity {
    constructor(x, y, team, type) {
        super(x, y, team, type === 'core' ? 55 : 45);
        this.type = type;
        this.maxHp = type === 'core' ? 300000 : 18000;
        this.hp = this.maxHp;
        this.atkTimer = 0;
        this.attackRange = 300; 
        this.currentTarget = null;
        this.towerAtkStack = 0;
    }
    takeDamage(dmg, sourceTeam, type = 'physical') {
        if (!this.alive) return;
        if (this.type === 'tower' || this.type === 'core') {
            let hasMinionNearby = entities.some(e => 
                e.alive && e instanceof Minion && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= 300
            );
            if (!hasMinionNearby) {
                dmg *= 0.15; 
                damageTexts.push({ x: this.x, y: this.y - 50, value: '🛡️ 無兵線減傷', color: '#00d2ff', life: 0.8 });
            }
        }
        this.hp -= dmg;
        damageTexts.push({ x: this.x, y: this.y - 45, value: `-${Math.floor(dmg)}`, color: '#ff4444', life: 0.8 });
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(sourceTeam);
        }
    }
    update() {
        if (!this.alive) return;
        this.atkTimer++;
        if (this.currentTarget) {
            let dist = Math.hypot(this.currentTarget.x - this.x, this.currentTarget.y - this.y);
            if (!this.currentTarget.alive || dist > this.attackRange) {
                this.currentTarget = null;
                this.towerAtkStack = 0;
            }
        }
        if (!this.currentTarget) {
            let inRangeEnemies = entities.filter(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.attackRange);
            let minionTarget = inRangeEnemies.find(e => e instanceof Minion);
            let heroTarget = inRangeEnemies.find(e => e instanceof Hero);
            let newTarget = minionTarget || heroTarget || null;
            if (newTarget !== this.currentTarget) {
                this.towerAtkStack = 0;
            }
            this.currentTarget = newTarget;
        }
        if (this.atkTimer >= 60) {
            this.atkTimer = 0;
            if (this.currentTarget) {
                let baseTowerDmg = 400;
                let finalTowerDmg = calcRandomDmg(baseTowerDmg * Math.pow(1.5, this.towerAtkStack));
                this.towerAtkStack++;

                this.currentTarget.takeDamage(finalTowerDmg, this.team, 'magical');
                
                if (this.currentTarget instanceof Hero) {
                    this.currentTarget.towerSlowStacks = Math.min(2, (this.currentTarget.towerSlowStacks || 0) + 1);
                    this.currentTarget.towerSlowTimer = 90;
                }

                damageTexts.push({ x: this.currentTarget.x, y: this.currentTarget.y - 40, value: `${Math.floor(finalTowerDmg)}`, color: '#ff4444', life: 0.6 });
                attackEffects.push({ startX: this.x, startY: this.y, x: this.currentTarget.x, y: this.currentTarget.y, life: 0.25, isLaser: true, color: this.team === 'blue' ? '#00d2ff' : '#ff4444' });
            }
        }
    }
    onDeath(sourceTeam) {
        if (this.type === 'tower') {
            isRunning = false;
            let resultEl = document.getElementById('result-screen');
            let titleEl = document.getElementById('result-title');
            if (sourceTeam === 'blue') {
                titleEl.innerText = 'VICTORY';
                titleEl.className = 'result-title-win';
            } else {
                titleEl.innerText = 'DEFEAT';
                titleEl.className = 'result-title-lose';
            }
            resultEl.classList.remove('hidden');
        }
    }
}

class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 18);
        this.maxHp = 2000; this.hp = 2000; 
        this.atk = 45; this.range = 120;
        this.targetX = team === 'blue' ? MAP_SIZE - 450 : 450;
        this.targetY = team === 'blue' ? 450 : MAP_SIZE - 450;
        this.moveSpeed = 1.6;
        this.atkCooldown = 0;
    }
    update() {
        if (!this.alive) return;
        if (this.isStunned) return;
        if (this.atkCooldown > 0) this.atkCooldown--;

        let nearestTarget = null;
        let minDist = 9999;
        entities.forEach(e => {
            if (e.alive && e.team !== this.team) {
                let dist = Math.hypot(e.x - this.x, e.y - this.y);
                if (dist < minDist) { minDist = dist; nearestTarget = e; }
            }
        });

        if (nearestTarget && minDist <= this.range) {
            if (this.atkCooldown === 0) {
                this.atkCooldown = 60;
                let dmg = calcRandomDmg(this.atk);
                nearestTarget.takeDamage(dmg, this.team, 'physical');
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(dmg)}`, color: '#f3c654', life: 0.8 });
            }
        } else {
            let destX = nearestTarget ? nearestTarget.x : this.targetX;
            let destY = nearestTarget ? nearestTarget.y : this.targetY;
            let angle = Math.atan2(destY - this.y, destX - this.x);
            let speed = this.moveSpeed;
            if (this.isSlowed) speed *= (1 - (this.slowFactor || 0.4));
            let nx = this.x + Math.cos(angle) * speed;
            let ny = this.y + Math.sin(angle) * speed;
            let clamped = clampPosition(nx, ny, this.radius);
            this.x = clamped.x; this.y = clamped.y;
        }
    }
    onDeath(sourceTeam) {
        entities.forEach(e => {
            if (e instanceof Hero && e.alive && e.team === sourceTeam) {
                e.gainExpAndGold(10, 25);
                if (e.heroKey === 'butterfly') {
                    e.butterflyStacks = Math.min(3, e.butterflyStacks + 1);
                }
                if (e.heroKey === 'slimz') {
                    let st = heroSkillStage['slimz'];
                    if (st && st.ultActiveTimer > 0) {
                        st.ultActiveTimer += 1.5;
                        damageTexts.push({ x: e.x, y: e.y - 55, value: '⏱️ 大招時間+1.5s', color: '#00e676', life: 1.0 });
                    }
                }
            }
        });

        if (player && player.heroKey === 'butterfly' && player.butterflyMarkedTarget === this) {
            skillCooldowns[3] = 0;
            damageTexts.push({ x: player.x, y: player.y - 65, value: '✨ 3技重置', color: '#00e676', life: 1.5 });
            player.butterflyMarkedTarget = null;
        }
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer) {
        let data = HERO_DB[heroKey];
        super(x, y, team, 26);
        this.heroKey = heroKey;
        this.heroData = data;
        this.maxHp = data.baseHp; this.hp = this.maxHp;
        this.atk = data.atk; this.range = data.range;
        this.isPlayer = isPlayer;
        this.level = 1; this.exp = 0; this.gold = 300;
        this.kills = 0; this.deaths = 0; this.assists = 0;
        
        this.atkCooldown = 0;
        this.attackLockTimer = 0;
        this.hasEnhancedAttack = false;
        this.isSuperArmor = false;
        this.isUntargetable = false;
        this.isCastingAction = false;
        this.isDamageReduced = false;
        this.damageReductionRatio = 0;
        this.isStunned = false;
        this.isSilenced = false;
        this.isSlowed = false;
        this.slowFactor = 0.4;
        
        this.statusText = '';
        this.statusDuration = 0;
        this.statusMaxDuration = 0;

        this.towerSlowStacks = 0;
        this.towerSlowTimer = 0;

        this.outOfCombatTimer = 300; 
        this.speedBuffTimer = 0;

        this.lilianaForm = 'human'; 
        this.razPassiveTimer = 0;
        this.razAtkCount = 0;
        this.razHasEnhancedAtk = false;

        this.muradStage1Count = 1;
        this.muradShadowPos = null;
        this.muradStacks = 0;
        this.muradStackTimer = 0;
        this.muradIsUnlocked = false;
        this.muradUnlockTimer = 0;
        this.muradTimerActive = false;
        this.muradWindowTimer = 0;

        this.butterflyStacks = 0;
        this.butterflyMarkedTarget = null;
        this.butterflyMarkTimer = 0;

        this.lindisPassiveNextAtk = false;
        this.lindisMarks = new Map();

        this.valheinHitCounter = 0;
        this.valheinPassiveStacks = 0;
        this.valheinPassiveTimer = 0;
        this.nakrothPassiveCounter = 0;
        this.ryomaPassiveTimer = 5.0;
        this.quillenMarkedTimer = 0;
        this.aiSkillCooldownTimer = 0;
        this.isRetreatingForHeal = false;

        this.isDashing = false; this.dashTargetX = x; this.dashTargetY = y; this.dashSpeed = 30;
        this.rotation = team === 'blue' ? -Math.PI / 4 : Math.PI * 3 / 4;
    }
    
    setStatus(text, durationSec) {
        this.statusText = text;
        this.statusDuration = durationSec;
        this.statusMaxDuration = durationSec;
    }

    startDash(tx, ty, speed = 35) {
        this.isDashing = true;
        this.dashTargetX = tx; this.dashTargetY = ty;
        let dist = Math.hypot(tx - this.x, ty - this.y);
        let timeSec = (dist / 70 * 0.10) / 3.0;
        this.dashSpeed = timeSec > 0 ? dist / (timeSec * 60) : speed * 3.0;
    }

    update() {
        if (!this.alive) return;

        if (this.statusDuration > 0) {
            this.statusDuration -= 1 / 60;
            if (this.statusDuration <= 0) {
                this.statusText = '';
                this.statusDuration = 0;
            }
        }

        if (this.isStunned || this.isCastingAction) return;

        this.outOfCombatTimer++;

        if (this.towerSlowTimer > 0) {
            this.towerSlowTimer--;
            if (this.towerSlowTimer === 0) this.towerSlowStacks = 0;
        }

        if (this.heroKey === 'slimz') {
            let st = heroSkillStage['slimz'];
            if (st && st.ultActiveTimer > 0) {
                st.ultActiveTimer -= 1 / 60;
            }
        }

        if (this.heroKey === 'murad' && this.muradTimerActive) {
            this.muradWindowTimer--;
            if (this.muradWindowTimer <= 0) {
                this.muradTimerActive = false;
                this.muradStage1Count = 1;
                this.muradShadowPos = null;
                skillCooldowns[1] = 6.0;
            }
        }

        if (this.heroKey === 'lindis') {
            let st = heroSkillStage['lindis'];
            if (st && st.globalButterfly && st.globalButterfly.active) {
                let gb = st.globalButterfly;
                gb.timer--;
                let progress = (300 - gb.timer) / 300;
                if (gb.type === 2 && gb.centerPos) {
                    let angle = -progress * Math.PI * 2;
                    gb.pos = {
                        x: this.x + Math.cos(angle) * 120,
                        y: this.y + Math.sin(angle) * 120
                    };
                } else if (gb.type === 3 && gb.dirX !== undefined && (300 - gb.timer) <= 180) {
                    gb.pos.x += gb.dirX * 2.5;
                    gb.pos.y += gb.dirY * 2.5;
                }

                if (gb.timer <= 0) {
                    gb.active = false;
                    gb.type = null;
                    gb.pos = null;
                }
            }
        }

        if (this.heroKey === 'raz') {
            this.razPassiveTimer += 1 / 60;
            if (this.razPassiveTimer >= 5.0 && !this.razHasEnhancedAtk) {
                this.razHasEnhancedAtk = true;
            }
        }

        if (this.heroKey === 'murad') {
            if (this.muradStacks > 0) {
                this.muradStackTimer += 1 / 60;
                if (this.muradStackTimer >= 5.0) {
                    this.muradStacks = 0;
                    this.muradStackTimer = 0;
                }
            }
            if (this.muradIsUnlocked) {
                this.muradUnlockTimer -= 1 / 60;
                if (this.muradUnlockTimer <= 0) {
                    this.muradIsUnlocked = false;
                }
            }
        }

        if (this.heroKey === 'alice' && this.outOfCombatTimer >= 300) {
            if (this.hp < this.maxHp) {
                let lostHp = this.maxHp - this.hp;
                let healAmt = (lostHp * 0.025) / 60;
                this.hp = Math.min(this.maxHp, this.hp + healAmt);
            }
        }

        if (this.speedBuffTimer > 0) this.speedBuffTimer--;

        if (this.heroKey === 'valhein' && this.valheinPassiveStacks > 0) {
            this.valheinPassiveTimer++;
            if (this.valheinPassiveTimer >= 300) {
                this.valheinPassiveTimer = 0;
                this.valheinPassiveStacks = 0;
                this.valheinHitCounter = 0;
            }
        }

        if (this.heroKey === 'ryoma') {
            let intervalReduction = (this.level - 1) * 0.1;
            let targetInterval = Math.max(1.0, 5.0 - intervalReduction);
            if (this.ryomaPassiveTimer > 0) {
                this.ryomaPassiveTimer -= 1 / 60;
                if (this.ryomaPassiveTimer <= 0) {
                    this.hasEnhancedAttack = true;
                }
            }
        }

        if (this.quillenMarkedTimer > 0) this.quillenMarkedTimer--;

        if (this.atkCooldown > 0) this.atkCooldown--;
        if (this.attackLockTimer > 0) this.attackLockTimer--;

        let fountainX = this.team === 'blue' ? 380 : MAP_SIZE - 380;
        let fountainY = this.team === 'blue' ? MAP_SIZE - 380 : 380;
        let distToFountain = Math.hypot(this.x - fountainX, this.y - fountainY);
        
        if (distToFountain <= 100 && this.hp < this.maxHp) {
            if (!this.fountainTimer) this.fountainTimer = 0;
            this.fountainTimer++;
            if (this.fountainTimer >= 60) {
                this.fountainTimer = 0;
                let healAmount = this.maxHp * 0.13;
                this.hp = Math.min(this.maxHp, this.hp + healAmount);
                damageTexts.push({ x: this.x, y: this.y - 35, value: `+${Math.floor(healAmount)}`, color: '#00e676', life: 0.8 });
            }
        } else {
            this.fountainTimer = 0;
        }

        if (this.isDashing) {
            let dx = this.dashTargetX - this.x;
            let dy = this.dashTargetY - this.y;
            let dist = Math.hypot(dx, dy);

            if (Math.random() < 0.4) {
                afterimages.push({ x: this.x, y: this.y, radius: this.radius, team: this.team, life: 0.35 });
            }

            if (dist < this.dashSpeed) {
                this.x = this.dashTargetX; this.y = this.dashTargetY;
                this.isDashing = false;
            } else {
                this.x += (dx / dist) * this.dashSpeed;
                this.y += (dy / dist) * this.dashSpeed;
            }
            return;
        }

        let speed = 2.8;
        if (this.heroKey === 'alice' && this.outOfCombatTimer >= 300) speed *= 1.15;
        if (this.speedBuffTimer > 0) speed *= 1.40; 
        if (this.heroKey === 'slimz') {
            let st = heroSkillStage['slimz'];
            if (st && st.ultActiveTimer > 0) speed *= 1.5;
        }
        if (this.isSlowed) speed *= (1 - this.slowFactor);
        if (this.towerSlowStacks > 0) speed *= (1 - this.towerSlowStacks * 0.20);

        if (this.isPlayer) {
            if (this.attackLockTimer <= 0) {
                if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                    let nx = this.x + joystickDir.x * speed;
                    let ny = this.y + joystickDir.y * speed;
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                    this.rotation = Math.atan2(joystickDir.y, joystickDir.x);
                }
            }
            if (isAttackingPressed) {
                performAttack();
            }
        } else {
            if (this.aiSkillCooldownTimer > 0) this.aiSkillCooldownTimer--;

            let isEnemyLowHp = (player && player.alive && player.hp < player.maxHp * 0.2);
            let isSelfLowHp = (this.hp < this.maxHp * 0.2);

            if (isSelfLowHp && !isEnemyLowHp) {
                this.isRetreatingForHeal = true;
            }
            if (this.hp >= this.maxHp * 0.9) {
                this.isRetreatingForHeal = false;
            }

            if (this.isRetreatingForHeal) {
                if (distToFountain > 80) {
                    let angleToFountain = Math.atan2(fountainY - this.y, fountainX - this.x);
                    let nx = this.x + Math.cos(angleToFountain) * (speed * 0.8);
                    let ny = this.y + Math.sin(angleToFountain) * (speed * 0.8);
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                }
                return;
            }

            if (isEnemyLowHp && player && player.alive) {
                let angleToOpponent = Math.atan2(player.y - this.y, player.x - this.x);
                let nx = this.x + Math.cos(angleToOpponent) * speed;
                let ny = this.y + Math.sin(angleToOpponent) * speed;
                let clamped = clampPosition(nx, ny, this.radius);
                this.x = clamped.x; this.y = clamped.y;
                
                let distToOpponent = Math.hypot(player.x - this.x, player.y - this.y);
                if (distToOpponent <= this.range + player.radius && this.atkCooldown <= 0) {
                    this.atkCooldown = 25;
                    let dmg = calcRandomDmg(this.getEffectiveAtk());
                    player.takeDamage(dmg, this.team, 'physical');
                    damageTexts.push({ x: player.x, y: player.y - 35, value: `${Math.floor(dmg)}`, color: '#f3c654', life: 0.8 });
                }
                return;
            }

            let enemyTower = this.team === 'blue' ? redTower : blueTower;
            let hasMinionInTower = entities.some(e => e.alive && e instanceof Minion && e.team === this.team && enemyTower && Math.hypot(e.x - enemyTower.x, e.y - enemyTower.y) <= 300);
            let distToTower = enemyTower ? Math.hypot(this.x - enemyTower.x, this.y - enemyTower.y) : 9999;
            
            if (!hasMinionInTower && distToTower <= 320) {
                let angleAway = Math.atan2(this.y - enemyTower.y, this.x - enemyTower.x);
                let nx = this.x + Math.cos(angleAway) * speed;
                let ny = this.y + Math.sin(angleAway) * speed;
                let clamped = clampPosition(nx, ny, this.radius);
                this.x = clamped.x; this.y = clamped.y;
                return;
            }

            let nearestEnemy = null;
            let minDist = 9999;
            entities.forEach(e => {
                if (e.alive && e.team !== this.team) {
                    let dist = Math.hypot(e.x - this.x, e.y - this.y);
                    if (dist < minDist) { minDist = dist; nearestEnemy = e; }
                }
            });

            if (nearestEnemy && this.attackLockTimer <= 0) {
                let angleToEnemy = Math.atan2(nearestEnemy.y - this.y, nearestEnemy.x - this.x);
                let dirX = Math.cos(angleToEnemy);
                let dirY = Math.sin(angleToEnemy);

                if (this.aiSkillCooldownTimer === 0 && minDist <= 280 && !this.isSilenced) {
                    this.aiSkillCooldownTimer = 100;
                    executeAiSkill(this, 1, dirX, dirY);
                }

                let curRange = this.heroKey === 'liliana' ? (this.lilianaForm === 'human' ? 240 : 120) : this.range;

                if (minDist <= curRange + nearestEnemy.radius) {
                    if (this.atkCooldown <= 0) {
                        this.atkCooldown = 25;
                        this.attackLockTimer = 15;
                        let dmg = calcRandomDmg(this.getEffectiveAtk());
                        nearestEnemy.takeDamage(dmg, this.team, 'physical');
                        damageTexts.push({ x: nearestEnemy.x, y: nearestEnemy.y - 35, value: `${Math.floor(dmg)}`, color: '#f3c654', life: 0.8 });
                        this.outOfCombatTimer = 0;
                    }
                } else {
                    let nx = this.x + dirX * (speed * 0.6) + (Math.random() - 0.5) * 1.5;
                    let ny = this.y + dirY * (speed * 0.6) + (Math.random() - 0.5) * 1.5;
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                }
            }
        }
    }

    getEffectiveAtk() {
        let base = this.atk + (this.level - 1) * this.heroData.atkGrowth;
        if (this.heroKey === 'murad' && this.muradIsUnlocked) base *= 1.3;
        return base;
    }

    gainExpAndGold(expAmt, goldAmt) {
        this.gold += goldAmt;
        if (this.isPlayer) { currentUserData.gold = this.gold; saveUserData(); }
        this.exp += expAmt;
        let reqExp = LEVEL_EXP_TABLE[this.level] || 150;
        
        while (this.exp >= reqExp && this.level < 15) {
            this.exp -= reqExp;
            this.level++; 
            if (this.isPlayer) unallocatedPoints++;
            let hpGain = this.heroData.hpGrowth;
            this.maxHp += hpGain; 
            this.hp = Math.min(this.maxHp, this.hp + hpGain);
            if (this.isPlayer) { triggerAnnouncement(`🎉 恭喜升到 Lv.${this.level}！`, '#00e676'); }
            reqExp = LEVEL_EXP_TABLE[this.level] || 150;
        }
        updateTopScopeUI();
        updateSkillUI();
    }

    onDeath(sourceTeam) {
        let respawnTime = Math.min(25, Math.max(4, Math.floor(4 + this.level * 1.5)));

        if (this.isPlayer) {
            deaths++;
            aiKillStreak++;
            playerKillStreak = 0;
            redKills++; 
            triggerAnnouncement(`YOU HAVE BEEN SLAIN (復活倒數 ${respawnTime} 秒)`, '#ff3366');

            setTimeout(() => {
                if (!isRunning) return;
                this.hp = this.maxHp;
                this.x = 380; this.y = MAP_SIZE - 380;
                this.alive = true;
                triggerAnnouncement('⚔️ 你已重返戰場！', '#00e676');
            }, respawnTime * 1000);
        } else {
            blueKills++;
            kills++;
            playerKillStreak++;
            aiKillStreak = 0;
            
            if (!hasFirstBloodOccurred) {
                hasFirstBloodOccurred = true;
                triggerAnnouncement('FIRST BLOOD 擊殺首血！', '#ffd700');
            } else {
                triggerAnnouncement(`ENEMY SLAIN (敵方 ${respawnTime} 秒後復活)`, '#00e676');
            }

            if (player && player.alive) {
                player.gainExpAndGold(20, 150);
                if (player.heroKey === 'quillen') {
                    skillCooldowns = { 1: 0, 2: 0, 3: 0 };
                }
                if (player.heroKey === 'butterfly') {
                    player.butterflyStacks = Math.min(3, player.butterflyStacks + 2);
                }
                if (player.heroKey === 'slimz') {
                    let st = heroSkillStage['slimz'];
                    if (st && st.ultActiveTimer > 0) {
                        st.ultActiveTimer += 4.0;
                        damageTexts.push({ x: player.x, y: player.y - 55, value: '⏱️ 大招時間+4s', color: '#00e676', life: 1.2 });
                    }
                }
            }

            if (player && player.heroKey === 'butterfly' && player.butterflyMarkedTarget === this) {
                skillCooldowns[3] = 0;
                damageTexts.push({ x: player.x, y: player.y - 65, value: '✨ 3技重置', color: '#00e676', life: 1.5 });
                player.butterflyMarkedTarget = null;
            }

            setTimeout(() => {
                if (!isRunning) return;
                this.hp = this.maxHp;
                this.x = MAP_SIZE - 380; this.y = 380;
                this.alive = true;
            }, respawnTime * 1000);
        }
        updateTopScopeUI();
    }
}

function performAttack() {
    if (!player || !player.alive) return;
    if (player.atkCooldown > 0) return;

    let attackRange = player.range;
    let nearestTarget = null;
    let minTargetDist = 9999;

    entities.forEach(target => {
        if (!target.alive || target.team === player.team) return;
        let dist = Math.hypot(target.x - player.x, target.y - player.y);
        if (dist <= attackRange + target.radius && dist < minTargetDist) {
            minTargetDist = dist;
            nearestTarget = target;
        }
    });

    if (nearestTarget) {
        player.outOfCombatTimer = 0; 
        
        if (player.heroKey === 'slimz') {
            let intervalReduction = (player.level - 1) * 0.01;
            let currentInterval = Math.max(0.1, 0.4 - intervalReduction);
            let st = heroSkillStage['slimz'];
            if (st && st.ultActiveTimer > 0) currentInterval -= 0.05;

            player.atkCooldown = Math.round(currentInterval * 60);
            player.attackLockTimer = Math.round(0.1 * 60);

            st.atks++;
            let baseDmg = player.getEffectiveAtk();
            if (st.ultActiveTimer > 0) {
                let sLv = skillLevels[3] || 1;
                let flatAdd = 200 + (sLv - 1) * 200;
                let maxHpAdd = nearestTarget.maxHp * 0.01;
                baseDmg += (flatAdd + maxHpAdd);
            }

            let isPassiveProc = false;
            if (st.atks >= 3) {
                st.atks = 0;
                isPassiveProc = true;
                let sLv1 = skillLevels[1] || 1;
                let passiveDmg = 300 + (sLv1 - 1) * 10;
                baseDmg += passiveDmg;
            }

            let totalDmg = calcRandomDmg(baseDmg);
            nearestTarget.takeDamage(totalDmg, player.team, 'physical');
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(totalDmg)}`, color: isPassiveProc ? '#00d2ff' : '#ffd700', life: 0.9 });
            attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#ff9800' });
            return;
        }

        if (player.heroKey === 'lindis') {
            player.atkCooldown = Math.round(player.heroData.atkInterval * 60);
            player.attackLockTimer = Math.round(player.heroData.atkRecovery * 60);
            
            let attackCount = player.lindisPassiveNextAtk ? 3 : 1;
            player.lindisPassiveNextAtk = false; 

            for (let i = 0; i < attackCount; i++) {
                setTimeout(() => {
                    if (!nearestTarget.alive) return;
                    let baseDmg = player.getEffectiveAtk();
                    let maxHpDmg = nearestTarget.maxHp * 0.01; 
                    let totalDmg = calcRandomDmg(baseDmg + maxHpDmg);
                    nearestTarget.takeDamage(totalDmg, player.team, 'physical');

                    let currentMarks = (player.lindisMarks.get(nearestTarget) || 0) + 1;
                    if (currentMarks >= 3) {
                        let explosiveDgm = calcRandomDmg(200 + (player.level - 1) * 10);
                        nearestTarget.takeDamage(explosiveDgm, player.team, 'magical');
                        currentMarks = 0;
                        damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 50, value: `${Math.floor(explosiveDgm)}`, color: '#00d2ff', life: 1.2 });
                    }
                    player.lindisMarks.set(nearestTarget, currentMarks);

                    damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(totalDmg)}`, color: '#ffd700', life: 0.8 });
                    attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#00d2ff' });
                }, i * 80);
            }
            return;
        }

        if (player.heroKey === 'murad') {
            player.muradStacks = Math.min(4, player.muradStacks + 1);
            player.muradStackTimer = 0;
            if (player.muradStacks >= 4) {
                player.muradIsUnlocked = true;
                player.muradUnlockTimer = 5.0;
            }

            player.atkCooldown = 36;
            player.attackLockTimer = 12;
            let sLv = skillLevels[1] || 1;
            let baseDmg = calcRandomDmg((180 + (sLv - 1) * 17) * (player.muradIsUnlocked ? 1.3 : 1.0));
            nearestTarget.takeDamage(baseDmg, player.team, 'physical');
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(baseDmg)}`, color: '#00d2ff', life: 0.8 });
            attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#00d2ff' });
            return;
        }

        if (player.heroKey === 'liliana') {
            let sLv = skillLevels[1] || 1;
            let baseDmg = 0;
            if (player.lilianaForm === 'human') {
                player.atkCooldown = 30; 
                player.attackLockTimer = 18; 
                baseDmg = calcRandomDmg(180 + (sLv - 1) * 17);
                nearestTarget.takeDamage(baseDmg, player.team, 'magical');
            } else {
                player.atkCooldown = 24; 
                player.attackLockTimer = 12; 
                baseDmg = calcRandomDmg(190 + (sLv - 1) * 17);
                nearestTarget.takeDamage(baseDmg, player.team, 'physical');
            }
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(baseDmg)}`, color: '#e040fb', life: 0.8 });
            attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#e040fb' });
            return;
        }

        if (player.heroKey === 'butterfly') {
            player.atkCooldown = 30;
            player.attackLockTimer = 15;
            let sLv = skillLevels[1] || 1;
            let baseDmg = calcRandomDmg(180 + (sLv - 1) * 10);
            nearestTarget.takeDamage(baseDmg, player.team, 'physical');
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(baseDmg)}`, color: '#e74c3c', life: 0.8 });
            attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#e74c3c' });
            return;
        }

        if (player.heroKey === 'raz') {
            player.atkCooldown = 42; 
            player.attackLockTimer = 24; 
            let sLv = skillLevels[1] || 1;
            let baseDmg = calcRandomDmg(180 + (sLv - 1) * 15);

            if (player.razHasEnhancedAtk) {
                player.razHasEnhancedAtk = false;
                player.razPassiveTimer = 0;
                baseDmg *= 1.7;

                let angleToTarget = Math.atan2(nearestTarget.y - player.y, nearestTarget.x - player.x);
                let dashTargetX = nearestTarget.x - Math.cos(angleToTarget) * 40;
                let dashTargetY = nearestTarget.y - Math.sin(angleToTarget) * 40;
                player.startDash(dashTargetX, dashTargetY, 45);

                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== player.team) {
                        let dist = Math.hypot(e.x - player.x, e.y - player.y);
                        if (dist <= 200) {
                            e.takeDamage(baseDmg, player.team, 'physical');
                            let pushX = e.x + Math.cos(angleToTarget) * 160;
                            let pushY = e.y + Math.sin(angleToTarget) * 160;
                            let clampedPush = clampPosition(pushX, pushY, e.radius);
                            e.x = clampedPush.x; e.y = clampedPush.y;
                        }
                    }
                });
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 45, value: `${Math.floor(baseDmg)}`, color: '#ff9800', life: 1.2 });
            } else {
                player.razAtkCount++;
                if (player.razAtkCount >= 2) {
                    player.razAtkCount = 0;
                    player.razHasEnhancedAtk = true;
                }
                nearestTarget.takeDamage(baseDmg, player.team, 'physical');
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(baseDmg)}`, color: '#ff9800', life: 0.8 });
            }

            attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#ff9800' });
            return;
        }

        let interval = player.heroData.atkInterval || 0.5;
        player.atkCooldown = Math.round(interval * 60);
        player.attackLockTimer = Math.round((player.heroData.atkRecovery || 0.3) * 60);
        
        let baseDmg = calcRandomDmg(player.getEffectiveAtk());
        nearestTarget.takeDamage(baseDmg, player.team, 'physical');
        damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(baseDmg)}`, color: '#f3c654', life: 0.8 });
        attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#f3c654' });
    }
}

function executeAiSkill(aiObj, skillId, dirX, dirY) {
    let targetX = aiObj.x + dirX * 180;
    let targetY = aiObj.y + dirY * 180;
    
    skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 75, color: 'rgba(255, 68, 68, 0.65)', team: aiObj.team });
    
    entities.forEach(e => {
        if (!(e instanceof Building) && e.alive && e.team !== aiObj.team && Math.hypot(e.x - targetX, e.y - targetY) <= 80) {
            let dmg = calcRandomDmg(350);
            e.takeDamage(dmg, aiObj.team, 'magical');
            damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(dmg)}`, color: '#ff4444', life: 0.8 });
        }
    });
}

function castSkill(skillId, dirX, dirY, customDist) {
    if (!player || !player.alive || player.isSilenced || player.isStunned || player.isCastingAction) return;
    if (skillLevels[skillId] === 0 || skillCooldowns[skillId] > 0) return;

    if (skillId === 3) {
        let currentLvl = skillLevels[3];
        let requiredLevel = (currentLvl === 1) ? 4 : (currentLvl === 2 ? 8 : 12);
        if (player.level < requiredLevel) return;
    }

    let sLv = skillLevels[skillId] || 1;
    let heroKey = player.heroKey;
    player.outOfCombatTimer = 0;

    if (heroKey === 'slimz') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(2.0, 7.0 - (sLv - 1) * 0.5);
            let dmg = calcRandomDmg(600 + (sLv - 1) * 50);
            let startX = player.x, startY = player.y;
            let targetX = startX + dirX * 480;
            let targetY = startY + dirY * 480;

            projectiles.push({
                x: startX, y: startY, startX: startX, startY: startY,
                targetX: targetX, targetY: targetY, speed: 14.0, radius: 18,
                isSlimzSpear: true, owner: player, team: player.team, damage: dmg
            });
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(3.0, 10.0 - (sLv - 1) * 0.8);
            let dist = customDist || 240;
            let tx = player.x + dirX * dist;
            let ty = player.y + dirY * dist;
            player.startDash(tx, ty, 45);

            let st = heroSkillStage['slimz'];
            st.ultActiveTimer = Math.max(st.ultActiveTimer, 0) + 5.0;

            skillEffects.push({ x: tx, y: ty, life: 0.4, size: 80, color: 'rgba(255, 152, 0, 0.75)', team: player.team });
            damageTexts.push({ x: player.x, y: player.y - 45, value: '🐰 狩獵爆發啟動！', color: '#ff9800', life: 1.2 });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(10.0, 20.0 - (sLv - 1) * 2.0);
            let st = heroSkillStage['slimz'];
            st.ultActiveTimer = 10.0;

            skillEffects.push({ x: player.x, y: player.y, life: 0.5, size: 100, color: 'rgba(255, 69, 0, 0.85)', team: player.team });
            damageTexts.push({ x: player.x, y: player.y - 45, value: '🔥 狂野增幅 10秒！', color: '#ff3366', life: 1.5 });
        }
        updateSkillUI();
        return;
    }

    if (heroKey === 'lindis') {
        let st = heroSkillStage['lindis'] = heroSkillStage['lindis'] || {};
        let gb = st.globalButterfly || { active: false, type: null, pos: null, timer: 0, centerPos: null, dirX: 0, dirY: 0 };

        if (gb.active && gb.type === skillId) {
            if (gb.pos) {
                player.x = gb.pos.x;
                player.y = gb.pos.y;
                damageTexts.push({ x: player.x, y: player.y - 45, value: `🦋 藉由 ${skillId} 技返回蝴蝶處！`, color: '#00d2ff', life: 1.0 });
            }
            gb.active = false;
            gb.type = null;
            gb.pos = null;
            gb.timer = 0;
            st.globalButterfly = gb;
            skillCooldowns[skillId] = skillId === 1 ? 4.0 : (skillId === 2 ? 6.0 : 10.0);
            updateSkillUI();
            return;
        }

        player.lindisPassiveNextAtk = true;

        if (!gb.active) {
            gb.active = true;
            gb.type = skillId;
            gb.timer = 300;
            if (skillId === 2) {
                gb.centerPos = { x: player.x, y: player.y };
                gb.pos = { x: player.x + 120, y: player.y };
            } else if (skillId === 3) {
                gb.pos = { x: player.x, y: player.y };
                gb.dirX = dirX;
                gb.dirY = dirY;
            } else {
                gb.pos = { x: player.x, y: player.y };
            }
        }
        st.globalButterfly = gb;

        if (skillId === 1) {
            let tx = player.x + dirX * 120;
            let ty = player.y + dirY * 120;
            player.startDash(tx, ty, 35);
            damageTexts.push({ x: player.x, y: player.y - 35, value: '✨ 1技短位移', color: '#00d2ff', life: 0.8 });
        } else if (skillId === 2) {
            skillEffects.push({ x: player.x, y: player.y, life: 0.4, size: 90, color: 'rgba(0, 210, 255, 0.6)', team: player.team });
            player.isUntargetable = true;
            damageTexts.push({ x: player.x, y: player.y - 35, value: '🛡️ 2技擋塔傷', color: '#00d2ff', life: 0.8 });
            setTimeout(() => { if (player) player.isUntargetable = false; }, 500);
        } else if (skillId === 3) {
            let pushDist = 180;
            let strikeDmg = calcRandomDmg(600 + (sLv - 1) * 100);
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 220) {
                    e.takeDamage(strikeDmg, player.team, 'physical');
                    let pushX = e.x + dirX * pushDist;
                    let pushY = e.y + dirY * pushDist;
                    let clamped = clampPosition(pushX, pushY, e.radius);
                    e.x = clamped.x; e.y = clamped.y;
                    damageTexts.push({ x: e.x, y: e.y - 45, value: `${Math.floor(strikeDmg)}`, color: '#e74c3c', life: 1.0 });
                }
            });
            damageTexts.push({ x: player.x, y: player.y - 35, value: '💥 3技純擊退', color: '#00d2ff', life: 0.8 });
        }
        updateSkillUI();
        return;
    }

    if (heroKey === 'murad' && skillId === 1) {
        let muradStage = player.muradStage1Count || 1; 
        let baseDmg = calcRandomDmg(650 + (sLv - 1) * 30);

        if (!player.muradTimerActive) {
            player.muradTimerActive = true;
            player.muradWindowTimer = 420; 
        }

        if (muradStage === 1) {
            player.muradShadowPos = { x: player.x, y: player.y };
            let tx = player.x + dirX * 200;
            let ty = player.y + dirY * 200;
            player.startDash(tx, ty, 40);

            player.muradStacks = Math.min(4, player.muradStacks + 1);
            player.muradStackTimer = 0;

            skillEffects.push({ x: tx, y: ty, life: 0.4, size: 70, color: 'rgba(0, 210, 255, 0.8)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 75) {
                    e.takeDamage(baseDmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(baseDmg)}`, color: '#00d2ff', life: 0.8 });
                    e.isStunned = true;
                    e.setStatus('暈眩', 1.0);
                    setTimeout(() => { e.isStunned = false; }, 1000);
                }
            });

            player.muradStage1Count = 2;
            player.muradWindowTimer = 420; 
            skillCooldowns[1] = 0; 
        } else if (muradStage === 2) {
            let tx = player.x + dirX * 200;
            let ty = player.y + dirY * 200;
            player.startDash(tx, ty, 40);

            player.muradStacks = Math.min(4, player.muradStacks + 1);
            player.muradStackTimer = 0;

            skillEffects.push({ x: tx, y: ty, life: 0.4, size: 70, color: 'rgba(0, 210, 255, 0.8)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 75) {
                    e.takeDamage(baseDmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(baseDmg)}`, color: '#00d2ff', life: 0.8 });
                    e.isStunned = true;
                    e.setStatus('暈眩', 1.0);
                    setTimeout(() => { e.isStunned = false; }, 1000);
                }
            });

            player.muradStage1Count = 3;
            player.muradWindowTimer = 420; 
            skillCooldowns[1] = 0; 
        } else if (muradStage === 3) {
            if (player.muradShadowPos) {
                player.startDash(player.muradShadowPos.x, player.muradShadowPos.y, 50);
            }
            player.muradStage1Count = 1;
            player.muradShadowPos = null;
            player.muradTimerActive = false;
            skillCooldowns[1] = Math.max(3.5, 6.0 - (sLv - 1) * 0.5); 
        }
        updateSkillUI();
        return;
    }

    if (heroKey === 'butterfly') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(2.0, 5.0 - (sLv - 1) * 0.3);
            let dmg = calcRandomDmg(600 + (sLv - 1) * 40);
            let shieldRatio = 0.20 + (sLv - 1) * 0.05;
            let shieldAmt = player.maxHp * Math.min(0.50, shieldRatio);
            player.shield = Math.min(player.maxHp * 0.6, (player.shield || 0) + shieldAmt);
            setTimeout(() => { if (player) player.shield = Math.max(0, (player.shield || 0) - shieldAmt); }, 3000);

            player.speedBuffTimer = 150; 
            skillEffects.push({ x: player.x, y: player.y, life: 0.4, size: 85, color: 'rgba(231, 76, 60, 0.75)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 85) {
                    e.takeDamage(dmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(dmg)}`, color: '#e74c3c', life: 0.8 });
                }
            });

            if (player.butterflyStacks >= 3) {
                player.butterflyStacks = 0;
                skillCooldowns[1] = 0;
            }
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(3.5, 7.0 - (sLv - 1) * 0.6);
            let dmg = calcRandomDmg(800 + (sLv - 1) * 50);
            let slowRatio = Math.min(0.56, 0.32 + (sLv - 1) * 0.04);
            let hitX = player.x + dirX * 120;
            let hitY = player.y + dirY * 120;

            skillEffects.push({ x: hitX, y: hitY, life: 0.35, size: 80, color: 'rgba(231, 76, 60, 0.8)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - hitX, e.y - hitY) <= 80) {
                    e.takeDamage(dmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(dmg)}`, color: '#e74c3c', life: 0.8 });
                    e.isSlowed = true;
                    e.slowFactor = slowRatio;
                    setTimeout(() => { e.isSlowed = false; }, 2000);
                }
            });

            if (player.butterflyStacks >= 3) {
                player.butterflyStacks = 0;
                skillCooldowns[2] = 0;
            }
        } else if (skillId === 3) {
            let baseDmg = 1100 + (sLv - 1) * 200;
            let cR = 65;
            let dist = customDist || 240;
            let tx = player.x + dirX * dist;
            let ty = player.y + dirY * dist;

            let targetEnemy = null;
            let minD = 9999;
            entities.forEach(e => {
                if (e.alive && e.team !== player.team) {
                    let d = Math.hypot(e.x - tx, e.y - ty);
                    let priority = (e instanceof Hero) ? 0 : 1;
                    if (d <= cR + e.radius && (priority < (targetEnemy instanceof Hero ? 0 : 1) || d < minD)) {
                        minD = d;
                        targetEnemy = e;
                    }
                }
            });

            if (!targetEnemy) {
                updateSkillUI();
                return;
            }

            player.butterflyMarkedTarget = targetEnemy;
            skillCooldowns[3] = Math.max(5.0, 11.0 - (sLv - 1) * 1.0);

            let dashBackX = targetEnemy.x - Math.cos(dirX) * 45;
            let dashBackY = targetEnemy.y - Math.sin(dirY) * 45;
            player.startDash(dashBackX, dashBackY, 60);

            let missingHp = Math.max(0, targetEnemy.maxHp - targetEnemy.hp);
            let bonusDmg = missingHp * 0.15; 
            let totalDmg = calcRandomDmg(baseDmg + bonusDmg);

            targetEnemy.takeDamage(totalDmg, player.team, 'physical');

            damageTexts.push({ x: targetEnemy.x, y: targetEnemy.y - 45, value: `${Math.floor(totalDmg)}`, color: '#e74c3c', life: 1.5 });
            skillEffects.push({ x: targetEnemy.x, y: targetEnemy.y, life: 0.4, size: 85, color: 'rgba(231, 76, 60, 0.95)', team: player.team });

            if (player.butterflyStacks >= 3) {
                player.butterflyStacks = 0;
                skillCooldowns[3] = 0;
            }
        }
        updateSkillUI();
        return;
    }

    if (heroKey === 'murad' && skillId > 1) {
        if (skillId === 2) {
            skillCooldowns[2] = Math.max(4.0, 7.0 - (sLv - 1) * 0.5);
            let dmg = calcRandomDmg((700 + (sLv - 1) * 20) * (player.muradIsUnlocked ? 1.3 : 1.0));

            player.isUntargetable = true; 
            player.isCastingAction = true;
            player.setStatus('不可選中', 0.5);

            setTimeout(() => {
                if (player) {
                    player.isUntargetable = false;
                    player.isCastingAction = false;
                }
            }, 500);

            skillEffects.push({ x: player.x, y: player.y, life: 0.6, size: 90, color: 'rgba(0, 210, 255, 0.5)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 90) {
                    e.takeDamage(dmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(dmg)}`, color: '#00d2ff', life: 0.8 });
                    e.isSlowed = true;
                    e.slowFactor = 0.5;
                    setTimeout(() => { e.isSlowed = false; }, 2000);
                }
            });
        } else if (skillId === 3) {
            if (!player.muradIsUnlocked) {
                return;
            }
            skillCooldowns[3] = Math.max(5.0, 9.0 - (sLv - 1) * 2.0); 
            
            player.isUntargetable = true; 
            player.isCastingAction = true;
            player.setStatus('不可選中', 2.1);

            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    skillEffects.push({ x: player.x, y: player.y, life: 0.25, size: 120, color: 'rgba(0, 210, 255, 0.7)', team: player.team });
                    
                    entities.forEach(target => {
                        if (!(target instanceof Building) && target.alive && target.team !== player.team && Math.hypot(target.x - player.x, target.y - player.y) <= 140) {
                            let baseDmg = 240 + (sLv - 1) * 50;
                            let missingHp = Math.max(0, target.maxHp - target.hp);
                            let bonusDmg = missingHp * 0.03;
                            let totalDmg = calcRandomDmg((baseDmg + bonusDmg) * (player.muradIsUnlocked ? 1.3 : 1.0));

                            target.takeDamage(totalDmg, player.team, 'physical');
                            damageTexts.push({ x: target.x, y: target.y - 40, value: `${Math.floor(totalDmg)}`, color: '#00d2ff', life: 0.8 });
                        }
                    });

                    if (i === 6) {
                        player.isUntargetable = false;
                        player.isCastingAction = false;
                    }
                }, (i + 1) * 300);
            }
        }
        updateSkillUI();
        return;
    }

    if (heroKey === 'raz') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(3.6, 6.0 - (sLv - 1) * 0.4);
            let dmg = calcRandomDmg(500 + (sLv - 1) * 50);
            let targetX = player.x + dirX * 180;
            let targetY = player.y + dirY * 180;

            player.startDash(targetX, targetY, 40);
            skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 75, color: 'rgba(255, 152, 0, 0.8)', team: player.team });

            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) <= 75) {
                    e.takeDamage(dmg, player.team, 'magical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(dmg)}`, color: '#ff9800', life: 0.8 });
                    e.isStunned = true;
                    e.setStatus('暈眩', 0.67);
                    setTimeout(() => { e.isStunned = false; }, 670);
                }
            });
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(2.5, 5.0 - (sLv - 1) * 0.6);
            let dmg = calcRandomDmg(900 + (sLv - 1) * 100);
            let slowRatio = 0.40 + (sLv - 1) * 0.08;
            let defReduce = 100 + (sLv - 1) * 20;

            let startX = player.x, startY = player.y;
            let targetX = startX + dirX * 240;
            let targetY = startY + dirY * 240;

            projectiles.push({
                x: startX, y: startY, startX: startX, startY: startY,
                targetX: targetX, targetY: targetY, speed: 10, radius: 20,
                isRazFireball: true, owner: player, team: player.team,
                damage: dmg, slowRatio: slowRatio, defReduce: defReduce, hasBounced: false
            });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(5.0, 14.0 - (sLv - 1) * 3.0);
            let segDmg = calcRandomDmg(420 + (sLv - 1) * 60);
            let targetX = player.x + dirX * 180;
            let targetY = player.y + dirY * 180;

            player.startDash(targetX, targetY, 35);

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    skillEffects.push({ x: player.x, y: player.y, life: 0.25, size: 140, color: 'rgba(255, 140, 0, 0.85)', team: player.team });
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team) {
                            let dist = Math.hypot(e.x - player.x, e.y - player.y);
