<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 1v1 模擬器 - 完整旗艦版</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: #0a0a0c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 960px; max-height: 540px; background: #1b5e20; overflow: hidden; border: 4px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        canvas { display: block; background: #2e7d32; }
        
        /* 選角畫面 */
        #hero-select-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,12,0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .hero-grid { display: flex; gap: 15px; margin-top: 20px; }
        .hero-card { width: 120px; height: 160px; background: #1a1a24; border: 3px solid #3d3d5c; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .hero-card:hover, .hero-card.selected { border-color: #ffd700; transform: translateY(-6px); background: #252538; box-shadow: 0 5px 15px rgba(255,215,0,0.3); }
        .hero-avatar { font-size: 46px; margin-bottom: 8px; }
        .hero-name { font-size: 15px; font-weight: bold; }
        .hero-type { font-size: 11px; color: #888a9e; margin-top: 4px; text-align: center; }
        .btn-start { margin-top: 30px; padding: 12px 36px; font-size: 18px; background: linear-gradient(to bottom, #ff9800, #f57c00); border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* 遊戲介面 HUD */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .top-hud { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.75); padding: 5px 18px; border-radius: 20px; border: 1px solid #444; letter-spacing: 2px; }
        
        /* 虛擬搖桿 */
        #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 140px; height: 140px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; pointer-events: auto; touch-action: none; }
        #joystick-knob { position: absolute; top: 45px; left: 45px; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        /* 技能按鈕群組 */
        .skill-btn-group { position: absolute; bottom: 25px; right: 25px; display: flex; gap: 15px; pointer-events: auto; }
        .skill-btn { width: 70px; height: 70px; background: rgba(10,10,15,0.75); border: 3px solid #ffd700; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .skill-btn:active { transform: scale(0.92); }
        .skill-cd { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #ff5252; display: none; }

        /* 結算畫面 */
        #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; display: none; }
        .result-title-win { font-size: 56px; color: #ffd700; font-weight: bold; text-shadow: 0 0 20px #ff9800; }
        .result-title-lose { font-size: 56px; color: #f44336; font-weight: bold; text-shadow: 0 0 20px #d32f2f; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="hero-select-screen">
        <h2>傳說對決 1v1 模擬器 (全英雄詳細版)</h2>
        <div class="hero-grid" id="hero-grid"></div>
        <button class="btn-start" onclick="confirmStartGame()">進入戰場</button>
    </div>

    <div id="ui-layer">
        <div class="top-hud" id="top-hud">00:00</div>
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="skill-btn-group">
            <div class="skill-btn" ontouchstart="castSkill(1)" onmousedown="castSkill(1)">1技<div class="skill-cd" id="cd-1"></div></div>
            <div class="skill-btn" ontouchstart="castSkill(2)" onmousedown="castSkill(2)">2技<div class="skill-cd" id="cd-2"></div></div>
            <div class="skill-btn" ontouchstart="castSkill(3)" onmousedown="castSkill(3)">3技<div class="skill-cd" id="cd-3"></div></div>
        </div>
    </div>

    <div id="result-screen">
        <div id="result-title">VICTORY</div>
        <div id="result-subtitle" style="margin: 20px 0; font-size: 20px; color: #ccc;"></div>
        <button class="btn-start" onclick="location.reload()">再戰一局</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let MAP_SIZE = 2800;
let selectedHeroKey = 'valhein';
let randomAiKey = 'nakroth';
let isRunning = false;
let gameTime = 0;
let minionSpawnTimer = 0;

// 五大英雄完整資料庫
const HERO_DB = {
    'valhein': { name: '凡恩', type: '射手 / 普攻流', baseHp: 5500, hpGrowth: 600, atk: 250, atkInterval: 0.6, range: 240, avatar: '🎯' },
    'nakroth': { name: '納克羅斯', type: '刺客 / 位移拉扯', baseHp: 5200, hpGrowth: 580, atk: 200, atkInterval: 0.4, range: 120, avatar: '🗡️' },
    'ryoma': { name: '龍馬', type: '戰士 / 消耗爆發', baseHp: 6000, hpGrowth: 700, atk: 190, atkInterval: 0.5, range: 180, avatar: '⚔️' },
    'quillen': { name: '奎倫', type: '刺客 / 背刺暴擊', baseHp: 5000, hpGrowth: 550, atk: 120, atkInterval: 0.5, range: 120, avatar: '🥷' },
    'krixi': { name: '克里希', type: '法師 / 遠程爆發', baseHp: 5800, hpGrowth: 650, atk: 150, atkInterval: 0.5, range: 240, avatar: '🦋' }
};

// 動態生成選角卡片
const heroGrid = document.getElementById('hero-grid');
Object.keys(HERO_DB).forEach(key => {
    let h = HERO_DB[key];
    let card = document.createElement('div');
    card.className = `hero-card ${key === selectedHeroKey ? 'selected' : ''}`;
    card.innerHTML = `<div class="hero-avatar">${h.avatar}</div><div class="hero-name">${h.name}</div><div class="hero-type">${h.type}</div>`;
    card.onclick = () => {
        document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedHeroKey = key;
    };
    heroGrid.appendChild(card);
});

class Entity {
    constructor(x, y, team, radius) {
        this.x = x; this.y = y; this.team = team; this.radius = radius;
        this.alive = true;
    }
}

// 建築物 (主堡與防禦塔)
class Building extends Entity {
    constructor(x, y, team, type) {
        super(x, y, team, type === 'core' ? 55 : 45);
        this.type = type;
        this.maxHp = type === 'core' ? 6000 : 12000;
        this.hp = this.maxHp;
        this.atkTimer = 0;
        this.attackRange = 240;
    }
    takeDamage(dmg, sourceTeam) {
        if (!this.alive) return;
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            if (this.type === 'tower') endGame(sourceTeam);
        }
    }
    update() {
        if (!this.alive) return;
        this.atkTimer++;
        if (this.atkTimer >= 60) {
            this.atkTimer = 0;
            let enemies = entities.filter(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.attackRange);
            let target = enemies.find(e => e instanceof Hero) || enemies[0];
            if (target) {
                target.takeDamage(300, this.team);
                damageTexts.push({ x: target.x, y: target.y - 45, value: '⚡ 防禦塔轟擊 300', color: '#ff5252', life: 0.8 });
            }
        }
    }
}

// 小兵類別
class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 14);
        this.maxHp = 1200;
        this.hp = this.maxHp;
        this.atk = 80;
        this.speed = 1.8;
        this.range = 100;
        this.atkCooldown = 0;
    }
    takeDamage(dmg, sourceTeam) {
        if (!this.alive) return;
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            if (sourceTeam === player.team && player.alive) {
                player.gainExp(100);
            }
        }
    }
    update() {
        if (!this.alive) return;
        if (this.atkCooldown > 0) this.atkCooldown--;

        let tx = this.team === 'blue' ? MAP_SIZE - 250 : 250;
        let ty = this.team === 'blue' ? 250 : MAP_SIZE - 250;
        let angle = Math.atan2(ty - this.y, tx - this.x);

        let target = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.range);
        if (target) {
            if (this.atkCooldown === 0) {
                this.atkCooldown = 60;
                target.takeDamage(this.atk, this.team);
            }
        } else {
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;
        }
    }
}

// 英雄類別
class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer) {
        super(x, y, team, 24);
        this.heroKey = heroKey;
        this.heroData = HERO_DB[heroKey];
        this.isPlayer = isPlayer;
        this.maxHp = this.heroData.baseHp;
        this.hp = this.maxHp;
        this.atk = this.heroData.atk;
        this.range = this.heroData.range;
        this.speed = 3.4;
        this.level = 1;
        this.exp = 0;
        this.atkCooldown = 0;
        this.isStunned = false;
        this.dashTimer = 0;
        this.dashTargetX = 0;
        this.dashTargetY = 0;
        this.dashSpeed = 0;
        
        // 被動變數
        this.valheinPassiveStacks = 0;
        this.valheinAutoCount = 0;
        this.valheinPassiveTimer = 0;
        this.nakrothPassiveStacks = 0;
        this.ryomaPassiveTimer = 300;
        this.ryomaHasStrongAtk = false;
        this.isQuillenStealth = false;
    }
    takeDamage(dmg, sourceTeam) {
        if (!this.alive) return;
        if (!this.isPlayer) dmg *= 0.8; // AI 傷害 0.8 倍降難度
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            setTimeout(() => { this.respawn(); }, 4000);
        }
    }
    gainExp(amount) {
        this.exp += amount;
        let neededExp = this.level * 300;
        if (this.exp >= neededExp && this.level < 15) {
            this.exp -= neededExp;
            this.level++;
            this.maxHp += this.heroData.hpGrowth || 600;
            this.hp = this.maxHp;
            damageTexts.push({ x: this.x, y: this.y - 60, value: `✨ LEVEL UP! Lv.${this.level}`, color: '#ffd700', life: 1.5 });
        }
    }
    startDash(targetX, targetY, speed) {
        this.dashTargetX = targetX;
        this.dashTargetY = targetY;
        this.dashSpeed = speed;
        this.dashTimer = 10;
    }
    respawn() {
        this.alive = true;
        this.hp = this.maxHp;
        this.x = this.team === 'blue' ? 250 : MAP_SIZE - 250;
        this.y = this.team === 'blue' ? MAP_SIZE - 250 : 250;
    }
    update() {
        if (!this.alive) return;
        if (this.atkCooldown > 0) this.atkCooldown--;

        if (this.dashTimer > 0) {
            this.dashTimer--;
            let dx = this.dashTargetX - this.x, dy = this.dashTargetY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 5) {
                this.x += (dx / dist) * this.dashSpeed;
                this.y += (dy / dist) * this.dashSpeed;
            }
        }

        // 凡恩被動 5 秒未普攻遞減
        if (this.heroKey === 'valhein' && this.valheinPassiveStacks > 0) {
            this.valheinPassiveTimer--;
            if (this.valheinPassiveTimer <= 0) {
                this.valheinPassiveStacks = 0;
            }
        }

        // 溫泉回血 (主堡 250 位置)
        let fx = this.team === 'blue' ? 250 : MAP_SIZE - 250;
        let fy = this.team === 'blue' ? MAP_SIZE - 250 : 250;
        if (Math.hypot(this.x - fx, this.y - fy) <= 130 && this.hp < this.maxHp) {
            this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.025);
        }

        if (this.heroKey === 'ryoma' && !this.ryomaHasStrongAtk) {
            this.ryomaPassiveTimer--;
            if (this.ryomaPassiveTimer <= 0) this.ryomaHasStrongAtk = true;
        }

        // AI 行動邏輯 (低血量回溫泉、自動索敵與普攻)
        if (!this.isPlayer) {
            let tx = this.team === 'blue' ? MAP_SIZE - 500 : 500;
            let ty = this.team === 'blue' ? 500 : MAP_SIZE - 500;
            if (this.hp < this.maxHp * 0.35) { tx = fx; ty = fy; }

            let angle = Math.atan2(ty - this.y, tx - this.x);
            if (Math.hypot(tx - this.x, ty - this.y) > 60) {
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            if (this.atkCooldown === 0) {
                performAttack(this);
            }
        }
    }
}

let entities = [];
let damageTexts = [];
let skillCooldowns = { 1: 0, 2: 0, 3: 0 };
let skillLevels = { 1: 1, 2: 1, 3: 1 };
let player, aiHero, blueCore, redCore, blueTower, redTower;
let joystickDir = { x: 0, y: 0 };

function confirmStartGame() {
    document.getElementById('hero-select-screen').style.display = 'none';
    
    blueCore = new Building(250, MAP_SIZE - 250, 'blue', 'core');       
    redCore = new Building(MAP_SIZE - 250, 250, 'red', 'core');
    blueTower = new Building(850, MAP_SIZE - 850, 'blue', 'tower');     
    redTower = new Building(MAP_SIZE - 850, 850, 'red', 'tower');

    player = new Hero(250, MAP_SIZE - 250, 'blue', selectedHeroKey, true);
    aiHero = new Hero(MAP_SIZE - 250, 250, 'red', randomAiKey, false);

    entities = [blueCore, redCore, blueTower, redTower, player, aiHero];
    isRunning = true;
    requestAnimationFrame(gameLoop);
}

// 普攻系統實作（帶範圍檢測與完整被動觸發）
function performAttack(attacker = player) {
    if (!attacker || !attacker.alive || attacker.atkCooldown > 0) return;

    let attackRange = attacker.range;
    let target = null;
    let minDist = 9999;

    entities.forEach(e => {
        if (!e.alive || e.team === attacker.team) return;
        let d = Math.hypot(e.x - attacker.x, e.y - attacker.y);
        if (d <= attackRange + e.radius && d < minDist) {
            minDist = d;
            target = e;
        }
    });

    if (target) {
        attacker.atkCooldown = Math.round((attacker.heroData.atkInterval || 0.5) * 60);
        let baseDmg = attacker.atk + (attacker.level - 1) * 25;

        // 凡恩被動 (每3下普攻疊1層，最多4層，5秒沒普攻消失)
        if (attacker.heroKey === 'valhein') {
            attacker.valheinPassiveTimer = 300; // 重置 5 秒
            attacker.valheinAutoCount++;
            if (attacker.valheinAutoCount >= 3) {
                attacker.valheinAutoCount = 0;
                if (attacker.valheinPassiveStacks < 4) attacker.valheinPassiveStacks++;
            }
            baseDmg += attacker.valheinPassiveStacks * 20;
        }
        // 納克羅斯被動 (每4下普攻擊飛)
        else if (attacker.heroKey === 'nakroth') {
            attacker.nakrothPassiveStacks++;
            if (attacker.nakrothPassiveStacks >= 4) {
                attacker.nakrothPassiveStacks = 0;
                target.isStunned = true;
                setTimeout(() => { target.isStunned = false; }, 500);
            }
        }
        // 龍馬強普 (每5秒強普 2倍傷)
        else if (attacker.heroKey === 'ryoma' && attacker.ryomaHasStrongAtk) {
            attacker.ryomaHasStrongAtk = false;
            attacker.ryomaPassiveTimer = 300;
            baseDmg *= 2.0;
        }
        // 奎倫背刺 (必定暴擊 200%)
        else if (attacker.heroKey === 'quillen') {
            baseDmg *= 2.0;
        }

        target.takeDamage(baseDmg, attacker.team);
    }
}

// 🎯 全英雄詳細技能路由 (castSkill)
function castSkill(id) {
    if (!player || !player.alive || skillCooldowns[id] > 0) return;
    skillCooldowns[id] = 6.0;

    let dirX = joystickDir.x !== 0 || joystickDir.y !== 0 ? joystickDir.x : 0.707;
    let dirY = joystickDir.x !== 0 || joystickDir.y !== 0 ? joystickDir.y : -0.707;
    let len = Math.hypot(dirX, dirY);
    dirX /= len; dirY /= len;

    let heroKey = player.heroKey;

    // 1. 凡恩 (Valhein)
    if (heroKey === 'valhein') {
        if (id === 1) {
            let target = findTargetInRange(240);
            if (target) {
                target.takeDamage(500, player.team);
                // 爆炸小範圍傷害
                setTimeout(() => {
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - target.x, e.y - target.y) <= 90) {
                            e.takeDamage(250, player.team);
                        }
                    });
                }, 200);
            }
        } else if (id === 2) {
            let target = findTargetInRange(240);
            if (target) {
                target.takeDamage(150, player.team);
                target.isStunned = true;
                setTimeout(() => { target.isStunned = false; }, 2000); // 2秒暈眩
            }
        } else if (id === 3) {
            player.valheinPassiveStacks = 4; // 滿被動
            let tx = player.x + dirX * 200, ty = player.y + dirY * 200;
            entities.forEach(e => {
                if (e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 120) {
                    e.takeDamage(500, player.team);
                }
            });
        }
    }
    // 2. 納克羅斯 (Nakroth)
    else if (heroKey === 'nakroth') {
        if (id === 1) {
            let dashX = player.x + dirX * 200, dashY = player.y + dirY * 200;
            player.startDash(dashX, dashY, 45);
            setTimeout(() => {
                entities.forEach(e => {
                    if (e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 90) {
                        e.takeDamage(400, player.team);
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 500);
                    }
                });
            }, 250);
        } else if (id === 2) {
            let dashX = player.x - dirX * 160, dashY = player.y - dirY * 160;
            player.startDash(dashX, dashY, 40);
        } else if (id === 3) {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 130) {
                            e.takeDamage(50, player.team);
                            if (i === 5) { // 最後一段擊飛
                                e.isStunned = true;
                                setTimeout(() => { e.isStunned = false; }, 500);
                            }
                        }
                    });
                }, i * 150);
            }
        }
    }
    // 3. 龍馬 (Ryoma)
    else if (heroKey === 'ryoma') {
        if (id === 1) {
            let dashX = player.x - dirX * 140, dashY = player.y - dirY * 140;
            player.startDash(dashX, dashY, 35);
        } else if (id === 2) {
            let tx = player.x + dirX * 240, ty = player.y + dirY * 240;
            entities.forEach(e => {
                if (e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 100) {
                    e.takeDamage(700, player.team);
                    e.isStunned = true;
                    setTimeout(() => { e.isStunned = false; }, 1000); // 1秒暈眩
                }
            });
        } else if (id === 3) {
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.08);
                    let tx = player.x + dirX * 200, ty = player.y + dirY * 200;
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 100) {
                            e.takeDamage(300, player.team);
                        }
                    });
                }, i * 200);
            }
        }
    }
    // 4. 奎倫 (Quillen)
    else if (heroKey === 'quillen') {
        if (id === 1) {
            for (let i = 0; i < 2; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 100) {
                            e.takeDamage(300, player.team);
                        }
                    });
                }, i * 150);
            }
        } else if (id === 2) {
            let dashX = player.x + dirX * 180, dashY = player.y + dirY * 180;
            player.startDash(dashX, dashY, 35);
        } else if (id === 3) {
            player.isQuillenStealth = true;
            setTimeout(() => { if (player) player.isQuillenStealth = false; }, 4000);
        }
    }
    // 5. 克里希 (Krixi)
    else if (heroKey === 'krixi') {
        if (id === 1) {
            let tx = player.x + dirX * 280, ty = player.y + dirY * 280;
            setTimeout(() => {
                entities.forEach(e => {
                    if (e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 90) {
                        e.takeDamage(630, player.team); // 600 + 被動30
                    }
                });
            }, 200);
        } else if (id === 2) {
            let cx = player.x + dirX * 240, cy = player.y + dirY * 240;
            setTimeout(() => {
                entities.forEach(e => {
                    if (e.alive && e.team !== player.team && Math.hypot(e.x - cx, e.y - cy) <= 80) {
                        e.takeDamage(230, player.team); // 200 + 被動30
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 750); // 0.75秒暈眩
                    }
                });
            }, 500);
        } else if (id === 3) {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    let target = entities.find(e => e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 240);
                    if (target) target.takeDamage(430, player.team); // 400 + 被動30
                }, i * 500);
            }
        }
    }
}

function findTargetInRange(range) {
    let target = null, minDist = 999;
    entities.forEach(e => {
        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= range) {
            let d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < minDist) { minDist = d; target = e; }
        }
    });
    return target;
}

// 虛擬搖桿
let joystickZone = document.getElementById('joystick-zone');
let joystickKnob = document.getElementById('joystick-knob');
let isDragging = false;

joystickZone.addEventListener('pointerdown', (e) => { isDragging = true; updateJoystick(e); });
window.addEventListener('pointermove', (e) => { if (isDragging) updateJoystick(e); });
window.addEventListener('pointerup', () => { isDragging = false; joystickDir = { x: 0, y: 0 }; joystickKnob.style.transform = `translate(0px, 0px)`; });

function updateJoystick(e) {
    let rect = joystickZone.getBoundingClientRect();
    let cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    let dist = Math.hypot(dx, dy), maxDist = 45;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir = { x: dx / maxDist, y: dy / maxDist };
}

function endGame(winnerTeam) {
    if (!isRunning) return;
    isRunning = false;
    let resScreen = document.getElementById('result-screen');
    let title = document.getElementById('result-title');
    let subtitle = document.getElementById('result-subtitle');
    
    if (winnerTeam === 'blue') {
        title.innerText = 'VICTORY'; title.className = 'result-title-win';
        subtitle.innerText = '成功摧毀敵方防禦塔！';
    } else {
        title.innerText = 'DEFEAT'; title.className = 'result-title-lose';
        subtitle.innerText = '我方防禦塔已被毀壞！';
    }
    resScreen.style.display = 'flex';
}

function gameLoop() {
    if (!isRunning) return;
    gameTime += 1/60;
    minionSpawnTimer++;

    if (minionSpawnTimer >= 900) {
        minionSpawnTimer = 0;
        entities.push(new Minion(250, MAP_SIZE - 250, 'blue'));
        entities.push(new Minion(MAP_SIZE - 250, 250, 'red'));
    }

    let mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
    let secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
    document.getElementById('top-hud').innerText = `${mins}:${secs}`;

    if (player.alive && !player.isStunned && (joystickDir.x !== 0 || joystickDir.y !== 0)) {
        player.x += joystickDir.x * player.speed;
        player.y += joystickDir.y * player.speed;
        player.x = Math.max(60, Math.min(MAP_SIZE - 60, player.x));
        player.y = Math.max(60, Math.min(MAP_SIZE - 60, player.y));
    }

    entities.forEach(e => e.update());
    entities = entities.filter(e => e.alive);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    
    let camX = canvas.width / 2 - player.x;
    let camY = canvas.height / 2 - player.y;
    ctx.translate(camX, camY);

    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
    ctx.strokeStyle = '#388e3c'; ctx.lineWidth = 120;
    ctx.beginPath(); ctx.moveTo(250, MAP_SIZE - 250); ctx.lineTo(MAP_SIZE - 250, 250); ctx.stroke();

    entities.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        if (e instanceof Building) {
            ctx.fillStyle = e.team === 'blue' ? '#00bcd4' : '#ff5722';
        } else if (e instanceof Minion) {
            ctx.fillStyle = e.team === 'blue' ? '#80d8ff' : '#ff8a80';
        } else {
            ctx.fillStyle = e.team === 'blue' ? '#2196f3' : '#f44336';
        }
        ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();

        if (e instanceof Hero || e instanceof Building || e instanceof Minion) {
            let barW = e instanceof Minion ? 30 : 56;
            let barH = 5;
            ctx.fillStyle = '#222';
            ctx.fillRect(e.x - barW / 2, e.y - e.radius - 12, barW, barH);
            ctx.fillStyle = e.team === 'blue' ? '#00e676' : '#ff5252';
            ctx.fillRect(e.x - barW / 2, e.y - e.radius - 12, barW * (e.hp / e.maxHp), barH);

            // 凡恩專屬被動條 (血條下方 4 格)
            if (e === player && e.heroKey === 'valhein') {
                for (let i = 0; i < 4; i++) {
                    ctx.fillStyle = i < e.valheinPassiveStacks ? '#00e5ff' : '#444';
                    ctx.fillRect(e.x - 28 + i * 15, e.y - e.radius - 20, 13, 4);
                }
            }
        }
    });

    ctx.restore();

    Object.keys(skillCooldowns).forEach(id => {
        if (skillCooldowns[id] > 0) {
            skillCooldowns[id] -= 1/60;
            if (skillCooldowns[id] < 0) skillCooldowns[id] = 0;
        }
    });

    requestAnimationFrame(gameLoop);
}
</script>
