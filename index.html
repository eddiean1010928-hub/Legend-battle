<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <!-- 引入 Google 官方 Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #0f1923; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; pointer-events: auto; padding: 15px; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        /* 玩家頭像與真實 Google 帳號顯示 */
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }

        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .start-match-btn .sub-text { font-size: 0.75rem; color: #fef3c7; font-weight: bold; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 20px; z-index: 20; font-size: 1rem; font-weight: bold; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .score-blue { color: #00d2ff; }

        .hero-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; overflow-y: auto; }

        .hero-card.active { border-color: #f3c654; background: rgba(243, 198, 84, 0.25); }

<script>
// 解析 Google 回傳 JWT Token 的函式
function parseJwt(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

// Google 登入成功後的回調函數
function handleCredentialResponse(response) {
    const responsePayload = parseJwt(response.credential);
    console.log("ID: " + responsePayload.sub);
    console.log('Full Name: ' + responsePayload.name);
    console.log('Image URL: ' + responsePayload.picture);
    console.log('Email: ' + responsePayload.email);

    // 隱藏登入按鈕，顯示玩家資訊
    document.getElementById('google-signin-btn-container').classList.add('hidden');
    let userProfile = document.getElementById('user-profile');
    document.getElementById('user-avatar').src = responsePayload.picture;
    document.getElementById('user-name').innerText = responsePayload.name;
    userProfile.classList.remove('hidden');
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let MAP_SIZE = 4200;
let isRunning = false;
let gameMode = '1v1';
let selectedHeroKey = 'krixi';

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

    'valhein': { name: '凡恩', type: '射手 (AD)', atk: 85, range: 250, color1: '#c29b38', color2: '#ffe89e' },
    'zuka': { name: '祖卡', type: '戰士 (AD)', atk: 110, range: 140, color1: '#ff9800', color2: '#ffe082' }
};

const ITEMS_DB = [
    { id: 'ap_1', name: '魔法書', cost: 300, atk: 25 },
    { id: 'ad_1', name: '聖劍', cost: 300, atk: 30 },
    { id: 'def_1', name: '守衛鎧甲', cost: 400, hp: 400 }
];

let blueKills = 0, redKills = 0;
let kills = 0, deaths = 0, assists = 0;
let player = null, entities = [], skillEffects = [], attackEffects = [], camera = { x: 0, y: 0 };
let minionSpawnTimer = 0;

let joystickDir = { x: 0, y: 0 };
let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };
let activeSkillDrag = null;
let showAttackRange = false;

let skillCooldowns = { 1: 0, 2: 0, 3: 0 };
const skillMaxCDs = { 1: 3.0, 2: 5.0, 3: 10.0 };

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');

function bindClick(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => { e.stopPropagation(); fn(e); });
    el.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); fn(e); }, { passive: false });
}

bindClick('btn-mode-1v1', () => openHeroPick('1v1'));
bindClick('btn-mode-5v5', () => openHeroPick('5v5'));
bindClick('btn-start-match', () => openHeroPick('1v1'));
bindClick('btn-confirm-hero', () => confirmStartGame());
bindClick('btn-pick-back', () => backToMenuFromPick());
bindClick('btn-back-lobby', () => backToLobby());

joystick.addEventListener('pointerdown', e => {
    joystickTouchId = e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    const rect = joystick.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
});
joystick.addEventListener('pointermove', e => {
    if (e.pointerId === joystickTouchId) updateJoystick(e.clientX, e.clientY);
});
function resetJoystick(e) {
    if (e.pointerId === joystickTouchId) {
        joystickTouchId = null;
        joystickDir = { x: 0, y: 0 };
        knob.style.transform = `translate(0px, 0px)`;
    }
}
joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
}

const attackBtn = document.getElementById('btn-attack');
attackBtn.addEventListener('pointerdown', () => { showAttackRange = true; performAttack(); });
attackBtn.addEventListener('pointerup', () => showAttackRange = false);
attackBtn.addEventListener('pointercancel', () => showAttackRange = false);

document.querySelectorAll('.skill-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
        let skillId = parseInt(btn.dataset.skill);
        let reqLevel = skillId === 1 ? 1 : (skillId === 2 ? 2 : 4);
        if (player.level < reqLevel || skillCooldowns[skillId] > 0 || !player.alive) return;

        e.preventDefault();
        e.stopPropagation();

        btn.setPointerCapture(e.pointerId);
        let rect = btn.getBoundingClientRect();
        activeSkillDrag = { 
            skillId: skillId, 
            pointerId: e.pointerId, 
            centerX: rect.left + rect.width / 2, 
            centerY: rect.top + rect.height / 2, 
            dirX: 0, 
            dirY: -1 
        };
    }, { passive: false });

    btn.addEventListener('pointermove', e => {
        if (activeSkillDrag && activeSkillDrag.pointerId === e.pointerId) {
            e.preventDefault();
            let dx = e.clientX - activeSkillDrag.centerX;
            let dy = e.clientY - activeSkillDrag.centerY;
            let len = Math.hypot(dx, dy);
            if (len > 10) { 
                activeSkillDrag.dirX = dx / len; 
                activeSkillDrag.dirY = dy / len; 
            }
        }
    }, { passive: false });

    function releaseSkill(e) {
        if (activeSkillDrag && activeSkillDrag.pointerId === e.pointerId) {
            castSkill(activeSkillDrag.skillId, activeSkillDrag.dirX, activeSkillDrag.dirY);
            activeSkillDrag = null;
        }
    }
    btn.addEventListener('pointerup', releaseSkill);
    btn.addEventListener('pointercancel', releaseSkill);
});

class Entity {
    constructor(x, y, team, radius = 22) {
        this.x = x; this.y = y; this.team = team;
        this.radius = radius; this.hp = 2000; this.maxHp = 2000; this.alive = true;
    }
    takeDamage(dmg, sourceTeam) {
        if (!this.alive) return;
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0; this.alive = false;
            if (sourceTeam === 'blue' && player && player.alive) {
                player.gold += 150;
                document.getElementById('header-gold').innerText = `🪙 ${Math.floor(player.gold)}`;
            }
            if (this instanceof Hero) {
                if (sourceTeam === 'blue') { blueKills++; kills++; } 
                else { redKills++; }
                updateTopScopeUI();
            } else if (this instanceof NexusBase) {
                if (this.team === 'red') showGameResult(true);
                else showGameResult(false);
            }
        }
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer = false) {
        let heroData = HERO_DB[heroKey];
        super(x, y, team, 26);
        this.startX = x; this.startY = y;
        this.heroKey = heroKey; this.heroData = heroData; this.isPlayer = isPlayer;
        this.gold = 2900; this.exp = 0; this.level = 1;
        this.atk = heroData.atk; this.range = heroData.range;
        this.speed = 4.5;
        this.maxHp = 2500; this.hp = 2500;
        this.minionIncomeTimer = 0;
    }
    update() {
        if (!this.alive) return;

        if (this.isPlayer) {
            if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                this.x += joystickDir.x * this.speed;
                this.y += joystickDir.y * this.speed;
            }
            
            this.minionIncomeTimer += 1/60;
            if (this.minionIncomeTimer >= 1.0) {
                this.gold += 3;
                this.minionIncomeTimer = 0;
                document.getElementById('header-gold').innerText = `🪙 ${Math.floor(this.gold)}`;
            }

            this.exp += 0.08;
            if (this.exp >= this.level * 100 && this.level < 15) {
                this.level++;
                this.maxHp += 300;
                this.hp = Math.min(this.maxHp, this.hp + 300);
                updateTopScopeUI();
            }
        } else {
            let target = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 350);
            if (target) {
                let dx = target.x - this.x, dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > this.range) {
                    this.x += (dx / dist) * (this.speed * 0.6);
                    this.y += (dy / dist) * (this.speed * 0.6);
                } else {
                    target.takeDamage(this.atk * 0.25, this.team);
                }
            } else {
                let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
                let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
                let dx = targetX - this.x, dy = targetY - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 50) {
                    this.x += (dx / dist) * (this.speed * 0.5);
                    this.y += (dy / dist) * (this.speed * 0.5);
                }
            }
        }
        this.x = Math.max(100, Math.min(MAP_SIZE - 100, this.x));
        this.y = Math.max(100, Math.min(MAP_SIZE - 100, this.y));
    }
    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.heroData.color1; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = this.heroData.color2; ctx.stroke();
        ctx.restore();

        if (this.isPlayer && showAttackRange) {
            ctx.beginPath(); ctx.arc(screenX, screenY, this.range, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = 'rgba(255, 215, 0, 0.08)'; ctx.fill();
        }

        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 30, screenY - 42, 60, 6);
        ctx.fillStyle = this.team === 'blue' ? '#00e676' : '#ff1744';
        ctx.fillRect(screenX - 30, screenY - 42, (this.hp / this.maxHp) * 60, 6);
    }
}

class Turret extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 35);
        this.maxHp = 5000; this.hp = 5000;
        this.range = 300; this.atk = 180; this.cooldown = 0;
    }
    update() {
        if (!this.alive) return;
        if (this.cooldown > 0) this.cooldown -= 1/60;
        if (this.cooldown <= 0) {
            let target = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < this.range);
            if (target) {
                target.takeDamage(this.atk, this.team);
                this.cooldown = 1.2;
            }
        }
    }
    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;

        ctx.beginPath(); ctx.arc(screenX, screenY, this.range, 0, Math.PI * 2);
        ctx.strokeStyle = this.team === 'blue' ? 'rgba(0, 210, 255, 0.25)' : 'rgba(255, 68, 68, 0.25)';
        ctx.lineWidth = 2; ctx.stroke();

        ctx.beginPath(); ctx.arc(screenX, screenY, 32, 0, Math.PI * 2);
        ctx.fillStyle = '#263238'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#546e7a'; ctx.stroke();

        ctx.fillStyle = this.team === 'blue' ? '#1565c0' : '#c62828';
        ctx.fillRect(screenX - 18, screenY - 26, 36, 42);

        ctx.fillStyle = '#000'; ctx.fillRect(screenX - 30, screenY - 40, 60, 6);
        ctx.fillStyle = '#00e676'; ctx.fillRect(screenX - 30, screenY - 40, (this.hp / this.maxHp) * 60, 6);
    }
}

class NexusBase extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 50);
        this.maxHp = 8000; this.hp = 8000;
    }
    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        ctx.beginPath(); ctx.arc(screenX, screenY, 50, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? '#0d47a1' : '#b71c1c'; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#ffd700'; ctx.stroke();

        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
        ctx.fillText(this.team === 'blue' ? '藍方主堡' : '紅方主堡', screenX, screenY + 5);

        ctx.fillStyle = '#000'; ctx.fillRect(screenX - 40, screenY - 65, 80, 8);
        ctx.fillStyle = '#00e676'; ctx.fillRect(screenX - 40, screenY - 65, (this.hp / this.maxHp) * 80, 8);
    }
}

class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 14);
        this.hp = 450; this.maxHp = 450; this.speed = 2.0; this.atk = 20;
    }
    update() {
        if (!this.alive) return;
        let enemy = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 60);
        if (enemy) {
            enemy.takeDamage(this.atk * 0.3, this.team);
        } else {
            let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
            let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
            let dx = targetX - this.x, dy = targetY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 20) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }
        }
    }
    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        ctx.beginPath(); ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? '#42a5f5' : '#ef5350'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 15, screenY - 20, 30, 4);
        ctx.fillStyle = this.team === 'blue' ? '#00e676' : '#ff1744';
        ctx.fillRect(screenX - 15, screenY - 20, (this.hp / this.maxHp) * 30, 4);
    }
}

function spawnMinionWave() {
    entities.push(new Minion(450, MAP_SIZE - 450, 'blue'));
    entities.push(new Minion(MAP_SIZE - 450, 450, 'red'));
}

function performAttack() {
    if (!player || !player.alive) return;
    let target = entities.find(e => e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= player.range);
    if (target) {
        target.takeDamage(player.atk, player.team);
        attackEffects.push({ x: target.x, y: target.y, life: 0.3, radius: 28 });
    }
}

function castSkill(skillId, dirX, dirY) {
    if (!player || !player.alive) return;
    skillCooldowns[skillId] = skillMaxCDs[skillId];

    if (player.heroKey === 'valhein') {
        if (skillId === 1) skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 1.0, speed: 11, size: 18, color: '#ffd700', dmg: 140, team: player.team });
        else if (skillId === 2) skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 1.0, speed: 9, size: 16, color: '#00e5ff', dmg: 110, team: player.team });
        else if (skillId === 3) {
            for (let angleOff = -0.4; angleOff <= 0.4; angleOff += 0.2) {
                let cos = Math.cos(angleOff), sin = Math.sin(angleOff);
                skillEffects.push({ x: player.x, y: player.y, dirX: dirX * cos - dirY * sin, dirY: dirX * sin + dirY * cos, life: 1.0, speed: 12, size: 18, color: '#ff3d00', dmg: 180, team: player.team });
            }
        }
    } else {
        if (skillId === 1) { player.x += dirX * 120; player.y += dirY * 120; }
        else skillEffects.push({ x: player.x + dirX * 100, y: player.y + dirY * 100, dirX: 0, dirY: 0, life: 0.8, speed: 0, size: 45, color: '#e040fb', dmg: 160, team: player.team });
    }
}

function showGameResult(win) {
    isRunning = false;
    let resScreen = document.getElementById('result-screen');
    let resTitle = document.getElementById('result-title');
    let resSub = document.getElementById('result-subtitle');

    resScreen.classList.remove('hidden');
    if (win) {
        resTitle.className = 'result-title-win';
        resTitle.innerText = 'VICTORY';
        resSub.innerText = '恭喜你！成功摧毀敵方主堡！';
    } else {
        resTitle.className = 'result-title-lose';
        resTitle.innerText = 'DEFEAT';
        resSub.innerText = '主堡被摧毀了，再接再厲！';
    }
}

function backToLobby() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.add('hidden');
    document.getElementById('top-hud').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function backToMenuFromPick() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function updateTopScopeUI() {
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;
    document.getElementById('level-display').innerText = `Lv.${player ? player.level : 1}`;
    document.getElementById('gold-display').innerText = `🪙 ${Math.floor(player ? player.gold : 0)}`;

    for (let id = 1; id <= 3; id++) {
        let reqLevel = id === 1 ? 1 : (id === 2 ? 2 : 4);
        let btn = document.getElementById(`skill-${id}`);
        let cdOverlay = document.getElementById(`cd-${id}`);

        if (player && player.level < reqLevel) {
            btn.classList.add('locked');
            cdOverlay.classList.remove('hidden');
            cdOverlay.innerText = `Lv.${reqLevel}`;
        } else {
            btn.classList.remove('locked');
            if (skillCooldowns[id] > 0) {
                cdOverlay.classList.remove('hidden');
                cdOverlay.innerText = skillCooldowns[id].toFixed(1);
            } else {
                cdOverlay.classList.add('hidden');
            }
        }
    }
}

function renderFastBuy() {
    let container = document.getElementById('fast-buy-list');
    container.innerHTML = '';
    ITEMS_DB.forEach(item => {
        if (player && player.gold >= item.cost) {
            let div = document.createElement('div');
            div.className = 'fast-buy-item';
            div.innerHTML = `<b>${item.name}</b><span class="cost">🪙${item.cost}</span>`;
            
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                player.gold -= item.cost;
                player.atk += item.atk || 0;
                player.maxHp += item.hp || 0;
                player.hp = Math.min(player.maxHp, player.hp + (item.hp || 0));
            });
            container.appendChild(div);
        }
    });
}

function openHeroPick(mode) {
    gameMode = mode;
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('pick-screen').classList.remove('hidden');

    let grid = document.getElementById('hero-select-grid');
    grid.innerHTML = '';
    Object.keys(HERO_DB).forEach(key => {
        let hero = HERO_DB[key];
        let card = document.createElement('div');
        card.className = `hero-card ${key === selectedHeroKey ? 'active' : ''}`;
        card.innerHTML = `<b>${hero.name}</b><br><span style="font-size:0.75rem;">${hero.type}</span>`;
        card.onclick = (e) => {
            e.stopPropagation();
            selectedHeroKey = key;
            document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            document.getElementById('selected-hero-name').innerText = hero.name;
            document.getElementById('selected-hero-type').innerText = hero.type;
        };
        grid.appendChild(card);
    });
}

function confirmStartGame() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.remove('hidden');
    document.getElementById('top-hud').classList.remove('hidden');

    blueKills = 0; redKills = 0; kills = 0; deaths = 0; assists = 0;
    entities = [];
    player = new Hero(400, MAP_SIZE - 400, 'blue', selectedHeroKey, true);
    entities.push(player);

    entities.push(new Hero(MAP_SIZE - 400, 400, 'red', 'valhein', false));

    entities.push(new NexusBase(400, MAP_SIZE - 400, 'blue'));
    entities.push(new NexusBase(MAP_SIZE - 400, 400, 'red'));

    entities.push(new Turret(1400, MAP_SIZE - 1400, 'blue'));
    entities.push(new Turret(MAP_SIZE - 1400, 1400, 'red'));

    spawnMinionWave();
    isRunning = true;
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    if (!isRunning) return;

    for (let id in skillCooldowns) {
        if (skillCooldowns[id] > 0) {
            skillCooldowns[id] -= 1/60;
            if (skillCooldowns[id] < 0) skillCooldowns[id] = 0;
        }
    }
    updateTopScopeUI();

    player.update();
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;

    ctx.fillStyle = '#0f1923';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#1e2d3d'; ctx.lineWidth = 180;
    ctx.beginPath();
    ctx.moveTo(400 - camera.x, MAP_SIZE - 400 - camera.y);
    ctx.lineTo(MAP_SIZE - 400 - camera.x, 400 - camera.y);
    ctx.stroke();

    entities.forEach(e => { if (e.update) e.update(); e.draw(ctx); });

    minionSpawnTimer += 1/60;
    if (minionSpawnTimer >= 15) { spawnMinionWave(); minionSpawnTimer = 0; }

    if (activeSkillDrag && player && player.alive) {
        let pX = player.x - camera.x;
        let pY = player.y - camera.y;
        ctx.beginPath();
        ctx.moveTo(pX, pY);
        ctx.lineTo(pX + activeSkillDrag.dirX * 220, pY + activeSkillDrag.dirY * 220);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    for (let i = attackEffects.length - 1; i >= 0; i--) {
        let af = attackEffects[i];
        af.life -= 0.05;
        ctx.beginPath(); ctx.arc(af.x - camera.x, af.y - camera.y, af.radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 235, 59, 0.8)'; ctx.lineWidth = 3; ctx.stroke();
        if (af.life <= 0) attackEffects.splice(i, 1);
    }

    for (let i = skillEffects.length - 1; i >= 0; i--) {
        let fx = skillEffects[i];
        fx.x += fx.dirX * fx.speed; fx.y += fx.dirY * fx.speed; fx.life -= 0.025;
        ctx.beginPath(); ctx.arc(fx.x - camera.x, fx.y - camera.y, fx.size, 0, Math.PI * 2);
        ctx.fillStyle = fx.color; ctx.fill();

        entities.forEach(e => {
            if (e.alive && e.team !== fx.team && Math.hypot(e.x - fx.x, e.y - fx.y) < fx.size + 10) {
                e.takeDamage(fx.dmg, fx.team);
            }
        });
        if (fx.life <= 0) skillEffects.splice(i, 1);
    }

    renderFastBuy();
    requestAnimationFrame(gameLoop);
}
</script>
