<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #070d14; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; pointer-events: auto; padding: 15px; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }
        .res-gold { color: #f3c654; }

        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px 0; position: relative; }
        .hero-heroine-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0.85; }
        .heroine-avatar { font-size: 9rem; text-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }

        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 10px 5px 10px; }
        .bottom-nav { display: flex; gap: 12px; background: rgba(6, 14, 26, 0.85); padding: 8px 18px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .nav-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: #94a3b8; cursor: pointer; }
        .nav-btn.active { color: #fff; }

        .start-group { display: flex; align-items: flex-end; gap: 15px; }
        .start-match-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%); border: 2px solid #fef08a; width: 170px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 16px; z-index: 20; font-size: 0.9rem; font-weight: bold; pointer-events: none; }
        .score-blue { color: #00d2ff; }
        .score-red { color: #ff4444; }
        .game-time-text { color: #00e676; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 8px; }
        .gold-text { color: #ffd700; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 8px; }
        .kda-text { color: #ffeb3b; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 8px; }
        .level-text { color: #00e676; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 8px; }

        .announcement-banner { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(13, 27, 46, 0.85); padding: 6px 30px; border-top: 1px solid #ffd700; border-bottom: 1px solid #ffd700; z-index: 100; pointer-events: none; text-align: center; }
        .announcement-text { font-size: 1.2rem; font-weight: 900; color: #ffd700; }

        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #hud-layer * { pointer-events: auto; }

        .joystick-container { position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(243, 198, 84, 0.85); border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none; }

        .fast-buy-container { position: absolute; top: 80px; left: 15px; display: flex; flex-direction: column; gap: 8px; width: 100px; z-index: 50; }
        .fast-buy-item { background: rgba(12, 20, 31, 0.95); border: 1px solid #f3c654; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }

        .controls-right { position: absolute; bottom: 15px; right: 20px; width: 280px; height: 180px; pointer-events: none; }
        .attack-btn { position: absolute; bottom: 5px; right: 5px; width: 75px; height: 75px; background: radial-gradient(circle, #f3c654 0%, #8f5c0a 100%); border: 3px solid #ffe596; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #fff; cursor: pointer; pointer-events: auto; }
        
        .bottom-actions-bar { position: absolute; bottom: 10px; right: 95px; display: flex; gap: 8px; pointer-events: auto; }
        .action-mini-btn { width: 42px; height: 42px; background: radial-gradient(circle, #263238 0%, #0d1b2a 100%); border: 2px solid #f3c654; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.9rem; color: #fff; cursor: pointer; position: relative; }
        .action-mini-btn .label { position: absolute; bottom: -15px; font-size: 0.55rem; color: #ffeb3b; font-weight: bold; white-space: nowrap; }

        .skill-btn { position: absolute; width: 60px; height: 60px; background: rgba(15, 25, 40, 0.9); border: 2px solid #00aaff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto; touch-action: none; }
        .skill-btn.locked { border-color: #555; opacity: 0.4; filter: grayscale(1); }
        .skill-desc-label { position: absolute; bottom: -16px; width: 90px; text-align: center; font-size: 0.55rem; color: #ffeb3b; font-weight: bold; pointer-events: none; white-space: nowrap; }
        .skill-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-upgrade-btn {
            position: absolute; top: -10px; right: -10px; width: 30px; height: 30px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8f00 100%);
            border: 2px solid #fff; border-radius: 50%; color: #000;
            font-size: 1.2rem; font-weight: 900; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 12px rgba(255, 215, 0, 0.9); z-index: 100;
            animation: pulse-upgrade 0.8s infinite alternate; pointer-events: auto;
        }
        @keyframes pulse-upgrade {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.15); }
        }

        #skill-3 { bottom: 100px; right: 5px; border-color: #e040fb; }
        #skill-2 { bottom: 70px; right: 75px; border-color: #00e676; }
        #skill-1 { bottom: 5px; right: 155px; border-color: #ff9100; }

        .pick-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070d18; z-index: 150; display: flex; flex-direction: column; padding: 15px; }
        .pick-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .pick-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 1rem; color: #f3c654; }
        .pick-cancel-btn { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; }
        
        .pick-content-layout { display: flex; flex: 1; margin-top: 15px; gap: 15px; overflow: hidden; }
        .pick-hero-sidebar { width: 220px; height: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; overflow-y: auto; padding-right: 5px; }

        .pick-hero-thumb { width: 80px; height: 80px; background: #1a2a40; border: 2px solid #334455; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; }
        .pick-hero-thumb.active { border-color: #f3c654; box-shadow: 0 0 10px rgba(243, 198, 84, 0.6); }
        .pick-hero-thumb .name { font-size: 0.65rem; color: #fff; margin-top: 2px; }

        .pick-center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(30,50,80,0.3) 0%, rgba(5,10,18,0.8) 100%); border-radius: 12px; }
        .stage-hero-avatar { font-size: 8rem; }
        
        .pick-right-sidebar { width: 200px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        .team-slot { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; font-size: 0.85rem; color: #aaa; }
        
        .pick-confirm-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: 2px solid #fef08a; color: #fff; font-weight: bold; font-size: 1.2rem; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }

        .result-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 10, 18, 0.9); z-index: 200; }
        .result-box { background: rgba(13, 23, 38, 0.95); border: 2px solid #f3c654; border-radius: 15px; padding: 30px; text-align: center; width: 85%; max-width: 420px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="top-hud" class="top-score-bar hidden">
        <span class="level-text" id="level-display">Lv.1</span>
        <span class="score-blue" id="score-blue">0</span>
        <span>VS</span>
        <span class="score-red" id="score-red">0</span>
        <span class="game-time-text" id="game-time-display">⏱️ 00:00</span>
        <span class="gold-text" id="gold-display">🪙 300</span>
        <span class="kda-text" id="kda-display">KDA: 0 / 0 / 0</span>
    </div>

    <div id="announcement-banner" class="announcement-banner hidden">
        <div id="announcement-text" class="announcement-text">FIRST BLOOD</div>
    </div>

    <div id="result-screen" class="result-overlay hidden">
        <div class="result-box">
            <div id="result-title" style="font-size: 3rem; font-weight: 900; color: #ffd700;">VICTORY</div>
            <p id="result-subtitle" style="color: #aaa; margin-bottom: 20px;">成功摧毀敵方主堡！</p>
            <button class="pick-confirm-btn" style="width:100%;" id="btn-back-lobby">返回遊戲大廳</button>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <div class="top-navbar">
            <div class="profile-area">
                <div class="user-profile-box">
                    <span class="user-name">挑戰者</span>
                </div>
            </div>
            <div class="resource-group">
                <div class="res-item res-gold" id="header-gold">🟡 300</div>
            </div>
        </div>

        <div class="main-content">
            <div class="hero-heroine-bg">
                <div class="heroine-avatar">⚔️</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-nav">
                <div class="nav-btn active">🛡️ 競技場</div>
            </div>
            <div class="start-group">
                <div class="start-match-btn" id="btn-start-match">
                    <span class="start-text">START</span>
                </div>
            </div>
        </div>
    </div>

    <div id="pick-screen" class="pick-screen-overlay hidden">
        <div class="pick-top-bar">
            <div class="pick-tabs">選擇你的英雄</div>
            <button class="pick-cancel-btn" id="btn-pick-back">取消 ✕</button>
        </div>

        <div class="pick-content-layout">
            <div class="pick-hero-sidebar" id="hero-select-grid"></div>

            <div class="pick-center-stage">
                <div class="stage-hero-avatar" id="stage-hero-avatar">🥷</div>
                <div class="stage-hero-info" style="text-align: center;">
                    <h2 id="selected-hero-name" style="color:#f3c654; font-size: 1.8rem;">奎倫</h2>
                    <p id="selected-hero-type" style="color:#aaa; font-size: 0.95rem;">刺客 / 背刺爆擊</p>
                </div>
            </div>

            <div class="pick-right-sidebar">
                <div class="team-slot"><span>我方</span><span style="color:#00d2ff;">準備就緒</span></div>
                <div class="team-slot"><span>敵方 AI</span><span style="color:#ff4444;">隨機配對</span></div>
                <button class="pick-confirm-btn" id="btn-confirm-hero">開始對戰</button>
            </div>
        </div>
    </div>

    <div id="hud-layer" class="hidden">
        <div class="fast-buy-container" id="fast-buy-list"></div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="controls-right">
            <div class="attack-btn" id="btn-attack">⚔️</div>
            
            <div class="bottom-actions-bar">
                <div class="action-mini-btn" id="btn-recall"><span style="font-size:0.7rem;">回城</span></div>
                <div class="action-mini-btn" id="btn-heal-spell"><span>💚</span><div class="label">恢復</div></div>
                <div class="action-mini-btn" id="btn-challenger-spell">
                    <span id="challenger-icon">✨</span>
                    <div class="label" id="lbl-challenger">順移</div>
                    <div class="skill-cd-overlay hidden" id="cd-challenger"></div>
                </div>
            </div>

            <div class="skill-btn locked" id="skill-3" data-skill="3">
                <div class="skill-upgrade-btn hidden" id="up-btn-3">+</div>
                三技
                <div class="skill-desc-label" id="lbl-skill-3">大招</div>
                <div class="skill-cd-overlay hidden" id="cd-3"></div>
            </div>
            <div class="skill-btn locked" id="skill-2" data-skill="2">
                <div class="skill-upgrade-btn hidden" id="up-btn-2">+</div>
                二技
                <div class="skill-desc-label" id="lbl-skill-2">二技</div>
                <div class="skill-cd-overlay hidden" id="cd-2"></div>
            </div>
            <div class="skill-btn locked" id="skill-1" data-skill="1">
                <div class="skill-upgrade-btn hidden" id="up-btn-1">+</div>
                一技
                <div class="skill-desc-label" id="lbl-skill-1">一技</div>
                <div class="skill-cd-overlay hidden" id="cd-1"></div>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let MAP_SIZE = 2200;
let ROAD_WIDTH = 300; 
let isRunning = false;
let selectedHeroKey = 'quillen';

let gameTimeSeconds = 0;
let blueKills = 0, redKills = 0, kills = 0, deaths = 0, assists = 0;
let player = null, entities = [], skillEffects = [], attackEffects = [], damageTexts = [], camera = { x: 0, y: 0 };
let minionSpawnTimer = 0;

let joystickDir = { x: 0, y: 0 };
let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };

let skillCooldowns = { 1: 0, 2: 0, 3: 0 };
let skillLevels = { 1: 0, 2: 0, 3: 0 };
let unallocatedPoints = 1; 

const skillMaxCDs = { 1: 4.5, 2: 6.0, 3: 18.0 };

// **包含愛麗絲在內的英雄資料庫**
const HERO_DB = {
    'quillen': { name: '奎倫', type: '刺客 / 背刺爆擊', baseHp: 4800, hpGrowth: 420, atk: 130, range: 140, avatar: '🥷', s1: '三段揮擊', s2: '標記突進', s3: '隱身回血' },
    'nakroth': { name: '納克羅斯', type: '刺客 / 高機動性', baseHp: 5000, hpGrowth: 450, atk: 120, range: 110, avatar: '🗡️', s1: '擊飛位移', s2: '強化普攻', s3: '連續刺刺刺' },
    'ryoma': { name: '龍馬', type: '戰士 / 槍尖爆發', baseHp: 5800, hpGrowth: 500, atk: 125, range: 180, avatar: '🥷', s1: '反向翻滾', s2: '槍尖暈眩', s3: '連續刺擊吸血' },
    'alice': { name: '愛麗絲', type: '法師 / 輔助團控', baseHp: 4200, hpGrowth: 380, atk: 100, range: 250, avatar: '🧚', s1: '星光暈眩', s2: '星神護盾', s3: '星神大招' }
};

const ITEMS_DB = [
    { id: 'ad_1', name: '聖劍', cost: 300, atk: 30 },
    { id: 'ap_1', name: '魔法書', cost: 300, atk: 25 },
    { id: 'def_1', name: '守衛鎧甲', cost: 400, hp: 400 }
];

function resizeCanvas() { 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function bindClick(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => { e.stopPropagation(); fn(e); });
    el.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); fn(e); }, { passive: false });
}

bindClick('btn-start-match', () => openHeroPick());
bindClick('btn-confirm-hero', () => confirmStartGame());
bindClick('btn-pick-back', () => backToMenuFromPick());
bindClick('btn-back-lobby', () => backToLobby());
bindClick('btn-heal-spell', () => {
    if (!player || !player.alive) return;
    let healAmt = player.maxHp * 0.35;
    player.hp = Math.min(player.maxHp, player.hp + healAmt);
    attackEffects.push({ x: player.x, y: player.y, life: 0.6, radius: 55, color: '#00e676' });
});
bindClick('btn-recall', () => {
    if (!player || !player.alive) return;
    player.x = 400; player.y = MAP_SIZE - 400;
    player.hp = player.maxHp;
    damageTexts.push({ x: player.x, y: player.y - 40, value: 'RECALLED!', color: '#00d2ff', life: 1.2 });
});

function openHeroPick() {
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('pick-screen').classList.remove('hidden');
    renderHeroPickGrid();
    selectHero(selectedHeroKey);
}

function backToMenuFromPick() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function backToLobby() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.add('hidden');
    document.getElementById('top-hud').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
    isRunning = false;
}

function renderHeroPickGrid() {
    let grid = document.getElementById('hero-select-grid');
    grid.innerHTML = '';
    Object.keys(HERO_DB).forEach(key => {
        let h = HERO_DB[key];
        let thumb = document.createElement('div');
        thumb.className = `pick-hero-thumb ${key === selectedHeroKey ? 'active' : ''}`;
        thumb.innerHTML = `<div>${h.avatar}</div><div class="name">${h.name}</div>`;
        thumb.onclick = () => selectHero(key);
        grid.appendChild(thumb);
    });
}

function selectHero(key) {
    selectedHeroKey = key;
    let h = HERO_DB[key];
    document.getElementById('stage-hero-avatar').innerText = h.avatar;
    document.getElementById('selected-hero-name').innerText = h.name;
    document.getElementById('selected-hero-type').innerText = h.type;
    renderHeroPickGrid();
}

function confirmStartGame() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.remove('hidden');
    document.getElementById('top-hud').classList.remove('hidden');
    initGameWorld();
}

function initGameWorld() {
    resizeCanvas();
    entities = []; skillEffects = []; attackEffects = []; damageTexts = [];
    blueKills = 0; redKills = 0; kills = 0; deaths = 0; assists = 0;
    gameTimeSeconds = 0;
    skillCooldowns = { 1: 0, 2: 0, 3: 0 };
    skillLevels = { 1: 0, 2: 0, 3: 0 };
    unallocatedPoints = 1;

    player = new Hero(400, MAP_SIZE - 400, 'blue', selectedHeroKey, true);
    entities.push(player);

    let aiKeys = Object.keys(HERO_DB).filter(k => k !== selectedHeroKey);
    let randomAiKey = aiKeys[Math.floor(Math.random() * aiKeys.length)];
    let ai = new Hero(MAP_SIZE - 400, 400, 'red', randomAiKey, false);
    entities.push(ai);

    entities.push(new Tower(800, MAP_SIZE - 900, 'blue'));
    entities.push(new Tower(MAP_SIZE - 800, 900, 'red'));
    entities.push(new Base(400, MAP_SIZE - 400, 'blue'));
    entities.push(new Base(MAP_SIZE - 400, 400, 'red'));

    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;

    updateFastBuyUI();
    updateTopScopeUI();
    isRunning = true;
    requestAnimationFrame(gameLoop);
}

function updateTopScopeUI() {
    document.getElementById('level-display').innerText = `Lv.${player ? player.level : 1}`;
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    let mins = String(Math.floor(gameTimeSeconds / 60)).padStart(2, '0');
    let secs = String(gameTimeSeconds % 60).padStart(2, '0');
    document.getElementById('game-time-display').innerText = `⏱️ ${mins}:${secs}`;
    document.getElementById('gold-display').innerText = `🪙 ${player ? Math.floor(player.gold) : 300}`;
    document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;

    [1, 2, 3].forEach(id => {
        let btn = document.getElementById(`skill-${id}`);
        let upBtn = document.getElementById(`up-btn-${id}`);
        if (skillLevels[id] === 0) btn.classList.add('locked');
        else btn.classList.remove('locked');

        if (unallocatedPoints > 0) upBtn.classList.remove('hidden');
        else upBtn.classList.add('hidden');
    });
}

setInterval(() => { if (isRunning) { gameTimeSeconds++; updateTopScopeUI(); } }, 1000);

function updateFastBuyUI() {
    let container = document.getElementById('fast-buy-list');
    container.innerHTML = '';
    ITEMS_DB.forEach(item => {
        let el = document.createElement('div');
        el.className = 'fast-buy-item';
        el.innerHTML = `<span style="font-size:0.75rem; font-weight:bold;">${item.name}</span><span style="font-size:0.65rem; color:#ffd700;">🪙 ${item.cost}</span>`;
        el.onclick = () => {
            if (player && player.gold >= item.cost) {
                player.gold -= item.cost;
                if (item.atk) player.atk += item.atk;
                if (item.hp) { player.maxHp += item.hp; player.hp += item.hp; }
                updateTopScopeUI();
            }
        };
        container.appendChild(el);
    });
}

[1, 2, 3].forEach(id => { bindClick(`up-btn-${id}`, () => upgradeSkill(id)); });

function upgradeSkill(id) {
    if (unallocatedPoints > 0) {
        unallocatedPoints--;
        skillLevels[id]++;
        updateTopScopeUI();
    }
}

// 搖桿控制
const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');

joystick.addEventListener('pointerdown', e => {
    joystickTouchId = e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    const rect = joystick.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
});
joystick.addEventListener('pointermove', e => {
    if (e.pointerId === joystickTouchId) updateJoystick(e.clientX, e.clientY);
});
function resetJoystick(e) {
    if (e.pointerId === joystickTouchId) {
        joystickTouchId = null;
        joystickDir = { x: 0, y: 0 };
        knob.style.transform = `translate(0px, 0px)`;
    }
}
joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
}

// 普攻按鈕
const attackBtn = document.getElementById('btn-attack');
attackBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    performAttack();
});

document.querySelectorAll('.skill-btn').forEach(btn => {
    btn.addEventListener('click', e => {
        let skillId = parseInt(btn.dataset.skill);
        if (skillLevels[skillId] > 0 && skillCooldowns[skillId] <= 0) {
            let dX = joystickDir.x !== 0 ? joystickDir.x : 1;
            let dY = joystickDir.y !== 0 ? joystickDir.y : 0;
            castSkill(skillId, dX, dY);
        }
    });
});

function clampPosition(x, y, radius = 26) {
    let startX = 400, startY = MAP_SIZE - 400;
    let endX = MAP_SIZE - 400, endY = 400;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;
    let vX = x - startX, vY = y - startY;
    let proj = vX * uX + vY * uY;
    proj = Math.max(0, Math.min(lineLen, proj));
    let nearestX = startX + uX * proj;
    let nearestY = startY + uY * proj;
    let dist = Math.hypot(x - nearestX, y - nearestY);
    if (dist > ROAD_WIDTH / 2 - radius) {
        let overX = x - nearestX, overY = y - nearestY;
        let overLen = Math.hypot(overX, overY);
        if (overLen > 0) {
            x = nearestX + (overX / overLen) * (ROAD_WIDTH / 2 - radius);
            y = nearestY + (overY / overLen) * (ROAD_WIDTH / 2 - radius);
        }
    }
    return { x: Math.max(radius, Math.min(MAP_SIZE - radius, x)), y: Math.max(radius, Math.min(MAP_SIZE - radius, y)) };
}

class Entity {
    constructor(x, y, team, radius = 26) {
        this.x = x; this.y = y; this.team = team; this.radius = radius;
        this.hp = 1000; this.maxHp = 1000; this.atk = 50; this.alive = true;
        this.isDashing = false; this.dashTargetX = 0; this.dashTargetY = 0; this.dashSpeed = 35;
        this.quillenMarked = false;
        this.rotation = 0;
    }
    startDash(tx, ty, speed = 35) {
        this.dashTargetX = tx; this.dashTargetY = ty; this.dashSpeed = speed; this.isDashing = true;
    }
    updateDash() {
        if (!this.isDashing) return;
        let dx = this.dashTargetX - this.x;
        let dy = this.dashTargetY - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist <= this.dashSpeed) {
            this.x = this.dashTargetX; this.y = this.dashTargetY; this.isDashing = false;
        } else {
            this.x += (dx / dist) * this.dashSpeed;
            this.y += (dy / dist) * this.dashSpeed;
            this.rotation = Math.atan2(dy, dx);
        }
    }
    takeDamage(amount, sourceTeam) {
        if (!this.alive) return;
        let wasAliveBefore = this.alive;
        this.hp -= amount;
        if (this.hp <= 0) {
            this.hp = 0; this.alive = false;
            if (wasAliveBefore) {
                if (this instanceof Minion) {
                    if (sourceTeam === 'blue' && player && player.alive) player.gainExpAndGold(35, 18);
                } else if (this instanceof Hero) {
                    if (this.isPlayer) {
                        redKills++; deaths++;
                    } else {
                        blueKills++; kills++;
                        player.gainExpAndGold(150, 100);
                    }
                    updateTopScopeUI();
                }
            }
        }
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer = false) {
        super(x, y, team, 26);
        this.heroKey = heroKey; this.isPlayer = isPlayer;
        let data = HERO_DB[heroKey] || HERO_DB['quillen'];
        this.heroData = data;
        this.maxHp = data.baseHp; this.hp = this.maxHp;
        this.atk = data.atk; this.range = data.range;
        this.level = 1; this.exp = 0; this.gold = 300;
        this.speed = 2.4; this.attackCd = 0;
    }
    gainExpAndGold(expAmt, goldAmt) {
        if (!this.isPlayer) return;
        this.gold += goldAmt;
        this.exp += expAmt;
        let nextLevelExp = this.level * 100;
        while (this.exp >= nextLevelExp && this.level < 15) {
            this.exp -= nextLevelExp; this.level++; unallocatedPoints++;
            let hpGain = this.heroData.hpGrowth || 400;
            this.maxHp += hpGain; this.hp = Math.min(this.maxHp, this.hp + hpGain);
            this.atk += 10;
            nextLevelExp = this.level * 100;
        }
        updateTopScopeUI();
    }
    update() {
        if (!this.alive) return;
        if (this.isDashing) { this.updateDash(); return; }
        if (this.attackCd > 0) this.attackCd--;

        if (this.isPlayer) {
            if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                let nx = this.x + joystickDir.x * this.speed;
                let ny = this.y + joystickDir.y * this.speed;
                let clamped = clampPosition(nx, ny, this.radius);
                this.x = clamped.x; this.y = clamped.y;
                this.rotation = Math.atan2(joystickDir.y, joystickDir.x);
            }
        } else {
            let targetX = 400, targetY = MAP_SIZE - 400;
            let dx = targetX - this.x, dy = targetY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 50) {
                let nx = this.x + (dx / dist) * (this.speed * 0.85);
                let ny = this.y + (dy / dist) * (this.speed * 0.85);
                let clamped = clampPosition(nx, ny, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            }
        }
    }
}

class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 18);
        this.maxHp = 1200; this.hp = 1200; this.atk = 35; this.range = 100;
        this.speed = 1.2; this.attackCd = 0;
    }
    update() {
        if (!this.alive) return;
        let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
        let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
        let dx = targetX - this.x, dy = targetY - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 40) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
        if (this.attackCd > 0) this.attackCd--;
        else {
            entities.forEach(e => {
                if (e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.range + e.radius) {
                    e.takeDamage(this.atk, this.team);
                    this.attackCd = 60;
                }
            });
        }
    }
}

class Tower extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 45);
        this.maxHp = 6000; this.hp = 6000; this.atk = 180; this.range = 350; this.attackCd = 0;
    }
    update() {
        if (!this.alive) return;
        if (this.attackCd > 0) this.attackCd--;
        else {
            entities.forEach(e => {
                if (e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.range) {
                    e.takeDamage(this.atk, this.team);
                    attackEffects.push({ x: e.x, y: e.y, life: 0.3, radius: 35, color: '#ff4444' });
                    this.attackCd = 75;
                }
            });
        }
    }
}

class Base extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 60);
        this.maxHp = 10000; this.hp = 10000;
    }
}

function performAttack() {
    if (!player || !player.alive) return;
    entities.forEach(target => {
        if (!target.alive || target.team === player.team) return;
        let dist = Math.hypot(target.x - player.x, target.y - player.y);
        if (dist <= player.range + target.radius) {
            target.takeDamage(player.atk, player.team);
            damageTexts.push({ x: target.x, y: target.y - 30, value: `${Math.floor(player.atk)}`, color: '#fff', life: 0.8 });
        }
    });
}

function castSkill(skillId, dirX, dirY) {
    let stats = { dmg: 350 + (skillLevels[skillId] - 1) * 80, cd: Math.max(2.0, 5.0 - (skillLevels[skillId] - 1) * 0.5) };
    skillCooldowns[skillId] = stats.cd;

    if (player.heroKey === 'alice') {
        if (skillId === 1) {
            // 愛麗絲 1 技：星光暈眩
            let targetX = player.x + dirX * 160;
            let targetY = player.y + dirY * 160;
            skillEffects.push({ x: targetX, y: targetY, life: 0.3, size: 45, color: 'rgba(0, 210, 255, 0.7)', dmg: stats.dmg, team: player.team });
        } else if (skillId === 2) {
            // 愛麗絲 2 技：護盾加速
            player.hp = Math.min(player.maxHp, player.hp + 300);
            attackEffects.push({ x: player.x, y: player.y, life: 0.5, radius: 50, color: '#00d2ff' });
        } else if (skillId === 3) {
            // 愛麗絲 3 技：大招沉默緩速
            let targetX = player.x + dirX * 180;
            let targetY = player.y + dirY * 180;
            skillEffects.push({ x: targetX, y: targetY, life: 1.0, size: 70, color: 'rgba(180, 0, 255, 0.6)', dmg: stats.dmg, team: player.team });
        }
    } else {
        // 其他英雄通用預設施法
        let targetX = player.x + dirX * 150;
        let targetY = player.y + dirY * 150;
        skillEffects.push({ x: targetX, y: targetY, life: 0.3, size: 50, color: 'rgba(255, 100, 0, 0.7)', dmg: stats.dmg, team: player.team });
    }
}

function updateGame() {
    minionSpawnTimer++;
    if (minionSpawnTimer >= 900) {
        minionSpawnTimer = 0;
        entities.push(new Minion(400, MAP_SIZE - 400, 'blue'));
        entities.push(new Minion(MAP_SIZE - 400, 400, 'red'));
    }

    [1, 2, 3].forEach(id => {
        if (skillCooldowns[id] > 0) skillCooldowns[id] = Math.max(0, skillCooldowns[id] - 1/60);
    });

    entities.forEach(e => e.update());

    skillEffects.forEach(eff => {
        eff.life -= 1/60;
        entities.forEach(e => {
            if (e.alive && e.team !== eff.team && Math.hypot(e.x - eff.x, e.y - eff.y) <= eff.size) {
                if (eff.dmg && !eff.hasHit) {
                    e.takeDamage(eff.dmg, eff.team);
                    eff.hasHit = true;
                }
            }
        });
    });
    skillEffects = skillEffects.filter(eff => eff.life > 0);
    attackEffects.forEach(ae => ae.life -= 1/60);
    attackEffects = attackEffects.filter(ae => ae.life > 0);
    damageTexts.forEach(dt => { dt.y -= 0.6; dt.life -= 1/60; });
    damageTexts = damageTexts.filter(dt => dt.life > 0);

    if (player) {
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
        camera.x = Math.max(0, Math.min(MAP_SIZE - canvas.width, camera.x));
        camera.y = Math.max(0, Math.min(MAP_SIZE - canvas.height, camera.y));
    }

    [1, 2, 3].forEach(id => {
        let cdEl = document.getElementById(`cd-${id}`);
        if (skillCooldowns[id] > 0) {
            cdEl.classList.remove('hidden');
            cdEl.innerText = Math.ceil(skillCooldowns[id]);
        } else {
            cdEl.classList.add('hidden');
        }
    });
}

function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = '#0a1420';
    ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

    ctx.strokeStyle = '#1b2a40';
    ctx.lineWidth = ROAD_WIDTH;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(400, MAP_SIZE - 400);
    ctx.lineTo(MAP_SIZE - 400, 400);
    ctx.stroke();

    entities.forEach(e => {
        if (!e.alive) return;
        let screenX = e.x, screenY = e.y;

        ctx.save();
        ctx.translate(screenX, screenY);

        if (e instanceof Hero) {
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
            ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
            ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(e.heroData.avatar, 0, 0);
        } else if (e instanceof Minion) {
            ctx.fillStyle = e.team === 'blue' ? '#4fc3f7' : '#e57373';
            ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
        } else if (e instanceof Tower) {
            ctx.fillStyle = e.team === 'blue' ? '#0288d1' : '#d32f2f';
            ctx.fillRect(-30, -30, 60, 60);
        } else if (e instanceof Base) {
            ctx.fillStyle = e.team === 'blue' ? '#01579b' : '#b71c1c';
            ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();

        if (!(e instanceof Base)) {
            let barW = 44, barH = 6;
            let bx = screenX - barW / 2, by = screenY - e.radius - 12;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(bx, by, barW, barH);
            ctx.fillStyle = e.team === 'blue' ? '#00e676' : '#ff3366';
            ctx.fillRect(bx, by, barW * (e.hp / e.maxHp), barH);
        }
    });

    skillEffects.forEach(eff => {
        ctx.save();
        ctx.fillStyle = eff.color;
        ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    });

    attackEffects.forEach(ae => {
        ctx.save();
        ctx.strokeStyle = ae.color;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ae.x, ae.y, ae.radius * (1 - ae.life), 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    });

    damageTexts.forEach(dt => {
        ctx.save();
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = dt.color;
        ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
        ctx.fillText(dt.value, dt.x, dt.y);
        ctx.restore();
    });

    ctx.restore();
}

function gameLoop() {
    if (!isRunning) return;
    updateGame();
    drawGame();
    requestAnimationFrame(gameLoop);
}
</script>
