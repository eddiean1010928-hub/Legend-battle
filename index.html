<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070d18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        canvas { background: #070d14; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none !important; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; padding: 15px; pointer-events: auto; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 110; pointer-events: auto; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #fff; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }
        .res-item { display: flex; align-items: center; gap: 5px; }
        .res-gold { color: #f3c654; }

        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px 0; position: relative; pointer-events: none; }
        .hero-heroine-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0.85; }
        .heroine-avatar { font-size: 9rem; text-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }

        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 10px 5px 10px; z-index: 110; pointer-events: auto; }
        .bottom-nav { display: flex; gap: 12px; background: rgba(6, 14, 26, 0.85); padding: 8px 18px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .nav-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: #94a3b8; cursor: pointer; pointer-events: auto !important; }
        .nav-btn.active { color: #fff; }

        .start-group { display: flex; align-items: flex-end; gap: 15px; pointer-events: auto; }
        .mode-select-btn { background: rgba(13, 27, 46, 0.9); border: 1px solid #00d2ff; border-radius: 50%; width: 55px; height: 55px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0,210,255,0.3); pointer-events: auto !important; }
        .mode-select-btn .icon { font-size: 1.2rem; pointer-events: none; }
        .mode-select-btn .label { font-size: 0.65rem; color: #00d2ff; font-weight: bold; margin-top: 2px; pointer-events: none; }

        .start-match-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%); border: 2px solid #fef08a; width: 170px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); pointer-events: auto !important; }
        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; pointer-events: none; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 20px; z-index: 20; font-size: 1rem; font-weight: bold; pointer-events: none; }
        .score-blue { color: #00d2ff; }
        .score-red { color: #ff4444; }
        .game-time-text { color: #00e676; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; font-variant-numeric: tabular-nums; }
        .gold-text { color: #ffd700; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .kda-text { color: #ffeb3b; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .level-text { color: #00e676; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; }

        .announcement-banner { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(13, 27, 46, 0.85) 50%, rgba(0,0,0,0) 100%); padding: 8px 40px; border-top: 1px solid #ffd700; border-bottom: 1px solid #ffd700; z-index: 100; pointer-events: none; text-align: center; transition: opacity 0.3s ease; }
        .announcement-text { font-size: 1.4rem; font-weight: 900; font-style: italic; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 69, 0, 0.6); letter-spacing: 2px; }

        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none !important; z-index: 10; }
        
        .joystick-container { position: absolute; bottom: 25px; left: 25px; width: 125px; height: 125px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto !important; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(243, 198, 84, 0.85); border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none; }

        .controls-right { position: absolute; bottom: 15px; right: 20px; width: 320px; height: 200px; pointer-events: none !important; }
        .attack-btn { position: absolute; bottom: 10px; right: 5px; width: 78px; height: 78px; background: radial-gradient(circle, #f3c654 0%, #8f5c0a 100%); border: 3px solid #ffe596; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #fff; cursor: pointer; pointer-events: auto !important; touch-action: none; }
        
        .bottom-actions-bar { position: absolute; bottom: 15px; right: 195px; display: flex; gap: 10px; pointer-events: auto !important; z-index: 60; }
        .action-mini-btn { width: 46px; height: 46px; background: radial-gradient(circle, #263238 0%, #0d1b2a 100%); border: 2px solid #f3c654; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.9rem; font-weight: bold; color: #fff; cursor: pointer; position: relative; pointer-events: auto !important; touch-action: none; overflow: hidden; }
        .action-mini-btn .label { position: absolute; bottom: -16px; font-size: 0.55rem; color: #ffeb3b; font-weight: bold; white-space: nowrap; pointer-events: none; }
        .spell-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-btn { position: absolute; width: 62px; height: 62px; background: rgba(15, 25, 40, 0.9); border: 2px solid #00aaff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto !important; touch-action: none !important; }
        .skill-btn.locked { border-color: #555; opacity: 0.5; filter: grayscale(1); }
        .skill-desc-label { position: absolute; bottom: -20px; width: 95px; text-align: center; font-size: 0.58rem; color: #ffeb3b; font-weight: bold; pointer-events: none; white-space: nowrap; }
        .skill-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-upgrade-btn {
            position: absolute; top: -8px; right: -8px; width: 28px; height: 28px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8f00 100%);
            border: 2px solid #fff; border-radius: 50%; color: #000;
            font-size: 1.1rem; font-weight: 900; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 12px rgba(255, 215, 0, 0.9); z-index: 60;
            animation: pulse-upgrade 0.8s infinite alternate; pointer-events: auto !important;
        }
        @keyframes pulse-upgrade {
            0% { transform: scale(0.95); box-shadow: 0 0 6px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.15); box-shadow: 0 0 16px rgba(255, 215, 0, 1); }
        }

        #skill-3 { bottom: 120px; right: 15px; border-color: #e040fb; }
        #skill-2 { bottom: 85px; right: 90px; border-color: #00e676; }
        #skill-1 { bottom: 10px; right: 150px; border-color: #ff9100; }

        .pick-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070d18; z-index: 150; display: flex; flex-direction: column; padding: 15px; pointer-events: auto; }
        .pick-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; pointer-events: auto; }
        .pick-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 1rem; color: #888; }
        .pick-tabs .active { color: #f3c654; border-bottom: 2px solid #f3c654; }
        .pick-cancel-btn { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; pointer-events: auto !important; }
        
        .pick-content-layout { display: flex; flex: 1; margin-top: 15px; gap: 20px; overflow: hidden; pointer-events: auto; }
        
        .pick-hero-sidebar { 
            width: 230px; 
            height: 100%; 
            max-height: 420px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            overflow-y: auto; 
            padding-right: 5px; 
            scrollbar-width: thin; 
            scrollbar-color: #f3c654 rgba(0,0,0,0.3); 
            touch-action: pan-y;
            pointer-events: auto !important;
        }
        .pick-hero-sidebar::-webkit-scrollbar { width: 6px; }
        .pick-hero-sidebar::-webkit-scrollbar-thumb { background-color: #f3c654; border-radius: 3px; }

        .pick-hero-thumb { width: 95px; height: 95px; background: #112233; border: 2px solid #334455; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; pointer-events: auto !important; touch-action: none; }
        .pick-hero-thumb.selected { border-color: #f3c654; box-shadow: 0 0 15px rgba(243, 198, 84, 0.6); }
        .pick-hero-thumb span { font-size: 2.2rem; pointer-events: none; }
        .pick-hero-thumb label { font-size: 0.7rem; color: #ccc; margin-top: 4px; pointer-events: none; }

        .pick-hero-preview-pane { flex: 1; background: rgba(15, 25, 40, 0.6); border: 1px solid #1e3a5f; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: auto; }
        .preview-info h2 { font-size: 1.8rem; color: #f3c654; margin-bottom: 5px; }
        .preview-info p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 15px; }
        .preview-skills-row { display: flex; gap: 15px; }
        .preview-skill-badge { background: #070d18; border: 1px solid #00d2ff; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; color: #00d2ff; font-weight: bold; }
        
        .confirm-pick-btn { align-self: flex-end; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: 1px solid #fef08a; padding: 12px 35px; border-radius: 25px; font-size: 1.1rem; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 0 15px rgba(245,158,11,0.5); pointer-events: auto !important; }

        .result-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 18, 0.92); z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        .result-title-win { font-size: 4rem; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255, 215, 0, 0.8); font-style: italic; margin-bottom: 20px; letter-spacing: 4px; }
        .result-title-lose { font-size: 4rem; font-weight: 900; color: #ff4444; text-shadow: 0 0 30px rgba(255, 68, 68, 0.8); font-style: italic; margin-bottom: 20px; letter-spacing: 4px; }
        .restart-btn { background: linear-gradient(135deg, #00d2ff 0%, #0077ff 100%); border: 2px solid #fff; padding: 12px 40px; border-radius: 25px; font-size: 1.2rem; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); pointer-events: auto !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- 頂部即時比分與資訊欄 -->
        <div id="top-score-bar" class="top-score-bar hidden">
            <span class="score-blue" id="score-blue-txt">藍方 0</span> / <span class="score-red" id="score-red-txt">紅方 0</span>
            <span class="game-time-text" id="game-time-txt">00:00</span>
            <span class="gold-text" id="top-gold-txt">💰 300</span>
            <span class="kda-text" id="top-kda-txt">⚔️ 0/0/0</span>
            <span class="level-text" id="top-level-txt">Lv.1</span>
        </div>

        <!-- 播報橫幅 -->
        <div id="announcement-banner" class="announcement-banner hidden">
            <div id="announcement-text" class="announcement-text">FIRST BLOOD</div>
        </div>

        <!-- 主大廳介面 -->
        <div id="lobby-screen" class="overlay">
            <div class="top-navbar">
                <div class="profile-area">
                    <div class="user-profile-box">
                        <div class="user-avatar" style="background: linear-gradient(135deg, #f59e0b, #b45309); display:flex; justify-content:center; align-items:center; font-size:1rem;">👑</div>
                        <span class="user-name">Eddie</span>
                    </div>
                </div>
                <div class="resource-group">
                    <div class="res-item res-gold">🪙 88,888</div>
                    <div class="res-item" style="color: #00d2ff;">💎 1,688</div>
                </div>
            </div>

            <div class="main-content">
                <div class="hero-heroine-bg">
                    <div class="heroine-avatar">⚔️</div>
                    <div style="font-size: 1.5rem; font-weight: bold; color: #f3c654; letter-spacing: 3px; margin-top: 10px;">ARENA OF VALOR</div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="bottom-nav">
                    <div class="nav-btn active"><span>⚔️</span> 經典對戰</div>
                    <div class="nav-btn" onclick="openHeroPicker()"><span>📜</span> 英雄列表</div>
                </div>
                <div class="start-group">
                    <div class="mode-select-btn" onclick="openHeroPicker()">
                        <div class="icon">👥</div>
                        <div class="label">1v1</div>
                    </div>
                    <div class="start-match-btn" onclick="startMatch()">
                        <div class="start-text">匹配對戰</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 英雄選擇畫面 -->
        <div id="pick-screen" class="pick-screen-overlay hidden">
            <div class="pick-top-bar">
                <div class="pick-tabs">
                    <div class="active">選擇你的英雄</div>
                </div>
                <button class="pick-cancel-btn" onclick="closeHeroPicker()">✕ 返回大廳</button>
            </div>
            <div class="pick-content-layout">
                <div class="pick-hero-sidebar" id="hero-sidebar-list">
                    <!-- 动态生成 -->
                </div>
                <div class="pick-hero-preview-pane">
                    <div class="preview-info">
                        <h2 id="preview-hero-name">凡恩</h2>
                        <p id="preview-hero-desc">特工魅影 - 遠端射手，擁有靈活的被動移速加成與雙色暈眩飛鏢，持續消耗能力極強。</p>
                        <div class="preview-skills-row" id="preview-skills-row">
                            <div class="preview-skill-badge">被動：被動疊層</div>
                            <div class="preview-skill-badge">1技：血腥獵殺</div>
                            <div class="preview-skill-badge">2技：送葬</div>
                            <div class="preview-skill-badge">3技：水銀彈幕</div>
                        </div>
                    </div>
                    <button class="confirm-pick-btn" onclick="confirmHeroPick()">確定選擇並出戰</button>
                </div>
            </div>
        </div>

        <!-- 遊戲操作 HUD -->
        <div id="hud-layer" class="hidden">
            <div class="joystick-container" id="joystick">
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>

            <div class="bottom-actions-bar">
                <div class="action-mini-btn" id="spell-heal" onclick="castSummonerSpell('heal')">
                    <span>➕</span><span class="label">回復</span>
                </div>
                <div class="action-mini-btn" id="spell-sprint" onclick="castSummonerSpell('sprint')">
                    <span>🏃</span><span class="label">疾走</span>
                </div>
            </div>

            <div class="controls-right">
                <div class="attack-btn" id="attack-btn">⚔️</div>
                <div class="skill-btn" id="skill-1" onclick="tryCastSkill(1)">
                    <span>1技</span>
                    <div class="skill-upgrade-btn" onclick="event.stopPropagation(); upgradeSkill(1)">+</div>
                    <div class="skill-cd-overlay hidden" id="cd-1">0.0</div>
                    <div class="skill-desc-label" id="desc-1">血腥獵殺</div>
                </div>
                <div class="skill-btn" id="skill-2" onclick="tryCastSkill(2)">
                    <span>2技</span>
                    <div class="skill-upgrade-btn" onclick="event.stopPropagation(); upgradeSkill(2)">+</div>
                    <div class="skill-cd-overlay hidden" id="cd-2">0.0</div>
                    <div class="skill-desc-label" id="desc-2">送葬</div>
                </div>
                <div class="skill-btn" id="skill-3" onclick="tryCastSkill(3)">
                    <span>大招</span>
                    <div class="skill-upgrade-btn" onclick="event.stopPropagation(); upgradeSkill(3)">+</div>
                    <div class="skill-cd-overlay hidden" id="cd-3">0.0</div>
                    <div class="skill-desc-label" id="desc-3">水銀彈幕</div>
                </div>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="result-overlay hidden">
            <div id="result-title" class="result-title-win">VICTORY</div>
            <button class="restart-btn" onclick="location.reload()">返回大廳</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const MAP_SIZE = 3000;
        let isRunning = false;
        let gameTime = 0;
        let entities = [];
        let damageTexts = [];
        let skillEffects = [];
        let attackEffects = [];

        const HERO_DB = {
            valhein: { name: '凡恩', avatar: '🎯', desc: '遠端射手，普攻疊被動，擁有黃藍雙色飛鏢控制。', s1: '血腥獵殺', s2: '送葬', s3: '水銀彈幕' },
            nakroth: { name: '納克羅斯', avatar: '🗡️', desc: '刺客打野，極致靈活多段位移與第四下擊飛。', s1: '無情衝鋒', s2: '引退', s3: '審判之刃' },
            ryoma: { name: '龍馬', avatar: '🥷', desc: '戰士刺客，中距離極限消耗與強普爆發。', s1: '居合', s2: '殺戮', s3: '暴雨斬' },
            quillen: { name: '奎倫', avatar: '🥷', desc: '背擊必暴擊的高爆發刺客。', s1: '雙殺', s2: '瞬擊', s3: '血殺神偷' },
            krixi: { name: '克里希', avatar: '🧚‍♀️', desc: '法師中路，來回蝴蝶與大範圍擊飛法陣。', s1: '蝴蝶飛舞', s2: '落葉飄搖', s3: '月落星沉' }
        };

        let selectedHeroKey = 'valhein';
        let aiHeroKey = 'nakroth';

        let player = null;
        let aiHero = null;
        let blueCore = null;
        let redCore = null;
        let blueTower = null;
        let redTower = null;

        let skillCooldowns = { 1: 0, 2: 0, 3: 0 };
        let skillLevels = { 1: 1, 2: 1, 3: 1 };
        let availableSkillPoints = 1;
        let playerGold = 300;
        let playerKills = 0;
        let playerDeaths = 0;
        let playerAssists = 0;

        let summonerSpells = {
            heal: { cd: 0, maxCd: 1800 },
            sprint: { cd: 0, maxCd: 1500 }
        };

        class Entity {
            constructor(x, y, team, radius) {
                this.x = x;
                this.y = y;
                this.team = team;
                this.radius = radius;
                this.alive = true;
            }
            update() {}
            draw() {}
        }

        class Minion extends Entity {
            constructor(x, y, team) {
                super(x, y, team, 16);
                this.maxHp = 1200;
                this.hp = this.maxHp;
                this.atk = 65;
                this.range = 140;
                this.speed = 1.2;
                this.atkCooldown = 0;
            }
            update() {
                if (!this.alive) return;
                if (this.atkCooldown > 0) this.atkCooldown--;

                let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
                let targetY = this.team === 'blue' ? MAP_SIZE - 400 : 400;

                let nearestEnemy = null;
                let minDist = 9999;
                entities.forEach(e => {
                    if (e.alive && e.team !== this.team && !(e instanceof Building && e.type === 'core')) {
                        let dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < minDist) { minDist = dist; nearestEnemy = e; }
                    }
                });

                if (nearestEnemy && minDist <= this.range) {
                    if (this.atkCooldown <= 0) {
                        this.atkCooldown = 50;
                        nearestEnemy.takeDamage(this.atk, this.team, 'physical');
                        damageTexts.push({ x: nearestEnemy.x, y: nearestEnemy.y - 30, value: `-${this.atk}`, color: '#ffaaaa', life: 0.6 });
                        attackEffects.push({ x: nearestEnemy.x, y: nearestEnemy.y, life: 0.2, radius: 15, color: '#ff4444' });
                    }
                } else if (nearestEnemy && minDist <= 400) {
                    let angle = Math.atan2(nearestEnemy.y - this.y, nearestEnemy.x - this.x);
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                } else {
                    let angle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }
            }
            takeDamage(dmg, sourceTeam, type = 'physical') {
                if (!this.alive) return;
                this.hp -= dmg;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.alive = false;
                    if (sourceTeam === 'blue' && this.team === 'red') playerGold += 35;
                }
            }
            draw() {
                if (!this.alive) return;
                ctx.fillStyle = this.team === 'blue' ? '#00d2ff' : '#ff4444';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - 18, this.y - 24, 36, 5);
                ctx.fillStyle = this.team === 'blue' ? '#00d2ff' : '#ff4444';
                ctx.fillRect(this.x - 18, this.y - 24, 36 * (this.hp / this.maxHp), 5);
            }
        }

        class Building extends Entity {
            constructor(x, y, team, type) {
                super(x, y, team, type === 'core' ? 55 : 45);
                this.type = type;
                this.maxHp = type === 'core' ? 6000 : 12000;
                this.hp = this.maxHp;
                this.atkTimer = 0;
                this.attackRange = 240;
                this.currentTarget = null;
                this.towerAttackCount = 0;
            }
            takeDamage(dmg, sourceTeam, type = 'physical') {
                if (!this.alive) return;
                if (this.type === 'tower' || this.type === 'core') {
                    let hasMinionNearby = entities.some(e => 
                        e.alive && e instanceof Minion && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= 240
                    );
                    if (!hasMinionNearby) {
                        dmg *= 0.15; 
                        damageTexts.push({ x: this.x, y: this.y - 50, value: '🛡️ 無兵線減傷 (防護中)', color: '#00d2ff', life: 0.8 });
                    }
                }
                this.hp -= dmg;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.alive = false;
                    this.onDeath(sourceTeam);
                }
            }
            update() {
                if (!this.alive) return;
                this.atkTimer++;
                if (this.currentTarget) {
                    let dist = Math.hypot(this.currentTarget.x - this.x, this.currentTarget.y - this.y);
                    if (!this.currentTarget.alive || dist > this.attackRange) {
                        this.currentTarget = null;
                        this.towerAttackCount = 0; 
                    }
                }
                if (!this.currentTarget) {
                    let inRangeEnemies = entities.filter(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.attackRange);
                    let minionTarget = inRangeEnemies.find(e => e instanceof Minion);
                    let heroTarget = inRangeEnemies.find(e => e instanceof Hero);
                    let newTarget = minionTarget || heroTarget || null;
                    
                    if (newTarget !== this.currentTarget) {
                        this.towerAttackCount = 0;
                    }
                    this.currentTarget = newTarget;
                }
                
                if (this.atkTimer >= 60) {
                    this.atkTimer = 0;
                    if (this.currentTarget) {
                        let baseTowerDmg = 400;
                        let finalTowerDmg = baseTowerDmg * Math.pow(1.2, this.towerAttackCount);
                        this.towerAttackCount++;

                        this.currentTarget.takeDamage(finalTowerDmg, this.team, 'magical');
                        damageTexts.push({ x: this.currentTarget.x, y: this.currentTarget.y - 40, value: `⚡ 塔傷 ${Math.floor(finalTowerDmg)}`, color: '#ff4444', life: 0.6 });
                        attackEffects.push({ startX: this.x, startY: this.y, x: this.currentTarget.x, y: this.currentTarget.y, life: 0.25, isLaser: true, color: this.team === 'blue' ? '#00d2ff' : '#ff4444' });
                    }
                }
            }
            onDeath(sourceTeam) {
                if (this.type === 'tower') {
                    isRunning = false;
                    let resultEl = document.getElementById('result-screen');
                    let titleEl = document.getElementById('result-title');
                    if (sourceTeam === 'blue') {
                        titleEl.innerText = 'VICTORY';
                        titleEl.className = 'result-title-win';
                    } else {
                        titleEl.innerText = 'DEFEAT';
                        titleEl.className = 'result-title-lose';
                    }
                    resultEl.classList.remove('hidden');
                }
            }
            draw() {
                if (!this.alive) return;
                ctx.fillStyle = this.team === 'blue' ? '#00aaff' : '#ff3333';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.type === 'core' ? '主堡' : '防禦塔', this.x, this.y - this.radius - 8);

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - 30, this.y - this.radius - 20, 60, 6);
                ctx.fillStyle = '#00e676';
                ctx.fillRect(this.x - 30, this.y - this.radius - 20, 60 * (this.hp / this.maxHp), 6);
            }
        }

        class Hero extends Entity {
            constructor(x, y, team, heroKey, isPlayer = false) {
                super(x, y, team, 24);
                this.heroKey = heroKey;
                this.isPlayer = isPlayer;
                this.maxHp = 3200;
                this.hp = this.maxHp;
                this.atk = 180;
                this.range = 160;
                this.speed = 2.4;
                this.level = 1;
                this.exp = 0;
                this.atkCooldown = 0;
                this.attackLockTimer = 0;
                this.isStunned = false;
                this.isSlowed = false;
                this.slowFactor = 1.0;
                this.hasEnhancedAttack = false;
                this.ryomaPassiveTimer = 0;
                this.nakrothPassiveCounter = 0;
                this.valheinPassiveStacks = 0;
                this.valheinAttackCounter = 0;
                this.valheinPassiveTimer = 0;
                this.isRetreatingForHeal = false;
                this.aiSkillCooldownTimer = 0;
            }
            takeDamage(dmg, sourceTeam, type = 'physical') {
                if (!this.alive) return;
                this.hp -= dmg;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.alive = false;
                    this.onDeath(sourceTeam);
                }
            }
            onDeath(sourceTeam) {
                if (this.isPlayer) {
                    playerDeaths++;
                    setTimeout(() => {
                        this.hp = this.maxHp;
                        this.x = 350;
                        this.y = MAP_SIZE - 350;
                        this.alive = true;
                    }, 4000);
                } else {
                    playerKills++;
                    setTimeout(() => {
                        this.hp = this.maxHp;
                        this.x = MAP_SIZE - 350;
                        this.y = 350;
                        this.alive = true;
                        this.isRetreatingForHeal = false;
                    }, 4000);
                }
            }
            update() {
                if (!this.alive) return;
                if (this.isStunned) return;
                if (this.atkCooldown > 0) this.atkCooldown--;
                if (this.attackLockTimer > 0) this.attackLockTimer--;
                if (this.ryomaPassiveTimer > 0) this.ryomaPassiveTimer -= 1/60;

                if (this.heroKey === 'valhein' && this.valheinPassiveStacks > 0) {
                    this.valheinPassiveTimer++;
                    if (this.valheinPassiveTimer >= 240) {
                        this.valheinPassiveTimer = 0;
                        this.valheinPassiveStacks = 0;
                        this.valheinAttackCounter = 0;
                    }
                }

                if (!this.isPlayer) {
                    if (this.aiSkillCooldownTimer > 0) this.aiSkillCooldownTimer--;
                    
                    let fountainX = this.team === 'blue' ? 380 : MAP_SIZE - 380;
                    let fountainY = this.team === 'blue' ? MAP_SIZE - 380 : 380;
                    let distToFountain = Math.hypot(this.x - fountainX, this.y - fountainY);

                    if (this.hp < this.maxHp * 0.4) {
                        this.isRetreatingForHeal = true;
                    }
                    if (this.isRetreatingForHeal && this.hp >= this.maxHp * 0.9) {
                        this.isRetreatingForHeal = false;
                    }

                    if (this.isRetreatingForHeal) {
                        if (distToFountain > 80) {
                            let angleToFountain = Math.atan2(fountainY - this.y, fountainX - this.x);
                            let speed = 2.2;
                            let nx = this.x + Math.cos(angleToFountain) * speed;
                            let ny = this.y + Math.sin(angleToFountain) * speed;
                            let clamped = clampPosition(nx, ny, this.radius);
                            this.x = clamped.x; this.y = clamped.y;
                        } else {
                            this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.02);
                        }
                        return; 
                    }

                    let nearestEnemy = null;
                    let minDist = 9999;
                    entities.forEach(e => {
                        if (e.alive && e.team !== this.team) {
                            let dist = Math.hypot(e.x - this.x, e.y - this.y);
                            if (dist < minDist) { minDist = dist; nearestEnemy = e; }
                        }
                    });

                    if (nearestEnemy && this.attackLockTimer <= 0) {
                        let angleToEnemy = Math.atan2(nearestEnemy.y - this.y, nearestEnemy.x - this.x);
                        let dirX = Math.cos(angleToEnemy);
                        let dirY = Math.sin(angleToEnemy);

                        if (this.aiSkillCooldownTimer === 0 && minDist <= 280) {
                            this.aiSkillCooldownTimer = 100;
                            executeAiSkill(this, 1, dirX, dirY);
                        }

                        if (minDist <= this.range + nearestEnemy.radius) {
                            if (this.atkCooldown <= 0) {
                                this.atkCooldown = 25;
                                this.attackLockTimer = 15;
                                let aiDmg = this.atk;
                                nearestEnemy.takeDamage(aiDmg, this.team, 'physical');

                                damageTexts.push({ x: nearestEnemy.x, y: nearestEnemy.y - 35, value: `💥 ${Math.floor(aiDmg)}`, color: '#ff3366', life: 0.8 });
                                attackEffects.push({ x: nearestEnemy.x, y: nearestEnemy.y, life: 0.3, radius: 30, color: '#ff4444' });
                            }
                        } else {
                            let speed = 1.7;
                            let nx = this.x + dirX * speed + (Math.random() - 0.5) * 1.5;
                            let ny = this.y + dirY * speed + (Math.random() - 0.5) * 1.5;
                            let clamped = clampPosition(nx, ny, this.radius);
                            this.x = clamped.x; this.y = clamped.y;
                        }
                    }
                }
            }
            draw() {
                if (!this.alive) return;
                ctx.fillStyle = this.isPlayer ? '#00d2ff' : '#ff4444';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(HERO_DB[this.heroKey].name, this.x, this.y - this.radius - 10);

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - 24, this.y - this.radius - 22, 48, 6);
                ctx.fillStyle = '#00e676';
                ctx.fillRect(this.x - 24, this.y - this.radius - 22, 48 * (this.hp / this.maxHp), 6);
            }
        }

        function clampPosition(x, y, r) {
            return {
                x: Math.max(r, Math.min(MAP_SIZE - r, x)),
                y: Math.max(r, Math.min(MAP_SIZE - r, y))
            };
        }

        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };

        const joystickEl = document.getElementById('joystick');
        const knobEl = document.getElementById('joystick-knob');

        joystickEl.addEventListener('pointerdown', (e) => {
            joystickActive = true;
            let rect = joystickEl.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (!joystickActive) return;
            updateJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            joystickActive = false;
            joystickVector = { x: 0, y: 0 };
            knobEl.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joystickCenter.x;
            let dy = clientY - joystickCenter.y;
            let dist = Math.hypot(dx, dy);
            let maxDist = 45;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector = { x: dx / maxDist, y: dy / maxDist };
        }

        function openHeroPicker() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('pick-screen').classList.remove('hidden');
            renderHeroSidebar();
        }

        function closeHeroPicker() {
            document.getElementById('pick-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function renderHeroSidebar() {
            let sidebar = document.getElementById('hero-sidebar-list');
            sidebar.innerHTML = '';
            Object.keys(HERO_DB).forEach(key => {
                let h = HERO_DB[key];
                let thumb = document.createElement('div');
                thumb.className = `pick-hero-thumb ${selectedHeroKey === key ? 'selected' : ''}`;
                thumb.innerHTML = `<span>${h.avatar}</span><label>${h.name}</label>`;
                thumb.onclick = () => {
                    selectedHeroKey = key;
                    updatePreviewPane();
                    renderHeroSidebar();
                };
                sidebar.appendChild(thumb);
            });
            updatePreviewPane();
        }

        function updatePreviewPane() {
            let h = HERO_DB[selectedHeroKey];
            document.getElementById('preview-hero-name').innerText = h.name;
            document.getElementById('preview-hero-desc').innerText = h.desc;
        }

        function confirmHeroPick() {
            closeHeroPicker();
        }

        function startMatch() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('top-score-bar').classList.remove('hidden');
            document.getElementById('hud-layer').classList.remove('hidden');
            
            entities = [];
            damageTexts = [];
            skillEffects = [];
            attackEffects = [];

            player = new Hero(350, MAP_SIZE - 350, 'blue', selectedHeroKey, true);
            let aiKeys = Object.keys(HERO_DB).filter(k => k !== selectedHeroKey);
            aiHeroKey = aiKeys[Math.floor(Math.random() * aiKeys.length)];
            aiHero = new Hero(MAP_SIZE - 350, 350, 'red', aiHeroKey, false);

            blueCore = new Building(250, MAP_SIZE - 250, 'blue', 'core');
            redCore = new Building(MAP_SIZE - 250, 250, 'red', 'core');
            blueTower = new Building(850, MAP_SIZE - 850, 'blue', 'tower');
            redTower = new Building(MAP_SIZE - 850, 850, 'red', 'tower');

            entities.push(blueCore, redCore, blueTower, redTower, player, aiHero);

            isRunning = true;
            gameTime = 0;
            requestAnimationFrame(gameLoop);
        }

        function upgradeSkill(skillId) {
            if (availableSkillPoints > 0 && skillLevels[skillId] < 3) {
                skillLevels[skillId]++;
                availableSkillPoints--;
            }
        }

        function castSummonerSpell(spellKey) {
            let spell = summonerSpells[spellKey];
            if (spell.cd > 0) return;
            spell.cd = spell.maxCd;

            if (spellKey === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3);
                damageTexts.push({ x: player.x, y: player.y - 40, value: '➕ 治癒回復！', color: '#00e676', life: 1.0 });
            } else if (spellKey === 'sprint') {
                player.speed *= 1.4;
                setTimeout(() => { player.speed /= 1.4; }, 5000);
                damageTexts.push({ x: player.x, y: player.y - 40, value: '🏃 疾走加速！', color: '#ffd700', life: 1.0 });
            }
        }

        document.getElementById('attack-btn').addEventListener('pointerdown', () => {
            if (!player || !player.alive) return;
            performAttack();
        });

        function performAttack() {
            let nearestTarget = null;
            let minDist = 9999;
            entities.forEach(e => {
                if (e.alive && e.team !== player.team) {
                    let dist = Math.hypot(e.x - player.x, e.y - player.y);
                    if (dist < minDist) { minDist = dist; nearestTarget = e; }
                }
            });

            if (nearestTarget && minDist <= player.range + nearestTarget.radius) {
                if (player.atkCooldown <= 0) {
                    player.atkCooldown = 25;
                    player.attackLockTimer = 15;
                    let baseDmg = player.atk;

                    if (player.heroKey === 'valhein') {
                        player.valheinPassiveTimer = 0;
                        player.valheinAttackCounter++;
                        if (player.valheinAttackCounter >= 3) {
                            player.valheinAttackCounter = 0;
                            if (player.valheinPassiveStacks < 4) {
                                player.valheinPassiveStacks++;
                                damageTexts.push({ x: player.x, y: player.y - 50, value: `⚡ 被動層數 +1 (${player.valheinPassiveStacks}層)`, color: '#00d2ff', life: 1.0 });
                            }
                        }
                        baseDmg += player.valheinPassiveStacks * 20;
                    }

                    nearestTarget.takeDamage(baseDmg, player.team, 'physical');
                    let textColor = nearestTarget.isPlayer ? '#ff3366' : '#ffffff';
                    damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `${Math.floor(baseDmg)}`, color: textColor, life: 0.8 });
                    attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#f3c654' });
                }
            }
        }

        function tryCastSkill(skillId) {
            if (skillCooldowns[skillId] > 0 || skillLevels[skillId] === 0) return;
            let dirX = joystickVector.x !== 0 || joystickVector.y !== 0 ? joystickVector.x : 1;
            let dirY = joystickVector.x !== 0 || joystickVector.y !== 0 ? joystickVector.y : 0;
            let len = Math.hypot(dirX, dirY);
            if (len > 0) { dirX /= len; dirY /= len; }

            let sLv = skillLevels[skillId];

            if (skillId === 1) {
                if (player.heroKey === 'krixi') {
                    skillCooldowns[1] = Math.max(4.0, 7.0 - (sLv - 1) * 0.4);
                    let dmg = 600 + (sLv - 1) * 40;
                    let endX = player.x + dirX * 240;
                    let endY = player.y + dirY * 240;

                    skillEffects.push({ x: endX, y: endY, life: 0.35, size: 75, color: 'rgba(255, 105, 180, 0.7)', team: player.team });
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - endX, e.y - endY) <= 85) {
                            e.takeDamage(dmg, player.team, 'magical');
                            damageTexts.push({ x: e.x, y: e.y - 40, value: `🧚‍♀️ 蝴蝶去程 (${dmg})`, color: '#ff69b4', life: 0.8 });
                        }
                    });

                    setTimeout(() => {
                        if (!player || !player.alive) return;
                        let returnX = (endX + player.x) / 2;
                        let returnY = (endY + player.y) / 2;
                        skillEffects.push({ x: returnX, y: returnY, life: 0.35, size: 75, color: 'rgba(255, 182, 193, 0.8)', team: player.team });
                        entities.forEach(e => {
                            if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - returnX, e.y - returnY) <= 85) {
                                e.takeDamage(dmg, player.team, 'magical');
                                damageTexts.push({ x: e.x, y: e.y - 45, value: `🧚‍♀️ 蝴蝶折返 (${dmg})`, color: '#ff1493', life: 0.9 });
                            }
                        });
                    }, 350);
                } else {
                    skillCooldowns[1] = 5.0;
                    let targetX = player.x + dirX * 180;
                    let targetY = player.y + dirY * 180;
                    skillEffects.push({ x: targetX, y: targetY, life: 0.3, size: 70, color: 'rgba(0, 210, 255, 0.8)', team: player.team });
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) <= 75) {
                            e.takeDamage(450, player.team, 'magical');
                            damageTexts.push({ x: e.x, y: e.y - 40, value: '💥 技能命中', color: '#00d2ff', life: 0.8 });
                        }
                    });
                }
            } else if (skillId === 2) {
                skillCooldowns[2] = 8.0;
                player.hasEnhancedAttack = true;
                let targetX = player.x + dirX * 180;
                let targetY = player.y + dirY * 180;
                skillEffects.push({ x: targetX, y: targetY, life: 0.35, size: 80, color: 'rgba(255, 215, 0, 0.8)', team: player.team });
                damageTexts.push({ x: player.x, y: player.y - 40, value: '⚡ 強化普攻就緒', color: '#ffd700', life: 1.0 });
            } else if (skillId === 3) {
                skillCooldowns[3] = 20.0;
                skillEffects.push({ x: player.x, y: player.y, life: 0.5, size: 150, color: 'rgba(238, 130, 238, 0.7)', team: player.team });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 150) {
                        e.takeDamage(1000, player.team, 'magical');
                        damageTexts.push({ x: e.x, y: e.y - 45, value: '🔥 大招暴雨轟炸！', color: '#ff00ff', life: 1.2 });
                    }
                });
            }
        }

        function executeAiSkill(aiObj, skillId, dirX, dirY) {
            let heroKey = aiObj.heroKey;
            let targetX = aiObj.x + dirX * 180;
            let targetY = aiObj.y + dirY * 180;

            if (heroKey === 'valhein') {
                skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 70, color: 'rgba(255, 215, 0, 0.8)', team: aiObj.team });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== aiObj.team && Math.hypot(e.x - targetX, e.y - targetY) <= 80) {
                        e.takeDamage(450, aiObj.team, 'magical');
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 2000);
                        damageTexts.push({ x: e.x, y: e.y - 40, value: '⚡ 敵方凡恩【黃牌暈眩 2秒】', color: '#ffd700', life: 1.2 });
                    }
                });
            } else if (heroKey === 'nakroth') {
                skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 85, color: 'rgba(156, 39, 176, 0.8)', team: aiObj.team });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== aiObj.team && Math.hypot(e.x - targetX, e.y - targetY) <= 85) {
                        e.takeDamage(400, aiObj.team, 'physical');
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 800);
                        damageTexts.push({ x: e.x, y: e.y - 40, value: '🗡️ 敵方納克【橫掃擊飛 0.8秒】', color: '#d7bde2', life: 1.0 });
                    }
                });
            } else if (heroKey === 'ryoma') {
                skillEffects.push({ x: targetX, y: targetY, life: 0.35, size: 75, color: 'rgba(76, 175, 80, 0.85)', team: aiObj.team });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== aiObj.team && Math.hypot(e.x - targetX, e.y - targetY) <= 80) {
                        e.takeDamage(650, aiObj.team, 'physical');
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 1000);
                        damageTexts.push({ x: e.x, y: e.y - 40, value: '🥷 敵方龍馬【槍尖暈眩 1秒】', color: '#00e676', life: 1.0 });
                    }
                });
            } else if (heroKey === 'krixi') {
                skillEffects.push({ x: targetX, y: targetY, life: 0.45, size: 90, color: 'rgba(233, 30, 99, 0.75)', team: aiObj.team });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== aiObj.team && Math.hypot(e.x - targetX, e.y - targetY) <= 90) {
                        e.takeDamage(300, aiObj.team, 'magical');
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 750);
                        damageTexts.push({ x: e.x, y: e.y - 40, value: '🧚‍♀️ 敵方克里希【法陣擊飛 0.75秒】', color: '#ff69b4', life: 1.0 });
                    }
                });
            }
        }

        let minionSpawnTimer = 0;
        function spawnMinionWave() {
            entities.push(new Minion(300, MAP_SIZE - 300, 'blue'));
            entities.push(new Minion(MAP_SIZE - 300, 300, 'red'));
        }

        function gameLoop() {
            if (!isRunning) return;

            gameTime += 1/60;
            minionSpawnTimer++;
            if (minionSpawnTimer >= 600) {
                minionSpawnTimer = 0;
                spawnMinionWave();
            }

            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                let nx = player.x + joystickVector.x * player.speed;
                let ny = player.y + joystickVector.y * player.speed;
                let clamped = clampPosition(nx, ny, player.radius);
                player.x = clamped.x;
                player.y = clamped.y;
            }

            for (let id in skillCooldowns) {
                if (skillCooldowns[id] > 0) {
                    skillCooldowns[id] -= 1/60;
                    if (skillCooldowns[id] < 0) skillCooldowns[id] = 0;
                }
            }

            for (let id in summonerSpells) {
                if (summonerSpells[id].cd > 0) {
                    summonerSpells[id].cd -= 1000 / 60;
                    if (summonerSpells[id].cd < 0) summonerSpells[id].cd = 0;
                }
            }

            entities.forEach(e => e.update());

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            ctx.fillStyle = '#0b132b';
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= MAP_SIZE; i += 300) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, MAP_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(MAP_SIZE, i); ctx.stroke();
            }

            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(350, MAP_SIZE - 350);
            ctx.lineTo(MAP_SIZE - 350, 350);
            ctx.stroke();

            entities.forEach(e => e.draw());

            skillEffects.forEach((fx, idx) => {
                ctx.fillStyle = fx.color;
                ctx.beginPath();
                ctx.arc(fx.x, fx.y, fx.size * (1 - fx.life), 0, Math.PI * 2);
                ctx.fill();
                fx.life -= 0.03;
            });
            skillEffects = skillEffects.filter(fx => fx.life > 0);

            attackEffects.forEach((ef, idx) => {
                if (ef.isLaser) {
                    ctx.strokeStyle = ef.color;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(ef.startX, ef.startY);
                    ctx.lineTo(ef.x, ef.y);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = ef.color;
                    ctx.beginPath();
                    ctx.arc(ef.x, ef.y, ef.radius || 20, 0, Math.PI * 2);
                    ctx.fill();
                }
                ef.life -= 0.05;
            });
            attackEffects = attackEffects.filter(ef => ef.life > 0);

            damageTexts.forEach(dt => {
                ctx.fillStyle = dt.color;
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(dt.value, dt.x, dt.y);
                dt.y -= 0.8;
                dt.life -= 0.02;
            });
            damageTexts = damageTexts.filter(dt => dt.life > 0);

            ctx.restore();

            let mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            let secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('game-time-txt').innerText = `${mins}:${secs}`;
            document.getElementById('score-blue-txt').innerText = `藍方 ${playerKills}`;
            document.getElementById('score-red-txt').innerText = `紅方 ${playerDeaths}`;
            document.getElementById('top-gold-txt').innerText = `💰 ${playerGold}`;
            document.getElementById('top-kda-txt').innerText = `⚔️ ${playerKills}/${playerDeaths}/${playerAssists}`;
            document.getElementById('top-level-txt').innerText = `Lv.${player.level}`;

            for (let id = 1; id <= 3; id++) {
                let cdOverlay = document.getElementById(`cd-${id}`);
                if (skillCooldowns[id] > 0) {
                    cdOverlay.classList.remove('hidden');
                    cdOverlay.innerText = skillCooldowns[id].toFixed(1);
                } else {
                    cdOverlay.classList.add('hidden');
                }
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
