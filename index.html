<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070d18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        canvas { background: #070d14; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none !important; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; padding: 15px; pointer-events: auto; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 110; pointer-events: auto; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #fff; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }
        .res-item { display: flex; align-items: center; gap: 5px; }
        .res-gold { color: #f3c654; }

        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px 0; position: relative; pointer-events: none; }
        .hero-heroine-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0.85; }
        .heroine-avatar { font-size: 9rem; text-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }

        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 10px 5px 10px; z-index: 110; pointer-events: auto; }
        .bottom-nav { display: flex; gap: 12px; background: rgba(6, 14, 26, 0.85); padding: 8px 18px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .nav-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: #94a3b8; cursor: pointer; pointer-events: auto !important; }
        .nav-btn.active { color: #fff; }

        .start-group { display: flex; align-items: flex-end; gap: 15px; pointer-events: auto; }
        .mode-select-btn { background: rgba(13, 27, 46, 0.9); border: 1px solid #00d2ff; border-radius: 50%; width: 55px; height: 55px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0,210,255,0.3); pointer-events: auto !important; }
        .mode-select-btn .icon { font-size: 1.2rem; pointer-events: none; }
        .mode-select-btn .label { font-size: 0.65rem; color: #00d2ff; font-weight: bold; margin-top: 2px; pointer-events: none; }

        .start-match-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%); border: 2px solid #fef08a; width: 170px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); pointer-events: auto !important; }
        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; pointer-events: none; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 20px; z-index: 20; font-size: 1rem; font-weight: bold; pointer-events: none; }
        .score-blue { color: #00d2ff; }
        .score-red { color: #ff4444; }
        .game-time-text { color: #00e676; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; font-variant-numeric: tabular-nums; }
        .gold-text { color: #ffd700; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .kda-text { color: #ffeb3b; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .level-text { color: #00e676; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; }

        .announcement-banner { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(13, 27, 46, 0.85) 50%, rgba(0,0,0,0) 100%); padding: 8px 40px; border-top: 1px solid #ffd700; border-bottom: 1px solid #ffd700; z-index: 100; pointer-events: none; text-align: center; transition: opacity 0.3s ease; }
        .announcement-text { font-size: 1.4rem; font-weight: 900; font-style: italic; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 69, 0, 0.6); letter-spacing: 2px; }

        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none !important; z-index: 10; }
        
        .joystick-container { position: absolute; bottom: 25px; left: 25px; width: 125px; height: 125px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto !important; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(243, 198, 84, 0.85); border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none; }

        .controls-right { position: absolute; bottom: 15px; right: 20px; width: 320px; height: 200px; pointer-events: none !important; }
        .attack-btn { position: absolute; bottom: 10px; right: 5px; width: 78px; height: 78px; background: radial-gradient(circle, #f3c654 0%, #8f5c0a 100%); border: 3px solid #ffe596; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #fff; cursor: pointer; pointer-events: auto !important; touch-action: none; }
        
        .bottom-actions-bar { position: absolute; bottom: 15px; right: 195px; display: flex; gap: 10px; pointer-events: auto !important; z-index: 60; }
        .action-mini-btn { width: 46px; height: 46px; background: radial-gradient(circle, #263238 0%, #0d1b2a 100%); border: 2px solid #f3c654; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.9rem; font-weight: bold; color: #fff; cursor: pointer; position: relative; pointer-events: auto !important; touch-action: none; overflow: hidden; }
        .action-mini-btn .label { position: absolute; bottom: -16px; font-size: 0.55rem; color: #ffeb3b; font-weight: bold; white-space: nowrap; pointer-events: none; }
        .spell-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-btn { position: absolute; width: 62px; height: 62px; background: rgba(15, 25, 40, 0.9); border: 2px solid #00aaff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto !important; touch-action: none; }
        .skill-btn.locked { border-color: #555; opacity: 0.5; filter: grayscale(1); }
        .skill-desc-label { position: absolute; bottom: -20px; width: 95px; text-align: center; font-size: 0.58rem; color: #ffeb3b; font-weight: bold; pointer-events: none; white-space: nowrap; }
        .skill-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-upgrade-btn {
            position: absolute; top: -8px; right: -8px; width: 28px; height: 28px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8f00 100%);
            border: 2px solid #fff; border-radius: 50%; color: #000;
            font-size: 1.1rem; font-weight: 900; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 12px rgba(255, 215, 0, 0.9); z-index: 60;
            animation: pulse-upgrade 0.8s infinite alternate; pointer-events: auto !important;
        }
        @keyframes pulse-upgrade {
            0% { transform: scale(0.95); box-shadow: 0 0 6px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.15); box-shadow: 0 0 16px rgba(255, 215, 0, 1); }
        }

        #skill-3 { bottom: 120px; right: 15px; border-color: #e040fb; }
        #skill-2 { bottom: 85px; right: 90px; border-color: #00e676; }
        #skill-1 { bottom: 10px; right: 150px; border-color: #ff9100; }

        .pick-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070d18; z-index: 150; display: flex; flex-direction: column; padding: 15px; pointer-events: auto; }
        .pick-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; pointer-events: auto; }
        .pick-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 1rem; color: #888; }
        .pick-tabs .active { color: #f3c654; border-bottom: 2px solid #f3c654; }
        .pick-cancel-btn { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; pointer-events: auto !important; }
        
        .pick-content-layout { display: flex; flex: 1; margin-top: 15px; gap: 20px; overflow: hidden; pointer-events: auto; }
        
        .pick-hero-sidebar { 
            width: 230px; 
            height: 100%; 
            max-height: 420px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            overflow-y: auto; 
            padding-right: 5px; 
            scrollbar-width: thin; 
            scrollbar-color: #f3c654 rgba(0,0,0,0.3); 
            touch-action: pan-y;
            pointer-events: auto !important;
        }
        .pick-hero-sidebar::-webkit-scrollbar { width: 6px; }
        .pick-hero-sidebar::-webkit-scrollbar-thumb { background-color: #f3c654; border-radius: 3px; }

        .pick-hero-thumb { width: 95px; height: 95px; background: #1a2a40; border: 2px solid #334455; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.6rem; cursor: pointer; pointer-events: auto !important; }
        .pick-hero-thumb span { font-size: 0.75rem; color: #fff; font-weight: bold; margin-top: 4px; pointer-events: none; }
        .pick-hero-thumb.active { border-color: #f3c654; box-shadow: 0 0 10px rgba(243, 198, 84, 0.6); }

        .pick-center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(30,50,80,0.3) 0%, rgba(5,10,18,0.8) 100%); border-radius: 12px; }
        .stage-hero-avatar { font-size: 10rem; }
        
        .pick-right-sidebar { width: 220px; display: flex; flex-direction: column; gap: 12px; justify-content: center; pointer-events: auto; }
        .team-slot { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 0.9rem; color: #aaa; }
        
        .pick-confirm-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: 2px solid #fef08a; color: #fff; font-weight: bold; font-size: 1.2rem; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; pointer-events: auto !important; }

        .result-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 10, 18, 0.9); z-index: 200; pointer-events: auto; }
        .result-box { background: rgba(13, 23, 38, 0.95); border: 2px solid #f3c654; border-radius: 15px; padding: 30px; text-align: center; width: 85%; max-width: 420px; pointer-events: auto; }
        .result-title-win { font-size: 3rem; font-weight: 900; color: #ffd700; }
        .result-title-lose { font-size: 3rem; font-weight: 900; color: #ff3366; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="top-hud" class="top-score-bar hidden">
        <span class="level-text" id="level-display">Lv.1</span>
        <span class="score-blue" id="score-blue">0</span>
        <span>VS</span>
        <span class="score-red" id="score-red">0</span>
        <span id="enemy-respawn-display" style="color: #ff4444; margin-left: 5px; font-weight: bold; display: none;">💀 10s</span>
        <span class="game-time-text" id="game-time-display">⏱️ 00:00</span>
        <span class="gold-text" id="gold-display">🪙 300</span>
        <span class="kda-text" id="kda-display">KDA: 0 / 0 / 0</span>
    </div>

    <div id="announcement-banner" class="announcement-banner hidden">
        <div id="announcement-text" class="announcement-text">FIRST BLOOD</div>
    </div>

    <div id="result-screen" class="result-overlay hidden">
        <div class="result-box">
            <div id="result-title" class="result-title-win">VICTORY</div>
            <p id="result-subtitle" style="color: #aaa; margin-bottom: 20px;">成功摧毀敵方主堡！</p>
            <button class="pick-confirm-btn" style="width:100%;" id="btn-back-lobby">返回遊戲大廳</button>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <div class="top-navbar">
            <div class="profile-area">
                <div id="user-profile" class="user-profile-box">
                    <img id="user-avatar" class="user-avatar" src="https://via.placeholder.com/32" alt="Avatar">
                    <span id="user-name" class="user-name">訪客玩家</span>
                </div>
            </div>

            <div class="resource-group">
                <div class="res-item res-gold" id="header-gold">🟡 300</div>
            </div>
        </div>

        <div class="main-content">
            <div class="hero-heroine-bg">
                <div class="heroine-avatar">🎯</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-nav">
                <div class="nav-btn active">🛡️ 英雄對戰</div>
            </div>

            <div class="start-group">
                <div class="mode-select-btn" id="btn-mode-1v1">
                    <span class="icon">⚔️</span>
                    <span class="label">1v1 單挑</span>
                </div>
                <div class="start-match-btn" id="btn-start-match">
                    <span class="start-text">START</span>
                </div>
            </div>
        </div>
    </div>

    <div id="pick-screen" class="pick-screen-overlay hidden">
        <div class="pick-top-bar">
            <div class="pick-tabs">
                <span class="active">選擇 7 大傳說英雄</span>
            </div>
            <button class="pick-cancel-btn" id="btn-pick-back">取消 ✕</button>
        </div>

        <div class="pick-content-layout">
            <div class="pick-hero-sidebar" id="hero-select-grid"></div>

            <div class="pick-center-stage">
                <div class="stage-hero-avatar" id="stage-hero-avatar">🎯</div>
                <div class="stage-hero-info">
                    <h2 id="selected-hero-name" style="color:#f3c654; font-size: 1.8rem;">凡恩</h2>
                    <p id="selected-hero-type" style="color:#aaa; font-size: 0.95rem;">射手 / 遠距輸出</p>
                </div>
            </div>

            <div class="pick-right-sidebar">
                <div class="team-slot"><span>我方 (你)</span><span style="color:#00d2ff;">準備就緒</span></div>
                <div class="team-slot"><span id="ai-opponent-slot">電競AI對手</span><span style="color:#ff4444;">隨機配對</span></div>
                <button class="pick-confirm-btn" id="btn-confirm-hero">確 定 參 戰</button>
            </div>
        </div>
    </div>

    <div id="hud-layer" class="hidden">
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        
        <div class="controls-right">
            <div class="attack-btn" id="btn-attack">⚔️</div>
            
            <div class="bottom-actions-bar">
                <div class="action-mini-btn" id="btn-heal-spell">
                    <span>💚</span>
                    <div class="label">恢復</div>
                    <div class="spell-cd-overlay hidden" id="cd-heal"></div>
                </div>
                <div class="action-mini-btn" id="btn-challenger-spell">
                    <span id="challenger-icon">✨</span>
                    <div class="label" id="lbl-challenger">順移</div>
                    <div class="spell-cd-overlay hidden" id="cd-challenger"></div>
                </div>
            </div>

            <div class="skill-btn" id="skill-3" data-skill="3">
                <div class="skill-upgrade-btn hidden" id="up-btn-3">+</div>
                大招
                <div class="skill-desc-label" id="lbl-skill-3">Lv.0 水銀彈幕</div>
                <div class="skill-cd-overlay hidden" id="cd-3"></div>
            </div>
            <div class="skill-btn" id="skill-2" data-skill="2">
                <div class="skill-upgrade-btn hidden" id="up-btn-2">+</div>
                二技
                <div class="skill-desc-label" id="lbl-skill-2">Lv.0 暈眩鏢</div>
                <div class="spell-cd-overlay hidden" id="cd-2"></div>
            </div>
            <div class="skill-btn" id="skill-1" data-skill="1">
                <div class="skill-upgrade-btn hidden" id="up-btn-1">+</div>
                一技
                <div class="skill-desc-label" id="lbl-skill-1">Lv.0 獵殺</div>
                <div class="skill-cd-overlay hidden" id="cd-1"></div>
            </div>
        </div>
    </div>
</div>

<script>
const LOCAL_STORAGE_KEY = 'aov_game_user_data_v11';
let currentUserData = { userId: '', name: '訪客玩家', avatar: 'https://via.placeholder.com/32', isGuest: true, gold: 300 };

const LEVEL_EXP_TABLE = {
    1: 20, 
    2: 25, 
    3: 30, 
    4: 50,   // 4 升 5
    5: 80,   // 5 升 6
    6: 140,  // 6 升 7
    7: 160, 
    8: 180, 
    9: 200, 
    10: 220, 
    11: 240, 
    12: 260, 
    13: 280, 
    14: 300  
};

function initUserData() {
    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (saved) { try { currentUserData = JSON.parse(saved); } catch (e) {} }
    else { currentUserData.userId = 'guest_' + Math.random().toString(36).substr(2, 9); saveUserData(); }
    updateUserProfileUI();
}

function saveUserData() { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(currentUserData)); }

function updateUserProfileUI() {
    const headerGold = document.getElementById('header-gold');
    if (headerGold) headerGold.innerText = `🟡 ${Math.floor(currentUserData.gold)}`;
}

window.addEventListener('DOMContentLoaded', () => { initUserData(); buildHeroSelectGrid(); });

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let MAP_SIZE = 2600; 
let ROAD_WIDTH = 380; 
let isRunning = false;
let selectedHeroKey = 'valhein';
let randomAiKey = 'nakroth';
let challengerCooldown = 0;
let healSpellCooldown = 0;

let gameTimeSeconds = 0;
let hasFirstBloodOccurred = false;
let playerKillStreak = 0;
let aiKillStreak = 0;
let announcementTimer = null;
let passiveExpTimer = 0;

function triggerAnnouncement(text, color = '#ffd700') {
    let banner = document.getElementById('announcement-banner');
    let txtEl = document.getElementById('announcement-text');
    
    txtEl.innerText = text;
    txtEl.style.color = color;
    banner.classList.remove('hidden');
    banner.style.opacity = '1';

    if (announcementTimer) clearTimeout(announcementTimer);
    
    announcementTimer = setTimeout(() => {
        banner.style.opacity = '0';
        setTimeout(() => { banner.classList.add('hidden'); }, 300);
    }, 3500);
}

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const HERO_DB = {
    'valhein': { 
        name: '凡恩', type: '射手 / 遠距輸出', baseHp: 6000, hpGrowth: 680, atk: 85, range: 240, avatar: '🎯', color1: '#c29b38', color2: '#ffe89e',
        skillRanges: { 1: 240, 2: 240, 3: 240 }
    },
    'nakroth': { 
        name: '納克羅斯', type: '刺客 / 高機動性', baseHp: 6500, hpGrowth: 750, atk: 120, range: 120, avatar: '🗡️', color1: '#8e44ad', color2: '#d7bde2',
        skillRanges: { 1: 180, 2: 120, 3: 180 }
    },
    'quillen': { 
        name: '奎倫', type: '刺客 / 背擊必爆', baseHp: 6200, hpGrowth: 700, atk: 70, range: 120, avatar: '🥷', color1: '#b71c1c', color2: '#ff8a80',
        skillRanges: { 1: 120, 2: 180, 3: 180 }
    },
    'krixi': { 
        name: '克里希', type: '法師 / 魔法爆發', baseHp: 5800, hpGrowth: 650, atk: 45, range: 240, avatar: '🧚‍♀️', color1: '#43a047', color2: '#a5d6a7',
        skillRanges: { 1: 240, 2: 180, 3: 240 }
    },
    'zuka': { 
        name: '祖卡', type: '戰士 / 物理爆發', baseHp: 7500, hpGrowth: 850, atk: 110, range: 120, avatar: '🐼', color1: '#ff9800', color2: '#ffe082',
        skillRanges: { 1: 180, 2: 120, 3: 180 }
    },
    'ryoma': { 
        name: '龍馬', type: '戰士 / 槍尖爆發', baseHp: 7200, hpGrowth: 800, atk: 125, range: 120, avatar: '🥷', color1: '#2e7d32', color2: '#a5d6a7',
        skillRanges: { 1: 180, 2: 180, 3: 180 }

function buildHeroSelectGrid() {

    Object.keys(HERO_DB).forEach(key => {
        let h = HERO_DB[key];
        let div = document.createElement('div');
        div.className = `pick-hero-thumb ${key === selectedHeroKey ? 'active' : ''}`;
        div.innerHTML = `<div>${h.avatar}</div><span>${h.name}</span>`;
        
        bindClickElement(div, () => {

function bindClickElement(el, fn) {
    if (!el) return;
    let fired = false;
    const trigger = (e) => {
        if (fired) return;
        fired = true;
        setTimeout(() => { fired = false; }, 200);
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        fn(e);
    };
    ['pointerdown', 'touchstart', 'click'].forEach(evt => {
        el.addEventListener(evt, trigger, { passive: false });
    });
}

function bindClick(id, fn) {
    bindClickElement(document.getElementById(id), fn);
}

function upgradeSkill(skillId) {
    if (unallocatedPoints <= 0) return;

    if (skillId === 3) {
        let currentLvl = skillLevels[3];

        if (player.level < requiredLevel) {
            triggerAnnouncement(`⚠️ 大招需達到 Lv.${requiredLevel} 才能解鎖！`, '#ff4444');
            return;
        }
    }

    if (skillLevels[skillId] < 3) {
        skillLevels[skillId]++;
        unallocatedPoints--;
        updateSkillUI();
    }
}

joystick.addEventListener('pointerdown', e => {

    joystick.setPointerCapture(e.pointerId);
    const rect = joystick.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
});
joystick.addEventListener('pointermove', e => {
    if (e.pointerId === joystickTouchId) updateJoystick(e.clientX, e.clientY);
});
function resetJoystick(e) {
    if (e.pointerId === joystickTouchId) {
        joystickTouchId = null;
        joystickDir = { x: 0, y: 0 };
        knob.style.transform = `translate(0px, 0px)`;
    }
}
joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
}

function clampPosition(x, y, radius = 26) {
    let startX = 450, startY = MAP_SIZE - 450;
    let endX = MAP_SIZE - 450, endY = 450;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;
    let pX = x - startX, pY = y - startY;
    let t = pX * uX + pY * uY;
    t = Math.max(0, Math.min(lineLen, t));
    let nearestX = startX + uX * t;
    let nearestY = startY + uY * t;
    let dist = Math.hypot(x - nearestX, y - nearestY);
    if (dist > ROAD_WIDTH / 2 - radius) {
        let angle = Math.atan2(y - nearestY, x - nearestX);
        x = nearestX + Math.cos(angle) * (ROAD_WIDTH / 2 - radius);
        y = nearestY + Math.sin(angle) * (ROAD_WIDTH / 2 - radius);
    }
    return { x: Math.max(radius, Math.min(MAP_SIZE - radius, x)), y: Math.max(radius, Math.min(MAP_SIZE - radius, y)) };
}

class Entity {
    constructor(x, y, team, radius = 26) {
        this.x = x; this.y = y; this.team = team; this.radius = radius;
        this.hp = 1000; this.maxHp = 1000; this.alive = true;
    }
    takeDamage(dmg, sourceTeam, type = 'physical') {
        if (!this.alive) return;
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(sourceTeam);
        }
    }
    onDeath(sourceTeam) {}
}

class Building extends Entity {
    constructor(x, y, team, type) {
        super(x, y, team, type === 'core' ? 55 : 45);
        this.type = type;
        this.maxHp = type === 'core' ? 6000 : 4500;
        this.hp = this.maxHp;
        this.atkTimer = 0;
        this.attackRange = 240;
        this.currentTarget = null;
    }
    takeDamage(dmg, sourceTeam, type = 'physical') {
        if (!this.alive) return;

        if (this.type === 'tower' || this.type === 'core') {
            let hasMinionNearby = entities.some(e => 
                e.alive && e instanceof Minion && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= 240
            );

            if (!hasMinionNearby) {
                dmg *= 0.15; 
                damageTexts.push({ x: this.x, y: this.y - 50, value: '🛡️ 無兵線減傷 (防護中)', color: '#00d2ff', life: 0.8 });
            }
        }

        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(sourceTeam);
        }
    }
    update() {
        if (!this.alive) return;
        this.atkTimer++;

        if (this.currentTarget) {
            let dist = Math.hypot(this.currentTarget.x - this.x, this.currentTarget.y - this.y);
            if (!this.currentTarget.alive || dist > this.attackRange) {
                this.currentTarget = null;
            }
        }

        if (!this.currentTarget) {
            let inRangeEnemies = entities.filter(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.attackRange);
            let minionTarget = inRangeEnemies.find(e => e instanceof Minion);
            let heroTarget = inRangeEnemies.find(e => e instanceof Hero);
            this.currentTarget = minionTarget || heroTarget || null;
        }

        if (this.atkTimer >= 60) {
            this.atkTimer = 0;
            if (this.currentTarget) {
                let dmg = 280;
                this.currentTarget.takeDamage(dmg, this.team, 'magical');
                damageTexts.push({ x: this.currentTarget.x, y: this.currentTarget.y - 40, value: `⚡ 塔傷 ${dmg}`, color: '#ff4444', life: 0.6 });
                
                attackEffects.push({
                    startX: this.x, startY: this.y,
                    x: this.currentTarget.x, y: this.currentTarget.y,
                    life: 0.25, isLaser: true,
                    color: this.team === 'blue' ? '#00d2ff' : '#ff4444'
                });
            }
        }
    }
    onDeath(sourceTeam) {
        if (this.type === 'core') {
            isRunning = false;
            let resultEl = document.getElementById('result-screen');
            let titleEl = document.getElementById('result-title');
            if (sourceTeam === 'blue') {
                titleEl.innerText = 'VICTORY';
                titleEl.className = 'result-title-win';
            } else {
                titleEl.innerText = 'DEFEAT';
                titleEl.className = 'result-title-lose';
            }
            resultEl.classList.remove('hidden');
        }
    }
}

class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 18);
        this.maxHp = 1800; this.hp = 1800;
        this.atk = 45; this.range = 120;
        this.targetX = team === 'blue' ? MAP_SIZE - 450 : 450;
        this.targetY = team === 'blue' ? 450 : MAP_SIZE - 450;
        this.moveSpeed = 1.6;
        this.atkCooldown = 0;
    }
    update() {
        if (!this.alive) return;
        if (this.isStunned) return;
        if (this.atkCooldown > 0) this.atkCooldown--;

        let nearestTarget = null;
        let minDist = 9999;
        entities.forEach(e => {
            if (e.alive && e.team !== this.team) {
                let dist = Math.hypot(e.x - this.x, e.y - this.y);
                if (dist < minDist) { minDist = dist; nearestTarget = e; }
            }
        });

        if (nearestTarget && minDist <= this.range) {
            if (this.atkCooldown === 0) {
                this.atkCooldown = 60;
                nearestTarget.takeDamage(this.atk, this.team, 'physical');
            }
        } else {
            let destX = nearestTarget ? nearestTarget.x : this.targetX;
            let destY = nearestTarget ? nearestTarget.y : this.targetY;
            let angle = Math.atan2(destY - this.y, destX - this.x);
            let speed = this.moveSpeed;
            if (this.isSlowed) speed *= (1 - (this.slowFactor || 0.4));
            let nx = this.x + Math.cos(angle) * speed;
            let ny = this.y + Math.sin(angle) * speed;
            let clamped = clampPosition(nx, ny, this.radius);
            this.x = clamped.x; this.y = clamped.y;
        }
    }
    onDeath(sourceTeam) {
        entities.forEach(e => {
            if (e instanceof Hero && e.alive && e.team === sourceTeam) {
                e.gainExpAndGold(10, 25);
            }
        });
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer) {
        let data = HERO_DB[heroKey];
        super(x, y, team, 26);
        this.heroKey = heroKey;
        this.heroData = data;
        this.maxHp = data.baseHp; this.hp = this.maxHp;
        this.shield = 0;
        this.atk = data.atk; this.range = data.range;
        this.isPlayer = isPlayer;
        this.level = 1; this.exp = 0; this.gold = 300;
        this.kills = 0; this.deaths = 0; this.assists = 0;
        
        this.atkCooldown = 0;
        this.attackLockTimer = 0;
        this.hasEnhancedAttack = false;
        this.isStealth = false;
        this.isSuperArmor = false;
        this.isStunned = false;
        this.isSlowed = false;
        this.slowFactor = 0.4;
        
        this.valheinPassiveStacks = 0;
        this.valheinAtkCounter = 0;
        this.valheinPassiveTimer = 0;

        this.isDashing = false; this.dashTargetX = x; this.dashTargetY = y; this.dashSpeed = 30;
        this.rotation = team === 'blue' ? -Math.PI / 4 : Math.PI * 3 / 4;
    }
    startDash(tx, ty, speed = 35) {
        this.isDashing = true;
        this.dashTargetX = tx; this.dashTargetY = ty;
        this.dashSpeed = speed;
    }
    update() {
        if (!this.alive) return;

        if (this.isStunned) return;

        if (this.heroKey === 'valhein' && this.valheinPassiveStacks > 0) {
            this.valheinPassiveTimer++;
            if (this.valheinPassiveTimer >= 300) {
                this.valheinPassiveTimer = 0;
                this.valheinPassiveStacks = Math.max(0, this.valheinPassiveStacks - 1);
            }
        }

        if (this.atkCooldown > 0) this.atkCooldown--;
        if (this.attackLockTimer > 0) this.attackLockTimer--;

        let fountainX = this.team === 'blue' ? 380 : MAP_SIZE - 380;
        let fountainY = this.team === 'blue' ? MAP_SIZE - 380 : 380;
        let distToFountain = Math.hypot(this.x - fountainX, this.y - fountainY);
        
        if (distToFountain <= 100) {
            if (this.hp < this.maxHp) {
                if (!this.fountainTimer) this.fountainTimer = 0;
                this.fountainTimer++;
                
                if (this.fountainTimer >= 60) {
                    this.fountainTimer = 0;
                    let healAmount = this.maxHp * 0.13;
                    this.hp = Math.min(this.maxHp, this.hp + healAmount);
                    
                    damageTexts.push({ 
                        x: this.x, y: this.y - 35, 
                        value: `+❤️ ${Math.floor(healAmount)}`, 
                        color: '#00e676', life: 0.8 
                    });
                }
            }
        } else {
            this.fountainTimer = 0;
        }

        if (this.isDashing) {
            let dx = this.dashTargetX - this.x;
            let dy = this.dashTargetY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist < this.dashSpeed) {
                this.x = this.dashTargetX; this.y = this.dashTargetY;
                this.isDashing = false;
            } else {
                this.x += (dx / dist) * this.dashSpeed;
                this.y += (dy / dist) * this.dashSpeed;
            }
            return;
        }

        if (this.isPlayer) {
            if (this.attackLockTimer <= 0) {
                if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                    let speed = 2.8;
                    if (this.isSlowed) speed *= (1 - this.slowFactor);
                    let nx = this.x + joystickDir.x * speed;
                    let ny = this.y + joystickDir.y * speed;
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                    this.rotation = Math.atan2(joystickDir.y, joystickDir.x);
                }
            }
            if (isAttackingPressed) {
                performAttack();
            }
        } else {
            if (this.attackLockTimer <= 0) {
                let hpRatio = this.hp / this.maxHp;
                let baseHomeX = this.team === 'blue' ? 380 : MAP_SIZE - 380;
                let baseHomeY = this.team === 'blue' ? MAP_SIZE - 380 : 380;
                let targetDestX = baseHomeX;
                let targetDestY = baseHomeY;

                let nearestEnemy = null;
                let minDist = 9999;
                entities.forEach(e => {
                    if (e.alive && e.team !== this.team) {
                        let dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < minDist) { minDist = dist; nearestEnemy = e; }
                    }
                });

                if (hpRatio < 0.35 && distToFountain > 80) {
                    targetDestX = baseHomeX;
                    targetDestY = baseHomeY;
                } else if (nearestEnemy) {
                    targetDestX = nearestEnemy.x;
                    targetDestY = nearestEnemy.y;

                    if (minDist <= 240 && Math.random() < 0.03 && this.atkCooldown <= 0) {
                        this.atkCooldown = 40;
                        let skillDmg = 300 + this.level * 35;
                        skillEffects.push({ x: nearestEnemy.x, y: nearestEnemy.y, life: 0.35, size: 60, color: 'rgba(194, 155, 56, 0.8)', dmg: skillDmg, team: this.team });
                        nearestEnemy.takeDamage(skillDmg, this.team, 'magical');
                    }

                    if (minDist <= this.range + nearestEnemy.radius) {
                        if (this.atkCooldown <= 0) {
                            this.atkCooldown = Math.max(10, 30 * (1 - (this.valheinPassiveStacks * 0.1)));
                            this.attackLockTimer = 15;
                            let finalAtk = this.atk + (this.valheinPassiveStacks * 20);
                            nearestEnemy.takeDamage(finalAtk, this.team, 'physical');
                            
                            this.valheinAtkCounter++;
                            if (this.valheinAtkCounter >= 3) {
                                this.valheinAtkCounter = 0;
                                if (this.valheinPassiveStacks < 4) this.valheinPassiveStacks++;
                            }
                            this.valheinPassiveTimer = 0;
                        }
                    }
                }

                let angle = Math.atan2(targetDestY - this.y, targetDestX - this.x);
                let speed = 1.6;
                if (this.isSlowed) speed *= (1 - this.slowFactor);
                let nx = this.x + Math.cos(angle) * speed;
                let ny = this.y + Math.sin(angle) * speed;
                let clamped = clampPosition(nx, ny, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            }
        }
    }

    gainExpAndGold(expAmt, goldAmt) {
        this.gold += goldAmt;
        if (this.isPlayer) {
            currentUserData.gold = this.gold;
            saveUserData();
        }

        this.exp += expAmt;
        let reqExp = LEVEL_EXP_TABLE[this.level] || 150;
        
        while (this.exp >= reqExp && this.level < 15) {
            this.exp -= reqExp;
            this.level++; 
            if (this.isPlayer) unallocatedPoints++;
            
            let hpGain = this.heroData.hpGrowth || 400;
            this.maxHp += hpGain; 
            this.hp = Math.min(this.maxHp, this.hp + hpGain);
            this.atk += 8;
            
            if (this.isPlayer) {
                triggerAnnouncement(`🎉 恭喜升到 Lv.${this.level}！`, '#00e676');
            }
            reqExp = LEVEL_EXP_TABLE[this.level] || 150;
        }
        updateTopScopeUI();
        updateSkillUI();
    }

    onDeath(sourceTeam) {
        let respawnTime = Math.min(35, Math.floor(5 + this.level * 0.8 + gameTimeSeconds / 60));

        if (this.isPlayer) {
            deaths++;
            aiKillStreak++;
            playerKillStreak = 0;
            triggerAnnouncement(`YOU HAVE BEEN SLAIN (復活倒數 ${respawnTime} 秒)`, '#ff3366');

            setTimeout(() => {
                this.hp = this.maxHp;
                this.x = 380; this.y = MAP_SIZE - 380;
                this.alive = true;
                triggerAnnouncement('⚔️ 你已重返戰場！', '#00e676');
            }, respawnTime * 1000);
        } else {
            blueKills++;
            kills++;
            playerKillStreak++;
            aiKillStreak = 0;
            
            if (!hasFirstBloodOccurred) {
                hasFirstBloodOccurred = true;
                triggerAnnouncement('FIRST BLOOD 擊殺首血！', '#ffd700');
            } else {
                triggerAnnouncement(`ENEMY SLAIN (敵方 ${respawnTime} 秒後復活)`, '#00e676');
            }

            if (player && player.alive) {
                player.gainExpAndGold(20, 150);
            }

            setTimeout(() => {
                this.hp = this.maxHp;
                this.x = MAP_SIZE - 380; this.y = 380;
                this.alive = true;
            }, respawnTime * 1000);
        }
        updateTopScopeUI();
    }
}

function performAttack() {
    if (!player || !player.alive) return;
    if (player.atkCooldown > 0) return;

    let attackRange = player.range;
    let nearestTarget = null;
    let minTargetDist = 9999;

    entities.forEach(target => {
        if (!target.alive || target.team === player.team) return;
        let dist = Math.hypot(target.x - player.x, target.y - player.y);
        if (dist <= attackRange + target.radius) {
            if (dist < minTargetDist) {
                minTargetDist = dist;
                nearestTarget = target;
            }
        }
    });

    if (nearestTarget) {
        let baseCd = 25;
        let speedBonus = 1 + (player.valheinPassiveStacks * 0.10);
        player.atkCooldown = Math.max(8, Math.floor(baseCd / speedBonus));
        player.attackLockTimer = 10; 

        let finalAtk = player.atk + (player.valheinPassiveStacks * 20);
        nearestTarget.takeDamage(finalAtk, player.team, 'physical');

        if (player.heroKey === 'valhein') {
            player.valheinAtkCounter++;
            if (player.valheinAtkCounter >= 3) {
                player.valheinAtkCounter = 0;
                if (player.valheinPassiveStacks < 4) {
                    player.valheinPassiveStacks++;
                    damageTexts.push({ x: player.x, y: player.y - 50, value: `⚡ 被動層數 +1 (${player.valheinPassiveStacks}/4)`, color: '#ffd700', life: 0.8 });
                }
            }
            player.valheinPassiveTimer = 0;
        }

        damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 30, value: `${Math.floor(finalAtk)}`, color: '#fff', life: 0.8 });
        attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#f3c654' });
    }
}

    const valheinSkillNames = {
        1: { name: '獵殺 (指定爆)', type: '輸出' },
        2: { name: '暈眩鏢 (2秒控)', type: '控場' },
        3: { name: '水銀彈幕 (滿層)', type: '大招' }
    };

    [1, 2, 3].forEach(id => {
        let btn = document.getElementById(`skill-${id}`);
        let upBtn = document.getElementById(`up-btn-${id}`);
        let cdEl = document.getElementById(`cd-${id}`);
        let descLbl = document.getElementById(`lbl-skill-${id}`);
        let sLv = skillLevels[id];

        if (player && player.heroKey === 'valhein') {
            let info = valheinSkillNames[id];
            descLbl.innerText = `Lv.${sLv} ${info.name}`;
        } else {
            descLbl.innerText = `Lv.${sLv} 技能${id}`;
        }

        let canUpgrade = false;
        if (unallocatedPoints > 0 && sLv < 3) {
            if (id === 3) {
                let reqLvl = (sLv === 0) ? 4 : (sLv === 1 ? 8 : 12);
                if (player && player.level >= reqLvl) canUpgrade = true;
            } else {
                canUpgrade = true;
            }
        }

        if (canUpgrade) upBtn.classList.remove('hidden');
        else upBtn.classList.add('hidden');

        if (sLv === 0) btn.classList.add('locked');
        else btn.classList.remove('locked');

        if (skillCooldowns[id] > 0) {
            cdEl.classList.remove('hidden');
            cdEl.innerText = skillCooldowns[id].toFixed(1);
        } else {
            cdEl.classList.add('hidden');
        }
    });

    let cdChallengerEl = document.getElementById('cd-challenger');
    if (challengerCooldown > 0) {
        cdChallengerEl.classList.remove('hidden');
        cdChallengerEl.innerText = Math.ceil(challengerCooldown);
    } else {
        cdChallengerEl.classList.add('hidden');
    }

    let cdHealEl = document.getElementById('cd-heal');
    if (healSpellCooldown > 0) {
        cdHealEl.classList.remove('hidden');
        cdHealEl.innerText = Math.ceil(healSpellCooldown);
    } else {
        cdHealEl.classList.add('hidden');
    }
}

function gameLoop() {
    if (!isRunning) return;

    gameTimeSeconds += 1 / 60;
    let mins = Math.floor(gameTimeSeconds / 60).toString().padStart(2, '0');
    let secs = Math.floor(gameTimeSeconds % 60).toString().padStart(2, '0');
    document.getElementById('game-time-display').innerText = `⏱️ ${mins}:${secs}`;

    passiveExpTimer += 1 / 60;
    if (passiveExpTimer >= 5.0) {
        passiveExpTimer = 0;
        entities.forEach(e => {
            if (e instanceof Hero && e.alive) {
                e.gainExpAndGold(5, 5);
            }
        });
    }

    [1, 2, 3].forEach(id => {
        if (skillCooldowns[id] > 0) {
            skillCooldowns[id] = Math.max(0, skillCooldowns[id] - 1 / 60);
        }
    });
    if (challengerCooldown > 0) challengerCooldown = Math.max(0, challengerCooldown - 1 / 60);
    if (healSpellCooldown > 0) healSpellCooldown = Math.max(0, healSpellCooldown - 1 / 60);

    minionSpawnTimer++;
    if (minionSpawnTimer >= 900) {
        minionSpawnTimer = 0;
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                if (!isRunning) return;
                entities.push(new Minion(450 - i * 15, MAP_SIZE - 450 + i * 15, 'blue'));
                entities.push(new Minion(MAP_SIZE - 450 + i * 15, 450 - i * 15, 'red'));
            }, i * 300);
        }
    }

    entities.forEach(e => e.update());

    if (player) {
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(450 - camera.x, MAP_SIZE - 450 - camera.y);
    ctx.lineTo(MAP_SIZE - 450 - camera.x, 450 - camera.y);
    ctx.strokeStyle = '#1e3a5f';
    ctx.lineWidth = ROAD_WIDTH;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ['blue', 'red'].forEach(team => {
        let fountainX = team === 'blue' ? 380 : MAP_SIZE - 380;
        let fountainY = team === 'blue' ? MAP_SIZE - 380 : 380;
        let sx = fountainX - camera.x;
        let sy = fountainY - camera.y;

        ctx.beginPath();
        ctx.arc(sx, sy, 100, 0, Math.PI * 2);
        ctx.fillStyle = team === 'blue' ? 'rgba(0, 210, 255, 0.15)' : 'rgba(255, 68, 68, 0.15)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = team === 'blue' ? 'rgba(0, 210, 255, 0.6)' : 'rgba(255, 68, 68, 0.6)';
        ctx.setLineDash([6, 6]);
        ctx.stroke();
    });
    ctx.restore();

    entities.forEach(e => {
        if (e instanceof Building && e.alive) {
            let sx = e.x - camera.x;
            let sy = e.y - camera.y;
            ctx.save();
            ctx.beginPath();
            ctx.arc(sx, sy, e.attackRange, 0, Math.PI * 2);
            ctx.fillStyle = e.team === 'blue' ? 'rgba(0, 210, 255, 0.05)' : 'rgba(255, 68, 68, 0.05)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = e.team === 'blue' ? 'rgba(0, 210, 255, 0.4)' : 'rgba(255, 68, 68, 0.4)';
            ctx.setLineDash([8, 8]);
            ctx.stroke();
            ctx.restore();
        }
    });

    attackEffects.forEach((eff, idx) => {
        eff.life -= 1 / 60;
        if (eff.isLaser) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(eff.startX - camera.x, eff.startY - camera.y);
            ctx.lineTo(eff.x - camera.x, eff.y - camera.y);
            ctx.strokeStyle = eff.color;
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();
        }
        if (eff.life <= 0) attackEffects.splice(idx, 1);
    });

    entities.forEach(e => {
        if (!e.alive) return;
        let sx = e.x - camera.x;
        let sy = e.y - camera.y;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
        
        if (e instanceof Building) {
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
        } else if (e instanceof Minion) {
            ctx.fillStyle = e.team === 'blue' ? '#4dabf7' : '#ff6b6b';
        } else {
            ctx.fillStyle = e.team === 'blue' ? '#2e86de' : '#ee5253';
        }
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        if (e instanceof Building) {
            ctx.font = '22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(e.type === 'core' ? '🏰' : '🗼', sx, sy);
        }
        ctx.restore();

        let barW = e instanceof Building ? 70 : 50, barH = 6;
        let barX = sx - barW / 2;
        let barY = sy - e.radius - 24;
        
        if (e instanceof Hero) {
            ctx.save();
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
            let heroInfo = HERO_DB[e.heroKey];
            let nameStr = heroInfo ? heroInfo.name : '英雄';
            ctx.fillText(`${nameStr} Lv.${e.level || 1}`, sx, barY - 4);
            ctx.restore();
        }

        let maxHp = e.maxHp;
        let hpRatio = Math.max(0, Math.min(1, e.hp / maxHp));
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX, barY, barW, barH);
        
        ctx.fillStyle = e.team === 'blue' ? '#00e676' : '#ff3366';
        ctx.fillRect(barX, barY, barW * hpRatio, barH);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.lineWidth = 1.5;
        if (maxHp > 1000) {
            let segments = Math.round(maxHp / 1000);
            for (let s = 1; s < segments; s++) {
                let ratio = (s * 1000) / maxHp;
                if (ratio > 0 && ratio < 1) {
                    let tickX = barX + barW * ratio;
                    ctx.beginPath();
                    ctx.moveTo(tickX, barY);
                    ctx.lineTo(tickX, barY + barH);
                    ctx.stroke();
                }
            }
        }

        let currentBottomY = barY + barH;

        if (e instanceof Hero && e.heroKey === 'valhein') {
            let passiveBarY = currentBottomY + 2;
            let passiveBarH = 4;
            let totalSlots = 4;
            let slotW = (barW - (totalSlots - 1) * 2) / totalSlots;

            for (let i = 0; i < totalSlots; i++) {
                let slotX = barX + i * (slotW + 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);

                if (i < e.valheinPassiveStacks) {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                }
            }
            currentBottomY = passiveBarY + passiveBarH;
        }

        if (e instanceof Hero) {
            let expBarY = currentBottomY + 2;
            let expBarH = 3;
            let reqExp = LEVEL_EXP_TABLE[e.level] || 150;
            let expRatio = Math.min(1, e.exp / reqExp);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(barX, expBarY, barW, expBarH);

            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(barX, expBarY, barW * expRatio, expBarH);
        }
    });

    skillEffects.forEach((eff, idx) => {
        eff.life -= 1 / 60;
        let sx = eff.x - camera.x;
        let sy = eff.y - camera.y;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, eff.size, 0, Math.PI * 2);
        ctx.fillStyle = eff.color || 'rgba(0, 210, 255, 0.5)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.restore();

        if (eff.life <= 0) skillEffects.splice(idx, 1);
    });

    damageTexts.forEach((d, idx) => {
        d.y -= 0.6; d.life -= 1 / 60;
        ctx.save();
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = d.color;
        ctx.textAlign = 'center';
        ctx.fillText(d.value, d.x - camera.x, d.y - camera.y);
        ctx.restore();
        if (d.life <= 0) damageTexts.splice(idx, 1);
    });

    updateSkillUI();
    requestAnimationFrame(gameLoop);
}
</script>
