    document.getElementById('hud-layer').classList.add('hidden');
    document.getElementById('top-hud').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function backToMenuFromPick() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function updateTopScopeUI() {
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;
    document.getElementById('level-display').innerText = `Lv.${player ? player.level : 1}`;
    document.getElementById('gold-display').innerText = `🪙 ${Math.floor(player ? player.gold : currentUserData.gold)}`;

    let chOverlay = document.getElementById('cd-challenger');
    if (challengerCooldown > 0) { 
        chOverlay.classList.remove('hidden'); 
        chOverlay.innerText = Math.ceil(challengerCooldown); 
    } else { 
        chOverlay.classList.add('hidden'); 
    }

    for (let id = 1; id <= 3; id++) {
        let btn = document.getElementById(`skill-${id}`);
        let upBtn = document.getElementById(`up-btn-${id}`);
        let cdOverlay = document.getElementById(`cd-${id}`);
        let sLv = skillLevels[id];

        if (checkCanUpgrade(id)) {
            upBtn.classList.remove('hidden');
        } else {
            upBtn.classList.add('hidden');
        }

        let isNakrothS2nd = (player && player.heroKey === 'nakroth' && id === 1 && nakrothS1Stage === 2);
        let isRyomaS2nd = (player && player.heroKey === 'ryoma' && id === 1 && ryomaS1Stage === 2);

        if (sLv === 0 && !isNakrothS2nd && !isRyomaS2nd) {
            btn.classList.add('locked');
            cdOverlay.classList.remove('hidden');
            cdOverlay.innerText = '未解鎖';
        } else {
            btn.classList.remove('locked');
            if (isNakrothS2nd || isRyomaS2nd) { 
                cdOverlay.classList.remove('hidden'); 
                cdOverlay.innerText = '2段'; 
            }
            else if (skillCooldowns[id] > 0) { 
                cdOverlay.classList.remove('hidden'); 
                cdOverlay.innerText = skillCooldowns[id].toFixed(1); 
            }
            else { 
                cdOverlay.classList.add('hidden'); 
            }
        }

        let maxCap = (id === 3) ? 3 : 6;
        let descLabel = document.getElementById(`lbl-skill-${id}`);
        if (descLabel && selectedHeroKey) {
            let heroInfo = HERO_DB[selectedHeroKey];
            let baseName = id === 1 ? heroInfo.s1 : (id === 2 ? heroInfo.s2 : heroInfo.s3);
            descLabel.innerText = `${baseName} Lv.${sLv}/${maxCap}`;
        }
    }
}

function renderFastBuy() {
    let container = document.getElementById('fast-buy-list');
    container.innerHTML = '';
    ITEMS_DB.forEach(item => {
        if (player && player.gold >= item.cost) {
            let div = document.createElement('div');
            div.className = 'fast-buy-item';
            div.innerHTML = `<b>${item.name}</b><span style="color:#ffd700;font-size:0.8rem;">🪙${item.cost}</span>`;
            div.addEventListener('click', (e) => {
                e.stopPropagation(); player.gold -= item.cost; currentUserData.gold = player.gold; saveUserData();
                player.atk += item.atk || 0; player.maxHp += item.hp || 0; player.hp = Math.min(player.maxHp, player.hp + (item.hp || 0));
                updateTopScopeUI();
            });
            container.appendChild(div);
        }
    });
}

function openHeroPick(mode) {
    gameMode = mode;
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('pick-screen').classList.remove('hidden');

    let keys = Object.keys(HERO_DB);
    randomAiKey = keys[Math.floor(Math.random() * keys.length)];
    document.getElementById('ai-opponent-slot').innerText = `電競AI對手: ${HERO_DB[randomAiKey].name}`;

    let grid = document.getElementById('hero-select-grid');
    grid.innerHTML = '';
    Object.keys(HERO_DB).forEach(key => {
        let hero = HERO_DB[key];
        let card = document.createElement('div');
        card.className = `pick-hero-thumb ${key === selectedHeroKey ? 'active' : ''}`;
        card.innerHTML = `<span style="font-size:2.2rem;">${hero.avatar}</span>`;
        card.onclick = (e) => {
            e.stopPropagation(); selectedHeroKey = key;
            document.querySelectorAll('.pick-hero-thumb').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            document.getElementById('selected-hero-name').innerText = hero.name;
            document.getElementById('selected-hero-type').innerText = hero.type;
            document.getElementById('stage-hero-avatar').innerText = hero.avatar;
        };
        grid.appendChild(card);
    });
}

function confirmStartGame() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.remove('hidden');
    document.getElementById('top-hud').classList.remove('hidden');

    blueKills = 0; redKills = 0; kills = 0; deaths = 0; assists = 0;
    hasFirstBloodOccurred = false; playerKillStreak = 0; aiKillStreak = 0;
    nakrothS1Stage = 1; ryomaS1Stage = 1; ryomaS1Timer = 0; challengerCooldown = 0; 
    skillLevels = { 1: 0, 2: 0, 3: 0 }; unallocatedPoints = 1;
    entities = []; damageTexts = [];
    
    let blueSpawn = { x: 400, y: MAP_SIZE - 400 };
    let redSpawn = { x: MAP_SIZE - 400, y: 400 };

    entities.push(new Fountain(blueSpawn.x, blueSpawn.y, 'blue'));
    entities.push(new Fountain(redSpawn.x, redSpawn.y, 'red'));

    player = new Hero(blueSpawn.x, blueSpawn.y, 'blue', selectedHeroKey, true);
    player.gold = currentUserData.gold;
    entities.push(player);

    entities.push(new Hero(redSpawn.x, redSpawn.y, 'red', randomAiKey, false));

    entities.push(new NexusBase(600, MAP_SIZE - 600, 'blue'));
    entities.push(new NexusBase(MAP_SIZE - 600, 600, 'red'));

    let bTurret = clampPosition(1050, MAP_SIZE - 1050, 35);
    let rTurret = clampPosition(MAP_SIZE - 1050, 1050, 35);
    entities.push(new Turret(bTurret.x, bTurret.y, 'blue'));
    entities.push(new Turret(rTurret.x, rTurret.y, 'red'));

    let heroInfo = HERO_DB[selectedHeroKey];
    document.getElementById('lbl-skill-1').innerText = heroInfo.s1;
    document.getElementById('lbl-skill-2').innerText = heroInfo.s2;
    document.getElementById('lbl-skill-3').innerText = heroInfo.s3;

    spawnMinionWave();
    isRunning = true;
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    if (!isRunning) return;

    if (player && player.heroKey === 'ryoma' && ryomaS1Stage === 2) {
        ryomaS1Timer -= 1/60;
        if (ryomaS1Timer <= 0) {
            ryomaS1Stage = 1;
            let stats = getSkillStats(1, 220, skillMaxCDs[1]);
            skillCooldowns[1] = stats.cd;
        }
    }

    for (let id in skillCooldowns) {
        if (skillCooldowns[id] > 0) { skillCooldowns[id] -= 1/60; if (skillCooldowns[id] < 0) skillCooldowns[id] = 0; }
    }
    if (challengerCooldown > 0) { challengerCooldown -= 1/60; if (challengerCooldown < 0) challengerCooldown = 0; }
    updateTopScopeUI();

    if (player) {
        player.update();
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
    }

    ctx.fillStyle = '#070d14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1e2d3d'; ctx.lineWidth = ROAD_WIDTH;
    ctx.beginPath();
    ctx.moveTo(400 - camera.x, MAP_SIZE - 400 - camera.y);
    ctx.lineTo(MAP_SIZE - 400 - camera.x, 400 - camera.y);
    ctx.stroke();

    entities.forEach(e => { if (e.update) e.update(); e.draw(ctx); });

    minionSpawnTimer += 1/60;
    if (minionSpawnTimer >= 15) { spawnMinionWave(); minionSpawnTimer = 0; }

    if (activeSkillDrag && player && player.alive) {
        let pX = player.x - camera.x, pY = player.y - camera.y;
        let dirX = activeSkillDrag.dirX, dirY = activeSkillDrag.dirY;

        let distMult = 1.8;
        if (player.heroKey === 'krixi' && activeSkillDrag.skillId === 2) distMult = 5.5;
        if (player.heroKey === 'alice' && activeSkillDrag.skillId === 1) distMult = 6.0;
        if (player.heroKey === 'alice' && activeSkillDrag.skillId === 3) distMult = 6.5;

        let dist = Math.max(80, activeSkillDrag.dragDist * distMult);
        let targetX = pX + dirX * dist;
        let targetY = pY + dirY * dist;

        ctx.save();
        if (player.heroKey === 'nakroth' && activeSkillDrag.skillId === 1) {
            let longDist = Math.max(120, activeSkillDrag.dragDist * 4.5);
            let lTargetX = pX + dirX * longDist;
            let lTargetY = pY + dirY * longDist;
            ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(lTargetX, lTargetY);
            ctx.strokeStyle = 'rgba(142, 68, 173, 0.6)'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(lTargetX, lTargetY, 65, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(142, 68, 173, 0.25)'; ctx.fill();
            ctx.strokeStyle = '#d7bde2'; ctx.lineWidth = 2.5; ctx.stroke();
        } else if (player.heroKey === 'nakroth' && activeSkillDrag.skillId === 2) {
            let backX = pX - dirX * dist;
            let backY = pY - dirY * dist;
            ctx.beginPath(); ctx.setLineDash([6, 6]);
            ctx.moveTo(pX, pY); ctx.lineTo(backX, backY);
            ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(backX, backY, 28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.25)'; ctx.fill();
            ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.stroke();
        } else if (player.heroKey === 'ryoma' && activeSkillDrag.skillId === 1) {
            if (ryomaS1Stage === 1) {
                let backX = pX - dirX * dist;
                let backY = pY - dirY * dist;
                ctx.beginPath(); ctx.setLineDash([6, 6]);
                ctx.moveTo(pX, pY); ctx.lineTo(backX, backY);
                ctx.strokeStyle = '#81c784'; ctx.lineWidth = 3; ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath(); ctx.arc(backX, backY, 30, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(129, 199, 132, 0.25)'; ctx.fill();
                ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2; ctx.stroke();
            } else {
                let forwardX = pX + dirX * (dist * 1.5);
                let forwardY = pY + dirY * (dist * 1.5);
                ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(forwardX, forwardY);
                ctx.strokeStyle = '#00e676'; ctx.lineWidth = 4; ctx.stroke();
                ctx.beginPath(); ctx.arc(forwardX, forwardY, 40, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 230, 118, 0.3)'; ctx.fill();
                ctx.strokeStyle = '#b9f6ca'; ctx.lineWidth = 2; ctx.stroke();
            }
        } else if (player.heroKey === 'ryoma' && activeSkillDrag.skillId === 2) {
            let angle = Math.atan2(dirY, dirX);
            ctx.translate(pX, pY);
            ctx.rotate(angle);
            ctx.fillStyle = 'rgba(46, 125, 50, 0.25)';
            ctx.fillRect(0, -30, 320, 60);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.35)';
            ctx.fillRect(180, -30, 140, 60);
            ctx.strokeStyle = '#a5d6a7';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, -30, 320, 60);
        } else {
            ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(targetX, targetY);
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.7)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(targetX, targetY, 45, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 210, 255, 0.2)'; ctx.fill();
            ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
    }

    for (let i = attackEffects.length - 1; i >= 0; i--) {
        let af = attackEffects[i]; af.life -= 0.05;
        ctx.beginPath(); ctx.arc(af.x - camera.x, af.y - camera.y, af.radius, 0, Math.PI * 2);
        ctx.strokeStyle = af.color || 'rgba(255, 235, 59, 0.8)'; ctx.lineWidth = 3; ctx.stroke();
        if (af.life <= 0) attackEffects.splice(i, 1);
    }

    for (let i = skillEffects.length - 1; i >= 0; i--) {
        let fx = skillEffects[i];
        
        if (fx.isRyomaS2) {
            let angle = Math.atan2(fx.dirY, fx.dirX);
            ctx.save();
            ctx.translate(fx.x - camera.x, fx.y - camera.y);
            ctx.rotate(angle);
            
            ctx.fillStyle = fx.color;
            ctx.fillRect(0, -fx.width / 2, fx.length, fx.width);
            
            ctx.fillStyle = 'rgba(255, 215, 0, 0.45)';
            ctx.fillRect(fx.tipStart, -fx.width / 2, fx.length - fx.tipStart, fx.width);

            ctx.strokeStyle = '#a5d6a7';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, -fx.width / 2, fx.length, fx.width);
            ctx.restore();

            if (fx.dmg > 0) {
                entities.forEach(e => {
                    let isBuilding = (e instanceof Turret || e instanceof NexusBase);
                    if (e.alive && e.team !== fx.team && !isBuilding) {
                        let dx = e.x - fx.x;
                        let dy = e.y - fx.y;
                        let localX = dx * fx.dirX + dy * fx.dirY;
                        let localY = -dx * fx.dirY + dy * fx.dirX;

                        if (localX >= 0 && localX <= fx.length && Math.abs(localY) <= fx.width / 2 + e.radius) {
                            let isTip = (localX >= fx.tipStart); 
                            let finalDmg = fx.dmg + (isTip ? fx.tipDmgBonus : 0);
                            
                            let isMagic = (player && player.heroKey === 'krixi');
                            let dmgType = isMagic ? 'magic' : 'physical';
                            e.takeDamage(finalDmg, fx.team, dmgType);
                            
                            if (isTip && e instanceof Hero) {
                                e.applyStun(1.2, '💫 槍尖暈眩');
                            }
                        }
                    }
                });
                fx.dmg = 0; 
            }
        } else {
            if (fx.isKrixiS1) {
                if (!fx.isReturning) {
                    fx.x += fx.dirX * fx.speed;
                    fx.y += fx.dirY * fx.speed;
                    fx.traveled += fx.speed;
                    if (fx.traveled >= fx.maxDist) {
                        fx.isReturning = true;
                        fx.hitEntities.clear();
                    }
                } else {
                    if (player && player.alive) {
                        let dx = player.x - fx.x;
                        let dy = player.y - fx.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist > 15) {
                            fx.dirX = dx / dist;
                            fx.dirY = dy / dist;
                            fx.x += fx.dirX * fx.speed;
                            fx.y += fx.dirY * fx.speed;
                        } else {
                            fx.life = 0;
                        }
                    } else {
                        fx.life = 0;
                    }
                }
            } else {
                fx.x += fx.dirX * fx.speed;
                fx.y += fx.dirY * fx.speed;
            }

            ctx.beginPath(); ctx.arc(fx.x - camera.x, fx.y - camera.y, fx.size, 0, Math.PI * 2);
            ctx.fillStyle = fx.color; ctx.fill();

            if (fx.dmg > 0) {
                entities.forEach(e => {
                    let isBuilding = (e instanceof Turret || e instanceof NexusBase);
                    if (e.alive && e.team !== fx.team && !isBuilding && Math.hypot(e.x - fx.x, e.y - fx.y) < fx.size + 10) {
                        let isMagic = (player && (player.heroKey === 'krixi' || player.heroKey === 'alice' || fx.dmgType === 'magic'));
                        let dmgType = isMagic ? 'magic' : 'physical';

                        if (fx.isKrixiS1) {
                            if (!fx.hitEntities.has(e)) {
                                e.takeDamage(fx.dmg, fx.team, dmgType);
                                fx.hitEntities.add(e);
                            }
                        } else {
                            e.takeDamage(fx.dmg, fx.team, dmgType);
                            if (fx.isStun && e instanceof Hero) {
                                e.applyStun(fx.stunDuration, fx.stunLabel || '💫 暈眩');
                            }
                            if (fx.isRyomaS3 && fx.team === player.team) {
                                if (skillCooldowns[2] > 0) {
                                    skillCooldowns[2] = Math.max(0, skillCooldowns[2] - 1.0);
                                }
                            }
                        }
                    }
                });
            }
        }

        fx.life -= 0.025;
        if (fx.life <= 0) skillEffects.splice(i, 1);
    }

    for (let i = damageTexts.length - 1; i >= 0; i--) {
        let dt = damageTexts[i];
        dt.y -= 0.6;
        dt.life -= 1 / 60;
        let alpha = Math.max(0, dt.life / 2.0);

        ctx.save();
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = dt.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
        
        let displayStr = typeof dt.value === 'number' ? `-${Math.round(dt.value)}` : dt.value;
        ctx.strokeText(displayStr, dt.x - camera.x, dt.y - camera.y);
        ctx.fillText(displayStr, dt.x - camera.x, dt.y - camera.y);
        ctx.restore();

        if (dt.life <= 0) damageTexts.splice(i, 1);
    }

    renderFastBuy();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
