<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #070d14; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; pointer-events: auto; padding: 15px; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #fff; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }
        .res-item { display: flex; align-items: center; gap: 5px; }
        .res-gold { color: #f3c654; }

        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px 0; position: relative; }
        .hero-heroine-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0.85; }
        .heroine-avatar { font-size: 9rem; text-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }

        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 10px 5px 10px; }
        .bottom-nav { display: flex; gap: 12px; background: rgba(6, 14, 26, 0.85); padding: 8px 18px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .nav-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: #94a3b8; cursor: pointer; }
        .nav-btn.active { color: #fff; }

        .start-group { display: flex; align-items: flex-end; gap: 15px; }
        .mode-select-btn { background: rgba(13, 27, 46, 0.9); border: 1px solid #00d2ff; border-radius: 50%; width: 55px; height: 55px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0,210,255,0.3); }
        .mode-select-btn .icon { font-size: 1.2rem; }
        .mode-select-btn .label { font-size: 0.65rem; color: #00d2ff; font-weight: bold; margin-top: 2px; }

        .start-match-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%); border: 2px solid #fef08a; width: 170px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 20px; z-index: 20; font-size: 1rem; font-weight: bold; pointer-events: none; }
        .score-blue { color: #00d2ff; }
        .score-red { color: #ff4444; }
        .game-time-text { color: #00e676; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; font-variant-numeric: tabular-nums; }
        .gold-text { color: #ffd700; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .kda-text { color: #ffeb3b; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .level-text { color: #00e676; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; }

        .announcement-banner { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(13, 27, 46, 0.85) 50%, rgba(0,0,0,0) 100%); padding: 8px 40px; border-top: 1px solid #ffd700; border-bottom: 1px solid #ffd700; z-index: 100; pointer-events: none; text-align: center; transition: opacity 0.3s ease; }
        .announcement-text { font-size: 1.4rem; font-weight: 900; font-style: italic; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 69, 0, 0.6); letter-spacing: 2px; }

        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #hud-layer * { pointer-events: auto; }

        .joystick-container { position: absolute; bottom: 25px; left: 25px; width: 125px; height: 125px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(243, 198, 84, 0.85); border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none; }

        .fast-buy-container { position: absolute; top: 80px; left: 15px; display: flex; flex-direction: column; gap: 10px; width: 110px; z-index: 50; }
        .fast-buy-item { background: rgba(12, 20, 31, 0.95); border: 1px solid #f3c654; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }

        .controls-right { position: absolute; bottom: 15px; right: 20px; width: 280px; height: 180px; pointer-events: none; }
        .attack-btn { position: absolute; bottom: 5px; right: 5px; width: 78px; height: 78px; background: radial-gradient(circle, #f3c654 0%, #8f5c0a 100%); border: 3px solid #ffe596; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #fff; cursor: pointer; pointer-events: auto; }
        
        .bottom-actions-bar { position: absolute; bottom: 10px; right: 95px; display: flex; gap: 8px; pointer-events: auto; }
        .action-mini-btn { width: 44px; height: 44px; background: radial-gradient(circle, #263238 0%, #0d1b2a 100%); border: 2px solid #f3c654; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.85rem; font-weight: bold; color: #fff; cursor: pointer; position: relative; }
        .action-mini-btn .label { position: absolute; bottom: -16px; font-size: 0.55rem; color: #ffeb3b; font-weight: bold; white-space: nowrap; }

        .skill-btn { position: absolute; width: 62px; height: 62px; background: rgba(15, 25, 40, 0.9); border: 2px solid #00aaff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto; touch-action: none; }
        .skill-btn.locked { border-color: #555; opacity: 0.5; filter: grayscale(1); }
        .skill-desc-label { position: absolute; bottom: -18px; width: 90px; text-align: center; font-size: 0.6rem; color: #ffeb3b; font-weight: bold; pointer-events: none; white-space: nowrap; }
        .skill-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-upgrade-btn {
            position: absolute; top: -8px; right: -8px; width: 28px; height: 28px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8f00 100%);
            border: 2px solid #fff; border-radius: 50%; color: #000;
            font-size: 1.1rem; font-weight: 900; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 12px rgba(255, 215, 0, 0.9); z-index: 60;
            animation: pulse-upgrade 0.8s infinite alternate;
        }
        @keyframes pulse-upgrade {
            0% { transform: scale(0.95); box-shadow: 0 0 6px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.15); box-shadow: 0 0 16px rgba(255, 215, 0, 1); }
        }

        #skill-3 { bottom: 105px; right: 10px; border-color: #e040fb; }
        #skill-2 { bottom: 65px; right: 85px; border-color: #00e676; }
        #skill-1 { bottom: 5px; right: 155px; border-color: #ff9100; }

        .pick-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070d18; z-index: 150; display: flex; flex-direction: column; padding: 15px; }
        .pick-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .pick-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 1rem; color: #888; }
        .pick-tabs .active { color: #f3c654; border-bottom: 2px solid #f3c654; }
        .pick-cancel-btn { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; }
        
        .pick-content-layout { display: flex; flex: 1; margin-top: 15px; gap: 20px; overflow: hidden; }
        .pick-hero-sidebar { width: 190px; height: 100%; max-height: 380px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; overflow-y: auto; padding-right: 5px; scrollbar-width: thin; scrollbar-color: #f3c654 rgba(0,0,0,0.3); }
        .pick-hero-sidebar::-webkit-scrollbar { width: 6px; }
        .pick-hero-sidebar::-webkit-scrollbar-thumb { background-color: #f3c654; border-radius: 3px; }

        .pick-hero-thumb { width: 75px; height: 75px; background: #1a2a40; border: 2px solid #334455; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; }
        .pick-hero-thumb.active { border-color: #f3c654; box-shadow: 0 0 10px rgba(243, 198, 84, 0.6); }

        .pick-center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(30,50,80,0.3) 0%, rgba(5,10,18,0.8) 100%); border-radius: 12px; }
        .stage-hero-avatar { font-size: 10rem; }
        
        .pick-right-sidebar { width: 220px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        .team-slot { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 0.9rem; color: #aaa; }
        
        .pick-confirm-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: 2px solid #fef08a; color: #fff; font-weight: bold; font-size: 1.2rem; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }

        .result-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 10, 18, 0.9); z-index: 200; }
        .result-box { background: rgba(13, 23, 38, 0.95); border: 2px solid #f3c654; border-radius: 15px; padding: 30px; text-align: center; width: 85%; max-width: 420px; }
        .result-title-win { font-size: 3rem; font-weight: 900; color: #ffd700; }
        .result-title-lose { font-size: 3rem; font-weight: 900; color: #ff3366; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="top-hud" class="top-score-bar hidden">
        <span class="level-text" id="level-display">Lv.1</span>
        <span class="score-blue" id="score-blue">0</span>
        <span>VS</span>
        <span class="score-red" id="score-red">0</span>
        <span class="game-time-text" id="game-time-display">⏱️ 00:00</span>
        <span class="gold-text" id="gold-display">🪙 300</span>
        <span class="kda-text" id="kda-display">KDA: 0 / 0 / 0</span>
    </div>

    <div id="announcement-banner" class="announcement-banner hidden">
        <div id="announcement-text" class="announcement-text">FIRST BLOOD</div>
    </div>

    <div id="result-screen" class="result-overlay hidden">
        <div class="result-box">
            <div id="result-title" class="result-title-win">VICTORY</div>
            <p id="result-subtitle" style="color: #aaa; margin-bottom: 20px;">成功摧毀敵方主堡！</p>
            <button class="pick-confirm-btn" style="width:100%;" id="btn-back-lobby">返回遊戲大廳</button>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <div class="top-navbar">
            <div class="profile-area">
                <div id="user-profile" class="user-profile-box">
                    <img id="user-avatar" class="user-avatar" src="https://via.placeholder.com/32" alt="Avatar">
                    <span id="user-name" class="user-name">訪客玩家</span>
                </div>
            </div>

            <div class="resource-group">
                <div class="res-item res-gold" id="header-gold">🟡 300</div>
            </div>
        </div>

        <div class="main-content">
            <div class="hero-heroine-bg">
                <div class="heroine-avatar">🗡️</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-nav">
                <div class="nav-btn active">🛡️ 英雄對戰</div>
            </div>

            <div class="start-group">
                <div class="mode-select-btn" id="btn-mode-1v1">
                    <span class="icon">⚔️</span>
                    <span class="label">1v1 單挑</span>
                </div>
                <div class="start-match-btn" id="btn-start-match">
                    <span class="start-text">START</span>
                </div>
            </div>
        </div>
    </div>

    <div id="pick-screen" class="pick-screen-overlay hidden">
        <div class="pick-top-bar">
            <div class="pick-tabs">
                <span class="active">英雄選擇</span>
            </div>
            <button class="pick-cancel-btn" id="btn-pick-back">取消 ✕</button>
        </div>

        <div class="pick-content-layout">
            <div class="pick-hero-sidebar" id="hero-select-grid"></div>

            <div class="pick-center-stage">
                <div class="stage-hero-avatar" id="stage-hero-avatar">🗡️</div>
                <div class="stage-hero-info">
                    <h2 id="selected-hero-name" style="color:#f3c654; font-size: 1.8rem;">納克羅斯</h2>
                    <p id="selected-hero-type" style="color:#aaa; font-size: 0.95rem;">刺客 / 高機動性爆發</p>
                </div>
            </div>

            <div class="pick-right-sidebar">
                <div class="team-slot"><span>我方 (你)</span><span style="color:#00d2ff;">準備就緒</span></div>
                <div class="team-slot"><span id="ai-opponent-slot">電競AI對手</span><span style="color:#ff4444;">隨機配對</span></div>
                
                <div style="background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px;">
                    <div style="font-size:0.8rem; color:#f3c654; margin-bottom:5px;">選擇挑戰者技能：</div>
                    <div style="display: flex; gap: 6px;">
                        <button class="ch-select-btn active" data-ch="blink" style="flex:1; padding:4px; background:#1a2a40; border:1px solid #f3c654; color:#fff; border-radius:4px; cursor:pointer; font-size:0.75rem;">✨ 順移</button>
                        <button class="ch-select-btn" data-ch="heal" style="flex:1; padding:4px; background:#1a2a40; border:1px solid #334455; color:#fff; border-radius:4px; cursor:pointer; font-size:0.75rem;">💚 治癒</button>
                        <button class="ch-select-btn" data-ch="execute" style="flex:1; padding:4px; background:#1a2a40; border:1px solid #334455; color:#fff; border-radius:4px; cursor:pointer; font-size:0.75rem;">⚔️ 斬殺</button>
                    </div>
                </div>

                <button class="pick-confirm-btn" id="btn-confirm-hero">確 定</button>
            </div>
        </div>
    </div>

    <div id="hud-layer" class="hidden">
        <div class="fast-buy-container" id="fast-buy-list"></div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="controls-right">
            <div class="attack-btn" id="btn-attack">⚔️</div>
            
            <div class="bottom-actions-bar">
                <div class="action-mini-btn" id="btn-recall">
                    <span>回城</span>
                </div>
                
                <div class="action-mini-btn" id="btn-heal-spell">
                    <span>💚</span>
                    <div class="label">恢復</div>
                </div>

                <div class="action-mini-btn" id="btn-challenger-spell">
                    <span id="challenger-icon">✨</span>
                    <div class="label" id="lbl-challenger">順移</div>
                    <div class="skill-cd-overlay hidden" id="cd-challenger"></div>
                </div>
            </div>

            <div class="skill-btn" id="skill-3" data-skill="3">
                <div class="skill-upgrade-btn hidden" id="up-btn-3">+</div>
                大招
                <div class="skill-desc-label" id="lbl-skill-3">絕技大招</div>
                <div class="skill-cd-overlay hidden" id="cd-3"></div>
            </div>
            <div class="skill-btn" id="skill-2" data-skill="2">
                <div class="skill-upgrade-btn hidden" id="up-btn-2">+</div>
                二技
                <div class="skill-desc-label" id="lbl-skill-2">核心技能</div>
                <div class="skill-cd-overlay hidden" id="cd-2"></div>
            </div>
            <div class="skill-btn" id="skill-1" data-skill="1">
                <div class="skill-upgrade-btn hidden" id="up-btn-1">+</div>
                一技
                <div class="skill-desc-label" id="lbl-skill-1">起手技能</div>
                <div class="skill-cd-overlay hidden" id="cd-1"></div>
            </div>
        </div>
    </div>
</div>

<script>
const LOCAL_STORAGE_KEY = 'aov_game_user_data';
let currentUserData = { userId: '', name: '訪客玩家', avatar: 'https://via.placeholder.com/32', isGuest: true, gold: 300 };

function initUserData() {
    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (saved) { try { currentUserData = JSON.parse(saved); } catch (e) {} }
    else { currentUserData.userId = 'guest_' + Math.random().toString(36).substr(2, 9); saveUserData(); }
    updateUserProfileUI();
}

function saveUserData() { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(currentUserData)); }

function updateUserProfileUI() {
    const headerGold = document.getElementById('header-gold');
    if (headerGold) headerGold.innerText = `🟡 ${Math.floor(currentUserData.gold)}`;
}

window.addEventListener('DOMContentLoaded', () => { initUserData(); });

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let MAP_SIZE = 3000;
let ROAD_WIDTH = 320; 
let isRunning = false;
let gameMode = '1v1';
let selectedHeroKey = 'quillen';
let randomAiKey = 'ryoma';
let selectedChallengerKey = 'blink';
let challengerCooldown = 0;
const CHALLENGER_MAX_CDS = { 'blink': 60, 'heal': 90, 'execute': 75 };

let gameTimeSeconds = 0;
let hasFirstBloodOccurred = false;
let playerKillStreak = 0;
let aiKillStreak = 0;
let announcementTimer = null;

// 草叢定義（位於中央牆壁兩側）
let bushes = [
    { x: MAP_SIZE / 2 - 250, y: MAP_SIZE / 2, radiusX: 110, radiusY: 70 },
    { x: MAP_SIZE / 2 + 250, y: MAP_SIZE / 2, radiusX: 110, radiusY: 70 }
];

function isInBush(x, y) {
    for (let bush of bushes) {
        let dx = x - bush.x;
        let dy = y - bush.y;
        if ((dx * dx) / (bush.radiusX * bush.radiusX) + (dy * dy) / (bush.radiusY * bush.radiusY) <= 1) {
            return true;
        }
    }
    return false;
}

function triggerAnnouncement(text, color = '#ffd700') {
    let banner = document.getElementById('announcement-banner');
    let txtEl = document.getElementById('announcement-text');
    
    txtEl.innerText = text;
    txtEl.style.color = color;
    banner.classList.remove('hidden');
    banner.style.opacity = '1';

    if (announcementTimer) clearTimeout(announcementTimer);
    
    announcementTimer = setTimeout(() => {
        banner.style.opacity = '0';
        setTimeout(() => { banner.classList.add('hidden'); }, 300);
    }, 3500);
}

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const HERO_DB = {
    'quillen': { name: '奎倫', type: '刺客 / 背刺必爆', baseHp: 4800, hpGrowth: 420, atk: 130, range: 140, avatar: '🥷', color1: '#b71c1c', color2: '#ff8a80', s1: '三段揮擊', s2: '標記突進', s3: '隱身回血' },
    'nakroth': { name: '納克羅斯', type: '刺客 / 高機動性', baseHp: 5000, hpGrowth: 450, atk: 120, range: 110, avatar: '🗡️', color1: '#8e44ad', color2: '#d7bde2', s1: '擊飛位移', s2: '強化普攻', s3: '刺刺刺亂舞' },

function castChallengerSpell() {
    challengerCooldown = CHALLENGER_MAX_CDS[selectedChallengerKey];

    if (selectedChallengerKey === 'blink') {
        let dX = joystickDir.x !== 0 ? joystickDir.x : 1;
        let dY = joystickDir.y !== 0 ? joystickDir.y : 0;
        let len = Math.hypot(dX, dY);
        if (len > 0) { dX /= len; dY /= len; } else { dX = 1; dY = 0; }

        let targetX = player.x + dX * 180;
        let targetY = player.y + dY * 180;
        player.startDash(targetX, targetY, 40);
        attackEffects.push({ x: player.x, y: player.y, life: 0.4, radius: 35, color: '#00d2ff' });
    } 
    else if (selectedChallengerKey === 'heal') {
        let healAmt = player.maxHp * 0.35;
        player.hp = Math.min(player.maxHp, player.hp + healAmt);
        attackEffects.push({ x: player.x, y: player.y, life: 0.6, radius: 55, color: '#00e676' });
    } 
    else if (selectedChallengerKey === 'execute') {
        let executedAny = false;
        entities.forEach(e => {
            if (e.alive && e.team !== player.team && e instanceof Hero && Math.hypot(e.x - player.x, e.y - player.y) <= 180) {
                let missingHp = e.maxHp - e.hp;
                let executeDmg = 400 + missingHp * 0.4;

                e.takeDamage(executeDmg, player.team, 'physical');
                attackEffects.push({ x: e.x, y: e.y, life: 0.6, radius: 65, color: '#ff1744' });
                if (wasAliveBefore && !e.alive) executedAny = true;
            }
        });
        if (executedAny) challengerCooldown *= 0.1;
    }
}

function resetJoystick(e) {

        joystickTouchId = null;

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
}

function clampPosition(x, y, radius = 26) {
    let startX = 400, startY = MAP_SIZE - 400;
    let endX = MAP_SIZE - 400, endY = 400;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;
    let vX = x - startX, vY = y - startY;
    let dot = vX * uX + vY * uY;
    dot = Math.max(0, Math.min(lineLen, dot));
    let projX = startX + uX * dot;
    let projY = startY + uY * dot;
    let dist = Math.hypot(x - projX, y - projY);
    if (dist > ROAD_WIDTH / 2 - radius) {
        let pushRatio = (ROAD_WIDTH / 2 - radius) / dist;
        x = projX + (x - projX) * pushRatio;
        y = projY + (y - projY) * pushRatio;
    }
    return { x: Math.max(radius, Math.min(MAP_SIZE - radius, x)), y: Math.max(radius, Math.min(MAP_SIZE - radius, y)) };
}

class Entity {
    constructor(x, y, team, radius = 26) {
        this.x = x; this.y = y; this.team = team; this.radius = radius;
        this.vx = 0; this.vy = 0; this.speed = 2.2;
        this.maxHp = 1000; this.hp = 1000; this.atk = 50; this.range = 100;
        this.alive = true; this.isStunned = false; this.dashTarget = null;
        this.inBush = false;
    }
    update() {
        if (!this.alive) return;
        this.inBush = isInBush(this.x, this.y);

        if (this.dashTarget) {
            let dx = this.dashTarget.x - this.x;
            let dy = this.dashTarget.y - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist < this.dashTarget.speed) {
                this.x = this.dashTarget.x;
                this.y = this.dashTarget.y;
                this.dashTarget = null;
            } else {
                this.x += (dx / dist) * this.dashTarget.speed;
                this.y += (dy / dist) * this.dashTarget.speed;
            }
            let clamped = clampPosition(this.x, this.y, this.radius);
            this.x = clamped.x; this.y = clamped.y;
            return;
        }
        if (this.isStunned) return;
    }
    startDash(toX, toY, speed = 35) {
        this.dashTarget = { x: toX, y: toY, speed: speed };
    }
    takeDamage(dmg, sourceTeam, dmgType = 'physical') {
        if (!this.alive) return;
        this.hp -= dmg;
        if (this.hp <= 0) {
            let wasAliveBefore = this.alive;
            this.hp = 0; this.alive = false;

            // 擊殺兵線或英雄經驗分配
            if (this instanceof Minion) {
                if (sourceTeam === 'blue' && player && player.alive) {
                    player.gainExpAndGold(35, 18);
                }
            }
            if (this instanceof Hero) {
                if (sourceTeam === 'blue') {
                    blueKills++;
                    if (!this.isPlayer) {
                        player.gainExpAndGold(200, 120);
                        kills++;
                        playerKillStreak++;
                        if (playerKillStreak === 1 && !hasFirstBloodOccurred) {
                            hasFirstBloodOccurred = true;
                            triggerAnnouncement('FIRST BLOOD 發生首殺！', '#ffd700');
                        } else if (playerKillStreak >= 3) {
                            triggerAnnouncement('🔥 已經連殺超神！', '#ff3366');
                        }
                    }
                } else {
                    redKills++;
                    if (this.isPlayer) {
                        deaths++;
                        playerKillStreak = 0;
                        triggerAnnouncement('YOU HAVE BEEN SLAIN 被擊殺', '#ff3366');
                    }
                }
                updateTopScopeUI();
                if (this.isPlayer) triggerDefeat();
                if (this.heroKey === 'quillen' && sourceTeam === player?.team && player?.heroKey === 'quillen') {
                    skillCooldowns[1] = 0; skillCooldowns[2] = 0; skillCooldowns[3] = 0;
                    damageTexts.push({ x: player.x, y: player.y - 70, value: 'RESET!', color: '#ffd700', life: 1.2 });
                }
            }
        }
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer = false) {
        super(x, y, team, 28);
        this.heroKey = heroKey;
        this.isPlayer = isPlayer;
        this.heroData = HERO_DB[heroKey];
        this.maxHp = this.heroData.baseHp;
        this.hp = this.maxHp;
        this.atk = this.heroData.atk;
        this.range = this.heroData.range;
        this.speed = 2.6;
        this.level = 1;
        this.exp = 0;
        this.gold = 300;
        this.items = [];
        this.isStealth = false;
        this.quillenMarked = false;
    }
    update() {
        super.update();
        if (!this.alive) return;

        if (!this.isPlayer) {
            // AI 簡單對線與殘血回溫泉邏輯
            let targetBaseX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
            let targetBaseY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
            if (this.hp < this.maxHp * 0.3) {
                let dx = targetBaseX - this.x, dy = targetBaseY - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 20) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    if (dist < 50) this.hp = Math.min(this.maxHp, this.hp + 50);
                }
            } else {
                let enemyTarget = entities.find(e => e.alive && e.team !== this.team);
                if (enemyTarget) {
                    let dx = enemyTarget.x - this.x, dy = enemyTarget.y - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > this.range) {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;
                    } else if (Math.random() < 0.05) {
                        enemyTarget.takeDamage(this.atk, this.team, 'physical');
                    }
                }
            }
            let clamped = clampPosition(this.x, this.y, this.radius);
            this.x = clamped.x; this.y = clamped.y;
        }
    }
    gainExpAndGold(expAmt, goldAmt) {
        if (!this.isPlayer) return;
        this.gold += goldAmt;
        currentUserData.gold = this.gold;
        saveUserData();

        this.exp += expAmt;
        let nextLevelExp = this.level * 100;
        while (this.exp >= nextLevelExp && this.level < 15) {
            this.exp -= nextLevelExp;
            this.level++; 
            unallocatedPoints++;
            let hpGain = this.heroData.hpGrowth || 400;
            this.maxHp += hpGain; 
            this.hp = Math.min(this.maxHp, this.hp + hpGain);
            this.atk += 10;
            triggerAnnouncement(`🎉 恭喜升到 Lv.${this.level}！`, '#00e676');
            nextLevelExp = this.level * 100;
        }
        updateTopScopeUI();
    }
}

function performAttack() {
    if (!player || !player.alive) return;
    entities.forEach(target => {
        if (!target.alive || target.team === player.team) return;
        let dist = Math.hypot(target.x - player.x, target.y - player.y);
        if (dist <= player.range + target.radius) {
            let isCrit = false;
            let finalAtk = player.atk;

            // 奎倫背刺必爆判定
            if (player.heroKey === 'quillen') {
                let toTargetX = target.x - player.x;
                let toTargetY = target.y - player.y;
                let targetFacingX = Math.cos(target.rotation || 0);
                let targetFacingY = Math.sin(target.rotation || 0);
                let dot = toTargetX * targetFacingX + toTargetY * targetFacingY;
                if (dot > 0) isCrit = true;
            }

            // 一般英雄 10% 爆擊率
            if (!isCrit && Math.random() < 0.10) isCrit = true;
            if (isCrit) finalAtk *= 2;

            target.takeDamage(finalAtk, player.team, 'physical');

            let dmgStr = isCrit ? `⭕ ${Math.floor(finalAtk)}` : `${Math.floor(finalAtk)}`;
            damageTexts.push({ x: target.x, y: target.y - 30, value: dmgStr, color: isCrit ? '#ff1744' : '#fff', life: 0.8 });

            if (player.heroKey === 'quillen' && target.quillenMarked) {
                skillCooldowns[3] = Math.max(0, skillCooldowns[3] - 1.0);
                skillCooldowns[2] = Math.max(0, skillCooldowns[2] - 0.5);
            }
        }
    });
}

function upgradeSkill(id) {
    if (unallocatedPoints > 0 && skillLevels[id] < 3) {
        skillLevels[id]++;
        unallocatedPoints--;
        document.getElementById(`up-btn-${id}`).classList.add('hidden');
    }
}

function getSkillStats(skillId, baseDmg, maxCd) {
    let sLv = skillLevels[skillId] || 1;
    return { dmg: baseDmg + (sLv - 1) * 75, cd: Math.max(2.0, maxCd - (sLv - 1) * 0.5) };
}

function castSkill(skillId, dirX, dirY, dragDist) {
    if (!player || !player.alive) return;
    skillLevels[skillId] = Math.max(1, skillLevels[skillId]);

    if (player.heroKey === 'quillen') {
        let stats = getSkillStats(skillId, skillId === 1 ? 350 : (skillId === 2 ? 300 : 0), skillMaxCDs[skillId]);
        if (skillId === 1) stats.cd = Math.max(2.0, 4.5 - (skillLevels[1] - 1) * 0.3);
        if (skillId === 2) stats.cd = Math.max(3.5, 6.0 - (skillLevels[2] - 1) * 0.5);
        if (skillId === 3) stats.cd = Math.max(9.0, 18.0 - (skillLevels[3] - 1) * 3.0);
        skillCooldowns[skillId] = stats.cd;

        if (skillId === 1) {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    skillEffects.push({ 
                        x: player.x + dirX * (40 + i * 25), y: player.y + dirY * (40 + i * 25), 
                        dirX: dirX, dirY: dirY, life: 0.25, speed: 0, size: 50, 
                        color: 'rgba(255, 82, 82, 0.6)', dmg: stats.dmg, team: player.team, dmgType: 'physical' 
                    });
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) < 70) {
                            e.takeDamage(stats.dmg, player.team, 'physical');
                        }
                    });
                }, i * 120);
            }
        } 
        else if (skillId === 2) {
            let dashDist = 140;
            let targetX = player.x + dirX * dashDist;
            let targetY = player.y + dirY * dashDist;
            let clamped = clampPosition(targetX, targetY, player.radius);
            player.startDash(clamped.x, clamped.y, 35);

            setTimeout(() => {
                entities.forEach(e => {
                    if (e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) < 75) {
                        e.quillenMarked = true;
                        setTimeout(() => { e.quillenMarked = false; }, 3000);
                        e.takeDamage(stats.dmg, player.team, 'physical');
                    }
                });
                skillEffects.push({ x: player.x, y: player.y, dirX: 0, dirY: 0, life: 0.3, speed: 0, size: 60, color: 'rgba(255, 23, 68, 0.5)', dmg: 0, team: player.team });
            }, 100);
        } 
        else if (skillId === 3) {
            let dashDist = 160;
            let targetX = player.x + dirX * dashDist;
            let targetY = player.y + dirY * dashDist;
            let clamped = clampPosition(targetX, targetY, player.radius);
            player.startDash(clamped.x, clamped.y, 40);

            player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3);
            player.isStealth = true;
            setTimeout(() => { player.isStealth = false; }, 5000);
            attackEffects.push({ x: player.x, y: player.y, life: 0.8, radius: 70, color: '#b71c1c' });
        }
    } 
    else if (player.heroKey === 'nakroth') {
        let stats = getSkillStats(skillId, skillId === 1 ? 300 : (skillId === 2 ? 260 : 150), skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;

        if (skillId === 1) {
            if (nakrothS1Stage === 1) {
                let targetX = player.x + dirX * 160;
                let targetY = player.y + dirY * 160;
                let clamped = clampPosition(targetX, targetY, player.radius);
                player.startDash(clamped.x, clamped.y, 45);
                nakrothS1Stage = 2;
                setTimeout(() => {
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) < 65) {
                            e.takeDamage(stats.dmg, player.team, 'physical');
                            e.isStunned = true;
                            setTimeout(() => { e.isStunned = false; }, 750);
                        }
                    });
                }, 100);
                setTimeout(() => { nakrothS1Stage = 1; }, 4000);
            } else {
                let targetX = player.x + dirX * 160;
                let targetY = player.y + dirY * 160;
                let clamped = clampPosition(targetX, targetY, player.radius);
                player.startDash(clamped.x, clamped.y, 45);
                nakrothS1Stage = 1;
            }
        } 
        else if (skillId === 2) {
            let targetX = player.x - dirX * 140;
            let targetY = player.y - dirY * 140;
            let clamped = clampPosition(targetX, targetY, player.radius);
            player.startDash(clamped.x, clamped.y, 40);
        } 
        else if (skillId === 3) {
            let rangeDist = 140;
            let hits = 4;
            for (let i = 0; i < hits; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    let targetX = player.x + dirX * rangeDist;
                    let targetY = player.y + dirY * rangeDist;
                    skillEffects.push({ x: targetX, y: targetY, dirX: dirX, dirY: dirY, life: 0.2, speed: 0, size: 55, color: 'rgba(142, 68, 173, 0.7)', dmg: stats.dmg, team: player.team, dmgType: 'physical' });
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) < 60) {
                            e.takeDamage(stats.dmg, player.team, 'physical');
                        }
                    });
                    attackEffects.push({ x: player.x, y: player.y, life: 0.3, radius: 45, color: '#8e44ad' });
                }, i * 120);
            }
        }
    }
    else if (player.heroKey === 'ryoma') {
        let stats = getSkillStats(skillId, skillId === 1 ? 350 : (skillId === 2 ? 450 : 200), skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;

        if (skillId === 1) {
            if (ryomaS1Stage === 1) {
                let targetX = player.x - dirX * 130;
                let targetY = player.y - dirY * 130;
                let clamped = clampPosition(targetX, targetY, player.radius);
                player.startDash(clamped.x, clamped.y, 35);
                ryomaS1Stage = 2;
                ryomaS1Timer = setTimeout(() => { ryomaS1Stage = 1; }, 4000);
            } else {
                let targetX = player.x + dirX * 140;
                let targetY = player.y + dirY * 140;
                let clamped = clampPosition(targetX, targetY, player.radius);
                player.startDash(clamped.x, clamped.y, 40);
                ryomaS1Stage = 1;
                if (ryomaS1Timer) clearTimeout(ryomaS1Timer);
            }
        } 
        else if (skillId === 2) {
            let rangeDist = 180;
            let targetX = player.x + dirX * rangeDist;
            let targetY = player.y + dirY * rangeDist;
            skillEffects.push({ x: targetX, y: targetY, dirX: dirX, dirY: dirY, life: 0.3, speed: 0, size: 45, color: 'rgba(46, 125, 50, 0.6)', dmg: stats.dmg, isStun: true, stunDuration: 0.75, stunLabel: '🎯 槍尖暈眩', team: player.team, dmgType: 'physical' });
            entities.forEach(e => {
                if (e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) < 55) {
                    e.takeDamage(stats.dmg, player.team, 'physical');
                    e.isStunned = true;
                    setTimeout(() => { e.isStunned = false; }, 750);
                }
            });
        } 
        else if (skillId === 3) {
            let rangeDist = 180;
            let hits = 4;
            for (let i = 0; i < hits; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    let targetX = player.x + dirX * rangeDist;
                    let targetY = player.y + dirY * rangeDist;
                    skillEffects.push({ x: targetX, y: targetY, dirX: dirX, dirY: dirY, life: 0.2, speed: 0, size: 50, color: 'rgba(255, 152, 0, 0.7)', dmg: stats.dmg, team: player.team, dmgType: 'physical' });
                    entities.forEach(e => {
                        if (e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) < 55) {
                            e.takeDamage(stats.dmg, player.team, 'physical');
                        }
                    });
                    let missingHp = player.maxHp - player.hp;
                    let healAmt = missingHp * 0.10;
                    player.hp = Math.min(player.maxHp, player.hp + healAmt);
                    attackEffects.push({ x: player.x, y: player.y, life: 0.4, radius: 40, color: '#00e676' });
                }, i * 150);
            }
        }
    }
}

function updateTopScopeUI() {
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    if (player) {
        document.getElementById('level-display').innerText = `Lv.${player.level}`;
        document.getElementById('gold-display').innerText = `🪙 ${Math.floor(player.gold)}`;
        document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;
    }
}

function openHeroPick(mode) {
    gameMode = mode;
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('pick-screen').classList.remove('hidden');
    renderHeroSelectGrid();
    updateHeroStageInfo();
}

function renderHeroSelectGrid() {
    const grid = document.getElementById('hero-select-grid');
    grid.innerHTML = '';
    Object.keys(HERO_DB).forEach(key => {
        let hero = HERO_DB[key];
        let thumb = document.createElement('div');
        thumb.className = `pick-hero-thumb ${selectedHeroKey === key ? 'active' : ''}`;
        thumb.innerText = hero.avatar;
        thumb.onclick = () => { selectedHeroKey = key; renderHeroSelectGrid(); updateHeroStageInfo(); };
        grid.appendChild(thumb);
    });
}

function updateHeroStageInfo() {
    let hero = HERO_DB[selectedHeroKey];
    document.getElementById('stage-hero-avatar').innerText = hero.avatar;
    document.getElementById('selected-hero-name').innerText = hero.name;
    document.getElementById('selected-hero-type').innerText = hero.type;
}

function confirmStartGame() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.remove('hidden');
    document.getElementById('top-hud').classList.remove('hidden');
    initGameMatch();
}

function backToMenuFromPick() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
}

function backToLobby() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
    isRunning = false;
}

function triggerDefeat() {
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('result-title').innerText = 'DEFEAT';
    document.getElementById('result-title').className = 'result-title-lose';
    document.getElementById('result-subtitle').innerText = '主堡已被摧毀';
    isRunning = false;
}

function initGameMatch() {
    entities = [];
    skillEffects = [];
    attackEffects = [];
    damageTexts = [];
    blueKills = 0; redKills = 0; kills = 0; deaths = 0; assists = 0;
    gameTimeSeconds = 0;
    hasFirstBloodOccurred = false;
    playerKillStreak = 0;
    aiKillStreak = 0;
    unallocatedPoints = 0;
    skillLevels = { 1: 0, 2: 0, 3: 0 };
    skillCooldowns = { 1: 0, 2: 0, 3: 0 };

    player = new Hero(400, MAP_SIZE - 400, 'blue', selectedHeroKey, true);
    entities.push(player);

    let aiKeys = Object.keys(HERO_DB).filter(k => k !== selectedHeroKey);
    randomAiKey = aiKeys[Math.floor(Math.random() * aiKeys.length)];
    let aiHero = new Hero(MAP_SIZE - 400, 400, 'red', randomAiKey, false);
    entities.push(aiHero);
    document.getElementById('ai-opponent-slot').innerText = aiHero.heroData.name;

    entities.push(new Tower(300, MAP_SIZE - 300, 'blue'));
    entities.push(new Tower(MAP_SIZE - 300, 300, 'red'));

    isRunning = true;
    requestAnimationFrame(gameLoop);

    setInterval(() => {
        if (!isRunning) return;
        gameTimeSeconds++;
        let mins = Math.floor(gameTimeSeconds / 60).toString().padStart(2, '0');
        let secs = (gameTimeSeconds % 60).toString().padStart(2, '0');
        document.getElementById('game-time-display').innerText = `⏱️ ${mins}:${secs}`;
    }, 1000);

    setInterval(() => {
        if (!isRunning) return;
        entities.push(new Minion(400, MAP_SIZE - 500, 'blue'));
        entities.push(new Minion(MAP_SIZE - 400, 500, 'red'));
    }, 12000);
}

function gameLoop() {
    if (!isRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (player && player.alive) {
        let targetVx = joystickDir.x * player.speed;
        let targetVy = joystickDir.y * player.speed;
        player.x += targetVx;
        player.y += targetVy;
        let clamped = clampPosition(player.x, player.y, player.radius);
        player.x = clamped.x; player.y = clamped.y;
    }

    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;
    camera.x = Math.max(0, Math.min(MAP_SIZE - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(MAP_SIZE - canvas.height, camera.y));

    // 繪製道路
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(400 - camera.x, MAP_SIZE - 400 - camera.y);
    ctx.lineTo(MAP_SIZE - 400 - camera.x, 400 - camera.y);
    ctx.lineWidth = ROAD_WIDTH;
    ctx.strokeStyle = '#122033';
    ctx.stroke();
    ctx.restore();

    // 繪製草叢
    bushes.forEach(bush => {
        let sx = bush.x - camera.x, sy = bush.y - camera.y;
        ctx.beginPath();
        ctx.ellipse(sx, sy, bush.radiusX, bush.radiusY, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 125, 50, 0.45)';
        ctx.fill();
        ctx.strokeStyle = '#81c784';
        ctx.lineWidth = 2;
        ctx.stroke();
    });

    entities.forEach(e => e.update());

    // 繪製實體
    entities.forEach(entity => {
        if (!entity.alive) return;
        let sx = entity.x - camera.x;
        let sy = entity.y - camera.y;

        ctx.save();
        if (entity.inBush && entity !== player) ctx.globalAlpha = 0.35;

        ctx.beginPath();
        ctx.arc(sx, sy, entity.radius, 0, Math.PI * 2);
        ctx.fillStyle = entity.team === 'blue' ? '#00d2ff' : '#ff4444';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        if (entity instanceof Hero) {
            ctx.font = '22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(entity.heroData.avatar, sx, sy);

            // 奎倫標記頭頂顯示
            if (entity.quillenMarked) {
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#ff1744';
                ctx.fillText('🎯 標記', sx, sy - entity.radius - 22);
            }
        }

        // 血條
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(sx - 24, sy - entity.radius - 12, 48, 6);
        ctx.fillStyle = entity.team === 'blue' ? '#00e676' : '#ff1744';
        ctx.fillRect(sx - 24, sy - entity.radius - 12, 48 * (entity.hp / entity.maxHp), 6);
        ctx.restore();
    });

    // 技能與特效
    skillEffects.forEach((fx, idx) => {
        fx.life -= 0.03;
        let sx = fx.x - camera.x, sy = fx.y - camera.y;
        ctx.beginPath();
        ctx.arc(sx, sy, fx.size, 0, Math.PI * 2);
        ctx.fillStyle = fx.color;
        ctx.fill();
        if (fx.life <= 0) skillEffects.splice(idx, 1);
    });

    damageTexts.forEach((dt, idx) => {
        dt.life -= 0.03;
        dt.y -= 0.8;
        let sx = dt.x - camera.x, sy = dt.y - camera.y;
        ctx.save();
        ctx.font = 'bold 16px Arial';
        ctx.fillStyle = dt.color;
        ctx.textAlign = 'center';
        ctx.fillText(dt.value, sx, sy);
        ctx.restore();
        if (dt.life <= 0) damageTexts.splice(idx, 1);
    });

    // 冷卻與點數按鈕狀態更新
    [1, 2, 3].forEach(id => {
        if (skillCooldowns[id] > 0) {
            skillCooldowns[id] -= 0.016;
            let cdEl = document.getElementById(`cd-${id}`);
            cdEl.classList.remove('hidden');
            cdEl.innerText = Math.ceil(skillCooldowns[id]);
        } else {
            document.getElementById(`cd-${id}`).classList.add('hidden');
        }

        let upBtn = document.getElementById(`up-btn-${id}`);
        if (unallocatedPoints > 0 && skillLevels[id] < 3) upBtn.classList.remove('hidden');
        else upBtn.classList.add('hidden');
    });

    if (challengerCooldown > 0) {
        challengerCooldown -= 0.016;
        let cdEl = document.getElementById('cd-challenger');
        cdEl.classList.remove('hidden');
        cdEl.innerText = Math.ceil(challengerCooldown);
    } else {
        document.getElementById('cd-challenger').classList.add('hidden');
    }

    requestAnimationFrame(gameLoop);
}
</script>
