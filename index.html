<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #070d14; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; pointer-events: auto; padding: 15px; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #fff; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }
        .res-item { display: flex; align-items: center; gap: 5px; }
        .res-gold { color: #f3c654; }

        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px 0; position: relative; }
        .hero-heroine-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0.85; }
        .heroine-avatar { font-size: 9rem; text-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }

        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 10px 5px 10px; }
        .bottom-nav { display: flex; gap: 12px; background: rgba(6, 14, 26, 0.85); padding: 8px 18px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .nav-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: #94a3b8; cursor: pointer; }
        .nav-btn.active { color: #fff; }

        .start-group { display: flex; align-items: flex-end; gap: 15px; }
        .mode-select-btn { background: rgba(13, 27, 46, 0.9); border: 1px solid #00d2ff; border-radius: 50%; width: 55px; height: 55px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0,210,255,0.3); }
        .mode-select-btn .icon { font-size: 1.2rem; }
        .mode-select-btn .label { font-size: 0.65rem; color: #00d2ff; font-weight: bold; margin-top: 2px; }

        .start-match-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%); border: 2px solid #fef08a; width: 170px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 20px; z-index: 20; font-size: 1rem; font-weight: bold; pointer-events: none; }
        .score-blue { color: #00d2ff; }
        .score-red { color: #ff4444; }
        .gold-text { color: #ffd700; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .kda-text { color: #ffeb3b; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .level-text { color: #00e676; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; }

        .announcement-banner { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(13, 27, 46, 0.85) 50%, rgba(0,0,0,0) 100%); padding: 8px 40px; border-top: 1px solid #ffd700; border-bottom: 1px solid #ffd700; z-index: 100; pointer-events: none; text-align: center; transition: opacity 0.3s ease; }
        .announcement-text { font-size: 1.4rem; font-weight: 900; font-style: italic; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 69, 0, 0.6); letter-spacing: 2px; }

        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #hud-layer * { pointer-events: auto; }

        .joystick-container { position: absolute; bottom: 25px; left: 25px; width: 125px; height: 125px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(243, 198, 84, 0.85); border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none; }

        .fast-buy-container { position: absolute; top: 80px; left: 15px; display: flex; flex-direction: column; gap: 10px; width: 110px; z-index: 50; }
        .fast-buy-item { background: rgba(12, 20, 31, 0.95); border: 1px solid #f3c654; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }

        .controls-right { position: absolute; bottom: 15px; right: 20px; width: 220px; height: 230px; pointer-events: none; }
        .attack-btn { position: absolute; bottom: 5px; right: 5px; width: 78px; height: 78px; background: radial-gradient(circle, #f3c654 0%, #8f5c0a 100%); border: 3px solid #ffe596; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #fff; cursor: pointer; pointer-events: auto; }
        
        .challenger-spell-btn { position: absolute; bottom: 130px; right: 95px; width: 48px; height: 48px; background: radial-gradient(circle, #263238 0%, #0d1b2a 100%); border: 2px solid #f3c654; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto; touch-action: none; }

        .skill-btn { position: absolute; width: 62px; height: 62px; background: rgba(15, 25, 40, 0.9); border: 2px solid #00aaff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto; touch-action: none; }
        .skill-btn.locked { border-color: #555; opacity: 0.5; filter: grayscale(1); }
        .skill-desc-label { position: absolute; bottom: -18px; width: 90px; text-align: center; font-size: 0.6rem; color: #ffeb3b; font-weight: bold; pointer-events: none; white-space: nowrap; }
        .skill-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        .skill-upgrade-btn {
            position: absolute; top: -8px; right: -8px; width: 28px; height: 28px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8f00 100%);
            border: 2px solid #fff; border-radius: 50%; color: #000;
            font-size: 1.1rem; font-weight: 900; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 12px rgba(255, 215, 0, 0.9); z-index: 60;
            animation: pulse-upgrade 0.8s infinite alternate;
        }
        @keyframes pulse-upgrade {
            0% { transform: scale(0.95); box-shadow: 0 0 6px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.15); box-shadow: 0 0 16px rgba(255, 215, 0, 1); }
        }

        #skill-3 { bottom: 130px; right: 20px; border-color: #e040fb; }
        #skill-2 { bottom: 90px; right: 100px; border-color: #00e676; }
        #skill-1 { bottom: 10px; right: 115px; border-color: #ff9100; }

        .pick-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070d18; z-index: 150; display: flex; flex-direction: column; padding: 15px; }
        .pick-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .pick-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 1rem; color: #888; }
        .pick-tabs .active { color: #f3c654; border-bottom: 2px solid #f3c654; }
        .pick-cancel-btn { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; }
        
        .pick-content-layout { display: flex; flex: 1; margin-top: 15px; gap: 20px; overflow: hidden; }
        .pick-hero-sidebar { width: 190px; height: 100%; max-height: 380px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; overflow-y: auto; padding-right: 5px; scrollbar-width: thin; scrollbar-color: #f3c654 rgba(0,0,0,0.3); }
        .pick-hero-sidebar::-webkit-scrollbar { width: 6px; }
        .pick-hero-sidebar::-webkit-scrollbar-thumb { background-color: #f3c654; border-radius: 3px; }

        .pick-hero-thumb { width: 75px; height: 75px; background: #1a2a40; border: 2px solid #334455; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; }
        .pick-hero-thumb.active { border-color: #f3c654; box-shadow: 0 0 10px rgba(243, 198, 84, 0.6); }

        .pick-center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(30,50,80,0.3) 0%, rgba(5,10,18,0.8) 100%); border-radius: 12px; }
        .stage-hero-avatar { font-size: 10rem; }
        
        .pick-right-sidebar { width: 220px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        .team-slot { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 0.9rem; color: #aaa; }
        
        .pick-confirm-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: 2px solid #fef08a; color: #fff; font-weight: bold; font-size: 1.2rem; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }

        .result-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 10, 18, 0.9); z-index: 200; }
        .result-box { background: rgba(13, 23, 38, 0.95); border: 2px solid #f3c654; border-radius: 15px; padding: 30px; text-align: center; width: 85%; max-width: 420px; }
        .result-title-win { font-size: 3rem; font-weight: 900; color: #ffd700; }
        .result-title-lose { font-size: 3rem; font-weight: 900; color: #ff3366; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="top-hud" class="top-score-bar hidden">
        <span class="level-text" id="level-display">Lv.1</span>
        <span class="score-blue" id="score-blue">0</span>
        <span>VS</span>
        <span class="score-red" id="score-red">0</span>
        <span class="gold-text" id="gold-display">🪙 300</span>
        <span class="kda-text" id="kda-display">KDA: 0 / 0 / 0</span>
    </div>

    <div id="announcement-banner" class="announcement-banner hidden">
        <div id="announcement-text" class="announcement-text">FIRST BLOOD</div>
    </div>

    <div id="result-screen" class="result-overlay hidden">
        <div class="result-box">
            <div id="result-title" class="result-title-win">VICTORY</div>
            <p id="result-subtitle" style="color: #aaa; margin-bottom: 20px;">成功摧毀敵方主堡！</p>
            <button class="pick-confirm-btn" style="width:100%;" id="btn-back-lobby">返回遊戲大廳</button>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <div class="top-navbar">
            <div class="profile-area">
                <div id="user-profile" class="user-profile-box">
                    <img id="user-avatar" class="user-avatar" src="https://via.placeholder.com/32" alt="Avatar">
                    <span id="user-name" class="user-name">訪客玩家</span>
                </div>
            </div>

            <div class="resource-group">
                <div class="res-item res-gold" id="header-gold">🟡 300</div>
            </div>
        </div>

        <div class="main-content">
            <div class="hero-heroine-bg">
                <div class="heroine-avatar">🗡️</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-nav">
                <div class="nav-btn active">🛡️ 英雄對戰</div>
            </div>

            <div class="start-group">
                <div class="mode-select-btn" id="btn-mode-1v1">
                    <span class="icon">⚔️</span>
                    <span class="label">1v1 單挑</span>
                </div>
                <div class="start-match-btn" id="btn-start-match">
                    <span class="start-text">START</span>
                </div>
            </div>
        </div>
    </div>

    <div id="pick-screen" class="pick-screen-overlay hidden">
        <div class="pick-top-bar">
            <div class="pick-tabs">
                <span class="active">英雄選擇</span>
            </div>
            <button class="pick-cancel-btn" id="btn-pick-back">取消 ✕</button>
        </div>

        <div class="pick-content-layout">
            <div class="pick-hero-sidebar" id="hero-select-grid"></div>

            <div class="pick-center-stage">
                <div class="stage-hero-avatar" id="stage-hero-avatar">🗡️</div>
                <div class="stage-hero-info">
                    <h2 id="selected-hero-name" style="color:#f3c654; font-size: 1.8rem;">納克羅斯</h2>
                    <p id="selected-hero-type" style="color:#aaa; font-size: 0.95rem;">刺客 / 高機動性爆發</p>
                </div>
            </div>

            <div class="pick-right-sidebar">
                <div class="team-slot"><span>我方 (你)</span><span style="color:#00d2ff;">準備就緒</span></div>
                <div class="team-slot"><span id="ai-opponent-slot">電競AI對手</span><span style="color:#ff4444;">隨機配對</span></div>
                
                <div style="background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px;">
                    <div style="font-size:0.8rem; color:#f3c654; margin-bottom:5px;">選擇挑戰者技能：</div>
                    <div style="display: flex; gap: 6px;">
                        <button class="ch-select-btn active" data-ch="blink" style="flex:1; padding:4px; background:#1a2a40; border:1px solid #f3c654; color:#fff; border-radius:4px; cursor:pointer; font-size:0.75rem;">✨ 順移</button>
                        <button class="ch-select-btn" data-ch="heal" style="flex:1; padding:4px; background:#1a2a40; border:1px solid #334455; color:#fff; border-radius:4px; cursor:pointer; font-size:0.75rem;">💚 治癒</button>
                        <button class="ch-select-btn" data-ch="execute" style="flex:1; padding:4px; background:#1a2a40; border:1px solid #334455; color:#fff; border-radius:4px; cursor:pointer; font-size:0.75rem;">⚔️ 斬殺</button>
                    </div>
                </div>

                <button class="pick-confirm-btn" id="btn-confirm-hero">確 定</button>
            </div>
        </div>
    </div>

    <div id="hud-layer" class="hidden">
        <div class="fast-buy-container" id="fast-buy-list"></div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="controls-right">
            <div class="attack-btn" id="btn-attack">⚔️</div>
            
            <div class="challenger-spell-btn" id="btn-challenger-spell">
                <span id="challenger-icon">✨</span>
                <div class="skill-desc-label" id="lbl-challenger">順移</div>
                <div class="skill-cd-overlay hidden" id="cd-challenger"></div>
            </div>

            <div class="skill-btn" id="skill-3" data-skill="3">
                <div class="skill-upgrade-btn hidden" id="up-btn-3">+</div>
                大招
                <div class="skill-desc-label" id="lbl-skill-3">霸體傷害</div>
                <div class="skill-cd-overlay hidden" id="cd-3"></div>
            </div>
            <div class="skill-btn" id="skill-2" data-skill="2">
                <div class="skill-upgrade-btn hidden" id="up-btn-2">+</div>
                二技
                <div class="skill-desc-label" id="lbl-skill-2">槍尖暈眩</div>
                <div class="skill-cd-overlay hidden" id="cd-2"></div>
            </div>
            <div class="skill-btn" id="skill-1" data-skill="1">
                <div class="skill-upgrade-btn hidden" id="up-btn-1">+</div>
                一技
                <div class="skill-desc-label" id="lbl-skill-1">反向翻滾</div>
                <div class="skill-cd-overlay hidden" id="cd-1"></div>
            </div>
        </div>
    </div>
</div>

<script>
const LOCAL_STORAGE_KEY = 'aov_game_user_data';
let currentUserData = { userId: '', name: '訪客玩家', avatar: 'https://via.placeholder.com/32', isGuest: true, gold: 300 };

function initUserData() {
    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (saved) { try { currentUserData = JSON.parse(saved); } catch (e) {} }
    else { currentUserData.userId = 'guest_' + Math.random().toString(36).substr(2, 9); saveUserData(); }
    updateUserProfileUI();
}

function saveUserData() { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(currentUserData)); }

function updateUserProfileUI() {
    const headerGold = document.getElementById('header-gold');
    if (headerGold) headerGold.innerText = `🟡 ${Math.floor(currentUserData.gold)}`;
}

window.addEventListener('DOMContentLoaded', () => { initUserData(); });

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let MAP_SIZE = 3000;
let ROAD_WIDTH = 320; 
let isRunning = false;
let gameMode = '1v1';
let selectedHeroKey = 'ryoma';
let randomAiKey = 'krixi';
let selectedChallengerKey = 'blink';
let challengerCooldown = 0;
const CHALLENGER_MAX_CDS = { 'blink': 60, 'heal': 90, 'execute': 75 };

let hasFirstBloodOccurred = false;
let playerKillStreak = 0;
let aiKillStreak = 0;
let announcementTimer = null;

function triggerAnnouncement(text, color = '#ffd700') {
    let banner = document.getElementById('announcement-banner');
    let txtEl = document.getElementById('announcement-text');
    
    txtEl.innerText = text;
    txtEl.style.color = color;
    banner.classList.remove('hidden');
    banner.style.opacity = '1';

    if (announcementTimer) clearTimeout(announcementTimer);
    
    announcementTimer = setTimeout(() => {
        banner.style.opacity = '0';
        setTimeout(() => { banner.classList.add('hidden'); }, 300);
    }, 3500);
}

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const HERO_DB = {
    'nakroth': { name: '納克羅斯', type: '刺客 / 高機動性', baseHp: 5000, hpGrowth: 450, atk: 120, range: 150, avatar: '🗡️', color1: '#8e44ad', color2: '#d7bde2', s1: '擊飛位移', s2: '強化普攻', s3: '霸體連擊' },
    'valhein': { name: '凡恩', type: '射手 / 物理攻擊', baseHp: 4500, hpGrowth: 380, atk: 85, range: 240, avatar: '🎯', color1: '#c29b38', color2: '#ffe89e', s1: '獵魔星標', s2: '黃色飛鏢', s3: '水銀彈幕' },
    'krixi': { name: '克里希', type: '法師 / 魔法爆發', baseHp: 4200, hpGrowth: 350, atk: 45, range: 220, avatar: '🧚‍♀️', color1: '#43a047', color2: '#a5d6a7', s1: '蝶影穿梭', s2: '落葉擊飛', s3: '月落星沉' },
    'zuka': { name: '祖卡', type: '戰士 / 物理爆發', baseHp: 6200, hpGrowth: 550, atk: 110, range: 140, avatar: '🐼', color1: '#ff9800', color2: '#ffe082', s1: '泰山壓頂', s2: '熊貓護盾', s3: '沉重打擊' },
    'ryoma': { name: '龍馬', type: '戰士 / 槍尖爆發', baseHp: 5800, hpGrowth: 500, atk: 125, range: 220, avatar: '🥷', color1: '#2e7d32', color2: '#a5d6a7', s1: '反向翻滾', s2: '槍尖暈眩', s3: '連續多段刺' },
    'alice': { name: '愛麗絲', type: '法師 / 輔助控場', baseHp: 4000, hpGrowth: 320, atk: 40, range: 240, avatar: '✨', color1: '#ab47bc', color2: '#e1bee7', s1: '星芒暈眩', s2: '流星護盾', s3: '大招沈默' }
};

const ITEMS_DB = [
    { id: 'ad_1', name: '聖劍', cost: 300, atk: 30 },
    { id: 'ap_1', name: '魔法書', cost: 300, atk: 25 },
    { id: 'def_1', name: '守衛鎧甲', cost: 400, hp: 400 }
];

let blueKills = 0, redKills = 0;
let kills = 0, deaths = 0, assists = 0;
let player = null, entities = [], skillEffects = [], attackEffects = [], damageTexts = [], camera = { x: 0, y: 0 };
let minionSpawnTimer = 0;

let joystickDir = { x: 0, y: 0 };
let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };
let activeSkillDrag = null;
let isAttackingPressed = false;

let skillCooldowns = { 1: 0, 2: 0, 3: 0 };
let skillLevels = { 1: 0, 2: 0, 3: 0 };
let unallocatedPoints = 0;

function bindClick(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => { e.stopPropagation(); fn(e); });
    el.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); fn(e); }, { passive: false });
}

challengerBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (challengerCooldown > 0 || !player || !player.alive) return;
    castChallengerSpell();
});

function castChallengerSpell() {
    challengerCooldown = CHALLENGER_MAX_CDS[selectedChallengerKey];

    if (selectedChallengerKey === 'blink') {
        let dX = joystickDir.x !== 0 ? joystickDir.x : 1;
        let dY = joystickDir.y !== 0 ? joystickDir.y : 0;
        let len = Math.hypot(dX, dY);
        if (len > 0) { dX /= len; dY /= len; } else { dX = 1; dY = 0; }

        let targetX = player.x + dX * 180;
        let targetY = player.y + dY * 180;
        player.startDash(targetX, targetY, 40);
        attackEffects.push({ x: player.x, y: player.y, life: 0.4, radius: 35, color: '#00d2ff' });
    } 
    else if (selectedChallengerKey === 'heal') {
        let healAmt = player.maxHp * 0.35;
        player.hp = Math.min(player.maxHp, player.hp + healAmt);
        attackEffects.push({ x: player.x, y: player.y, life: 0.6, radius: 55, color: '#00e676' });
    } 
    else if (selectedChallengerKey === 'execute') {
        let executedAny = false;
        entities.forEach(e => {
            if (e.alive && e.team !== player.team && e instanceof Hero && Math.hypot(e.x - player.x, e.y - player.y) <= 180) {
                let missingHp = e.maxHp - e.hp;
                let executeDmg = 400 + missingHp * 0.4;
                
                let wasAliveBefore = e.alive;
                e.takeDamage(executeDmg, player.team, 'physical');
                
                attackEffects.push({ x: e.x, y: e.y, life: 0.6, radius: 65, color: '#ff1744' });
                skillEffects.push({ x: e.x, y: e.y, dirX: 0, dirY: 0, life: 0.4, speed: 0, size: 85, color: 'rgba(255, 23, 68, 0.4)', dmg: 0, team: player.team });

                if (wasAliveBefore && !e.alive) {
                    executedAny = true;
                }
            }
        });

        if (executedAny) {
            challengerCooldown *= 0.1;
            damageTexts.push({ x: player.x, y: player.y - 50, value: 'CHALLENGER EXECUTE!', color: '#ffd700', life: 1.5 });
        }
    }
}

joystick.addEventListener('pointerdown', e => {
    joystickTouchId = e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    const rect = joystick.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
});
joystick.addEventListener('pointermove', e => {
    if (e.pointerId === joystickTouchId) updateJoystick(e.clientX, e.clientY);
});
function resetJoystick(e) {
    if (e.pointerId === joystickTouchId) {
        joystickTouchId = null;
        joystickDir = { x: 0, y: 0 };
        knob.style.transform = `translate(0px, 0px)`;
    }
}
joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
}

document.querySelectorAll('.skill-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
        let skillId = parseInt(btn.dataset.skill);
        let sLv = skillLevels[skillId];

        let isNakrothS2nd = (player && player.heroKey === 'nakroth' && skillId === 1 && nakrothS1Stage === 2);
        let isRyomaS2nd = (player && player.heroKey === 'ryoma' && skillId === 1 && ryomaS1Stage === 2);

        if (!isNakrothS2nd && !isRyomaS2nd && (sLv === 0 || skillCooldowns[skillId] > 0 || !player || !player.alive)) return;

        e.preventDefault();
        e.stopPropagation();

        btn.setPointerCapture(e.pointerId);
        let rect = btn.getBoundingClientRect();
        activeSkillDrag = { 
            skillId: skillId, 
            pointerId: e.pointerId, 
            centerX: rect.left + rect.width / 2, 
            centerY: rect.top + rect.height / 2, 
            dirX: 0, 
            dirY: -1,
            dragDist: 0
        };
    }, { passive: false });

    btn.addEventListener('pointermove', e => {
        if (activeSkillDrag && activeSkillDrag.pointerId === e.pointerId) {
            e.preventDefault();
            let dx = e.clientX - activeSkillDrag.centerX;
            let dy = e.clientY - activeSkillDrag.centerY;
            let len = Math.hypot(dx, dy);
            activeSkillDrag.dragDist = Math.min(len, 60);
            if (len > 5) { 
                activeSkillDrag.dirX = dx / len; 
                activeSkillDrag.dirY = dy / len; 
            }
        }
    }, { passive: false });

    function releaseSkill(e) {
        if (activeSkillDrag && activeSkillDrag.pointerId === e.pointerId) {
            castSkill(activeSkillDrag.skillId, activeSkillDrag.dirX, activeSkillDrag.dirY, activeSkillDrag.dragDist);
            activeSkillDrag = null;
        }
    }
    btn.addEventListener('pointerup', releaseSkill);
    btn.addEventListener('pointercancel', releaseSkill);
});

function clampPosition(x, y, radius = 26) {
    let startX = 400, startY = MAP_SIZE - 400;
    let endX = MAP_SIZE - 400, endY = 400;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;

    let vecX = x - startX, vecY = y - startY;
    let proj = Math.max(0, Math.min(lineLen, vecX * uX + vecY * uY));

    let closestX = startX + proj * uX, closestY = startY + proj * uY;
    let perpX = x - closestX, perpY = y - closestY;
    let distFromCenter = Math.hypot(perpX, perpY);

    let maxDist = (ROAD_WIDTH / 2) - radius;
    if (distFromCenter > maxDist) {
        if (distFromCenter === 0) return { x: closestX, y: closestY };
        return { x: closestX + (perpX / distFromCenter) * maxDist, y: closestY + (perpY / distFromCenter) * maxDist };
    }
    return { x, y };
}

function checkCanUpgrade(skillId) {
    if (unallocatedPoints <= 0 || !player) return false;
    let heroLv = player.level;
    let currentSkillLv = skillLevels[skillId];

    if (skillId === 1 || skillId === 2) {
        if (currentSkillLv >= 6) return false;
        if (heroLv === 2 && skillLevels[1] === 0 && skillId !== 1) return true;
        if (heroLv === 2 && skillLevels[2] === 0 && skillId !== 2) return true;
        if (heroLv === 2 && skillLevels[1] > 0 && skillLevels[2] > 0) return false;
        return true;
    } else if (skillId === 3) {
        if (currentSkillLv >= 3) return false;
        if (heroLv < 4) return false;
        if (currentSkillLv === 1 && heroLv < 8) return false;
        if (currentSkillLv === 2 && heroLv < 12) return false;
        return true;
    }
    return false;
}

function upgradeSkill(skillId) {
    if (checkCanUpgrade(skillId)) {
        skillLevels[skillId]++;
        unallocatedPoints--;
        updateTopScopeUI();
    }
}

function getSkillStats(skillId, baseDmg, baseCD) {
    let sLv = skillLevels[skillId] || 1;
    let dmg = Math.round(baseDmg * (1 + (sLv - 1) * 0.25));
    let cd = Math.max(1.0, baseCD * (1 - (sLv - 1) * 0.08));
    return { dmg, cd };
}

class Entity {
    constructor(x, y, team, radius = 22) {
        this.x = x; this.y = y; this.team = team;
        this.radius = radius; this.hp = 5000; this.maxHp = 5000; this.alive = true;
    }
    takeDamage(dmg, sourceTeam, dmgType = 'physical', sourceEntity = null) {
        if (!this.alive) return;
        
        if (this instanceof Turret || this instanceof NexusBase) {
            let enemyMinions = entities.filter(e => e instanceof Minion && e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 220);
            if (enemyMinions.length === 0) dmg *= 0.2; 
        }

        if (this instanceof NexusBase) {
            let enemyTurrets = entities.filter(e => e instanceof Turret && e.alive && e.team === this.team);
            if (enemyTurrets.length > 0) return;
        }

        let wasAliveBefore = this.alive;
        this.hp -= dmg;

        let isFromMinion = (sourceEntity instanceof Minion);
        if (!isFromMinion) {
            let color = (dmgType === 'magic') ? '#ab47bc' : '#ff3366';
            damageTexts.push({
                x: this.x + (Math.random() * 20 - 10),
                y: this.y - this.radius - 10,
                value: dmg,
                color: color,
                life: 2.0
            });
        }

        if (this.hp <= 0 && wasAliveBefore) {
            this.hp = 0; this.alive = false;
            if (this instanceof Hero) {
                let killerTeam = sourceTeam;
                
                if (!hasFirstBloodOccurred) {
                    hasFirstBloodOccurred = true;
                    let fbText = (killerTeam === 'blue') ? '我方完成 FIRST BLOOD（首殺）！' : '敵方完成 FIRST BLOOD（首殺）！';
                    triggerAnnouncement(fbText, '#ff3366');
                }

                if (killerTeam === 'blue') {
                    blueKills++; 
                    if (!this.isPlayer) {
                        kills++; 
                        playerKillStreak++;
                        if (aiKillStreak >= 3) {
                            triggerAnnouncement(`玩家終結了 ${this.heroData.name} 的連殺！`, '#00e676');
                        } else {
                            triggerAnnouncement(`我方擊殺了 ${this.heroData.name}`, '#00d2ff');
                        }
                        aiKillStreak = 0;
                        player.gold += 150; currentUserData.gold += 150; saveUserData();
                    }
                } else {
                    redKills++; 
                    if (this.isPlayer) {
                        deaths++;
                        playerKillStreak = 0;
                        aiKillStreak++;
                    } else {
                        aiKillStreak++;
                    }
                    triggerAnnouncement(`敵方擊殺了 ${this.heroData.name}`, '#ff3366');
                }

                updateTopScopeUI();
                this.respawnTimer = 5.0;
            } else if (this instanceof NexusBase) {
                showGameResult(this.team === 'red');
            }
        }
    }
}

class Fountain {
    constructor(x, y, team) { this.x = x; this.y = y; this.team = team; this.radius = 120; }
    update() {
        entities.forEach(e => {
            if (e instanceof Hero && e.alive && e.team === this.team && Math.hypot(e.x - this.x, e.y - this.y) < this.radius) {
                e.hp = Math.min(e.maxHp, e.hp + (e.maxHp * 0.1 / 60));
            }
        });
    }
    draw(ctx) {
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        ctx.beginPath(); ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? 'rgba(0, 230, 118, 0.12)' : 'rgba(255, 23, 68, 0.12)'; ctx.fill();
        ctx.strokeStyle = this.team === 'blue' ? '#00e676' : '#ff1744'; ctx.lineWidth = 3; ctx.stroke();
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer = false) {
        let heroData = HERO_DB[heroKey];
        super(x, y, team, 26);
        this.startX = x; this.startY = y;
        this.heroKey = heroKey; this.heroData = heroData; this.isPlayer = isPlayer;
        this.gold = currentUserData.gold; this.exp = 0; this.level = 1;
        this.atk = heroData.atk; this.range = heroData.range;
        this.speed = 2.6; 
        
        this.maxHp = isPlayer ? heroData.baseHp : Math.floor(heroData.baseHp * 1.3);
        this.hp = this.maxHp;
        
        this.minionIncomeTimer = 0;
        this.respawnTimer = 0;
        this.attackCooldown = 0;
        this.attackStopTimer = 0;
        this.aiSkillCooldowns = { 1: 0, 2: 0, 3: 0 };
        this.isEnhancedAtk = false;
        this.isSuperArmor = false;
        this.superArmorTimer = 0;

        this.stunTimer = 0;
        this.maxStunTimer = 0;
        this.stunLabel = '💫 暈眩';

        this.isDashing = false;
        this.dashTargetX = x;
        this.dashTargetY = y;
        this.dashSpeed = 0;
        this.shadows = [];
    }

    startDash(targetX, targetY, speed = 18) {
        let clamped = clampPosition(targetX, targetY, this.radius);
        this.dashTargetX = clamped.x;
        this.dashTargetY = clamped.y;
        this.dashSpeed = speed;
        this.isDashing = true;
    }

    applyStun(duration, label = '💫 暈眩') {
        if (this.isSuperArmor) return;
        this.stunTimer = duration;
        this.maxStunTimer = duration;
        this.stunLabel = label;
    }

    update() {
        if (!this.alive) {
            if (this.respawnTimer > 0) {
                this.respawnTimer -= 1/60;
                if (this.respawnTimer <= 0) {
                    this.x = this.startX; this.y = this.startY;
                    this.hp = this.maxHp; this.alive = true;
                }
            }
            return;
        }

        for (let i = this.shadows.length - 1; i >= 0; i--) {
            this.shadows[i].alpha -= 0.08;
            if (this.shadows[i].alpha <= 0) this.shadows.splice(i, 1);
        }

        if (this.stunTimer > 0) {
            this.stunTimer -= 1/60;
            if (this.stunTimer <= 0) this.stunTimer = 0;
        }

        if (this.isDashing) {
            let dx = this.dashTargetX - this.x;
            let dy = this.dashTargetY - this.y;
            let dist = Math.hypot(dx, dy);

            this.shadows.push({ x: this.x, y: this.y, alpha: 0.65, color: this.heroData.color1 });

            if (dist <= this.dashSpeed) {
                this.x = this.dashTargetX;
                this.y = this.dashTargetY;
                this.isDashing = false;
            } else {
                let nextX = this.x + (dx / dist) * this.dashSpeed;
                let nextY = this.y + (dy / dist) * this.dashSpeed;
                let clamped = clampPosition(nextX, nextY, this.radius);
                this.x = clamped.x;
                this.y = clamped.y;
            }
            return;
        }

        if (this.superArmorTimer > 0) {
            this.superArmorTimer -= 1/60;
            if (this.superArmorTimer <= 0) this.isSuperArmor = false;
        }

        this.exp += 0.08;
        if (this.exp >= this.level * 100 && this.level < 15) {
            this.level++; 
            unallocatedPoints++;
            let hpGain = this.heroData.hpGrowth || 400;
            this.maxHp += hpGain; 
            this.hp = Math.min(this.maxHp, this.hp + hpGain);
            this.atk += 8;
            if (this.isPlayer) updateTopScopeUI();
        }

        if (this.stunTimer > 0) return;

        if (this.attackCooldown > 0) this.attackCooldown -= 1/60;
        if (this.attackStopTimer > 0) this.attackStopTimer -= 1/60;

        if (this.isPlayer) {
            if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                let currentSpeed = (this.attackStopTimer > 0) ? 0 : this.speed;
                let nextX = this.x + joystickDir.x * currentSpeed;
                let nextY = this.y + joystickDir.y * currentSpeed;
                let clamped = clampPosition(nextX, nextY, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            }
            
            this.minionIncomeTimer += 1/60;
            if (this.minionIncomeTimer >= 1.0) {
                this.gold += 3; currentUserData.gold += 3; saveUserData();
                this.minionIncomeTimer = 0;
                document.getElementById('header-gold').innerText = `🪙 ${Math.floor(this.gold)}`;
            }
        } else {
            for (let sKey in this.aiSkillCooldowns) {
                if (this.aiSkillCooldowns[sKey] > 0) this.aiSkillCooldowns[sKey] -= 1/60;
            }

            let hpPercent = this.hp / this.maxHp;
            let fountainX = (this.team === 'blue') ? 400 : MAP_SIZE - 400;
            let fountainY = (this.team === 'blue') ? MAP_SIZE - 400 : 400;
            let distToFountain = Math.hypot(fountainX - this.x, fountainY - this.y);

            if (hpPercent < 0.3 && distToFountain > 80) {
                let dx = fountainX - this.x, dy = fountainY - this.y;
                let dirX = dx / distToFountain, dirY = dy / distToFountain;
                let nextX = this.x + dirX * (this.speed * 1.1);
                let nextY = this.y + dirY * (this.speed * 1.1);
                let clamped = clampPosition(nextX, nextY, this.radius);
                this.x = clamped.x; this.y = clamped.y;
                return;
            }

            let target = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 350);
            let lineCenter = MAP_SIZE / 2;
            let distToCenter = Math.hypot(lineCenter - this.x, lineCenter - this.y);

            if (target) {
                let dx = target.x - this.x, dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);
                let dirX = dx / dist, dirY = dy / dist;

                if (this.aiSkillCooldowns[3] <= 0 && this.level >= 4 && dist < 250) {
                    skillEffects.push({ x: this.x, y: this.y, dirX, dirY, life: 1.0, speed: 10, size: 22, color: '#ff1744', dmg: 250, team: this.team });
                    this.aiSkillCooldowns[3] = 10.0;
                } else if (this.aiSkillCooldowns[1] <= 0 && dist < 300) {
                    skillEffects.push({ x: this.x, y: this.y, dirX, dirY, life: 1.0, speed: 11, size: 18, color: '#ff9100', dmg: 160, team: this.team });
                    this.aiSkillCooldowns[1] = 4.0;
                } else if (dist > this.range) {
                    let nextX = this.x + dirX * (this.speed * 0.65);
                    let nextY = this.y + dirY * (this.speed * 0.65);
                    let clamped = clampPosition(nextX, nextY, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                } else if (this.attackCooldown <= 0) {
                    let atkDmg = this.atk * 1.5;
                    target.takeDamage(atkDmg, this.team, 'physical');
                    
                    damageTexts.push({
                        x: target.x + (Math.random() * 20 - 10),
                        y: target.y - target.radius - 10,
                        value: atkDmg,
                        color: '#ff3366',
                        life: 2.0
                    });

                    attackEffects.push({ x: target.x, y: target.y, life: 0.35, radius: 26, color: '#ff3366' });
                    this.attackCooldown = 0.5;
                }
            } else if (distToCenter > 350) {
                let dx = lineCenter - this.x, dy = lineCenter - this.y;
                let nextX = this.x + (dx / distToCenter) * this.speed;
                let nextY = this.y + (dy / distToCenter) * this.speed;
                let clamped = clampPosition(nextX, nextY, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            } else {
                let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
                let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
                let dx = targetX - this.x, dy = targetY - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 50) {
                    let nextX = this.x + (dx / dist) * (this.speed * 0.5);
                    let nextY = this.y + (dy / dist) * (this.speed * 0.5);
                    let clamped = clampPosition(nextX, nextY, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                }
            }
        }
        let safePos = clampPosition(this.x, this.y, this.radius);
        this.x = safePos.x; this.y = safePos.y;
    }

    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;

        this.shadows.forEach(s => {
            let sX = s.x - camera.x, sY = s.y - camera.y;
            ctx.save();
            ctx.beginPath(); ctx.arc(sX, sY, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = s.color; ctx.globalAlpha = s.alpha; ctx.fill();
            ctx.restore();
        });

        if (this.isPlayer && isAttackingPressed) {
            let currentRange = (this.isEnhancedAtk || this.isZukaEnhanced) ? this.range * 1.5 : this.range;
            ctx.beginPath();
            ctx.arc(screenX, screenY, currentRange, 0, Math.PI * 2);
            if (this.isEnhancedAtk || this.isZukaEnhanced) {
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.95)';
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(255, 215, 0, 0.12)';
            } else {
                ctx.strokeStyle = 'rgba(0, 210, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0, 210, 255, 0.08)';
            }
            ctx.fill();
            ctx.stroke();
        }

        if (this.isSuperArmor) {
            let progress = this.superArmorTimer / 1.2;
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
            ctx.fillText('⚡ 霸體', screenX, screenY - 65);
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 25, screenY - 60, 50, 4);
            ctx.fillStyle = '#ffd700'; ctx.fillRect(screenX - 25, screenY - 60, 50 * progress, 4);
        } else if (this.stunTimer > 0) {
            let progress = this.stunTimer / this.maxStunTimer;
            ctx.fillStyle = '#ff1744'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
            ctx.fillText(this.stunLabel, screenX, screenY - 65);
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 25, screenY - 60, 50, 4);
            ctx.fillStyle = '#ff1744'; ctx.fillRect(screenX - 25, screenY - 60, 50 * progress, 4);
        }

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.heroData.color1; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = this.heroData.color2; ctx.stroke();
        ctx.restore();

        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 30, screenY - 45, 60, 6);
        ctx.fillStyle = this.team === 'blue' ? '#00e676' : '#ff1744';
        ctx.fillRect(screenX - 30, screenY - 45, (this.hp / this.maxHp) * 60, 6);

        let segmentCount = Math.floor(this.maxHp / 1000);
        if (segmentCount > 1) {
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)'; ctx.lineWidth = 1.5;
            for (let i = 1; i < segmentCount; i++) {
                let segX = (screenX - 30) + (i * 1000 / this.maxHp) * 60;
                ctx.beginPath(); ctx.moveTo(segX, screenY - 45); ctx.lineTo(segX, screenY - 39); ctx.stroke();
            }
        }

        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`Lv.${this.level}`, screenX, screenY - 50);
    }
}

class Turret extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 35);
        this.maxHp = 12000; this.hp = 12000; 
        this.range = 360; 
        this.baseAtk = 360; this.atk = 360; this.cooldown = 0;
        this.targetHistory = new Map();
        this.currentTarget = null;
        this.laserTimer = 0;
    }

    takeDamage(dmg, sourceTeam, dmgType = 'physical', sourceEntity = null) {
        let wasAlive = this.alive;
        super.takeDamage(dmg, sourceTeam, dmgType, sourceEntity);
        if (wasAlive && !this.alive) {
            if (this.team === 'red') {
                triggerAnnouncement('我方已擊破敵方外塔！', '#00e676');
            } else {
                triggerAnnouncement('敵方已擊破我方外塔！', '#ff3366');
            }
        }
    }

    update() {
        if (!this.alive) return;
        if (this.cooldown > 0) this.cooldown -= 1/60;
        if (this.laserTimer > 0) this.laserTimer -= 1/60;

        let inRangeEnemies = entities.filter(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < this.range);
        let minions = inRangeEnemies.filter(e => e instanceof Minion);
        let heroes = inRangeEnemies.filter(e => e instanceof Hero);

        let target = null;
        if (this.currentTarget && this.currentTarget.alive && Math.hypot(this.currentTarget.x - this.x, this.currentTarget.y - this.y) < this.range) {
            target = this.currentTarget;
        } else {
            if (minions.length > 0) target = minions[0];
            else if (heroes.length > 0) target = heroes[0];
        }

        this.currentTarget = target;

        if (target && this.cooldown <= 0) {
            let hitCount = this.targetHistory.get(target) || 0;
            let currentDmg = this.baseAtk * (1 + hitCount * 0.25);
            target.takeDamage(currentDmg, this.team, 'physical');
            
            damageTexts.push({
                x: target.x + (Math.random() * 20 - 10),
                y: target.y - target.radius - 10,
                value: currentDmg,
                color: (target instanceof Hero) ? '#ff5722' : '#ff9800',
                life: 2.0
            });

            this.laserTimer = 0.25;
            attackEffects.push({ x: target.x, y: target.y, life: 0.35, radius: 32, color: '#ff1744' });

            this.targetHistory.set(target, hitCount + 1);
            this.cooldown = 1.0;
        } else {
            this.targetHistory.clear();
            this.currentTarget = null;
        }
    }

    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        
        let enemyMinions = entities.filter(e => e instanceof Minion && e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 220);
        let hasArmor = enemyMinions.length === 0;

        if (this.laserTimer > 0 && this.currentTarget) {
            let targetScreenX = this.currentTarget.x - camera.x;
            let targetScreenY = this.currentTarget.y - camera.y;
            ctx.save();
            ctx.beginPath(); ctx.moveTo(screenX, screenY); ctx.lineTo(targetScreenX, targetScreenY);
            ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 5; ctx.stroke();
            ctx.restore();
        }

        ctx.beginPath(); ctx.arc(screenX, screenY, this.range, 0, Math.PI * 2);
        ctx.strokeStyle = this.team === 'blue' ? 'rgba(0, 210, 255, 0.25)' : 'rgba(255, 68, 68, 0.25)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(screenX, screenY, 32, 0, Math.PI * 2);
        ctx.fillStyle = '#263238'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = hasArmor ? '#ff3366' : '#546e7a'; ctx.stroke();
        ctx.fillStyle = this.team === 'blue' ? '#1565c0' : '#c62828'; ctx.fillRect(screenX - 18, screenY - 26, 36, 42);
        
        if (hasArmor) { 
            ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; 
            ctx.fillText('🛡️ 減傷80%', screenX, screenY - 50); 
        }
        
        ctx.fillStyle = '#000'; ctx.fillRect(screenX - 30, screenY - 40, 60, 6);
        ctx.fillStyle = '#00e676'; ctx.fillRect(screenX - 30, screenY - 40, (this.hp / this.maxHp) * 60, 6);

        let segmentCount = Math.floor(this.maxHp / 1000);
        if (segmentCount > 1) {
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)'; ctx.lineWidth = 1.5;
            for (let i = 1; i < segmentCount; i++) {
                let segX = (screenX - 30) + (i * 1000 / this.maxHp) * 60;
                ctx.beginPath(); ctx.moveTo(segX, screenY - 40); ctx.lineTo(segX, screenY - 34); ctx.stroke();
            }
        }
    }
}

class Minion extends Entity {
    constructor(x, y, team) { 
        super(x, y, team, 14); 
        this.hp = 3000; 
        this.maxHp = 3000; 
        this.speed = 2.0; 
        this.atk = 8;
        this.attackCooldown = 0;
    }
    
    update() {
        if (!this.alive) return;

        if (this.attackCooldown > 0) this.attackCooldown -= 1/60;

        let enemy = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 60);
        
        if (enemy) { 
            if (this.attackCooldown <= 0) {
                enemy.takeDamage(this.atk * 2.0, this.team, 'physical', this); 
                this.attackCooldown = 1.2; 
            }
        }
        else {
            let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
            let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
            let dx = targetX - this.x, dy = targetY - this.y, dist = Math.hypot(dx, dy);
            if (dist > 20) {
                let clamped = clampPosition(this.x + (dx / dist) * this.speed, this.y + (dy / dist) * this.speed, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            }
        }
    }
    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        ctx.beginPath(); ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? '#42a5f5' : '#ef5350'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 15, screenY - 20, 30, 4);
        ctx.fillStyle = this.team === 'blue' ? '#00e676' : '#ff1744'; ctx.fillRect(screenX - 15, screenY - 20, (this.hp / this.maxHp) * 30, 4);
    }
}

function spawnMinionWave() {
    for (let i = 0; i < 3; i++) {
        let offset = i * 35;
        let bluePos = clampPosition(450 + offset, MAP_SIZE - 450 - offset, 14);
        let redPos = clampPosition(MAP_SIZE - 450 - offset, 450 + offset, 14);
        entities.push(new Minion(bluePos.x, bluePos.y, 'blue'));
        entities.push(new Minion(redPos.x, redPos.y, 'red'));
    }
}

function performAttack() {
    if (!player || !player.alive) return;
    
    if (player.attackCooldown > 0) return;

    let isEnhanced = (player.heroKey === 'nakroth' && player.isEnhancedAtk) || (player.heroKey === 'zuka' && player.isZukaEnhanced);
    let activeRange = isEnhanced ? player.range * 1.5 : player.range;
    
    let target = entities.find(e => e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= activeRange);
    
    if (target) {
        let finalDmg = player.atk * 3.0; 
        
        if (isEnhanced) {
            finalDmg *= 2.0; 
            let aoeRadius = 100; 
            
            entities.forEach(e => {
                if (e.alive && e.team !== player.team && Math.hypot(e.x - target.x, e.y - target.y) <= aoeRadius) {
                    e.takeDamage(finalDmg, player.team, 'physical');
                }
            });
            
            if (player.heroKey === 'nakroth') player.isEnhancedAtk = false;
            if (player.heroKey === 'zuka') player.isZukaEnhanced = false;
            
            attackEffects.push({ x: target.x, y: target.y, life: 0.45, radius: aoeRadius, color: '#ffd700' });
        } else {
            target.takeDamage(finalDmg, player.team, 'physical');
            attackEffects.push({ x: target.x, y: target.y, life: 0.3, radius: 24, color: '#ffffff' });
        }

        player.attackCooldown = 0.5;
        player.attackStopTimer = 0.5;
    }
}

function castSkill(skillId, dirX, dirY, dragDist) {
    if (!player || !player.alive) return;

    let castDistance = Math.max(80, dragDist * 1.8);

    if (player.heroKey === 'nakroth' && skillId === 1) {
        let longDist = Math.max(120, dragDist * 4.5);
        let targetX = player.x + dirX * longDist;
        let targetY = player.y + dirY * longDist;
        
        player.startDash(targetX, targetY, 28);
        skillEffects.push({ x: targetX, y: targetY, dirX: 0, dirY: 0, life: 0.5, speed: 0, size: 65, color: 'rgba(142, 68, 173, 0.7)', dmg: 180, team: player.team });

        if (nakrothS1Stage === 1) { nakrothS1Stage = 2; return; }
        else { nakrothS1Stage = 1; skillCooldowns[1] = skillMaxCDs[1]; return; }
    }

    if (player.heroKey === 'nakroth') {
        let stats = getSkillStats(skillId, skillId === 2 ? 180 : 320, skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;
        if (skillId === 2) { 
            let dashX = player.x - dirX * castDistance;
            let dashY = player.y - dirY * castDistance;
            player.startDash(dashX, dashY, 22);
            player.isEnhancedAtk = true; 
        }
        else if (skillId === 3) { 
            player.isSuperArmor = true;
            player.superArmorTimer = 1.2;
            skillEffects.push({ x: player.x, y: player.y, dirX:0, dirY:0, life:0.8, speed:0, size:65, color:'#d7bde2', dmg:stats.dmg, team:player.team }); 
        }
    } else if (player.heroKey === 'zuka') {
        let stats = getSkillStats(skillId, 180, skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;
        player.isEnhancedAtk = true;
        let dashX = player.x + dirX * castDistance;
        let dashY = player.y + dirY * castDistance;
        player.startDash(dashX, dashY, 18);
        skillEffects.push({ x: dashX, y: dashY, dirX:0, dirY:0, life:0.5, speed:0, size:45, color:'#ff9800', dmg:stats.dmg, team:player.team }); 
    } else if (player.heroKey === 'ryoma') {
        let stats = getSkillStats(skillId, skillId === 1 ? 220 : (skillId === 2 ? 350 : 150), skillMaxCDs[skillId]);
        
        if (skillId === 1) {
            if (ryomaS1Stage === 1) {
                let forwardX = player.x + dirX * 160;
                let forwardY = player.y + dirY * 160;
                skillEffects.push({ x: forwardX, y: forwardY, dirX: 0, dirY: 0, life: 0.4, speed: 0, size: 75, color: 'rgba(129, 199, 132, 0.7)', dmg: stats.dmg, team: player.team });
                
                let backDashX = player.x - dirX * castDistance;
                let backDashY = player.y - dirY * castDistance;
                player.startDash(backDashX, backDashY, 22);

                ryomaS1Stage = 2;
                ryomaS1Timer = 4.0;
                return;
            } else {
                let dashX = player.x + dirX * (castDistance * 1.5);
                let dashY = player.y + dirY * (castDistance * 1.5);
                player.startDash(dashX, dashY, 26);
                
                skillEffects.push({ 
                    x: dashX, y: dashY, dirX: 0, dirY: 0, life: 0.5, speed: 0, size: 85, 
                    color: 'rgba(46, 125, 50, 0.8)', dmg: stats.dmg * 1.2, team: player.team 
                });

                ryomaS1Stage = 1;
                ryomaS1Timer = 0;
                skillCooldowns[1] = stats.cd;
                return;
            }
        } else if (skillId === 2) {
            skillEffects.push({ 
                x: player.x, y: player.y, 
                dirX: dirX, dirY: dirY, 
                length: 320, width: 60, 
                tipStart: 180,
                life: 0.25, speed: 0, 
                color: 'rgba(46, 125, 50, 0.75)', 
                dmg: stats.dmg, tipDmgBonus: 250, 
                isRyomaS2: true, 
                team: player.team 
            });
            skillCooldowns[2] = stats.cd;
        } else if (skillId === 3) {
            skillCooldowns[3] = stats.cd;
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    if (player && player.alive) {
                        skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 0.4, speed: 18, size: 26, color: '#a5d6a7', dmg: stats.dmg, isRyomaS3: true, team: player.team });
                        player.hp = Math.min(player.maxHp, player.hp + 140);
                    }
                }, i * 140);
            }
        }
    } else if (player.heroKey === 'krixi') {
        let stats = getSkillStats(skillId, skillId === 1 ? 450 : (skillId === 2 ? 90 : 280), skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;

        if (skillId === 1) {
            skillEffects.push({ 
                x: player.x, y: player.y, startX: player.x, startY: player.y,
                dirX: dirX, dirY: dirY, life: 1.6, speed: 9, size: 26, 
                color: '#a5d6a7', dmg: stats.dmg, isKrixiS1: true, isReturning: false, 
                maxDist: 320, traveled: 0, team: player.team, hitEntities: new Set() 
            });
        } else if (skillId === 2) {
            let maxCastDist = Math.max(120, dragDist * 5.5);
            let targetX = player.x + dirX * maxCastDist;
            let targetY = player.y + dirY * maxCastDist;
            let clamped = clampPosition(targetX, targetY, player.radius);
            skillEffects.push({ 
                x: clamped.x, y: clamped.y, dirX: 0, dirY: 0, life: 0.5, speed: 0, size: 60, 
                color: 'rgba(67, 160, 71, 0.4)', dmg: stats.dmg, isStun: true, stunDuration: 0.75, stunLabel: '🌪️ 擊飛', team: player.team 
            });
        } else if (skillId === 3) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    if (player && player.alive) {
                        let angle = Math.random() * Math.PI * 2;
                        let r = Math.random() * 200;
                        skillEffects.push({ x: player.x + Math.cos(angle) * r, y: player.y + Math.sin(angle) * r, dirX: 0, dirY: 0, life: 0.4, speed: 0, size: 45, color: '#81c784', dmg: stats.dmg, team: player.team });
                    }
                }, i * 200);
            }
        }
    } else if (player.heroKey === 'alice') {
        let stats = getSkillStats(skillId, skillId === 1 ? 320 : (skillId === 2 ? 0 : 380), skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;

        if (skillId === 1) {
            let maxCastDist = Math.max(140, dragDist * 6.0);
            let targetX = player.x + dirX * maxCastDist;
            let targetY = player.y + dirY * maxCastDist;
            let clamped = clampPosition(targetX, targetY, player.radius);
            skillEffects.push({ 
                x: clamped.x, y: clamped.y, dirX: 0, dirY: 0, life: 0.5, speed: 0, size: 55, 
                color: 'rgba(171, 71, 188, 0.5)', dmg: stats.dmg, isStun: true, stunDuration: 1.2, stunLabel: '💫 暈眩', team: player.team, dmgType: 'magic' 
            });
        } else if (skillId === 2) {
            player.hp = Math.min(player.maxHp, player.hp + 400); 
            skillEffects.push({ x: player.x, y: player.y, dirX: 0, dirY: 0, life: 1.0, speed: 0, size: 50, color: 'rgba(225, 190, 231, 0.7)', dmg: 0, team: player.team });
        } else if (skillId === 3) {
            let maxCastDist = Math.max(160, dragDist * 6.5);
            let targetX = player.x + dirX * maxCastDist;
            let targetY = player.y + dirY * maxCastDist;
            let clamped = clampPosition(targetX, targetY, player.radius);
            skillEffects.push({ 
                x: clamped.x, y: clamped.y, dirX: 0, dirY: 0, life: 1.5, speed: 0, size: 110, 
                color: 'rgba(142, 68, 173, 0.35)', dmg: stats.dmg, isStun: true, stunDuration: 1.5, stunLabel: '🔇 沈默', team: player.team, dmgType: 'magic' 
            });
        }
    } else {
        let stats = getSkillStats(skillId, 150, skillMaxCDs[skillId]);
        skillCooldowns[skillId] = stats.cd;
        if (skillId === 1) skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 1.0, speed: 11, size: 18, color: '#ffd700', dmg: stats.dmg, team: player.team });
        else if (skillId === 2) skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 1.0, speed: 9, size: 16, color: '#00e5ff', dmg: stats.dmg, team: player.team });
        else if (skillId === 3) {
            for (let angleOff = -0.4; angleOff <= 0.4; angleOff += 0.2) {
                let cos = Math.cos(angleOff), sin = Math.sin(angleOff);
                skillEffects.push({ x: player.x, y: player.y, dirX: dirX * cos - dirY * sin, dirY: dirX * sin + dirY * cos, life: 1.0, speed: 12, size: 18, color: '#ff3d00', dmg: stats.dmg, team: player.team });
            }
        }
    }
}

function backToLobby() {
