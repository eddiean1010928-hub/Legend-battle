<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>傳說對決 Arena of Valor Canvas Edition</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #070d14; display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, rgba(30, 60, 100, 0.4) 0%, rgba(5, 10, 18, 0.95) 100%); z-index: 100; pointer-events: auto; padding: 15px; }
        .hidden { display: none !important; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        
        .user-profile-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid #f3c654; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #fff; }
        .user-name { font-size: 0.85rem; font-weight: bold; color: #f3c654; }

        .resource-group { display: flex; gap: 15px; background: rgba(0, 0, 0, 0.4); padding: 4px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-weight: bold; }
        .res-item { display: flex; align-items: center; gap: 5px; }
        .res-gold { color: #f3c654; }

        .system-icons { display: flex; gap: 12px; font-size: 1.1rem; color: #cfd8dc; }
        .sys-btn { background: rgba(255,255,255,0.08); width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }

        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px 0; position: relative; }
        .hero-heroine-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0.85; }
        .heroine-avatar { font-size: 9rem; text-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }

        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 10px 5px 10px; }
        .bottom-nav { display: flex; gap: 12px; background: rgba(6, 14, 26, 0.85); padding: 8px 18px; border-radius: 12px; border: 1px solid #1e3a5f; }
        .nav-btn { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: #94a3b8; cursor: pointer; }
        .nav-btn.active { color: #fff; }

        .start-group { display: flex; align-items: flex-end; gap: 15px; }
        .mode-select-btn { background: rgba(13, 27, 46, 0.9); border: 1px solid #00d2ff; border-radius: 50%; width: 55px; height: 55px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0,210,255,0.3); }
        .mode-select-btn .icon { font-size: 1.2rem; }
        .mode-select-btn .label { font-size: 0.65rem; color: #00d2ff; font-weight: bold; margin-top: 2px; }

        .start-match-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%); border: 2px solid #fef08a; width: 170px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
        .start-match-btn .start-text { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }

        .top-score-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; background: rgba(8, 14, 22, 0.88); border: 1px solid #f3c654; border-radius: 20px; padding: 6px 20px; z-index: 20; font-size: 1rem; font-weight: bold; pointer-events: none; }
        .score-blue { color: #00d2ff; }
        .score-red { color: #ff4444; }
        .gold-text { color: #ffd700; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .kda-text { color: #ffeb3b; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 10px; }
        .level-text { color: #00e676; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; }

        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #hud-layer * { pointer-events: auto; }

        .joystick-container { position: absolute; bottom: 25px; left: 25px; width: 125px; height: 125px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(243, 198, 84, 0.85); border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none; }

        .fast-buy-container { position: absolute; top: 80px; left: 15px; display: flex; flex-direction: column; gap: 10px; width: 110px; z-index: 50; }
        .fast-buy-item { background: rgba(12, 20, 31, 0.95); border: 1px solid #f3c654; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }

        .controls-right { position: absolute; bottom: 15px; right: 20px; width: 220px; height: 230px; pointer-events: none; }
        .attack-btn { position: absolute; bottom: 5px; right: 5px; width: 78px; height: 78px; background: radial-gradient(circle, #f3c654 0%, #8f5c0a 100%); border: 3px solid #ffe596; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #fff; cursor: pointer; pointer-events: auto; }
        
        .heal-spell-btn { position: absolute; bottom: 130px; right: 95px; width: 48px; height: 48px; background: radial-gradient(circle, #00e676 0%, #1b5e20 100%); border: 2px solid #b9f6ca; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.65rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto; }

        .skill-btn { position: absolute; width: 62px; height: 62px; background: rgba(15, 25, 40, 0.9); border: 2px solid #00aaff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: bold; color: #fff; cursor: pointer; pointer-events: auto; touch-action: none; }
        .skill-btn.locked { border-color: #555; opacity: 0.5; filter: grayscale(1); }
        .skill-desc-label { position: absolute; bottom: -18px; width: 70px; text-align: center; font-size: 0.65rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }
        .skill-cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; color: #ffeb3b; font-weight: bold; pointer-events: none; }

        #skill-3 { bottom: 130px; right: 20px; border-color: #e040fb; }
        #skill-2 { bottom: 90px; right: 100px; border-color: #00e676; }
        #skill-1 { bottom: 10px; right: 115px; border-color: #ff9100; }

        .pick-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070d18; z-index: 150; display: flex; flex-direction: column; padding: 15px; }
        .pick-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .pick-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 1rem; color: #888; }
        .pick-tabs .active { color: #f3c654; border-bottom: 2px solid #f3c654; }
        .pick-cancel-btn { background: none; border: none; color: #aaa; font-size: 1rem; cursor: pointer; }
        
        .pick-content-layout { display: flex; flex: 1; margin-top: 15px; gap: 20px; overflow: hidden; }
        .pick-hero-sidebar { width: 180px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow-y: auto; }
        .pick-hero-thumb { width: 75px; height: 75px; background: #1a2a40; border: 2px solid #334455; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; }
        .pick-hero-thumb.active { border-color: #f3c654; box-shadow: 0 0 10px rgba(243, 198, 84, 0.6); }

        .pick-center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(30,50,80,0.3) 0%, rgba(5,10,18,0.8) 100%); border-radius: 12px; }
        .stage-hero-avatar { font-size: 10rem; }
        
        .pick-right-sidebar { width: 220px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        .team-slot { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 0.9rem; color: #aaa; }
        
        .pick-confirm-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: 2px solid #fef08a; color: #fff; font-weight: bold; font-size: 1.2rem; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }

        .result-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 10, 18, 0.9); z-index: 200; }
        .result-box { background: rgba(13, 23, 38, 0.95); border: 2px solid #f3c654; border-radius: 15px; padding: 30px; text-align: center; width: 85%; max-width: 420px; }
        .result-title-win { font-size: 3rem; font-weight: 900; color: #ffd700; }
        .result-title-lose { font-size: 3rem; font-weight: 900; color: #ff3366; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="top-hud" class="top-score-bar hidden">
        <span class="level-text" id="level-display">Lv.1</span>
        <span class="score-blue" id="score-blue">0</span>
        <span>VS</span>
        <span class="score-red" id="score-red">0</span>
        <span class="gold-text" id="gold-display">🪙 300</span>
        <span class="kda-text" id="kda-display">KDA: 0 / 0 / 0</span>
    </div>

    <div id="result-screen" class="result-overlay hidden">
        <div class="result-box">
            <div id="result-title" class="result-title-win">VICTORY</div>
            <p id="result-subtitle" style="color: #aaa; margin-bottom: 20px;">成功摧毀敵方主堡！</p>
            <button class="pick-confirm-btn" style="width:100%;" id="btn-back-lobby">返回遊戲大廳</button>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <div class="top-navbar">
            <div class="profile-area">
                <div id="user-profile" class="user-profile-box">
                    <img id="user-avatar" class="user-avatar" src="https://via.placeholder.com/32" alt="Avatar">
                    <span id="user-name" class="user-name">訪客玩家</span>
                </div>
            </div>

            <div class="resource-group">
                <div class="res-item res-gold" id="header-gold">🟡 300</div>
            </div>
        </div>

        <div class="main-content">
            <div class="hero-heroine-bg">
                <div class="heroine-avatar">🗡️</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bottom-nav">
                <div class="nav-btn active">🛡️ 英雄對戰</div>
            </div>

            <div class="start-group">
                <div class="mode-select-btn" id="btn-mode-1v1">
                    <span class="icon">⚔️</span>
                    <span class="label">1v1 單挑</span>
                </div>
                <div class="start-match-btn" id="btn-start-match">
                    <span class="start-text">START</span>
                </div>
            </div>
        </div>
    </div>

    <div id="pick-screen" class="pick-screen-overlay hidden">
        <div class="pick-top-bar">
            <div class="pick-tabs">
                <span class="active">英雄選擇</span>
            </div>
            <button class="pick-cancel-btn" id="btn-pick-back">取消 ✕</button>
        </div>

        <div class="pick-content-layout">
            <div class="pick-hero-sidebar" id="hero-select-grid"></div>

            <div class="pick-center-stage">
                <div class="stage-hero-avatar" id="stage-hero-avatar">🗡️</div>
                <div class="stage-hero-info">
                    <h2 id="selected-hero-name" style="color:#f3c654; font-size: 1.8rem;">納克羅斯</h2>
                    <p id="selected-hero-type" style="color:#aaa; font-size: 0.95rem;">刺客 / 高機動性爆發</p>
                </div>
            </div>

            <div class="pick-right-sidebar">
                <div class="team-slot"><span>我方 (你)</span><span style="color:#00d2ff;">準備就緒</span></div>
                <div class="team-slot"><span id="ai-opponent-slot">電競AI對手</span><span style="color:#ff4444;">隨機配對</span></div>
                <button class="pick-confirm-btn" id="btn-confirm-hero">確 定</button>
            </div>
        </div>
    </div>

    <div id="hud-layer" class="hidden">
        <div class="fast-buy-container" id="fast-buy-list"></div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="controls-right">
            <div class="attack-btn" id="btn-attack">⚔️</div>
            <div class="heal-spell-btn" id="btn-heal-spell">
                恢復
                <div class="skill-cd-overlay hidden" id="cd-heal"></div>
            </div>
            <div class="skill-btn" id="skill-3" data-skill="3">
                大招
                <div class="skill-desc-label" id="lbl-skill-3">霸體傷害</div>
                <div class="skill-cd-overlay hidden" id="cd-3"></div>
            </div>
            <div class="skill-btn" id="skill-2" data-skill="2">
                二技
                <div class="skill-desc-label" id="lbl-skill-2">強化位移</div>
                <div class="skill-cd-overlay hidden" id="cd-2"></div>
            </div>
            <div class="skill-btn" id="skill-1" data-skill="1">
                一技
                <div class="skill-desc-label" id="lbl-skill-1">位移擊飛</div>
                <div class="skill-cd-overlay hidden" id="cd-1"></div>
            </div>
        </div>
    </div>
</div>

<script>
const LOCAL_STORAGE_KEY = 'aov_game_user_data';
let currentUserData = { userId: '', name: '訪客玩家', avatar: 'https://via.placeholder.com/32', isGuest: true, gold: 300 };

function initUserData() {
    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (saved) { try { currentUserData = JSON.parse(saved); } catch (e) {} }
    else { currentUserData.userId = 'guest_' + Math.random().toString(36).substr(2, 9); saveUserData(); }
    updateUserProfileUI();
}

function saveUserData() { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(currentUserData)); }

function updateUserProfileUI() {
    const headerGold = document.getElementById('header-gold');
    if (headerGold) headerGold.innerText = `🟡 ${Math.floor(currentUserData.gold)}`;
}

window.addEventListener('DOMContentLoaded', () => { initUserData(); });

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let MAP_SIZE = 4200;
let ROAD_WIDTH = 320; 
let isRunning = false;
let gameMode = '1v1';
let selectedHeroKey = 'nakroth';
let randomAiKey = 'krixi';

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const HERO_DB = {
    'nakroth': { name: '納克羅斯', type: '刺客 / 高機動性', atk: 120, range: 150, avatar: '🗡️', color1: '#8e44ad', color2: '#d7bde2', s1: '擊飛位移', s2: '強化普攻', s3: '霸體連擊' },
    'valhein': { name: '凡恩', type: '射手 / 物理攻擊', atk: 85, range: 240, avatar: '🎯', color1: '#c29b38', color2: '#ffe89e', s1: '獵魔星標', s2: '黃色飛鏢', s3: '水銀彈幕' },
    'krixi': { name: '克里希', type: '法師 / 魔法攻擊', atk: 70, range: 220, avatar: '🧚‍♀️', color1: '#43a047', color2: '#a5d6a7', s1: '蝶影穿梭', s2: '落葉擊飛', s3: '月落星沉' },
    'zuka': { name: '祖卡', type: '戰士 / 物理爆發', atk: 110, range: 140, avatar: '🐼', color1: '#ff9800', color2: '#ffe082', s1: '泰山壓頂', s2: '熊貓護盾', s3: '沉重打擊' }
};

const ITEMS_DB = [
    { id: 'ad_1', name: '聖劍', cost: 300, atk: 30 },
    { id: 'ap_1', name: '魔法書', cost: 300, atk: 25 },
    { id: 'def_1', name: '守衛鎧甲', cost: 400, hp: 400 }
];

let blueKills = 0, redKills = 0;
let kills = 0, deaths = 0, assists = 0;
let player = null, entities = [], skillEffects = [], attackEffects = [], camera = { x: 0, y: 0 };
let minionSpawnTimer = 0;

let joystickDir = { x: 0, y: 0 };
let joystickTouchId = null;
let joystickCenter = { x: 0, y: 0 };
let activeSkillDrag = null;

let skillCooldowns = { 1: 0, 2: 0, 3: 0 };
let healCooldown = 0;
const skillMaxCDs = { 1: 3.0, 2: 5.0, 3: 10.0 };
let nakrothS1Stage = 1;

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');

function bindClick(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', (e) => { e.stopPropagation(); fn(e); });
    el.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); fn(e); }, { passive: false });
}

bindClick('btn-mode-1v1', () => openHeroPick('1v1'));
bindClick('btn-start-match', () => openHeroPick('1v1'));
bindClick('btn-confirm-hero', () => confirmStartGame());
bindClick('btn-pick-back', () => backToMenuFromPick());
bindClick('btn-back-lobby', () => backToLobby());
bindClick('btn-heal-spell', () => useHealSpell());

joystick.addEventListener('pointerdown', e => {
    joystickTouchId = e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    const rect = joystick.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
});
joystick.addEventListener('pointermove', e => {
    if (e.pointerId === joystickTouchId) updateJoystick(e.clientX, e.clientY);
});
function resetJoystick(e) {
    if (e.pointerId === joystickTouchId) {
        joystickTouchId = null;
        joystickDir = { x: 0, y: 0 };
        knob.style.transform = `translate(0px, 0px)`;
    }
}
joystick.addEventListener('pointerup', resetJoystick);
joystick.addEventListener('pointercancel', resetJoystick);

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystickCenter.x;
    let dy = clientY - joystickCenter.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 40;
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
}

const attackBtn = document.getElementById('btn-attack');
attackBtn.addEventListener('pointerdown', () => performAttack());

function useHealSpell() {
    if (!player || !player.alive || healCooldown > 0) return;
    player.hp = Math.min(player.maxHp, player.hp + 2000);
    healCooldown = 30.0;
    skillEffects.push({ x: player.x, y: player.y, dirX: 0, dirY: 0, life: 0.8, speed: 0, size: 50, color: '#00e676', dmg: -2000, team: player.team });
}

document.querySelectorAll('.skill-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
        let skillId = parseInt(btn.dataset.skill);
        let reqLevel = skillId === 1 ? 1 : (skillId === 2 ? 2 : 4);
        
        let isNakrothS2nd = (player && player.heroKey === 'nakroth' && skillId === 1 && nakrothS1Stage === 2);
        if (!isNakrothS2nd && (skillCooldowns[skillId] > 0 || !player || player.level < reqLevel || !player.alive)) return;

        e.preventDefault();
        e.stopPropagation();

        btn.setPointerCapture(e.pointerId);
        let rect = btn.getBoundingClientRect();
        activeSkillDrag = { 
            skillId: skillId, 
            pointerId: e.pointerId, 
            centerX: rect.left + rect.width / 2, 
            centerY: rect.top + rect.height / 2, 
            dirX: 0, 
            dirY: -1,
            dragDist: 0
        };
    }, { passive: false });

    btn.addEventListener('pointermove', e => {
        if (activeSkillDrag && activeSkillDrag.pointerId === e.pointerId) {
            e.preventDefault();
            let dx = e.clientX - activeSkillDrag.centerX;
            let dy = e.clientY - activeSkillDrag.centerY;
            let len = Math.hypot(dx, dy);
            activeSkillDrag.dragDist = Math.min(len, 60);
            if (len > 5) { 
                activeSkillDrag.dirX = dx / len; 
                activeSkillDrag.dirY = dy / len; 
            }
        }
    }, { passive: false });

    function releaseSkill(e) {
        if (activeSkillDrag && activeSkillDrag.pointerId === e.pointerId) {
            castSkill(activeSkillDrag.skillId, activeSkillDrag.dirX, activeSkillDrag.dirY, activeSkillDrag.dragDist);
            activeSkillDrag = null;
        }
    }
    btn.addEventListener('pointerup', releaseSkill);
    btn.addEventListener('pointercancel', releaseSkill);
});

function clampPosition(x, y, radius = 26) {
    let startX = 400, startY = MAP_SIZE - 400;
    let endX = MAP_SIZE - 400, endY = 400;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;

    let vecX = x - startX, vecY = y - startY;
    let proj = Math.max(0, Math.min(lineLen, vecX * uX + vecY * uY));

    let closestX = startX + proj * uX, closestY = startY + proj * uY;
    let perpX = x - closestX, perpY = y - closestY;
    let distFromCenter = Math.hypot(perpX, perpY);

    let maxDist = (ROAD_WIDTH / 2) - radius;
    if (distFromCenter > maxDist) {
        if (distFromCenter === 0) return { x: closestX, y: closestY };
        return { x: closestX + (perpX / distFromCenter) * maxDist, y: closestY + (perpY / distFromCenter) * maxDist };
    }
    return { x, y };
}

class Entity {
    constructor(x, y, team, radius = 22) {
        this.x = x; this.y = y; this.team = team;
        this.radius = radius; this.hp = 5000; this.maxHp = 5000; this.alive = true;
    }
    takeDamage(dmg, sourceTeam) {
        if (!this.alive) return;
        
        if (this instanceof Turret || this instanceof NexusBase) {
            let enemyMinions = entities.filter(e => e instanceof Minion && e.alive && e.team === this.team && Math.hypot(e.x - this.x, e.y - this.y) < 220);
            if (enemyMinions.length === 0) dmg *= 0.2; // 無兵線減傷 80%
        }

        if (this instanceof NexusBase) {
            let enemyTurrets = entities.filter(e => e instanceof Turret && e.alive && e.team === this.team);
            if (enemyTurrets.length > 0) return;
        }

        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0; this.alive = false;
            if (this instanceof Hero) {
                if (sourceTeam === 'blue') { blueKills++; if (!this.isPlayer) { kills++; player.gold += 150; currentUserData.gold += 150; saveUserData(); } }
                else { redKills++; if (this.isPlayer) deaths++; }
                updateTopScopeUI();
                this.respawnTimer = 5.0;
            } else if (this instanceof NexusBase) {
                showGameResult(this.team === 'red');
            }
        }
    }
}

class Fountain {
    constructor(x, y, team) { this.x = x; this.y = y; this.team = team; this.radius = 120; }
    update() {
        entities.forEach(e => {
            if (e instanceof Hero && e.alive && e.team === this.team && Math.hypot(e.x - this.x, e.y - this.y) < this.radius) {
                e.hp = Math.min(e.maxHp, e.hp + (e.maxHp * 0.1 / 60));
            }
        });
    }
    draw(ctx) {
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        ctx.beginPath(); ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? 'rgba(0, 230, 118, 0.12)' : 'rgba(255, 23, 68, 0.12)'; ctx.fill();
        ctx.strokeStyle = this.team === 'blue' ? '#00e676' : '#ff1744'; ctx.lineWidth = 3; ctx.stroke();
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer = false) {
        let heroData = HERO_DB[heroKey];
        super(x, y, team, 26);
        this.startX = x; this.startY = y;
        this.heroKey = heroKey; this.heroData = heroData; this.isPlayer = isPlayer;
        this.gold = currentUserData.gold; this.exp = 0; this.level = 1;
        this.atk = heroData.atk; this.range = heroData.range;
        
        // 降低基礎跑速，讓對戰走位更扎實
        this.speed = 3.2; 
        
        this.maxHp = isPlayer ? 5000 : 7500;
        this.hp = this.maxHp;
        this.minionIncomeTimer = 0;
        this.respawnTimer = 0;
        this.attackCooldown = 0;
        
        // 強化普攻狀態與霸體狀態
        this.isEnhancedAtk = false;
        this.isSuperArmor = false; // 霸體開關
        this.superArmorTimer = 0;
    }

    update() {
        if (!this.alive) {
            if (this.respawnTimer > 0) {
                this.respawnTimer -= 1/60;
                if (this.respawnTimer <= 0) {
                    this.x = this.startX; this.y = this.startY;
                    this.hp = this.maxHp; this.alive = true;
                }
            }
            return;
        }

        // 霸體時間計算
        if (this.superArmorTimer > 0) {
            this.superArmorTimer -= 1/60;
            if (this.superArmorTimer <= 0) this.isSuperArmor = false;
        }

        if (this.isPlayer) {
            if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                let nextX = this.x + joystickDir.x * this.speed;
                let nextY = this.y + joystickDir.y * this.speed;
                let clamped = clampPosition(nextX, nextY, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            }
            
            this.minionIncomeTimer += 1/60;
            if (this.minionIncomeTimer >= 1.0) {
                this.gold += 3; currentUserData.gold += 3; saveUserData();
                this.minionIncomeTimer = 0;
                document.getElementById('header-gold').innerText = `🪙 ${Math.floor(this.gold)}`;
            }

            this.exp += 0.08;
            if (this.exp >= this.level * 100 && this.level < 15) {
                this.level++; this.maxHp += 450; this.hp = Math.min(this.maxHp, this.hp + 450);
                updateTopScopeUI();
            }
        } else {
            // AI 敵方打擊與普攻特效
            if (this.attackCooldown > 0) this.attackCooldown -= 1/60;
            let target = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < 350);
            if (target) {
                let dx = target.x - this.x, dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > this.range) {
                    let nextX = this.x + (dx / dist) * (this.speed * 0.6);
                    let nextY = this.y + (dy / dist) * (this.speed * 0.6);
                    let clamped = clampPosition(nextX, nextY, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                } else if (this.attackCooldown <= 0) {
                    target.takeDamage(this.atk * 0.5, this.team);
                    // 敵方紅色打擊特效
                    attackEffects.push({ x: target.x, y: target.y, life: 0.35, radius: 26, color: '#ff3366' });
                    this.attackCooldown = 1.0;
                }
            } else {
                let targetX = this.team === 'blue' ? MAP_SIZE - 400 : 400;
                let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
                let dx = targetX - this.x, dy = targetY - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 50) {
                    let nextX = this.x + (dx / dist) * (this.speed * 0.5);
                    let nextY = this.y + (dy / dist) * (this.speed * 0.5);
                    let clamped = clampPosition(nextX, nextY, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                }
            }
        }
        let safePos = clampPosition(this.x, this.y, this.radius);
        this.x = safePos.x; this.y = safePos.y;
    }

    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;

        // 霸體護盾黃色特效繪製
        if (this.isSuperArmor) {
            ctx.beginPath(); ctx.arc(screenX, screenY, this.radius + 8, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
            ctx.fillText('⚡ 霸體', screenX, screenY - 60);
        }

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.heroData.color1; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = this.heroData.color2; ctx.stroke();
        ctx.restore();

        // **普攻範圍圈繪製**：黃色代表「強化普攻」；白色代表「一般普攻」
        if (this.isPlayer) {
            let activeRange = this.isEnhancedAtk ? this.range * 1.5 : this.range;
            ctx.beginPath(); ctx.arc(screenX, screenY, activeRange, 0, Math.PI * 2);
            ctx.strokeStyle = this.isEnhancedAtk ? 'rgba(255, 215, 0, 0.95)' : 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = this.isEnhancedAtk ? 3.5 : 1.5;
            ctx.stroke();
            ctx.fillStyle = this.isEnhancedAtk ? 'rgba(255, 215, 0, 0.15)' : 'rgba(255, 255, 255, 0.03)';
            ctx.fill();
        }

        // 血條與等級
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(screenX - 30, screenY - 45, 60, 6);
        ctx.fillStyle = this.team === 'blue' ? '#00e676' : '#ff1744';
        ctx.fillRect(screenX - 30, screenY - 45, (this.hp / this.maxHp) * 60, 6);

        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
        ctx.fillText(`Lv.${this.level}`, screenX, screenY - 50);
    }
}

class Turret extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 35);
        this.maxHp = 4000; this.hp = 4000; this.range = 300; this.atk = 90; this.cooldown = 0;
    }
    update() {
        if (!this.alive) return;
        if (this.cooldown > 0) this.cooldown -= 1/60;
        if (this.cooldown <= 0) {
            let target = entities.find(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) < this.range);
            if (target) {
                target.takeDamage(this.atk, this.team);
                attackEffects.push({ x: target.x, y: target.y, life: 0.3, radius: 28, color: '#ff3366' });
                this.cooldown = 1.0;
            }
        }
    }
    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;
        let enemyMinions = entities.filter(e => e instanceof Minion && e.alive && e.team === this.team && Math.hypot(e.x - this.x, e.y - this.y) < 220);
        let hasArmor = enemyMinions.length === 0;

        ctx.beginPath(); ctx.arc(screenX, screenY, this.range, 0, Math.PI * 2);
        ctx.strokeStyle = this.team === 'blue' ? 'rgba(0, 210, 255, 0.25)' : 'rgba(255, 68, 68, 0.25)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(screenX, screenY, 32, 0, Math.PI * 2);
        ctx.fillStyle = '#263238'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = hasArmor ? '#ff3366' : '#546e7a'; ctx.stroke();
        ctx.fillStyle = this.team === 'blue' ? '#1565c0' : '#c62828'; ctx.fillRect(screenX - 18, screenY - 26, 36, 42);
        if (hasArmor) { ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('🛡️ 減傷80%', screenX, screenY - 50); }
        ctx.fillStyle = '#000'; ctx.fillRect(screenX - 30, screenY - 40, 60, 6);
        ctx.fillStyle = '#00e676'; ctx.fillRect(screenX - 30, screenY - 40, (this.hp / this.maxHp) * 60, 6);
    }
}

class Minion extends Entity {

        else {

            let targetY = this.team === 'blue' ? 400 : MAP_SIZE - 400;
            let dx = targetX - this.x, dy = targetY - this.y, dist = Math.hypot(dx, dy);
            if (dist > 20) {
                let clamped = clampPosition(this.x + (dx / dist) * this.speed, this.y + (dy / dist) * this.speed, this.radius);
                this.x = clamped.x; this.y = clamped.y;
            }
        }

    draw(ctx) {
        if (!this.alive) return;
        let screenX = this.x - camera.x, screenY = this.y - camera.y;

function spawnMinionWave() {
    for (let i = 0; i < 3; i++) {
        let offset = i * 35;
        let bluePos = clampPosition(450 + offset, MAP_SIZE - 450 - offset, 14);
        let redPos = clampPosition(MAP_SIZE - 450 - offset, 450 + offset, 14);
        entities.push(new Minion(bluePos.x, bluePos.y, 'blue'));
        entities.push(new Minion(redPos.x, redPos.y, 'red'));
    }
}

// **我方普攻判定**：強化普攻用金黃色特效，普通普攻用白色特效
function performAttack() {
    if (!player || !player.alive) return;
    let activeRange = player.isEnhancedAtk ? player.range * 1.5 : player.range;
    let target = entities.find(e => e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= activeRange);
    if (target) {
        let finalDmg = player.atk;
        if (player.isEnhancedAtk) {
            finalDmg *= 2.0; // 納克 / 祖卡放完技能傷害加倍
            player.isEnhancedAtk = false;
            attackEffects.push({ x: target.x, y: target.y, life: 0.4, radius: 35, color: '#ffd700' });
        } else {
            attackEffects.push({ x: target.x, y: target.y, life: 0.3, radius: 24, color: '#ffffff' });
        }
        target.takeDamage(finalDmg, player.team);
    }
}

function castSkill(skillId, dirX, dirY, dragDist) {
    if (!player || !player.alive) return;

    // 拖曳微拉與點擊優化：計算對應的距離，不強迫一定拉到最遠
    let castDistance = Math.max(100, dragDist * 3.5);

    if (player.heroKey === 'nakroth' && skillId === 1) {
        let dashX = player.x + dirX * castDistance;
        let dashY = player.y + dirY * castDistance;
        let clamped = clampPosition(dashX, dashY, player.radius);
        player.x = clamped.x; player.y = clamped.y;
        
        // 擊飛與傷害
        skillEffects.push({ x: player.x, y: player.y, dirX:0, dirY:0, life:0.5, speed:0, size:40, color:'#8e44ad', dmg:180, team:player.team });

        if (nakrothS1Stage === 1) { nakrothS1Stage = 2; return; }
        else { nakrothS1Stage = 1; skillCooldowns[1] = skillMaxCDs[1]; return; }
    }

    skillCooldowns[skillId] = skillMaxCDs[skillId];

    if (player.heroKey === 'nakroth') {
        if (skillId === 2) { 
            let dashX = player.x - dirX * castDistance;
            let dashY = player.y - dirY * castDistance;
            let clamped = clampPosition(dashX, dashY, player.radius);
            player.x = clamped.x; player.y = clamped.y;
            
            // **觸發強化普攻**：下次普攻傷害*2、範圍變大且有黃圈提示
            player.isEnhancedAtk = true; 
        }
        else if (skillId === 3) { 
            // **霸體大招**
            player.isSuperArmor = true;
            player.superArmorTimer = 1.2;
            skillEffects.push({ x: player.x, y: player.y, dirX:0, dirY:0, life:0.8, speed:0, size:65, color:'#d7bde2', dmg:320, team:player.team }); 
        }
    } else if (player.heroKey === 'zuka') {
        player.isEnhancedAtk = true; // 祖卡放完技能觸發強化普攻
        let dashX = player.x + dirX * castDistance;
        let dashY = player.y + dirY * castDistance;
        let clamped = clampPosition(dashX, dashY, player.radius);
        player.x = clamped.x; player.y = clamped.y;
        skillEffects.push({ x: player.x, y: player.y, dirX:0, dirY:0, life:0.5, speed:0, size:45, color:'#ff9800', dmg:180, team:player.team }); 
    } else {
        if (skillId === 1) skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 1.0, speed: 11, size: 18, color: '#ffd700', dmg: 140, team: player.team });
        else if (skillId === 2) skillEffects.push({ x: player.x, y: player.y, dirX, dirY, life: 1.0, speed: 9, size: 16, color: '#00e5ff', dmg: 110, team: player.team });
        else if (skillId === 3) {
            for (let angleOff = -0.4; angleOff <= 0.4; angleOff += 0.2) {
                let cos = Math.cos(angleOff), sin = Math.sin(angleOff);
                skillEffects.push({ x: player.x, y: player.y, dirX: dirX * cos - dirY * sin, dirY: dirX * sin + dirY * cos, life: 1.0, speed: 12, size: 18, color: '#ff3d00', dmg: 180, team: player.team });
            }
        }
    }
}

function updateTopScopeUI() {
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;
    document.getElementById('level-display').innerText = `Lv.${player ? player.level : 1}`;
    document.getElementById('gold-display').innerText = `🪙 ${Math.floor(player ? player.gold : currentUserData.gold)}`;

    let healOverlay = document.getElementById('cd-heal');
    if (healCooldown > 0) { healOverlay.classList.remove('hidden'); healOverlay.innerText = Math.ceil(healCooldown); }
    else { healOverlay.classList.add('hidden'); }

    for (let id = 1; id <= 3; id++) {
        let reqLevel = id === 1 ? 1 : (id === 2 ? 2 : 4);
        let btn = document.getElementById(`skill-${id}`);
        let cdOverlay = document.getElementById(`cd-${id}`);
        let isNakrothS2nd = (player && player.heroKey === 'nakroth' && id === 1 && nakrothS1Stage === 2);

        if (player && player.level < reqLevel) {
            btn.classList.add('locked'); cdOverlay.classList.remove('hidden'); cdOverlay.innerText = `Lv.${reqLevel}`;
        } else {
            btn.classList.remove('locked');
            if (isNakrothS2nd) { cdOverlay.classList.remove('hidden'); cdOverlay.innerText = '2段'; }
            else if (skillCooldowns[id] > 0) { cdOverlay.classList.remove('hidden'); cdOverlay.innerText = skillCooldowns[id].toFixed(1); }
            else { cdOverlay.classList.add('hidden'); }
        }
    }
}

function renderFastBuy() {
    let container = document.getElementById('fast-buy-list');
    container.innerHTML = '';
    ITEMS_DB.forEach(item => {
        if (player && player.gold >= item.cost) {
            let div = document.createElement('div');
            div.className = 'fast-buy-item';
            div.innerHTML = `<b>${item.name}</b><span style="color:#ffd700;font-size:0.8rem;">🪙${item.cost}</span>`;
            div.addEventListener('click', (e) => {
                e.stopPropagation(); player.gold -= item.cost; currentUserData.gold = player.gold; saveUserData();
                player.atk += item.atk || 0; player.maxHp += item.hp || 0; player.hp = Math.min(player.maxHp, player.hp + (item.hp || 0));
                updateTopScopeUI();
            });
            container.appendChild(div);
        }
    });
}

function confirmStartGame() {
    document.getElementById('pick-screen').classList.add('hidden');
    document.getElementById('hud-layer').classList.remove('hidden');
    document.getElementById('top-hud').classList.remove('hidden');

    blueKills = 0; redKills = 0; kills = 0; deaths = 0; assists = 0;
    nakrothS1Stage = 1; healCooldown = 0; entities = [];
    
    let blueSpawn = { x: 400, y: MAP_SIZE - 400 };
    let redSpawn = { x: MAP_SIZE - 400, y: 400 };

    entities.push(new Fountain(blueSpawn.x, blueSpawn.y, 'blue'));
    entities.push(new Fountain(redSpawn.x, redSpawn.y, 'red'));

    player = new Hero(blueSpawn.x, blueSpawn.y, 'blue', selectedHeroKey, true);
    player.gold = currentUserData.gold;
    entities.push(player);

    entities.push(new Hero(redSpawn.x, redSpawn.y, 'red', randomAiKey, false));

    entities.push(new NexusBase(800, MAP_SIZE - 800, 'blue'));
    entities.push(new NexusBase(MAP_SIZE - 800, 800, 'red'));

    let bTurret = clampPosition(1600, MAP_SIZE - 1600, 35);
    let rTurret = clampPosition(MAP_SIZE - 1600, 1600, 35);
    entities.push(new Turret(bTurret.x, bTurret.y, 'blue'));
    entities.push(new Turret(rTurret.x, rTurret.y, 'red'));

    let heroInfo = HERO_DB[selectedHeroKey];
    document.getElementById('lbl-skill-1').innerText = heroInfo.s1;
    document.getElementById('lbl-skill-2').innerText = heroInfo.s2;
    document.getElementById('lbl-skill-3').innerText = heroInfo.s3;

    spawnMinionWave();
    isRunning = true;
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    if (!isRunning) return;

    for (let id in skillCooldowns) {
        if (skillCooldowns[id] > 0) { skillCooldowns[id] -= 1/60; if (skillCooldowns[id] < 0) skillCooldowns[id] = 0; }
    }
    if (healCooldown > 0) { healCooldown -= 1/60; if (healCooldown < 0) healCooldown = 0; }
    updateTopScopeUI();

    if (player) {
        player.update();
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
    }

    ctx.fillStyle = '#070d14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1e2d3d'; ctx.lineWidth = ROAD_WIDTH;
    ctx.beginPath();
    ctx.moveTo(400 - camera.x, MAP_SIZE - 400 - camera.y);
    ctx.lineTo(MAP_SIZE - 400 - camera.x, 400 - camera.y);
    ctx.stroke();

    entities.forEach(e => { if (e.update) e.update(); e.draw(ctx); });

    minionSpawnTimer += 1/60;
    if (minionSpawnTimer >= 15) { spawnMinionWave(); minionSpawnTimer = 0; }

    // 技能指示器
    if (activeSkillDrag && player && player.alive) {
        let pX = player.x - camera.x, pY = player.y - camera.y;
        let dirX = activeSkillDrag.dirX, dirY = activeSkillDrag.dirY;
        let dist = Math.max(100, activeSkillDrag.dragDist * 3.5);

        ctx.save();
        ctx.beginPath(); ctx.moveTo(pX, pY); ctx.lineTo(pX + dirX * dist, pY + dirY * dist);
        ctx.strokeStyle = 'rgba(0, 210, 255, 0.7)'; ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();
    }

    for (let i = attackEffects.length - 1; i >= 0; i--) {
        let af = attackEffects[i]; af.life -= 0.05;
        ctx.beginPath(); ctx.arc(af.x - camera.x, af.y - camera.y, af.radius, 0, Math.PI * 2);
        ctx.strokeStyle = af.color || 'rgba(255, 235, 59, 0.8)'; ctx.lineWidth = 3; ctx.stroke();
        if (af.life <= 0) attackEffects.splice(i, 1);
    }

    for (let i = skillEffects.length - 1; i >= 0; i--) {
        let fx = skillEffects[i]; fx.x += fx.dirX * fx.speed; fx.y += fx.dirY * fx.speed; fx.life -= 0.025;
        ctx.beginPath(); ctx.arc(fx.x - camera.x, fx.y - camera.y, fx.size, 0, Math.PI * 2);
        ctx.fillStyle = fx.color; ctx.fill();
        if (fx.dmg > 0) {
            entities.forEach(e => {
                if (e.alive && e.team !== fx.team && Math.hypot(e.x - fx.x, e.y - fx.y) < fx.size + 10) {
                    e.takeDamage(fx.dmg, fx.team);
                }
            });
        }
        if (fx.life <= 0) skillEffects.splice(i, 1);
    }

    renderFastBuy();
    requestAnimationFrame(gameLoop);
}
</script>
