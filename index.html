function updateTopScopeUI() {
    if (!player) return;
    document.getElementById('level-display').innerText = `Lv.${player.level}`;
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    document.getElementById('gold-display').innerText = `🪙 ${Math.floor(player.gold)}`;
    document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;
    updateUserProfileUI();
}

// 底部狀態欄更新（史蘭茲 2 技與大招各自獨立顯示）
function updateStatusBuffBar() {
    const bar = document.getElementById('status-buff-bar');
    if (!bar || !player || !player.alive) {
        if (bar) bar.innerHTML = '';
        return;
    }

    let buffs = [];

    if (player.heroKey === 'slimz') {
        let st = heroSkillStage['slimz'];
        if (st && st.s2ActiveTimer > 0) {
            buffs.push({ icon: '🐰', name: '狩獵爆發', time: st.s2ActiveTimer.toFixed(1) });
        }
        if (st && st.ultActiveTimer > 0) {
            buffs.push({ icon: '🔥', name: '狂野增幅', time: st.ultActiveTimer.toFixed(1) });
        }
    }

    if (player.heroKey === 'valhein' && player.valheinPassiveStacks > 0) {
        buffs.push({ icon: '🎯', name: `獵手 ${player.valheinPassiveStacks}層`, time: (player.valheinPassiveTimer / 60).toFixed(1) });
    }

    if (player.heroKey === 'tarra') {
        if (player.tarraBuffStacks > 0) {
            buffs.push({ icon: '🪓', name: `戰意 ${player.tarraBuffStacks}層`, time: (player.tarraBuffTimer / 60).toFixed(1) });
        }
        if (player.tarraUltimateTimer > 0) {
            buffs.push({ icon: '💚', name: '狂血再生', time: (player.tarraUltimateTimer / 60).toFixed(1) });
        }
    }

    if (player.heroKey === 'lindis') {
        let st = heroSkillStage['lindis'];
        if (st && st.globalButterfly && st.globalButterfly.active && st.globalButterfly.timer > 0) {
            buffs.push({ icon: '🦋', name: `${st.globalButterfly.type}技蝴蝶`, time: (st.globalButterfly.timer / 60).toFixed(1) });
        }
    }

    if (player.heroKey === 'murad' && player.muradIsUnlocked && player.muradUnlockTimer > 0) {
        buffs.push({ icon: '⏳', name: '時空解鎖', time: player.muradUnlockTimer.toFixed(1) });
    }

    if (player.speedBuffTimer > 0) {
        buffs.push({ icon: '⚡', name: '疾行加速', time: (player.speedBuffTimer / 60).toFixed(1) });
    }

    if (buffs.length === 0) {
        if (bar.innerHTML !== '') bar.innerHTML = '';
        return;
    }

    bar.innerHTML = buffs.map(b => `
        <div class="status-buff-item">
            <div class="status-buff-name">${b.name}</div>
            <div class="status-buff-icon">${b.icon}</div>
            <div class="status-buff-timer">${b.time}s</div>
        </div>
    `).join('');
}

function updateSkillUI() {
    [1, 2, 3].forEach(id => {
        let btn = document.getElementById(`skill-${id}`);
        let upBtn = document.getElementById(`up-btn-${id}`);
        let cdEl = document.getElementById(`cd-${id}`);
        let descLbl = document.getElementById(`lbl-skill-${id}`);
        let sLv = skillLevels[id];

        let labelName = `技能${id}`;
        if (player && player.heroKey === 'slimz') {
            labelName = id === 1 ? '飛行長矛' : (id === 2 ? '狩獵爆發' : '狂野增幅');
        } else if (player && player.heroKey === 'lindis') {
            let st = heroSkillStage['lindis'];
            let gb = st && st.globalButterfly;
            if (gb && gb.active && gb.type === id) {
                let leftSec = (gb.timer / 60).toFixed(1);
                labelName = `${leftSec}s 回蝴蝶`;
            } else {
                labelName = id === 1 ? '1技位移' : (id === 2 ? '2技擋塔' : '3技擊退');
            }
        } else if (player && player.heroKey === 'liliana') {
            if (player.lilianaForm === 'human') {
                labelName = id === 1 ? '人1技' : (id === 2 ? '人2技' : '切換狐狸');
            } else {
                let st = heroSkillStage['liliana'][2];
                labelName = id === 1 ? '狐1技' : (id === 2 ? (st && st.foxStage2Ready ? '法球齊發' : '狐2技') : '切換人類');
            }
        } else if (player && player.heroKey === 'murad') {
            if (id === 1) labelName = player.muradStage1Count === 3 ? '返回影子' : `1技(${player.muradStage1Count}/3)`;
            else if (id === 2) labelName = '時空結界';
            else if (id === 3) labelName = player.muradIsUnlocked ? '時空殺陣' : '殺陣(未解)';
        } else if (player && player.heroKey === 'butterfly') {
            labelName = id === 1 ? '瞬殺迴旋' : (id === 2 ? '致命斬擊' : '瞬影斬殺');
        }
        descLbl.innerText = `Lv.${sLv} ${labelName}`;

        let canUpgrade = false;
        let maxLvl = (id === 3) ? SKILL_MAX_LEVEL_ULT : SKILL_MAX_LEVEL_NORMAL;

        if (unallocatedPoints > 0 && sLv < maxLvl) {
            if (id === 3) {
                let reqLvl = (sLv === 0) ? 4 : (sLv === 1 ? 8 : 12);
                if (player && player.level >= reqLvl) canUpgrade = true;
            } else {
                canUpgrade = true;
            }
        }

        if (canUpgrade) upBtn.classList.remove('hidden');
        else upBtn.classList.add('hidden');

        if (sLv === 0 || (player && player.isSilenced)) btn.classList.add('locked');
        else btn.classList.remove('locked');

        if (skillCooldowns[id] > 0) {
            cdEl.classList.remove('hidden');
            cdEl.innerText = skillCooldowns[id].toFixed(1);
        } else {
            cdEl.classList.add('hidden');
        }
    });

    let cdChallengerEl = document.getElementById('cd-challenger');
    if (challengerCooldown > 0) {
        cdChallengerEl.classList.remove('hidden');
        cdChallengerEl.innerText = Math.ceil(challengerCooldown);
    } else {
        cdChallengerEl.classList.add('hidden');
    }

    let cdHealEl = document.getElementById('cd-heal');
    if (healSpellCooldown > 0) {
        cdHealEl.classList.remove('hidden');
        cdHealEl.innerText = Math.ceil(healSpellCooldown);
    } else {
        cdHealEl.classList.add('hidden');
    }
}

function gameLoop() {
    if (!isRunning) return;

    gameTimeSeconds += 1 / 60;
    let mins = Math.floor(gameTimeSeconds / 60).toString().padStart(2, '0');
    let secs = Math.floor(gameTimeSeconds % 60).toString().padStart(2, '0');
    document.getElementById('game-time-display').innerText = `⏱️ ${mins}:${secs}`;

    // 更新陣亡英雄的復活倒數
    if (player && !player.alive && player.respawnRemaining > 0) {
        player.respawnRemaining = Math.max(0, player.respawnRemaining - 1 / 60);
    }
    if (aiHero && !aiHero.alive && aiHero.respawnRemaining > 0) {
        aiHero.respawnRemaining = Math.max(0, aiHero.respawnRemaining - 1 / 60);
    }

    // 若經濟面板正開啟，即時刷新倒數與經濟數據
    const econModal = document.getElementById('economy-modal');
    if (econModal && !econModal.classList.contains('hidden')) {
        renderEconomyModal();
    }

    passiveExpTimer += 1 / 60;
    if (passiveExpTimer >= 5.0) {
        passiveExpTimer = 0;
        entities.forEach(e => {
            if (e instanceof Hero && e.alive) e.gainExpAndGold(5, 10);
        });
    }

    [1, 2, 3].forEach(id => {
        if (skillCooldowns[id] > 0) skillCooldowns[id] = Math.max(0, skillCooldowns[id] - 1 / 60);
    });
    if (challengerCooldown > 0) challengerCooldown = Math.max(0, challengerCooldown - 1 / 60);
    if (healSpellCooldown > 0) healSpellCooldown = Math.max(0, healSpellCooldown - 1 / 60);

    minionSpawnTimer++;
    if (minionSpawnTimer >= 900) {
        minionSpawnTimer = 0;
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                if (!isRunning) return;
                entities.push(new Minion(450 - i * 15, MAP_SIZE - 450 + i * 15, 'blue'));
                entities.push(new Minion(MAP_SIZE - 450 + i * 15, 450 - i * 15, 'red'));
            }, i * 300);
        }
    }

    entities.forEach(e => e.update());

    projectiles.forEach((p, idx) => {
        if (p.isSlimzSpear) {
            let dx = p.targetX - p.x;
            let dy = p.targetY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed) {
                p.x = p.targetX; p.y = p.targetY;
            } else {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }

            let hitEnemy = null;
            entities.forEach(e => {
                if (!hitEnemy && !(e instanceof Building) && e.alive && e.team !== p.team) {
                    if (Math.hypot(e.x - p.x, e.y - p.y) <= p.radius + e.radius) {
                        hitEnemy = e;
                    }
                }
            });

            if (hitEnemy) {
                hitEnemy.takeDamage(p.damage, p.team, 'physical', p.owner);
                damageTexts.push({ x: hitEnemy.x, y: hitEnemy.y - 40, value: `${Math.floor(p.damage)}`, color: '#ff9800', life: 1.2 });
                if (hitEnemy instanceof Hero) {
                    hitEnemy.applyStun(2.0, '暈眩2s');
                }

                skillEffects.push({ x: p.x, y: p.y, life: 0.4, size: 70, color: 'rgba(255, 152, 0, 0.85)', team: p.team });
                projectiles.splice(idx, 1);
                return;
            }

            if (p.x === p.targetX && p.y === p.targetY) {
                projectiles.splice(idx, 1);
            }
            return;
        }

        if (p.isLilianaHomingBall) {
            p.lifeTimer--;
            if (p.speed < p.maxSpeed) p.speed += 0.15;

            if (p.targetEntity && p.targetEntity.alive) {
                let dx = p.targetEntity.x - p.x;
                let dy = p.targetEntity.y - p.y;
                let dist = Math.hypot(dx, dy);

                if (dist <= p.speed + p.targetEntity.radius) {
                    let baseDmg = p.damage;
                    let missingHp = Math.max(0, p.targetEntity.maxHp - p.targetEntity.hp);
                    let bonusDmg = missingHp * 0.30;
                    let totalDmg = calcRandomDmg(baseDmg + bonusDmg);

                    p.targetEntity.takeDamage(totalDmg, p.team, 'magical', p.owner);
                    skillEffects.push({ x: p.x, y: p.y, life: 0.3, size: 55, color: 'rgba(224, 64, 251, 0.9)', team: p.team });
                    damageTexts.push({ x: p.targetEntity.x, y: p.targetEntity.y - 40, value: `${Math.floor(totalDmg)}`, color: '#e040fb', life: 0.9 });
                    projectiles.splice(idx, 1);
                    return;
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                }
            } else {
                p.x += p.speed;
                p.y += p.speed;
            }

            if (p.lifeTimer <= 0) {
                projectiles.splice(idx, 1);
            }
            return;
        }

        if (p.isLilianaHumanBall) {
            let dx = p.targetX - p.x;
            let dy = p.targetY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed) {
                p.x = p.targetX; p.y = p.targetY;
            } else {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }

            let hit = false;
            entities.forEach(e => {
                if (!hit && !(e instanceof Building) && e.alive && e.team !== p.team) {
                    if (Math.hypot(e.x - p.x, e.y - p.y) <= p.radius + e.radius) {
                        hit = true;
                        e.takeDamage(p.damage, p.team, 'magical', p.owner);
                        damageTexts.push({ x: e.x, y: e.y - 40, value: `${Math.floor(p.damage)}`, color: '#e040fb', life: 0.8 });
                        if (e instanceof Hero) e.applyStun(1.5);
                        skillEffects.push({ x: p.x, y: p.y, life: 0.4, size: 75, color: 'rgba(224, 64, 251, 0.85)', team: p.team });
                    }
                }
            });

            if (hit || (p.x === p.targetX && p.y === p.targetY)) {
                projectiles.splice(idx, 1);
            }
            return;
        }

        if (p.isRazFireball) {
            let dx = p.targetX - p.x;
            let dy = p.targetY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed) {
                p.x = p.targetX; p.y = p.targetY;
            } else {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }

            let hitEnemy = null;
            entities.forEach(e => {
                if (!hitEnemy && !(e instanceof Building) && e.alive && e.team !== p.team) {
                    if (Math.hypot(e.x - p.x, e.y - p.y) <= p.radius + e.radius) {
                        hitEnemy = e;
                    }
                }
            });

            if (hitEnemy) {
                hitEnemy.takeDamage(p.damage, p.team, 'magical', p.owner);
                damageTexts.push({ x: hitEnemy.x, y: hitEnemy.y - 40, value: `${Math.floor(p.damage)}`, color: '#ff9800', life: 1.2 });
                hitEnemy.isSlowed = true;
                hitEnemy.slowFactor = p.slowRatio;
                setTimeout(() => { hitEnemy.isSlowed = false; }, 2000);
                skillEffects.push({ x: p.x, y: p.y, life: 0.4, size: 70, color: 'rgba(255, 69, 0, 0.85)', team: p.team });

                if (!p.hasBounced) {
                    let secondTarget = entities.find(e => !(e instanceof Building) && e.alive && e.team !== p.team && e !== hitEnemy && Math.hypot(e.x - hitEnemy.x, e.y - hitEnemy.y) <= 200);
                    if (secondTarget) {
                        let bounceDmg = p.damage * 0.75;
                        secondTarget.takeDamage(bounceDmg, p.team, 'magical', p.owner);
                        damageTexts.push({ x: secondTarget.x, y: secondTarget.y - 40, value: `${Math.floor(bounceDmg)}`, color: '#ff9800', life: 1.2 });
                        secondTarget.isSlowed = true;
                        secondTarget.slowFactor = p.slowRatio;
                        setTimeout(() => { secondTarget.isSlowed = false; }, 2000);
                    }
                }

                projectiles.splice(idx, 1);
                return;
            }

            if (p.x === p.targetX && p.y === p.targetY) {
                projectiles.splice(idx, 1);
            }
            return;
        }

        if (!p.returning) {
            let dx = p.targetX - p.x;
            let dy = p.targetY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed) {
                p.x = p.targetX; p.y = p.targetY;
                p.returning = true;
                p.hitTargets.clear();
            } else {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }
        } else {
            let ownerX = p.owner.x;
            let ownerY = p.owner.y;
            let dx = ownerX - p.x;
            let dy = ownerY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed + 15) {
                projectiles.splice(idx, 1);
                return;
            } else {
                p.x += (dx / dist) * (p.speed * 1.15);
                p.y += (dy / dist) * (p.speed * 1.15);
            }
        }

        entities.forEach(e => {
            if (!(e instanceof Building) && e.alive && e.team !== p.team) {
                let distToEnemy = Math.hypot(e.x - p.x, e.y - p.y);
                if (distToEnemy <= p.radius + e.radius && !p.hitTargets.has(e)) {
                    p.hitTargets.add(e);
                    e.takeDamage(p.damage, p.team, 'magical', p.owner);
                    damageTexts.push({ 
                        x: e.x, y: e.y - 40, 
                        value: `${Math.floor(p.damage)}`, 
                        color: '#ff69b4', life: 0.9 
                    });
                }
            }
        });
    });

    if (player) {
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(450 - camera.x, MAP_SIZE - 450 - camera.y);
    ctx.lineTo(MAP_SIZE - 450 - camera.x, 450 - camera.y);
    ctx.strokeStyle = '#1e3a5f';
    ctx.lineWidth = ROAD_WIDTH;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ['blue', 'red'].forEach(team => {
        let fountainX = team === 'blue' ? 380 : MAP_SIZE - 380;
        let fountainY = team === 'blue' ? MAP_SIZE - 380 : 380;
        let sx = fountainX - camera.x;
        let sy = fountainY - camera.y;

        ctx.beginPath();
        ctx.arc(sx, sy, 100, 0, Math.PI * 2);
        ctx.fillStyle = team === 'blue' ? 'rgba(0, 210, 255, 0.15)' : 'rgba(255, 68, 68, 0.15)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = team === 'blue' ? 'rgba(0, 210, 255, 0.6)' : 'rgba(255, 68, 68, 0.6)';
        ctx.setLineDash([6, 6]);
        ctx.stroke();
    });
    ctx.restore();

    if (player && player.heroKey === 'lindis') {
        let st = heroSkillStage['lindis'];
        if (st && st.globalButterfly && st.globalButterfly.active && st.globalButterfly.pos) {
            let bx = st.globalButterfly.pos.x - camera.x;
            let by = st.globalButterfly.pos.y - camera.y;
            ctx.save();
            ctx.beginPath();
            ctx.arc(bx, by, 16, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 210, 255, 0.65)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = '#00d2ff';
            ctx.textAlign = 'center';
            ctx.fillText('🦋 蝴蝶', bx, by - 22);
            ctx.restore();
        }
    }

    if (player && player.heroKey === 'murad' && player.muradShadowPos) {
        let sx = player.muradShadowPos.x - camera.x;
        let sy = player.muradShadowPos.y - camera.y;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, 28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 210, 255, 0.35)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#00d2ff';
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.font = 'bold 12px Arial';
        ctx.fillStyle = '#00d2ff';
        ctx.textAlign = 'center';
        ctx.fillText('⏳ 影子位置', sx, sy - 34);
        ctx.restore();
    }

    afterimages.forEach((af, idx) => {
        af.life -= 1 / 60;
        let sx = af.x - camera.x;
        let sy = af.y - camera.y;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, af.radius, 0, Math.PI * 2);
        ctx.fillStyle = af.team === 'blue' ? `rgba(0, 210, 255, ${af.life * 1.5})` : `rgba(255, 68, 68, ${af.life * 1.5})`;
        ctx.fill();
        ctx.restore();

        if (af.life <= 0) afterimages.splice(idx, 1);
    });

    entities.forEach(e => {
        if (e instanceof Building && e.alive) {
            let sx = e.x - camera.x;
            let sy = e.y - camera.y;
            ctx.save();
            ctx.beginPath();
            ctx.arc(sx, sy, e.attackRange, 0, Math.PI * 2);
            ctx.fillStyle = e.team === 'blue' ? 'rgba(0, 210, 255, 0.05)' : 'rgba(255, 68, 68, 0.05)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = e.team === 'blue' ? 'rgba(0, 210, 255, 0.4)' : 'rgba(255, 68, 68, 0.4)';
            ctx.setLineDash([8, 8]);
            ctx.stroke();
            ctx.restore();
        }
    });

    if (player && player.alive && activeSkillDrag) {
        let px = player.x - camera.x;
        let py = player.y - camera.y;
        let maxR = activeSkillDrag.maxRange;
        let dx = activeSkillDrag.dirX;
        let dy = activeSkillDrag.dirY;

        ctx.save();
        
        if (activeSkillDrag.type === 'range') {
            ctx.beginPath();
            ctx.arc(px, py, maxR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(76, 175, 80, 0.18)';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#4caf50';
            ctx.stroke();
        } else if (activeSkillDrag.type === 'position') {
            let clampedDist = Math.min(activeSkillDrag.currentDist, maxR);
            let targetX = px + dx * clampedDist;
            let targetY = py + dy * clampedDist;

            ctx.beginPath();
            ctx.arc(px, py, maxR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 170, 255, 0.05)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(0, 170, 255, 0.4)';
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            let cR = activeSkillDrag.circleRadius || 60;
            ctx.beginPath();
            ctx.arc(targetX, targetY, cR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#00ffff';
            ctx.stroke();
        } else if (activeSkillDrag.type === 'pointing') {
            let clampedDist = Math.min(activeSkillDrag.currentDist, maxR);
            let targetX = px + dx * clampedDist;
            let targetY = py + dy * clampedDist;

            ctx.beginPath();
            ctx.arc(px, py, maxR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.05)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.4)';
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(targetX, targetY);
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#e74c3c';
            ctx.stroke();

            let cR = activeSkillDrag.circleRadius || 65;
            let hoveredTarget = null;
            let worldTargetX = player.x + dx * clampedDist;
            let worldTargetY = player.y + dy * clampedDist;

            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team) {
                    let d = Math.hypot(e.x - worldTargetX, e.y - worldTargetY);
                    if (d <= cR + e.radius) {
                        hoveredTarget = e;
                    }
                }
            });

            ctx.beginPath();
            ctx.arc(targetX, targetY, cR, 0, Math.PI * 2);
            ctx.fillStyle = hoveredTarget ? 'rgba(255, 215, 0, 0.35)' : 'rgba(231, 76, 60, 0.3)';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = hoveredTarget ? '#ff3366' : '#e74c3c';
            ctx.stroke();

            if (hoveredTarget) {
                let hx = hoveredTarget.x - camera.x;
                let hy = hoveredTarget.y - camera.y;
                ctx.save();
                ctx.beginPath();
                ctx.arc(hx, hy, hoveredTarget.radius + 8, 0, Math.PI * 2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00e676';
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();
            }
        } else {
            let angle = Math.atan2(dy, dx);
            let rectWidth = 35;
            let rectLength = maxR;

            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.rect(0, -rectWidth / 2, rectLength, rectWidth);
            ctx.fillStyle = 'rgba(156, 39, 176, 0.25)';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ba68c8';
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();

        ctx.save();
        let cancelX = canvas.width - 60;
        let cancelY = 55;
        ctx.beginPath();
        ctx.arc(cancelX, cancelY, 32, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220, 53, 69, 0.9)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = 'bold 15px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✕ 取消', cancelX, cancelY);
        ctx.restore();
    }

    attackEffects.forEach((eff, idx) => {
        eff.life -= 1 / 60;
        if (eff.isLaser) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(eff.startX - camera.x, eff.startY - camera.y);
            ctx.lineTo(eff.x - camera.x, eff.y - camera.y);
            ctx.strokeStyle = eff.color;
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();
        }
        if (eff.life <= 0) attackEffects.splice(idx, 1);
    });

    projectiles.forEach(p => {
        let sx = p.x - camera.x;
        let sy = p.y - camera.y;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, p.isSlimzSpear ? 18 : (p.isLilianaHomingBall ? 18 : (p.isLilianaHumanBall ? 24 : (p.isRazFireball ? 22 : p.radius))), 0, Math.PI * 2);
        ctx.fillStyle = p.isSlimzSpear ? 'rgba(255, 152, 0, 0.95)' : (p.isLilianaHomingBall ? 'rgba(224, 64, 251, 0.95)' : (p.isLilianaHumanBall ? 'rgba(224, 64, 251, 0.95)' : (p.isRazFireball ? 'rgba(255, 140, 0, 0.95)' : 'rgba(255, 105, 180, 0.9)')));
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();
    });

    entities.forEach(e => {
        if (!e.alive) return;
        let sx = e.x - camera.x;
        let sy = e.y - camera.y;

        if (e instanceof Hero) {
            ctx.save();
            let isEnhanced = (e.heroKey === 'nakroth' && e.hasEnhancedAttack) || (e.heroKey === 'ryoma' && e.hasEnhancedAttack) || (e.heroKey === 'liliana' && e.hasEnhancedAttack) || (e.heroKey === 'raz' && e.razHasEnhancedAtk);
            let drawRange = e.heroKey === 'liliana' ? (e.lilianaForm === 'human' ? 240 : (isEnhanced ? 180 : 120)) : (e.heroKey === 'raz' ? (isEnhanced ? 180 : 120) : (isEnhanced ? 180 : e.range));

            if (isEnhanced || (e.isPlayer && isAttackingPressed)) {
                ctx.beginPath();
                ctx.arc(sx, sy, drawRange, 0, Math.PI * 2);
                ctx.strokeStyle = isEnhanced ? 'rgba(255, 215, 0, 0.9)' : 'rgba(243, 198, 84, 0.6)';
                ctx.lineWidth = isEnhanced ? 2.5 : 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
            }
            ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
        
        if (e instanceof Building) {
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
        } else if (e instanceof Minion) {
            ctx.fillStyle = e.team === 'blue' ? '#4dabf7' : '#ff6b6b';
        } else {
            ctx.fillStyle = e.team === 'blue' ? '#2e86de' : '#ee5253';
        }
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        if (e instanceof Building) {
            ctx.font = '22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(e.type === 'core' ? '🏰' : '🗼', sx, sy);
        }
        ctx.restore();

        let barW = e instanceof Building ? 70 : 50, barH = 6;
        let barX = sx - barW / 2;
        let barY = sy - e.radius - 24;
        
        if (e instanceof Hero) {
            ctx.save();
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
            let heroInfo = HERO_DB[e.heroKey];
            
            if (e.statusText && e.statusDuration > 0) {
                ctx.fillText(e.statusText, sx, barY - 4);
            } else {
                let multTag = (!e.isPlayer && e.statMultiplier !== 1.0) ? ` [*${e.statMultiplier}]` : '';
                ctx.fillText(`${heroInfo.name} Lv.${e.level || 1}${multTag}`, sx, barY - 4);
            }
            ctx.restore();
        }

        let maxHp = e.maxHp;
        let hpRatio = Math.max(0, Math.min(1, e.hp / maxHp));
        let shieldRatio = Math.max(0, Math.min(1, (e.shield || 0) / maxHp));
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX, barY, barW, barH);
        
        ctx.fillStyle = e.team === 'blue' ? '#00e676' : '#ff3366';
        ctx.fillRect(barX, barY, barW * hpRatio, barH);

        ctx.save();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.lineWidth = 1.5;
        let stepHp = 2000; 
        for (let hMark = stepHp; hMark < maxHp; hMark += stepHp) {
            let markRatio = hMark / maxHp;
            let markX = barX + barW * markRatio;
            ctx.beginPath();
            ctx.moveTo(markX, barY);
            ctx.lineTo(markX, barY + barH);
            ctx.stroke();
        }
        ctx.restore();

        if (shieldRatio > 0) {
            ctx.fillStyle = '#ffffff';
            let shieldStartX = barX + (barW * hpRatio);
            let shieldW = Math.min(barW - (barW * hpRatio), barW * shieldRatio);
            ctx.fillRect(shieldStartX, barY, shieldW, barH);
        }

        if (e instanceof Hero && e.statusText && e.statusDuration > 0) {
            let statusLineY = barY - 8;
            let statusRatio = Math.max(0, Math.min(1, e.statusDuration / e.statusMaxDuration));
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, statusLineY, barW, 3);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(barX, statusLineY, barW * statusRatio, 3);
        }

        let currentBottomY = barY + barH;

        if (e instanceof Hero) {
            let passiveBarY = currentBottomY + 2;
            let passiveBarH = 4;
            
            if (e.heroKey === 'slimz') {
                let st = heroSkillStage['slimz'];
                let slotW = (barW - 2 * 2) / 3;
                for (let i = 0; i < 3; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < st.atks) {
                        ctx.fillStyle = '#ff9800';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'lindis') {
                let st = heroSkillStage['lindis'];
                let hasB = st && st.globalButterfly && st.globalButterfly.active;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                ctx.fillStyle = '#00d2ff';
                ctx.fillRect(barX, passiveBarY, hasB ? barW : 0, passiveBarH);
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'murad') {
                let slotW = (barW - 3 * 2) / 4;
                for (let i = 0; i < 4; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.muradStacks) {
                        ctx.fillStyle = '#00d2ff';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'butterfly') {
                let slotW = (barW - 2 * 2) / 3;
                for (let i = 0; i < 3; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.butterflyStacks) {
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'liliana') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                ctx.fillStyle = e.lilianaForm === 'human' ? '#ffffff' : '#ab47bc';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'raz') {
                let ratio = e.razHasEnhancedAtk ? 1.0 : Math.min(1.0, e.razPassiveTimer / 5.0);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                ctx.fillStyle = '#ff9800';
                ctx.fillRect(barX, passiveBarY, barW * ratio, passiveBarH);
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'valhein') {
                let slotW = (barW - 3 * 2) / 4;
                for (let i = 0; i < 4; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.valheinPassiveStacks) {
                        ctx.fillStyle = '#ffd700';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'nakroth') {
                let slotW = (barW - 3 * 2) / 4;
                for (let i = 0; i < 4; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.nakrothPassiveCounter) {
                        ctx.fillStyle = '#d7bde2';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'ryoma') {
                let intervalReduction = (e.level - 1) * 0.1;
                let maxInterval = Math.max(1.0, 5.0 - intervalReduction);
                let ratio = e.hasEnhancedAttack ? 1.0 : Math.max(0, 1.0 - (e.ryomaPassiveTimer / maxInterval));

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(barX, passiveBarY, barW * ratio, passiveBarH);
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'tarra') {
                let slotW = (barW - 2 * 2) / 3;
                for (let i = 0; i < 3; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.tarraBuffStacks) {
                        ctx.fillStyle = '#ff9800';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            }
        }

        if (e instanceof Hero) {
            let reqExp = LEVEL_EXP_TABLE[e.level] || 150;
            let expRatio = Math.max(0, Math.min(1, (e.exp || 0) / reqExp));
            let expBarY = currentBottomY + 2;
            let expBarH = 3;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(barX, expBarY, barW, expBarH);
            ctx.fillStyle = '#9c27b0';
            ctx.fillRect(barX, expBarY, barW * expRatio, expBarH);
        }
    });

    skillEffects.forEach((eff, idx) => {
        eff.life -= 1 / 60;
        let sx = eff.x - camera.x, sy = eff.y - camera.y;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, eff.size, 0, Math.PI * 2);
        ctx.fillStyle = eff.color;
        ctx.fill();
        ctx.restore();
        if (eff.life <= 0) skillEffects.splice(idx, 1);
    });

    damageTexts.forEach((dt, idx) => {
        dt.life -= 1 / 60;
        dt.y -= 1.2;
        let sx = dt.x - camera.x, sy = dt.y - camera.y;
        ctx.save();
        ctx.font = 'bold 16px Arial';
        ctx.fillStyle = dt.color;
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.lineWidth = 3;
        ctx.strokeText(dt.value, sx, sy);
        ctx.fillText(dt.value, sx, sy);
        ctx.restore();
        if (dt.life <= 0) damageTexts.splice(idx, 1);
    });

    updateSkillUI();
    updateStatusBuffBar();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
