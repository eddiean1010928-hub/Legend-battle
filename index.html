function clampPosition(x, y, radius = 26) {
    let startX = 450, startY = MAP_SIZE - 450;
    let endX = MAP_SIZE - 450, endY = 450;
    let lineLen = Math.hypot(endX - startX, endY - startY);
    let uX = (endX - startX) / lineLen, uY = (endY - startY) / lineLen;
    let pX = x - startX, pY = y - startY;
    let t = pX * uX + pY * uY;
    t = Math.max(0, Math.min(lineLen, t));
    let nearestX = startX + uX * t;
    let nearestY = startY + uY * t;
    let dist = Math.hypot(x - nearestX, y - nearestY);
    if (dist > ROAD_WIDTH / 2 - radius) {
        let angle = Math.atan2(y - nearestY, x - nearestX);
        x = nearestX + Math.cos(angle) * (ROAD_WIDTH / 2 - radius);
        y = nearestY + Math.sin(angle) * (ROAD_WIDTH / 2 - radius);
    }
    return { x: Math.max(radius, Math.min(MAP_SIZE - radius, x)), y: Math.max(radius, Math.min(MAP_SIZE - radius, y)) };
}

class Entity {
    constructor(x, y, team, radius = 26) {
        this.x = x; this.y = y; this.team = team; this.radius = radius;
        this.hp = 1000; this.maxHp = 1000; this.alive = true;
        this.shield = 0;
    }
    takeDamage(dmg, sourceTeam, type = 'physical') {
        if (!this.alive) return;
        
        if (this instanceof Hero) {
            this.outOfCombatTimer = 0; 
        }

        if (this.shield > 0) {
            if (this.shield >= dmg) {
                this.shield -= dmg;
                dmg = 0;
            } else {
                dmg -= this.shield;
                this.shield = 0;
            }
        }

        this.hp -= dmg;
        
        if (this === player) {
            damageTexts.push({ x: this.x, y: this.y - 45, value: `-${Math.floor(dmg)}`, color: '#ff3366', life: 0.8 });
        }

        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(sourceTeam);
        }
    }
    onDeath(sourceTeam) {}
}

class Building extends Entity {
    constructor(x, y, team, type) {
        super(x, y, team, type === 'core' ? 55 : 45);
        this.type = type;
        this.maxHp = type === 'core' ? 6000 : 12000;
        this.hp = this.maxHp;
        this.atkTimer = 0;
        this.attackRange = 260;
        this.currentTarget = null;
        this.towerAtkStack = 0;
    }
    takeDamage(dmg, sourceTeam, type = 'physical') {
        if (!this.alive) return;
        if (this.type === 'tower' || this.type === 'core') {
            let hasMinionNearby = entities.some(e => 
                e.alive && e instanceof Minion && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= 260
            );
            if (!hasMinionNearby) {
                dmg *= 0.15; 
                damageTexts.push({ x: this.x, y: this.y - 50, value: '🛡️ 無兵線減傷 (防護中)', color: '#00d2ff', life: 0.8 });
            }
        }
        this.hp -= dmg;
        if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(sourceTeam);
        }
    }
    update() {
        if (!this.alive) return;
        this.atkTimer++;
        if (this.currentTarget) {
            let dist = Math.hypot(this.currentTarget.x - this.x, this.currentTarget.y - this.y);
            if (!this.currentTarget.alive || dist > this.attackRange) {
                this.currentTarget = null;
                this.towerAtkStack = 0;
            }
        }
        if (!this.currentTarget) {
            let inRangeEnemies = entities.filter(e => e.alive && e.team !== this.team && Math.hypot(e.x - this.x, e.y - this.y) <= this.attackRange);
            let minionTarget = inRangeEnemies.find(e => e instanceof Minion);
            let heroTarget = inRangeEnemies.find(e => e instanceof Hero);
            let newTarget = minionTarget || heroTarget || null;
            if (newTarget !== this.currentTarget) {
                this.towerAtkStack = 0;
            }
            this.currentTarget = newTarget;
        }
        if (this.atkTimer >= 60) {
            this.atkTimer = 0;
            if (this.currentTarget) {
                let baseTowerDmg = 400;
                let finalTowerDmg = baseTowerDmg * Math.pow(1.5, this.towerAtkStack);
                this.towerAtkStack++;

                this.currentTarget.takeDamage(finalTowerDmg, this.team, 'magical');
                
                // 🎯 防禦塔打到英雄後附加減速（20% 緩速，最多疊加到 2 層）
                if (this.currentTarget instanceof Hero) {
                    this.currentTarget.towerSlowStacks = Math.min(2, (this.currentTarget.towerSlowStacks || 0) + 1);
                    this.currentTarget.towerSlowTimer = 90; // 1.5 秒
                    damageTexts.push({ x: this.currentTarget.x, y: this.currentTarget.y - 55, value: `❄️ 塔擊緩速 (${this.currentTarget.towerSlowStacks * 20}%)`, color: '#00d2ff', life: 0.9 });
                }

                damageTexts.push({ x: this.currentTarget.x, y: this.currentTarget.y - 40, value: `⚡ 塔傷 ${Math.floor(finalTowerDmg)}`, color: '#ff4444', life: 0.6 });
                attackEffects.push({ startX: this.x, startY: this.y, x: this.currentTarget.x, y: this.currentTarget.y, life: 0.25, isLaser: true, color: this.team === 'blue' ? '#00d2ff' : '#ff4444' });
            }
        }
    }
    onDeath(sourceTeam) {
        if (this.type === 'tower') {
            isRunning = false;
            let resultEl = document.getElementById('result-screen');
            let titleEl = document.getElementById('result-title');
            if (sourceTeam === 'blue') {
                titleEl.innerText = 'VICTORY';
                titleEl.className = 'result-title-win';
            } else {
                titleEl.innerText = 'DEFEAT';
                titleEl.className = 'result-title-lose';
            }
            resultEl.classList.remove('hidden');
        }
    }
}

class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, team, 18);
        this.maxHp = 1800; this.hp = 1800;
        this.atk = 45; this.range = 120;
        this.targetX = team === 'blue' ? MAP_SIZE - 450 : 450;
        this.targetY = team === 'blue' ? 450 : MAP_SIZE - 450;
        this.moveSpeed = 1.6;
        this.atkCooldown = 0;
    }
    update() {
        if (!this.alive) return;
        if (this.isStunned) return;
        if (this.atkCooldown > 0) this.atkCooldown--;

        let nearestTarget = null;
        let minDist = 9999;
        entities.forEach(e => {
            if (e.alive && e.team !== this.team) {
                let dist = Math.hypot(e.x - this.x, e.y - this.y);
                if (dist < minDist) { minDist = dist; nearestTarget = e; }
            }
        });

        if (nearestTarget && minDist <= this.range) {
            if (this.atkCooldown === 0) {
                this.atkCooldown = 60;
                nearestTarget.takeDamage(this.atk, this.team, 'physical');
            }
        } else {
            let destX = nearestTarget ? nearestTarget.x : this.targetX;
            let destY = nearestTarget ? nearestTarget.y : this.targetY;
            let angle = Math.atan2(destY - this.y, destX - this.x);
            let speed = this.moveSpeed;
            if (this.isSlowed) speed *= (1 - (this.slowFactor || 0.4));
            let nx = this.x + Math.cos(angle) * speed;
            let ny = this.y + Math.sin(angle) * speed;
            let clamped = clampPosition(nx, ny, this.radius);
            this.x = clamped.x; this.y = clamped.y;
        }
    }
    onDeath(sourceTeam) {
        entities.forEach(e => {
            if (e instanceof Hero && e.alive && e.team === sourceTeam) {
                e.gainExpAndGold(10, 25);
            }
        });
    }
}

class Hero extends Entity {
    constructor(x, y, team, heroKey, isPlayer) {
        let data = HERO_DB[heroKey];
        super(x, y, team, 26);
        this.heroKey = heroKey;
        this.heroData = data;
        this.maxHp = data.baseHp; this.hp = this.maxHp;
        this.atk = data.atk; this.range = data.range;
        this.isPlayer = isPlayer;
        this.level = 1; this.exp = 0; this.gold = 300;
        this.kills = 0; this.deaths = 0; this.assists = 0;
        
        this.atkCooldown = 0;
        this.attackLockTimer = 0;
        this.hasEnhancedAttack = false;
        this.isSuperArmor = false;
        this.isStunned = false;
        this.isSilenced = false;
        this.isSlowed = false;
        this.slowFactor = 0.4;
        
        this.towerSlowStacks = 0;
        this.towerSlowTimer = 0;

        this.outOfCombatTimer = 300; 
        this.speedBuffTimer = 0;

        // 塔拉專屬狀態
        this.tarraHealTimer = 0;
        this.tarraHealAmtPerSec = 0;
        this.tarraBuffStacks = 0;
        this.tarraBuffTimer = 0;
        this.tarraUltimateTimer = 0;

        this.valheinHitCounter = 0;
        this.valheinPassiveStacks = 0;
        this.valheinPassiveTimer = 0;
        this.nakrothPassiveCounter = 0;
        this.ryomaPassiveTimer = 5.0;
        this.quillenMarkedTimer = 0;
        this.aiSkillCooldownTimer = 0;
        this.isRetreatingForHeal = false;

        this.isDashing = false; this.dashTargetX = x; this.dashTargetY = y; this.dashSpeed = 30;
        this.rotation = team === 'blue' ? -Math.PI / 4 : Math.PI * 3 / 4;
    }
    startDash(tx, ty, speed = 35) {
        this.isDashing = true;
        this.dashTargetX = tx; this.dashTargetY = ty;
        this.dashSpeed = speed;
    }
    update() {
        if (!this.alive) return;
        if (this.isStunned) return;

        this.outOfCombatTimer++;

        if (this.towerSlowTimer > 0) {
            this.towerSlowTimer--;
            if (this.towerSlowTimer === 0) this.towerSlowStacks = 0;
        }

        // 塔拉被動：使用技能後4秒內恢復4%最大生命值
        if (this.heroKey === 'tarra') {
            if (this.tarraHealTimer > 0) {
                this.tarraHealTimer--;
                let healPerFrame = (this.maxHp * 0.04) / 240; // 4秒 (240偵)
                this.hp = Math.min(this.maxHp, this.hp + healPerFrame);
            }
            if (this.tarraBuffTimer > 0) {
                this.tarraBuffTimer--;
                if (this.tarraBuffTimer === 0) this.tarraBuffStacks = 0;
            }
            // 塔拉大招：6秒內每0.5秒恢復4%最大生命值
            if (this.tarraUltimateTimer > 0) {
                this.tarraUltimateTimer--;
                if (this.tarraUltimateTimer % 30 === 0) {
                    let ultHeal = this.maxHp * 0.04;
                    this.hp = Math.min(this.maxHp, this.hp + ultHeal);
                    damageTexts.push({ x: this.x, y: this.y - 40, value: `+❤️ 大招回血 ${Math.floor(ultHeal)}`, color: '#00e676', life: 0.8 });
                }
            }
        }

        // 愛麗絲被動
        if (this.heroKey === 'alice' && this.outOfCombatTimer >= 300) {
            if (this.hp < this.maxHp) {
                let lostHp = this.maxHp - this.hp;
                let healAmt = (lostHp * 0.025) / 60;
                this.hp = Math.min(this.maxHp, this.hp + healAmt);
            }
        }

        if (this.speedBuffTimer > 0) this.speedBuffTimer--;

        if (this.heroKey === 'valhein' && this.valheinPassiveStacks > 0) {
            this.valheinPassiveTimer++;
            if (this.valheinPassiveTimer >= 240) {
                this.valheinPassiveTimer = 0;
                this.valheinPassiveStacks = 0;
                this.valheinHitCounter = 0;
            }
        }

        if (this.heroKey === 'ryoma') {
            let intervalReduction = (this.level - 1) * 0.1;
            let targetInterval = Math.max(1.0, 5.0 - intervalReduction);
            if (this.ryomaPassiveTimer > 0) {
                this.ryomaPassiveTimer -= 1 / 60;
                if (this.ryomaPassiveTimer <= 0) {
                    this.hasEnhancedAttack = true;
                }
            }
        }

        if (this.quillenMarkedTimer > 0) this.quillenMarkedTimer--;

        if (this.atkCooldown > 0) this.atkCooldown--;
        if (this.attackLockTimer > 0) this.attackLockTimer--;

        let fountainX = this.team === 'blue' ? 380 : MAP_SIZE - 380;
        let fountainY = this.team === 'blue' ? MAP_SIZE - 380 : 380;
        let distToFountain = Math.hypot(this.x - fountainX, this.y - fountainY);
        
        if (distToFountain <= 100 && this.hp < this.maxHp) {
            if (!this.fountainTimer) this.fountainTimer = 0;
            this.fountainTimer++;
            if (this.fountainTimer >= 60) {
                this.fountainTimer = 0;
                let healAmount = this.maxHp * 0.13;
                this.hp = Math.min(this.maxHp, this.hp + healAmount);
                damageTexts.push({ x: this.x, y: this.y - 35, value: `+❤️ ${Math.floor(healAmount)}`, color: '#00e676', life: 0.8 });
            }
        } else {
            this.fountainTimer = 0;
        }

        if (this.isDashing) {
            let dx = this.dashTargetX - this.x;
            let dy = this.dashTargetY - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist < this.dashSpeed) {
                this.x = this.dashTargetX; this.y = this.dashTargetY;
                this.isDashing = false;
            } else {
                this.x += (dx / dist) * this.dashSpeed;
                this.y += (dy / dist) * this.dashSpeed;
            }
            return;
        }

        let speed = 2.8;
        if (this.heroKey === 'alice' && this.outOfCombatTimer >= 300) speed *= 1.15;
        if (this.heroKey === 'tarra' && this.tarraUltimateTimer > 0) speed *= 1.40; // 塔拉大招加速 40%
        if (this.speedBuffTimer > 0) speed *= 1.20;
        if (this.isSlowed) speed *= (1 - this.slowFactor);
        if (this.towerSlowStacks > 0) speed *= (1 - this.towerSlowStacks * 0.20); // 塔擊緩速 20% 每層

        if (this.isPlayer) {
            if (this.attackLockTimer <= 0) {
                if (joystickDir.x !== 0 || joystickDir.y !== 0) {
                    let nx = this.x + joystickDir.x * speed;
                    let ny = this.y + joystickDir.y * speed;
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                    this.rotation = Math.atan2(joystickDir.y, joystickDir.x);
                }
            }
            if (isAttackingPressed) {
                performAttack();
            }
        } else {
            if (this.aiSkillCooldownTimer > 0) this.aiSkillCooldownTimer--;

            if (this.hp < this.maxHp * 0.25) {
                this.isRetreatingForHeal = true;
            }
            if (this.isRetreatingForHeal && this.hp >= this.maxHp * 0.9) {
                this.isRetreatingForHeal = false;
            }

            if (this.isRetreatingForHeal) {
                if (distToFountain > 80) {
                    let angleToFountain = Math.atan2(fountainY - this.y, fountainX - this.x);
                    let nx = this.x + Math.cos(angleToFountain) * (speed * 0.8);
                    let ny = this.y + Math.sin(angleToFountain) * (speed * 0.8);
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                }
                return;
            }

            let nearestEnemy = null;
            let minDist = 9999;
            entities.forEach(e => {
                if (e.alive && e.team !== this.team) {
                    let dist = Math.hypot(e.x - this.x, e.y - this.y);
                    if (dist < minDist) { minDist = dist; nearestEnemy = e; }
                }
            });

            if (nearestEnemy && this.attackLockTimer <= 0) {
                let angleToEnemy = Math.atan2(nearestEnemy.y - this.y, nearestEnemy.x - this.x);
                let dirX = Math.cos(angleToEnemy);
                let dirY = Math.sin(angleToEnemy);

                if (this.aiSkillCooldownTimer === 0 && minDist <= 280 && !this.isSilenced) {
                    this.aiSkillCooldownTimer = 100;
                    executeAiSkill(this, 1, dirX, dirY);
                }

                if (minDist <= this.range + nearestEnemy.radius) {
                    if (this.atkCooldown <= 0) {
                        this.atkCooldown = 25;
                        this.attackLockTimer = 15;
                        nearestEnemy.takeDamage(this.getEffectiveAtk(), this.team, 'physical');
                        this.outOfCombatTimer = 0;
                    }
                } else {
                    let nx = this.x + dirX * (speed * 0.6) + (Math.random() - 0.5) * 1.5;
                    let ny = this.y + dirY * (speed * 0.6) + (Math.random() - 0.5) * 1.5;
                    let clamped = clampPosition(nx, ny, this.radius);
                    this.x = clamped.x; this.y = clamped.y;
                }
            }
        }
    }

    getEffectiveAtk() {
        let base = this.atk + (this.level - 1) * 30;
        if (this.heroKey === 'tarra') {
            // 塔拉被動：血量少 1%，攻擊多增加 1.2%
            let missingHpPercent = Math.max(0, (1 - (this.hp / this.maxHp))) * 100;
            let bonusAtkRatio = 1 + (missingHpPercent * 0.012);
            base *= bonusAtkRatio;
        }
        if (this.tarraBuffStacks > 0) {
            base *= (1 + this.tarraBuffStacks * 0.05); // 傷害提升 5% 疊加 3 層
        }
        return base;
    }

    gainExpAndGold(expAmt, goldAmt) {
        this.gold += goldAmt;
        if (this.isPlayer) { currentUserData.gold = this.gold; saveUserData(); }
        this.exp += expAmt;
        let reqExp = LEVEL_EXP_TABLE[this.level] || 150;
        
        while (this.exp >= reqExp && this.level < 15) {
            this.exp -= reqExp;
            this.level++; 
            if (this.isPlayer) unallocatedPoints++;
            let hpGain = this.heroData.hpGrowth || 400;
            this.maxHp += hpGain; 
            this.hp = Math.min(this.maxHp, this.hp + hpGain);
            this.atk += 25;
            if (this.isPlayer) { triggerAnnouncement(`🎉 恭喜升到 Lv.${this.level}！`, '#00e676'); }
            reqExp = LEVEL_EXP_TABLE[this.level] || 150;
        }
        updateTopScopeUI();
        updateSkillUI();
    }

    onDeath(sourceTeam) {
        let respawnTime = Math.min(25, Math.max(4, Math.floor(4 + this.level * 1.5)));

        if (this.isPlayer) {
            deaths++;
            aiKillStreak++;
            playerKillStreak = 0;
            redKills++; 
            triggerAnnouncement(`YOU HAVE BEEN SLAIN (復活倒數 ${respawnTime} 秒)`, '#ff3366');

            setTimeout(() => {
                if (!isRunning) return;
                this.hp = this.maxHp;
                this.x = 380; this.y = MAP_SIZE - 380;
                this.alive = true;
                triggerAnnouncement('⚔️ 你已重返戰場！', '#00e676');
            }, respawnTime * 1000);
        } else {
            blueKills++;
            kills++;
            playerKillStreak++;
            aiKillStreak = 0;
            
            if (!hasFirstBloodOccurred) {
                hasFirstBloodOccurred = true;
                triggerAnnouncement('FIRST BLOOD 擊殺首血！', '#ffd700');
            } else {
                triggerAnnouncement(`ENEMY SLAIN (敵方 ${respawnTime} 秒後復活)`, '#00e676');
            }

            if (player && player.alive) {
                player.gainExpAndGold(20, 150);
                if (player.heroKey === 'quillen') {
                    skillCooldowns = { 1: 0, 2: 0, 3: 0 };
                    damageTexts.push({ x: player.x, y: player.y - 50, value: '✨ 奎倫被動：擊殺刷新所有技能冷卻！', color: '#ff3366', life: 1.2 });
                }
            }

            setTimeout(() => {
                if (!isRunning) return;
                this.hp = this.maxHp;
                this.x = MAP_SIZE - 380; this.y = 380;
                this.alive = true;
            }, respawnTime * 1000);
        }
        updateTopScopeUI();
    }
}

function performAttack() {
    if (!player || !player.alive) return;
    if (player.atkCooldown > 0) return;

    let attackRange = player.range;
    if (player.heroKey === 'nakroth' && player.hasEnhancedAttack) attackRange = 180;
    if (player.heroKey === 'ryoma' && player.hasEnhancedAttack) attackRange = 180;

    let nearestTarget = null;
    let minTargetDist = 9999;

    entities.forEach(target => {
        if (!target.alive || target.team === player.team) return;
        let dist = Math.hypot(target.x - player.x, target.y - player.y);
        if (dist <= attackRange + target.radius && dist < minTargetDist) {
            minTargetDist = dist;
            nearestTarget = target;
        }
    });

    if (nearestTarget) {
        player.outOfCombatTimer = 0; 
        let interval = player.heroData.atkInterval || 0.5;
        player.atkCooldown = Math.round(interval * 60);
        player.attackLockTimer = Math.round((player.heroData.atkRecovery || 0.3) * 60);
        
        let baseDmg = player.getEffectiveAtk();

        if (player.heroKey === 'valhein') {
            player.valheinPassiveTimer = 0;
            player.valheinHitCounter = (player.valheinHitCounter || 0) + 1;
            
            if (player.valheinHitCounter >= 3) {
                player.valheinHitCounter = 0;
                player.valheinPassiveStacks = Math.min(4, player.valheinPassiveStacks + 1);
            }
            baseDmg += player.valheinPassiveStacks * 20;
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 30, value: `${Math.floor(baseDmg)}`, color: '#ffd700', life: 0.8 });

        } else if (player.heroKey === 'alice') {
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 30, value: `🎀 愛麗絲普攻 (${Math.floor(baseDmg)})`, color: '#e040fb', life: 0.8 });
        } else if (player.heroKey === 'tarra') {
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 30, value: `🪓 塔拉重斧 (${Math.floor(baseDmg)})`, color: '#ff9800', life: 0.8 });
        } else if (player.heroKey === 'nakroth') {
            baseDmg = 200 + (player.level - 1) * 40;
            if (player.hasEnhancedAttack) {
                player.hasEnhancedAttack = false;
                baseDmg *= 1.5;
                nearestTarget.isStunned = true;
                setTimeout(() => { nearestTarget.isStunned = false; }, 800);
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 45, value: '🗡️ 2技強普 (180範圍橫掃)', color: '#d7bde2', life: 1.0 });
            } else {
                player.nakrothPassiveCounter++;
                if (player.nakrothPassiveCounter >= 4) {
                    player.nakrothPassiveCounter = 0;
                    nearestTarget.isStunned = true;
                    setTimeout(() => { nearestTarget.isStunned = false; }, 800);
                    damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 45, value: '🗡️ 第四下被動擊飛!', color: '#d7bde2', life: 1.0 });
                }
            }
        } else if (player.heroKey === 'ryoma') {
            baseDmg = 190 + (player.level - 1) * 20;
            if (player.hasEnhancedAttack) {
                player.hasEnhancedAttack = false;
                let intervalReduction = (player.level - 1) * 0.1;
                player.ryomaPassiveTimer = Math.max(1.0, 5.0 - intervalReduction);
                baseDmg *= 2.0;
                nearestTarget.isSlowed = true;
                setTimeout(() => { nearestTarget.isSlowed = false; }, 2000);
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 40, value: `🥷 龍馬強普2倍傷害 (180範圍)`, color: '#00e676', life: 1.2 });
            }
        } else if (player.heroKey === 'quillen') {
            baseDmg = 200 + (player.level - 1) * 30;
            let targetAngle = nearestTarget.rotation || 0;
            let angleToPlayer = Math.atan2(player.y - nearestTarget.y, player.x - nearestTarget.x);
            let angleDiff = Math.abs(angleToPlayer - targetAngle);
            let isBehind = (angleDiff < Math.PI / 2 || angleDiff > Math.PI * 1.5);

            if (isBehind) {
                baseDmg *= 2.0;
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 45, value: `💥 奎倫背擊爆擊! ${Math.floor(baseDmg)}`, color: '#ff3366', life: 1.0 });
            } else {
                damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 35, value: `正面未爆擊 ${Math.floor(baseDmg)}`, color: '#aaa', life: 0.8 });
            }

            if (nearestTarget.quillenMarkedTimer > 0) {
                skillCooldowns[2] = Math.max(0, skillCooldowns[2] - 1.0);
                skillCooldowns[3] = Math.max(0, skillCooldowns[3] - 1.0);
                damageTexts.push({ x: player.x, y: player.y - 50, value: '✨ 標記觸發：2、3技冷卻-1秒', color: '#00e676', life: 1.0 });
            }
        } else if (player.heroKey === 'krixi') {
            baseDmg = 150 + (player.level - 1) * 30 + 30;
            damageTexts.push({ x: nearestTarget.x, y: nearestTarget.y - 30, value: `🧚‍♀️ 克里希普攻 (${Math.floor(baseDmg)})`, color: '#ff69b4', life: 0.8 });
        }

        nearestTarget.takeDamage(baseDmg, player.team, 'physical');
        attackEffects.push({ x: nearestTarget.x, y: nearestTarget.y, life: 0.3, radius: 25, color: '#f3c654' });
    }
}

function executeAiSkill(aiObj, skillId, dirX, dirY) {
    let targetX = aiObj.x + dirX * 180;
    let targetY = aiObj.y + dirY * 180;
    
    skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 75, color: 'rgba(255, 68, 68, 0.65)', team: aiObj.team });
    
    entities.forEach(e => {
        if (!(e instanceof Building) && e.alive && e.team !== aiObj.team && Math.hypot(e.x - targetX, e.y - targetY) <= 80) {
            e.takeDamage(350, aiObj.team, 'magical');
        }
    });
}

function castSkill(skillId, dirX, dirY, customDist) {
    if (!player || !player.alive || player.isSilenced) return;
    if (skillLevels[skillId] === 0 || skillCooldowns[skillId] > 0) return;

    if (skillId === 3) {
        let currentLvl = skillLevels[3];
        let requiredLevel = (currentLvl === 1) ? 4 : (currentLvl === 2 ? 8 : 12);
        if (player.level < requiredLevel) return;
    }

    let sLv = skillLevels[skillId] || 1;
    let heroKey = player.heroKey;
    player.outOfCombatTimer = 0;

    // 塔拉被動：每次使用技能扣除 2% 最大生命值，觸發 4 秒內恢復 4% 生命，且傷害提升 5% 疊加 3 層
    if (heroKey === 'tarra') {
        let costHp = player.maxHp * 0.02;
        player.hp = Math.max(1, player.hp - costHp);
        player.tarraHealTimer = 240; // 4 秒
        player.tarraBuffStacks = Math.min(3, player.tarraBuffStacks + 1);
        player.tarraBuffTimer = 300; // 5 秒
        damageTexts.push({ x: player.x, y: player.y - 50, value: `🪓 狂血消耗 -${Math.floor(costHp)} (疊層 ${player.tarraBuffStacks})`, color: '#ff9800', life: 1.0 });
    }

    if (heroKey === 'tarra') {
        if (skillId === 1) {
            // 🎯 塔拉 1 技：轉一圈造成 250 (+40) 傷害，CD 5s (-0.2s)
            skillCooldowns[1] = Math.max(2.5, 5.0 - (sLv - 1) * 0.2);
            let dmg = 250 + (sLv - 1) * 40;
            skillEffects.push({ x: player.x, y: player.y, life: 0.35, size: 85, color: 'rgba(255, 152, 0, 0.7)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 85) {
                    e.takeDamage(dmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `🪓 旋風斬 (${dmg})`, color: '#ff9800', life: 0.9 });
                }
            });
        } else if (skillId === 2) {
            // 🎯 塔拉 2 技：向指定位置位移並造成 200 (+30) 傷害，CD 9s (-0.6s)
            skillCooldowns[2] = Math.max(4.5, 9.0 - (sLv - 1) * 0.6);
            let dmg = 200 + (sLv - 1) * 30;
            let dist = customDist || 240;
            let targetX = player.x + dirX * dist;
            let targetY = player.y + dirY * dist;

            player.startDash(targetX, targetY, 40);
            skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 80, color: 'rgba(255, 152, 0, 0.8)', team: player.team });
            
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) <= 80) {
                    e.takeDamage(dmg, player.team, 'physical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `🪓 跳砸傷害 (${dmg})`, color: '#ff9800', life: 0.9 });
                }
            });
        } else if (skillId === 3) {
            // 🎯 塔拉 3 技：6秒內每0.5秒恢復4%最大生命值，加速40%，CD 25s (-4s)
            skillCooldowns[3] = Math.max(11.0, 25.0 - (sLv - 1) * 4.0);
            player.tarraUltimateTimer = 360; // 6秒 (360偵)
            damageTexts.push({ x: player.x, y: player.y - 55, value: '🪓 鋼軀怒吼：不死之身開啟!', color: '#00e676', life: 1.5 });
        }
    } else if (heroKey === 'alice') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(3.0, 6.0 - (sLv - 1) * 0.3);
            let dmg = 600 + (sLv - 1) * 50;
            let dist = customDist || 240;
            let targetX = player.x + dirX * dist;
            let targetY = player.y + dirY * dist;

            skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 75, color: 'rgba(224, 64, 251, 0.75)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) <= 75) {
                    e.takeDamage(dmg, player.team, 'magical');
                    e.isStunned = true;
                    setTimeout(() => { e.isStunned = false; }, 1000);
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `🎀 星光暈眩 1秒! (${dmg})`, color: '#e040fb', life: 1.0 });
                }
            });
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(4.0, 8.0 - (sLv - 1) * 0.5);
            let shieldAmt = player.maxHp * 0.20 + player.level * 100;

            entities.forEach(e => {
                if (e instanceof Hero && e.alive && e.team === player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 240) {
                    e.shield = Math.min(e.maxHp * 0.5, (e.shield || 0) + shieldAmt);
                    e.speedBuffTimer = 180; 
                    damageTexts.push({ x: e.x, y: e.y - 45, value: `🛡️ 獲得護盾 +${Math.floor(shieldAmt)}`, color: '#ffffff', life: 1.2 });
                    
                    setTimeout(() => {
                        if (e.alive && e.shield > 0) e.shield = Math.max(0, e.shield - shieldAmt);
                    }, 5000);
                }
            });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(11.0, 23.0 - (sLv - 1) * 4.0);
            let secDmg = 300 + (sLv - 1) * 50;
            let dist = customDist || 240;
            let targetX = player.x + dirX * dist;
            let targetY = player.y + dirY * dist;

            damageTexts.push({ x: targetX, y: targetY - 60, value: '🎀 沉默法陣降臨 (5秒)!', color: '#e040fb', life: 1.5 });

            for (let t = 0; t < 5; t++) {
                setTimeout(() => {
                    if (!isRunning) return;
                    skillEffects.push({ x: targetX, y: targetY, life: 0.5, size: 110, color: 'rgba(156, 39, 176, 0.45)', team: player.team });
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) <= 110) {
                            e.takeDamage(secDmg, player.team, 'magical');
                            if (e instanceof Hero) {
                                e.isSilenced = true;
                                setTimeout(() => { e.isSilenced = false; }, 3000);
                                damageTexts.push({ x: e.x, y: e.y - 40, value: '🤐 沉默中 (無法放招)', color: '#ba68c8', life: 0.8 });
                            }
                        }
                    });
                }, t * 1000);
            }
        }
    } else if (heroKey === 'valhein') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(4.5, 7.0 - (sLv - 1) * 0.5);
            let hitDmg = 500 + (sLv - 1) * 20;
            let expDmg = 250 + (sLv - 1) * 20;
            let tx = player.x + dirX * 240;
            let ty = player.y + dirY * 240;

            skillEffects.push({ x: tx, y: ty, life: 0.4, size: 80, color: 'rgba(255, 215, 0, 0.7)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 80) {
                    e.takeDamage(hitDmg, player.team, 'magical');
                    damageTexts.push({ x: e.x, y: e.y - 40, value: `🎯 1技擊中 ${hitDmg}`, color: '#ffd700', life: 0.9 });
                    entities.forEach(subE => {
                        if (!(subE instanceof Building) && subE.alive && subE.team !== player.team && Math.hypot(subE.x - e.x, subE.y - e.y) <= 90) {
                            subE.takeDamage(expDmg, player.team, 'magical');
                        }
                    });
                }
            });
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(5.5, 8.0 - (sLv - 1) * 0.5);
            let tx = player.x + dirX * 240;
            let ty = player.y + dirY * 240;
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 70) {
                    e.isStunned = true;
                    setTimeout(() => { e.isStunned = false; }, 2000);
                    damageTexts.push({ x: e.x, y: e.y - 40, value: '🎯 2技暈眩 2秒!', color: '#00d2ff', life: 1.0 });
                }
            });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(9.0, 15.0 - (sLv - 1) * 2.0);
            let dmg = 500 + (sLv - 1) * 100;
            player.valheinPassiveStacks = 4;
            damageTexts.push({ x: player.x, y: player.y - 50, value: '🎯 大招：直接滿層被動!', color: '#ffd700', life: 1.2 });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 240) {
                    e.takeDamage(dmg, player.team, 'magical');
                }
            });
        }
    } else if (heroKey === 'nakroth') {
        if (skillId === 1) {
            let stInfo = heroSkillStage['nakroth'][1];
            let dist = customDist || 240;
            let dashX = player.x + dirX * dist;
            let dashY = player.y + dirY * dist;
            let dmg = 400 + (sLv - 1) * 50;

            if (stInfo.stage === 1) {
                player.startDash(dashX, dashY, 40);
                damageTexts.push({ x: player.x, y: player.y - 40, value: `🗡️ 1技1段擊飛 (${dmg})`, color: '#d7bde2', life: 0.8 });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - dashX, e.y - dashY) <= 70) {
                        e.takeDamage(dmg, player.team, 'physical');
                        e.isStunned = true;
                        setTimeout(() => { e.isStunned = false; }, 800);
                    }
                });
                stInfo.stage = 2;
                stInfo.timer = 5.0;
                skillCooldowns[1] = 0;
            } else {
                player.startDash(dashX, dashY, 40);
                damageTexts.push({ x: player.x, y: player.y - 40, value: `🗡️ 1技2段衝刺 (${dmg})`, color: '#d7bde2', life: 0.8 });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - dashX, e.y - dashY) <= 70) {
                        e.takeDamage(dmg, player.team, 'physical');
                    }
                });
                stInfo.stage = 1;
                stInfo.timer = 0;
                skillCooldowns[1] = Math.max(3.0, 5.0 - (sLv - 1) * 0.2);
            }
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(5.5, 8.0 - (sLv - 1) * 0.5);
            let dashX = player.x - dirX * 180;
            let dashY = player.y - dirY * 180;
            player.startDash(dashX, dashY, 45);
            player.hasEnhancedAttack = true;
            damageTexts.push({ x: player.x, y: player.y - 40, value: '🗡️ 2技：反向位移+強普預備', color: '#d7bde2', life: 1.0 });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(11.0, 20.0 - (sLv - 1) * 3.0);
            player.isSuperArmor = true;
            let strikeDmg = 50 + (sLv - 1) * 20;
            damageTexts.push({ x: player.x, y: player.y - 50, value: '🗡️ 霸體連刺擊!', color: '#8e44ad', life: 1.2 });

            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    let isLast = (i === 5);
                    skillEffects.push({ x: player.x, y: player.y, life: 0.2, size: 90, color: 'rgba(142, 68, 173, 0.8)', team: player.team });
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 90) {
                            e.takeDamage(strikeDmg, player.team, 'physical');
                            if (isLast) {
                                e.isStunned = true;
                                setTimeout(() => { e.isStunned = false; }, 500);
                            }
                        }
                    });
                    if (isLast) player.isSuperArmor = false;
                }, i * 150);
            }
        }
    } else if (heroKey === 'ryoma') {
        if (skillId === 1) {
            let stInfo = heroSkillStage['ryoma'][1];
            let dmg = 400 + (sLv - 1) * 30;

            if (!stInfo.canSecondCast) {
                let dashX = player.x - dirX * 180;
                let dashY = player.y - dirY * 180;
                player.startDash(dashX, dashY, 40);
                
                let frontX = player.x + dirX * 180;
                let frontY = player.y + dirY * 180;
                skillEffects.push({ x: frontX, y: frontY, life: 0.3, size: 70, color: 'rgba(46, 125, 50, 0.8)', team: player.team });
                
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - frontX, e.y - frontY) <= 75) {
                        e.takeDamage(dmg, player.team, 'physical');
                    }
                });
                damageTexts.push({ x: player.x, y: player.y - 40, value: `🥷 1技1段後撤斬 (${dmg})`, color: '#00e676', life: 1.0 });

                stInfo.canSecondCast = true;
                stInfo.timer = 3.0;
                skillCooldowns[1] = 0;
            } else {
                let dashX = player.x + dirX * 180;
                let dashY = player.y + dirY * 180;
                player.startDash(dashX, dashY, 45);

                skillEffects.push({ x: dashX, y: dashY, life: 0.3, size: 75, color: 'rgba(46, 125, 50, 0.9)', team: player.team });
                entities.forEach(e => {
                    if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - dashX, e.y - dashY) <= 80) {
                        e.takeDamage(dmg, player.team, 'physical');
                    }
                });
                damageTexts.push({ x: player.x, y: player.y - 40, value: `🥷 1技2段突進斬 (${dmg})`, color: '#00e676', life: 1.0 });

                stInfo.canSecondCast = false;
                stInfo.timer = 0;
                skillCooldowns[1] = 5.0;
            }
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(5.0, 8.0 - (sLv - 1) * 0.6);
            let baseDmg = 700 + (sLv - 1) * 50;
            let tipHitX = player.x + dirX * 200;
            let tipHitY = player.y + dirY * 200;
            skillEffects.push({ x: tipHitX, y: tipHitY, life: 0.35, size: 70, color: 'rgba(46, 125, 50, 0.8)', team: player.team });

            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team) {
                    let distFromPlayer = Math.hypot(e.x - player.x, e.y - player.y);
                    if (distFromPlayer <= 200) {
                        let isTip = (distFromPlayer >= 120 && distFromPlayer <= 200);
                        let finalDmg = isTip ? baseDmg * 1.5 : baseDmg;
                        e.takeDamage(finalDmg, player.team, 'physical');
                        if (isTip) {
                            e.isStunned = true;
                            setTimeout(() => { e.isStunned = false; }, 1000);
                            damageTexts.push({ x: e.x, y: e.y - 45, value: `🎯 槍尖後半段暈眩 1秒! (${Math.floor(finalDmg)})`, color: '#00e676', life: 1.2 });
                        } else {
                            damageTexts.push({ x: e.x, y: e.y - 35, value: `🥷 一刀斬前半 (${Math.floor(finalDmg)})`, color: '#2e7d32', life: 0.8 });
                        }
                    }
                }
            });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(8.0, 13.0 - (sLv - 1) * 1.5);
            let strikeDmg = 300 + (sLv - 1) * 100;
            let healPercent = 0.07 + (sLv - 1) * 0.02;
            damageTexts.push({ x: player.x, y: player.y - 50, value: '🥷 殺戮連刺 (吸血+減2技CD)!', color: '#2e7d32', life: 1.2 });

            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    let tx = player.x + dirX * (60 + i * 35);
                    let ty = player.y + dirY * (60 + i * 35);
                    skillEffects.push({ x: tx, y: ty, life: 0.2, size: 55, color: 'rgba(46, 125, 50, 0.7)', team: player.team });
                    let hitAny = false;
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 60) {
                            e.takeDamage(strikeDmg, player.team, 'physical');
                            hitAny = true;
                        }
                    });
                    if (hitAny) {
                        let healAmt = player.maxHp * healPercent;
                        player.hp = Math.min(player.maxHp, player.hp + healAmt);
                        skillCooldowns[2] = Math.max(0, skillCooldowns[2] - 1.0);
                        damageTexts.push({ x: player.x, y: player.y - 35, value: `+❤️ ${Math.floor(healAmt)}`, color: '#00e676', life: 0.8 });
                    }
                }, i * 150);
            }
        }
    } else if (heroKey === 'quillen') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(2.5, 4.0 - (sLv - 1) * 0.3);
            let dmgPerHit = 350 + (sLv - 1) * 30;
            let tx = player.x + dirX * 120;
            let ty = player.y + dirY * 120;

            for (let i = 0; i < 2; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    skillEffects.push({ x: tx, y: ty, life: 0.3, size: 55, color: 'rgba(255, 69, 0, 0.7)', team: player.team });
                    entities.forEach(e => {
                        if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - tx, e.y - ty) <= 65) {
                            e.takeDamage(dmgPerHit, player.team, 'physical');
                            damageTexts.push({ x: e.x, y: e.y - 35, value: `🥷 刺擊 #${i+1} (${dmgPerHit})`, color: '#ff9800', life: 0.8 });
                        }
                    });
                }, i * 150);
            }
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(6.0, 8.0 - (sLv - 1) * 0.4);
            let dashX = player.x + dirX * 120;
            let dashY = player.y + dirY * 120;
            player.startDash(dashX, dashY, 35);

            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - dashX, e.y - dashY) <= 70) {
                    e.quillenMarkedTimer = 180;
                    damageTexts.push({ x: e.x, y: e.y - 50, value: '🎯 標記目標 3秒!', color: '#ffeb3b', life: 1.0 });
                }
            });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(10.0, 16.0 - (sLv - 1) * 2.0);
            let dashX = player.x + dirX * 180;
            let dashY = player.y + dirY * 180;
            player.startDash(dashX, dashY, 40);

            let stealthFrames = 0;
            let healInterval = setInterval(() => {
                stealthFrames += 30;
                if (!player.alive || stealthFrames >= 240) {
                    clearInterval(healInterval);
                    return;
                }
                let lostHp = player.maxHp - player.hp;
                let healAmt = lostHp * 0.06;
                player.hp = Math.min(player.maxHp, player.hp + healAmt);
                damageTexts.push({ x: player.x, y: player.y - 35, value: `+❤️ 已損回血 ${Math.floor(healAmt)}`, color: '#00e676', life: 0.7 });
            }, 500);
            damageTexts.push({ x: player.x, y: player.y - 45, value: '🥷 隱形4秒 + 持續回血', color: '#9c27b0', life: 1.0 });
        }
    } else if (heroKey === 'krixi') {
        if (skillId === 1) {
            skillCooldowns[1] = Math.max(5.0, 7.0 - (sLv - 1) * 0.4);
            let dmg = 600 + (sLv - 1) * 40;

            let startX = player.x;
            let startY = player.y;
            let targetX = startX + dirX * 240;
            let targetY = startY + dirY * 240;

            projectiles.push({
                x: startX,
                y: startY,
                startX: startX,
                startY: startY,
                targetX: targetX,
                targetY: targetY,
                speed: 9.5,
                radius: 22,
                returning: false,
                owner: player,
                team: player.team,
                damage: dmg,
                hitTargets: new Set()
            });
        } else if (skillId === 2) {
            skillCooldowns[2] = Math.max(6.0, 8.0 - (sLv - 1) * 0.5);
            let dmg = 200 + (sLv - 1) * 20;
            let dist = customDist || 240;
            let targetX = player.x + dirX * dist;
            let targetY = player.y + dirY * dist;
            skillEffects.push({ x: targetX, y: targetY, life: 0.4, size: 75, color: 'rgba(0, 210, 255, 0.8)', team: player.team });
            entities.forEach(e => {
                if (!(e instanceof Building) && e.alive && e.team !== player.team && Math.hypot(e.x - targetX, e.y - targetY) <= 75) {
                    e.takeDamage(dmg, player.team, 'magical');
                    e.isStunned = true;
                    setTimeout(() => { e.isStunned = false; }, 750);
                    damageTexts.push({ x: e.x, y: e.y - 40, value: '🧚‍♀️ 法陣擊飛 0.75秒', color: '#00d2ff', life: 1.0 });
                }
            });
        } else if (skillId === 3) {
            skillCooldowns[3] = Math.max(16.0, 24.0 - (sLv - 1) * 4.0);
            let perHitDmg = 400 + (sLv - 1) * 50;
            damageTexts.push({ x: player.x, y: player.y - 50, value: '🧚‍♀️ 暴風流星雨 (6段打擊)!', color: '#ff69b4', life: 1.2 });

            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    if (!player.alive) return;
                    let target = entities.find(e => e.alive && e.team !== player.team && Math.hypot(e.x - player.x, e.y - player.y) <= 240);
                    if (target) {
                        skillEffects.push({ x: target.x, y: target.y, life: 0.2, size: 50, color: 'rgba(255, 105, 180, 0.8)', team: player.team });
                        target.takeDamage(perHitDmg, player.team, 'magical');
                    }
                }, i * 200);
            }
        }
    }

    updateSkillUI();
}

function updateTopScopeUI() {
    if (!player) return;
    document.getElementById('level-display').innerText = `Lv.${player.level}`;
    document.getElementById('score-blue').innerText = blueKills;
    document.getElementById('score-red').innerText = redKills;
    document.getElementById('gold-display').innerText = `🪙 ${Math.floor(player.gold)}`;
    document.getElementById('kda-display').innerText = `KDA: ${kills} / ${deaths} / ${assists}`;
    updateUserProfileUI();
}

function updateSkillUI() {
    [1, 2, 3].forEach(id => {
        let btn = document.getElementById(`skill-${id}`);
        let upBtn = document.getElementById(`up-btn-${id}`);
        let cdEl = document.getElementById(`cd-${id}`);
        let descLbl = document.getElementById(`lbl-skill-${id}`);
        let sLv = skillLevels[id];

        descLbl.innerText = `Lv.${sLv} 技能${id}`;

        let canUpgrade = false;
        if (unallocatedPoints > 0 && sLv < 3) {
            if (id === 3) {
                let reqLvl = (sLv === 0) ? 4 : (sLv === 1 ? 8 : 12);
                if (player && player.level >= reqLvl) canUpgrade = true;
            } else {
                canUpgrade = true;
            }
        }

        if (canUpgrade) upBtn.classList.remove('hidden');
        else upBtn.classList.add('hidden');

        if (sLv === 0 || (player && player.isSilenced)) btn.classList.add('locked');
        else btn.classList.remove('locked');

        if (skillCooldowns[id] > 0) {
            cdEl.classList.remove('hidden');
            cdEl.innerText = skillCooldowns[id].toFixed(1);
        } else {
            cdEl.classList.add('hidden');
        }
    });

    let cdChallengerEl = document.getElementById('cd-challenger');
    if (challengerCooldown > 0) {
        cdChallengerEl.classList.remove('hidden');
        cdChallengerEl.innerText = Math.ceil(challengerCooldown);
    } else {
        cdChallengerEl.classList.add('hidden');
    }

    let cdHealEl = document.getElementById('cd-heal');
    if (healSpellCooldown > 0) {
        cdHealEl.classList.remove('hidden');
        cdHealEl.innerText = Math.ceil(healSpellCooldown);
    } else {
        cdHealEl.classList.add('hidden');
    }
}

function gameLoop() {
    if (!isRunning) return;

    gameTimeSeconds += 1 / 60;
    let mins = Math.floor(gameTimeSeconds / 60).toString().padStart(2, '0');
    let secs = Math.floor(gameTimeSeconds % 60).toString().padStart(2, '0');
    document.getElementById('game-time-display').innerText = `⏱️ ${mins}:${secs}`;

    passiveExpTimer += 1 / 60;
    if (passiveExpTimer >= 5.0) {
        passiveExpTimer = 0;
        entities.forEach(e => {
            if (e instanceof Hero && e.alive) e.gainExpAndGold(5, 5);
        });
    }

    [1, 2, 3].forEach(id => {
        if (skillCooldowns[id] > 0) skillCooldowns[id] = Math.max(0, skillCooldowns[id] - 1 / 60);
    });
    if (challengerCooldown > 0) challengerCooldown = Math.max(0, challengerCooldown - 1 / 60);
    if (healSpellCooldown > 0) healSpellCooldown = Math.max(0, healSpellCooldown - 1 / 60);

    minionSpawnTimer++;
    if (minionSpawnTimer >= 900) {
        minionSpawnTimer = 0;
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                if (!isRunning) return;
                entities.push(new Minion(450 - i * 15, MAP_SIZE - 450 + i * 15, 'blue'));
                entities.push(new Minion(MAP_SIZE - 450 + i * 15, 450 - i * 15, 'red'));
            }, i * 300);
        }
    }

    entities.forEach(e => e.update());

    projectiles.forEach((p, idx) => {
        if (!p.returning) {
            let dx = p.targetX - p.x;
            let dy = p.targetY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed) {
                p.x = p.targetX;
                p.y = p.targetY;
                p.returning = true;
                p.hitTargets.clear();
            } else {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }
        } else {
            let ownerX = p.owner.x;
            let ownerY = p.owner.y;
            let dx = ownerX - p.x;
            let dy = ownerY - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist <= p.speed + 15) {
                projectiles.splice(idx, 1);
                return;
            } else {
                p.x += (dx / dist) * (p.speed * 1.15);
                p.y += (dy / dist) * (p.speed * 1.15);
            }
        }

        entities.forEach(e => {
            if (!(e instanceof Building) && e.alive && e.team !== p.team) {
                let distToEnemy = Math.hypot(e.x - p.x, e.y - p.y);
                if (distToEnemy <= p.radius + e.radius && !p.hitTargets.has(e)) {
                    p.hitTargets.add(e);
                    e.takeDamage(p.damage, p.team, 'magical');
                    damageTexts.push({ 
                        x: e.x, y: e.y - 40, 
                        value: p.returning ? `🧚‍♀️ 蝴蝶回程 (${p.damage})` : `🧚‍♀️ 蝴蝶去程 (${p.damage})`, 
                        color: '#ff69b4', life: 0.9 
                    });
                }
            }
        });
    });

    if (player) {
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(450 - camera.x, MAP_SIZE - 450 - camera.y);
    ctx.lineTo(MAP_SIZE - 450 - camera.x, 450 - camera.y);
    ctx.strokeStyle = '#1e3a5f';
    ctx.lineWidth = ROAD_WIDTH;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ['blue', 'red'].forEach(team => {
        let fountainX = team === 'blue' ? 380 : MAP_SIZE - 380;
        let fountainY = team === 'blue' ? MAP_SIZE - 380 : 380;
        let sx = fountainX - camera.x;
        let sy = fountainY - camera.y;

        ctx.beginPath();
        ctx.arc(sx, sy, 100, 0, Math.PI * 2);
        ctx.fillStyle = team === 'blue' ? 'rgba(0, 210, 255, 0.15)' : 'rgba(255, 68, 68, 0.15)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = team === 'blue' ? 'rgba(0, 210, 255, 0.6)' : 'rgba(255, 68, 68, 0.6)';
        ctx.setLineDash([6, 6]);
        ctx.stroke();
    });
    ctx.restore();

    entities.forEach(e => {
        if (e instanceof Building && e.alive) {
            let sx = e.x - camera.x;
            let sy = e.y - camera.y;
            ctx.save();
            ctx.beginPath();
            ctx.arc(sx, sy, e.attackRange, 0, Math.PI * 2);
            ctx.fillStyle = e.team === 'blue' ? 'rgba(0, 210, 255, 0.05)' : 'rgba(255, 68, 68, 0.05)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = e.team === 'blue' ? 'rgba(0, 210, 255, 0.4)' : 'rgba(255, 68, 68, 0.4)';
            ctx.setLineDash([8, 8]);
            ctx.stroke();
            ctx.restore();
        }
    });

    if (player && player.alive && activeSkillDrag) {
        let px = player.x - camera.x;
        let py = player.y - camera.y;
        let maxR = activeSkillDrag.maxRange;
        let dx = activeSkillDrag.dirX;
        let dy = activeSkillDrag.dirY;

        ctx.save();
        
        if (activeSkillDrag.type === 'circle') {
            let targetX = px + dx * activeSkillDrag.currentDist;
            let targetY = py + dy * activeSkillDrag.currentDist;

            ctx.beginPath();
            ctx.arc(px, py, maxR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 170, 255, 0.06)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(0, 170, 255, 0.4)';
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(targetX, targetY);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.8)';
            ctx.stroke();

            let cR = activeSkillDrag.circleRadius;
            ctx.beginPath();
            ctx.arc(targetX, targetY, cR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 210, 255, 0.25)';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#00ffff';
            ctx.stroke();

        } else if (activeSkillDrag.isRect) {
            let angle = Math.atan2(dy, dx);
            let rectWidth = 55;
            let rectLength = maxR;

            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.rect(0, -rectWidth / 2, rectLength, rectWidth);
            ctx.fillStyle = 'rgba(46, 125, 50, 0.25)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#00e676';
            ctx.stroke();

            if (player.heroKey === 'ryoma' && activeSkillDrag.skillId === 2) {
                ctx.beginPath();
                ctx.rect(rectLength * 0.6, -rectWidth / 2, rectLength * 0.4, rectWidth);
                ctx.fillStyle = 'rgba(0, 230, 118, 0.35)';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.setLineDash([3, 3]);
                ctx.stroke();
            }
            ctx.restore();
        } else {
            let targetX = px + dx * maxR;
            let targetY = py + dy * maxR;

            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(targetX, targetY);
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.9)';
            ctx.stroke();

            let angle = Math.atan2(dy, dx);
            let arrowSize = 22;
            ctx.beginPath();
            ctx.moveTo(targetX, targetY);
            ctx.lineTo(targetX - arrowSize * Math.cos(angle - Math.PI / 6), targetY - arrowSize * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(targetX - arrowSize * Math.cos(angle + Math.PI / 6), targetY - arrowSize * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = '#00ffff';
            ctx.fill();
        }

        ctx.restore();
    }

    attackEffects.forEach((eff, idx) => {
        eff.life -= 1 / 60;
        if (eff.isLaser) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(eff.startX - camera.x, eff.startY - camera.y);
            ctx.lineTo(eff.x - camera.x, eff.y - camera.y);
            ctx.strokeStyle = eff.color;
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();
        }
        if (eff.life <= 0) attackEffects.splice(idx, 1);
    });

    projectiles.forEach(p => {
        let sx = p.x - camera.x;
        let sy = p.y - camera.y;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 105, 180, 0.9)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.shadowColor = 'rgba(255, 105, 180, 0.8)';
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.restore();
    });

    entities.forEach(e => {
        if (!e.alive) return;
        let sx = e.x - camera.x;
        let sy = e.y - camera.y;

        if (e instanceof Hero) {
            ctx.save();
            let isEnhanced = (e.heroKey === 'nakroth' && e.hasEnhancedAttack) || (e.heroKey === 'ryoma' && e.hasEnhancedAttack);
            let drawRange = isEnhanced ? 180 : e.range;

            if (isEnhanced || (e.isPlayer && isAttackingPressed)) {
                ctx.beginPath();
                ctx.arc(sx, sy, drawRange, 0, Math.PI * 2);
                ctx.strokeStyle = isEnhanced ? 'rgba(255, 215, 0, 0.9)' : 'rgba(243, 198, 84, 0.6)';
                ctx.lineWidth = isEnhanced ? 2.5 : 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
            }
            ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
        
        if (e instanceof Building) {
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
        } else if (e instanceof Minion) {
            ctx.fillStyle = e.team === 'blue' ? '#4dabf7' : '#ff6b6b';
        } else {
            ctx.fillStyle = e.team === 'blue' ? '#2e86de' : '#ee5253';
        }
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        if (e instanceof Building) {
            ctx.font = '22px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(e.type === 'core' ? '🏰' : '🗼', sx, sy);
        }
        ctx.restore();

        let barW = e instanceof Building ? 70 : 50, barH = 6;
        let barX = sx - barW / 2;
        let barY = sy - e.radius - 24;
        
        if (e instanceof Hero) {
            ctx.save();
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = e.team === 'blue' ? '#00d2ff' : '#ff4444';
            let heroInfo = HERO_DB[e.heroKey];
            ctx.fillText(`${heroInfo.name} Lv.${e.level || 1}`, sx, barY - 4);
            ctx.restore();
        }

        let maxHp = e.maxHp;
        let hpRatio = Math.max(0, Math.min(1, e.hp / maxHp));
        let shieldRatio = Math.max(0, Math.min(1, (e.shield || 0) / maxHp));
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX, barY, barW, barH);
        
        ctx.fillStyle = e.team === 'blue' ? '#00e676' : '#ff3366';
        ctx.fillRect(barX, barY, barW * hpRatio, barH);

        if (shieldRatio > 0) {
            ctx.fillStyle = '#ffffff';
            let shieldStartX = barX + (barW * hpRatio);
            let shieldW = Math.min(barW - (barW * hpRatio), barW * shieldRatio);
            ctx.fillRect(shieldStartX, barY, shieldW, barH);
        }

        if (e instanceof Hero || e instanceof Building) {
            let totalGridCount = Math.floor(maxHp / 1000);
            if (totalGridCount > 1) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.lineWidth = 1;
                for (let i = 1; i < totalGridCount; i++) {
                    let gx = barX + (barW * (i * 1000 / maxHp));
                    ctx.beginPath();
                    ctx.moveTo(gx, barY);
                    ctx.lineTo(gx, barY + barH);
                    ctx.stroke();
                }
            }
        }

        let currentBottomY = barY + barH;

        if (e instanceof Hero) {
            let passiveBarY = currentBottomY + 2;
            let passiveBarH = 4;
            
            if (e.heroKey === 'valhein') {
                let slotW = (barW - 3 * 2) / 4;
                for (let i = 0; i < 4; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.valheinPassiveStacks) {
                        ctx.fillStyle = '#ffd700';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'nakroth') {
                let slotW = (barW - 3 * 2) / 4;
                for (let i = 0; i < 4; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.nakrothPassiveCounter) {
                        ctx.fillStyle = '#d7bde2';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'ryoma') {
                let intervalReduction = (e.level - 1) * 0.1;
                let maxInterval = Math.max(1.0, 5.0 - intervalReduction);
                let ratio = e.hasEnhancedAttack ? 1.0 : Math.max(0, 1.0 - (e.ryomaPassiveTimer / maxInterval));

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                ctx.fillStyle = '#00e676';
                ctx.fillRect(barX, passiveBarY, barW * ratio, passiveBarH);
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'alice') {
                let ratio = Math.min(1.0, e.outOfCombatTimer / 300);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX, passiveBarY, barW, passiveBarH);
                ctx.fillStyle = e.outOfCombatTimer >= 300 ? '#e040fb' : '#ba68c8';
                ctx.fillRect(barX, passiveBarY, barW * ratio, passiveBarH);
                currentBottomY = passiveBarY + passiveBarH;
            } else if (e.heroKey === 'tarra') {
                let slotW = (barW - 2 * 2) / 3;
                for (let i = 0; i < 3; i++) {
                    let slotX = barX + i * (slotW + 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    if (i < e.tarraBuffStacks) {
                        ctx.fillStyle = '#ff9800';
                        ctx.fillRect(slotX, passiveBarY, slotW, passiveBarH);
                    }
                }
                currentBottomY = passiveBarY + passiveBarH;
            }
        }

        if (e instanceof Hero) {
            let expBarY = currentBottomY + 2;
            let expBarH = 3;
            let reqExp = LEVEL_EXP_TABLE[e.level] || 150;
            let expRatio = Math.min(1, e.exp / reqExp);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(barX, expBarY, barW, expBarH);
            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(barX, expBarY, barW * expRatio, expBarH);
        }
    });

    skillEffects.forEach((eff, idx) => {
        eff.life -= 1 / 60;
        let sx = eff.x - camera.x;
        let sy = eff.y - camera.y;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, eff.size, 0, Math.PI * 2);
        ctx.fillStyle = eff.color || 'rgba(0, 210, 255, 0.5)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.restore();

        if (eff.life <= 0) skillEffects.splice(idx, 1);
    });

    damageTexts.forEach((d, idx) => {
        d.y -= 0.6; d.life -= 1 / 60;
        ctx.save();
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = d.color;
        ctx.textAlign = 'center';
        ctx.fillText(d.value, d.x - camera.x, d.y - camera.y);
        ctx.restore();
        if (d.life <= 0) damageTexts.splice(idx, 1);
    });

    updateSkillUI();
    requestAnimationFrame(gameLoop);
}
</script>
